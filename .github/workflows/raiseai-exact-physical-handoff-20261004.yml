name: RaiseAI v1.5.2 merged-main physical handoff

on:
  push:
    branches:
      - ops/raiseai-pr22-proof-20261004-0103
    paths:
      - ".github/raiseai-v152-physical-handoff.sha"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raiseai-v152-merged-main-physical-handoff
  cancel-in-progress: true

jobs:
  build-handoff:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 35
    steps:
      - name: Verify VPS execution host
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"

      - name: Checkout handoff trigger
        uses: actions/checkout@v4
        with:
          path: orchestrator

      - name: Load exact merged-main revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '\r\n' < orchestrator/.github/raiseai-v152-physical-handoff.sha | tr 'A-F' 'a-f')"
          printf '%s' "$revision" | grep -Eq '^[0-9a-f]{40}$'
          echo "RAISE_SHA=$revision" >> "$GITHUB_ENV"
          echo "RAISE_BUILD_REVISION=$revision" >> "$GITHUB_ENV"
          echo "Pinned physical-handoff revision: $revision"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android 35 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Checkout exact RaiseAI merged-main revision
        uses: actions/checkout@v4
        with:
          repository: Zennay/RaiseAI
          ref: ${{ env.RAISE_SHA }}
          path: raiseai
          fetch-depth: 1

      - name: Prove trigger still equals current RaiseAI main
        working-directory: raiseai
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD | tr 'A-F' 'a-f')" = "$RAISE_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}' | tr 'A-F' 'a-f')"
          test "$remote_main" = "$RAISE_SHA"
          echo "Current RaiseAI main is exactly $RAISE_SHA"

      - name: Prove merged-main v1.5.2 identity and build APK
        working-directory: raiseai
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(tr -d '\r\n' < VERSION.txt)" = "1.5.2"
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*19' app/build.gradle.kts

          bash -n upgrade-watch.command
          bash -n physical-validation.command
          python3 -m unittest discover -s tests -p 'test_watch_e2e_evidence_validator.py'
          python3 -m unittest discover -s tests -p 'test_watch_sensor_trace_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_watch_sensor_trial_analyzer.py'

          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx1280m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=1 \
            :app:verifyEvidenceBuildIdentity testDebugUnitTest assembleDebug

          grep -R --fixed-strings "$RAISE_SHA" app/build/generated >/dev/null
          test -s app/build/outputs/apk/debug/app-debug.apk

          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("app/build/outputs/apk/debug/output-metadata.json").read_text())
          elem = meta["elements"][0]
          if elem.get("versionCode") != 19 or elem.get("versionName") != "1.5.2":
              raise SystemExit(f"unexpected APK version metadata: {elem.get('versionCode')} / {elem.get('versionName')}")
          print("APK release identity:", elem["versionCode"], elem["versionName"])
          PY

          python3 - <<'PY'
          import os
          import zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          needle = os.environ["RAISE_SHA"].encode("ascii")
          with zipfile.ZipFile(apk) as archive:
              dex_files = [name for name in archive.namelist() if name.endswith(".dex")]
              hits = [name for name in dex_files if needle in archive.read(name)]
          if not hits:
              raise SystemExit("merged-main source revision not embedded in APK DEX")
          print("Exact merged-main revision embedded in:", ", ".join(hits))
          PY

      - name: Assemble physical-session handoff
        working-directory: raiseai
        shell: bash
        run: |
          set -euo pipefail
          OUT="../raiseai-v1.5.2-physical-handoff"
          mkdir -p "$OUT"

          cp app/build/outputs/apk/debug/app-debug.apk "$OUT/RaiseAI-v1.5.2-debug.apk"

          # Preserve the exact clean source revision needed by physical-validation.command.
          git branch -f main "$RAISE_SHA"
          git bundle create "$OUT/RaiseAI-v1.5.2-source.bundle" main
          git bundle verify "$OUT/RaiseAI-v1.5.2-source.bundle"
          test "$(git bundle list-heads "$OUT/RaiseAI-v1.5.2-source.bundle" refs/heads/main | awk '{print $1}')" = "$RAISE_SHA"

          RESTORE_DIR="../raiseai-v1.5.2-bundle-restore-check"
          rm -rf "$RESTORE_DIR"
          git clone -q -b main "$OUT/RaiseAI-v1.5.2-source.bundle" "$RESTORE_DIR"
          test "$(git -C "$RESTORE_DIR" rev-parse HEAD | tr 'A-F' 'a-f')" = "$RAISE_SHA"
          test -z "$(git -C "$RESTORE_DIR" status --porcelain --untracked-files=normal)"
          rm -rf "$RESTORE_DIR"
          git branch -D main

          apk_sha="$(sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')"
          bundle_sha="$(sha256sum "$OUT/RaiseAI-v1.5.2-source.bundle" | awk '{print $1}')"

          {
            echo "version=1.5.2"
            echo "version_code=19"
            echo "source_revision=$RAISE_SHA"
            echo "source_branch=main"
            echo "apk_sha256=$apk_sha"
            echo "source_bundle_sha256=$bundle_sha"
            echo "built_on=$(hostname)"
            echo "note=No gateway/provider secrets are bundled; provision credentials separately."
          } > "$OUT/BUILD-IDENTITY.txt"

          cat > "$OUT/README-PHYSICAL-HANDOFF.txt" <<EOF
Raise AI v1.5.2 physical validation handoff

Exact source revision:
  $RAISE_SHA

This artifact contains:
  - RaiseAI-v1.5.2-debug.apk: independently identity-checked Watch APK
  - RaiseAI-v1.5.2-source.bundle: exact clean Git source needed by the validation orchestrator
  - BUILD-IDENTITY.txt: version, source SHA and SHA-256 checksums

Restore the exact source on the Mac paired with the Galaxy Watch 7:
  git clone -b main RaiseAI-v1.5.2-source.bundle RaiseAI-v1.5.2
  cd RaiseAI-v1.5.2
  test "\$(git rev-parse HEAD)" = "$RAISE_SHA"
  test -z "\$(git status --porcelain --untracked-files=normal)"

Then run the canonical physical session from that clean checkout:
  bash ./physical-validation.command all /path/to/watch-gateway.properties

The orchestrator will build/install from this exact source revision, require fresh
schema-v2 quick_ai evidence, and bind the 30 raise / 100 non-trigger dataset to
the same app version + source revision.

Do not copy gateway/provider secrets into this artifact.
EOF

          cat > "$OUT/START-PHYSICAL-SESSION.command" <<'SCRIPT'
#!/bin/bash
set -euo pipefail
cd "$(dirname "$0")"

PROFILE="${1:-}"
if [ -z "$PROFILE" ] || [ ! -f "$PROFILE" ]; then
  echo "Usage: bash ./START-PHYSICAL-SESSION.command /path/to/watch-gateway.properties"
  exit 2
fi

command -v git >/dev/null 2>&1 || { echo "git is required"; exit 1; }
IDENTITY="BUILD-IDENTITY.txt"
BUNDLE="RaiseAI-v1.5.2-source.bundle"
[ -f "$IDENTITY" ] && [ -f "$BUNDLE" ] || {
  echo "Incomplete RaiseAI physical handoff artifact."
  exit 1
}

revision="$(sed -n 's/^source_revision=//p' "$IDENTITY" | head -n 1 | tr 'A-F' 'a-f')"
expected_bundle_sha="$(sed -n 's/^source_bundle_sha256=//p' "$IDENTITY" | head -n 1 | tr 'A-F' 'a-f')"
printf '%s' "$revision" | grep -Eq '^[0-9a-f]{40}

      - name: Upload physical-session handoff
        uses: actions/upload-artifact@v4
        with:
          name: RaiseAI-v1.5.2-physical-handoff-${{ github.run_id }}
          path: raiseai-v1.5.2-physical-handoff
          retention-days: 14

      - name: Record green handoff marker
        working-directory: orchestrator
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/raiseai-pr22-proof-20261004-0103
          git checkout -B ops/raiseai-pr22-proof-20261004-0103 origin/ops/raiseai-pr22-proof-20261004-0103
          mkdir -p .github/proofs
          marker=".github/proofs/raiseai-v1.5.2-physical-handoff-green.env"
          {
            echo "proof=GREEN"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "artifact_name=RaiseAI-v1.5.2-physical-handoff-$GITHUB_RUN_ID"
            cat ../raiseai-v1.5.2-physical-handoff/BUILD-IDENTITY.txt
          } > "$marker"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "Record green RaiseAI v1.5.2 physical handoff $RAISE_SHA"
          git push origin HEAD:ops/raiseai-pr22-proof-20261004-0103
 || { echo "Invalid source revision in BUILD-IDENTITY.txt"; exit 1; }
printf '%s' "$expected_bundle_sha" | grep -Eq '^[0-9a-f]{64}

      - name: Upload physical-session handoff
        uses: actions/upload-artifact@v4
        with:
          name: RaiseAI-v1.5.2-physical-handoff-${{ github.run_id }}
          path: raiseai-v1.5.2-physical-handoff
          retention-days: 14

      - name: Record green handoff marker
        working-directory: orchestrator
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin ops/raiseai-pr22-proof-20261004-0103
          mkdir -p .github/proofs
          marker=".github/proofs/raiseai-v1.5.2-physical-handoff-green.env"
          {
            echo "proof=GREEN"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "artifact_name=RaiseAI-v1.5.2-physical-handoff-$GITHUB_RUN_ID"
            cat ../raiseai-v1.5.2-physical-handoff/BUILD-IDENTITY.txt
          } > "$marker"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "Record green RaiseAI v1.5.2 physical handoff $RAISE_SHA"
          git push origin HEAD:ops/raiseai-pr22-proof-20261004-0103
 || { echo "Invalid bundle checksum in BUILD-IDENTITY.txt"; exit 1; }

if command -v shasum >/dev/null 2>&1; then
  actual_bundle_sha="$(shasum -a 256 "$BUNDLE" | awk '{print $1}' | tr 'A-F' 'a-f')"
elif command -v sha256sum >/dev/null 2>&1; then
  actual_bundle_sha="$(sha256sum "$BUNDLE" | awk '{print $1}' | tr 'A-F' 'a-f')"
else
  echo "Need shasum or sha256sum to verify the source bundle."
  exit 1
fi
[ "$actual_bundle_sha" = "$expected_bundle_sha" ] || {
  echo "Source bundle SHA-256 mismatch."
  exit 1
}

RESTORE_DIR="${RAISE_RESTORE_DIR:-$PWD/RaiseAI-v1.5.2-source}"
[ ! -e "$RESTORE_DIR" ] || {
  echo "Restore directory already exists: $RESTORE_DIR"
  echo "Remove it or set RAISE_RESTORE_DIR to a new path."
  exit 1
}

git clone -q -b main "$BUNDLE" "$RESTORE_DIR"
test "$(git -C "$RESTORE_DIR" rev-parse HEAD | tr 'A-F' 'a-f')" = "$revision"
test -z "$(git -C "$RESTORE_DIR" status --porcelain --untracked-files=normal)"

echo "Verified exact RaiseAI v1.5.2 source: $revision"
cd "$RESTORE_DIR"
exec bash ./physical-validation.command all "$PROFILE"
SCRIPT

      - name: Upload physical-session handoff
        uses: actions/upload-artifact@v4
        with:
          name: RaiseAI-v1.5.2-physical-handoff-${{ github.run_id }}
          path: raiseai-v1.5.2-physical-handoff
          retention-days: 14

      - name: Record green handoff marker
        working-directory: orchestrator
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin ops/raiseai-pr22-proof-20261004-0103
          mkdir -p .github/proofs
          marker=".github/proofs/raiseai-v1.5.2-physical-handoff-green.env"
          {
            echo "proof=GREEN"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "artifact_name=RaiseAI-v1.5.2-physical-handoff-$GITHUB_RUN_ID"
            cat ../raiseai-v1.5.2-physical-handoff/BUILD-IDENTITY.txt
          } > "$marker"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "Record green RaiseAI v1.5.2 physical handoff $RAISE_SHA"
          git push origin HEAD:ops/raiseai-pr22-proof-20261004-0103
