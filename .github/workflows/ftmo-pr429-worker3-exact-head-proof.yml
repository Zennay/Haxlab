name: FTMO PR429 Worker3 exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr429-worker3-exact-head-proof.yml"

permissions:
  contents: read

concurrency:
  group: ftmo-pr429-worker3-exact-head-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      TARGET_SHA: 8ec1585fb50e9d4a62cce292d54d4a2dacc922c8
    steps:
      - name: Verify VPS identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"

      - name: Fetch exact FTMO PR429 head
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr429-worker3"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_head_sha=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr429-worker3"
          venv="$RUNNER_TEMP/ftmo-pr429-worker3-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Compile changed runtime surface
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr429-worker3"
          venv="$RUNNER_TEMP/ftmo-pr429-worker3-venv"
          "$venv/bin/python" -m compileall -q "$src/src/prop_trading_ai/ops/autonomous_rollover.py"

      - name: Prove cache progress integrity and sealed boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr429-worker3"
          venv="$RUNNER_TEMP/ftmo-pr429-worker3-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q             tests/test_autonomous_provider_retry.py             tests/test_zero_cost_workflow_boundary.py
