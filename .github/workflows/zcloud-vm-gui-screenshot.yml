name: Screenshot Violentmonkey Installer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-vm-gui-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shot:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 4
    steps:
      - name: Capture current Firefox window
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          WIN="$(xdotool search --onlyvisible --class firefox 2>/dev/null | tail -n1 || true)"
          test -n "$WIN"
          echo "WINDOW=$WIN"
          xdotool getwindowname "$WIN" || true
          xdotool getwindowgeometry --shell "$WIN" || true
          command -v import
          command -v convert
          import -window "$WIN" /tmp/vm-installer.png
          convert /tmp/vm-installer.png -resize '650x650>' -quality 48 /tmp/vm-installer.jpg
          echo "IMAGE_BEGIN"
          base64 -w0 /tmp/vm-installer.jpg
          echo
          echo "IMAGE_END"
