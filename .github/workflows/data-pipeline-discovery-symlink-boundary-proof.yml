name: HaxLab discovery symlink boundary proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch SHA to prove
        required: true
        type: string
  push:
    branches:
      - feature/data-pipeline-discovery-symlink-boundary-20261007
    paths:
      - "src/haxlab/ingestion/discovery.py"
      - "tests/test_discovery.py"
      - "tests/test_discovery_symlink_boundary.py"
      - "tests/test_source_bundle_import_coverage.py"
      - "docs/discovery-symlink-boundary.md"
      - ".github/workflows/data-pipeline-discovery-symlink-boundary-proof.yml"

permissions:
  contents: read

concurrency:
  group: haxlab-discovery-symlink-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head discovery symlink boundary
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .discovery-symlink-venv
          python3 -m venv .discovery-symlink-venv
          .discovery-symlink-venv/bin/pip install -q --upgrade pip
          .discovery-symlink-venv/bin/pip install -q -e '.[dev]'
          .discovery-symlink-venv/bin/python -m compileall -q src tests
          .discovery-symlink-venv/bin/pytest -q             tests/test_discovery.py             tests/test_discovery_symlink_boundary.py             tests/test_source_bundle_import_coverage.py
          .discovery-symlink-venv/bin/pytest --collect-only -q >/dev/null
          echo "HAXLAB_DISCOVERY_SYMLINK_BOUNDARY_PROOF=success"
