name: Promotion Authorization Contract Validation

on:
  pull_request:
    paths:
      - "src/haxlab/evaluation/promotion_authorization.py"
      - "tests/test_promotion_authorization.py"
      - "docs/promotion-authorization-contract.md"
      - ".github/workflows/promotion-authorization-contract-validation.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: haxlab-promotion-authorization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Promotion authorization regressions
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15

    steps:
      - name: Checkout exact requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref }}
          clean: true

      - name: Verify exact requested SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid immutable ref::expected an exact lowercase 40-character SHA"
            exit 1
          fi
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error title=Validation provenance mismatch::checked out $ACTUAL_SHA, expected $EXPECTED_SHA"
            exit 1
          fi
          echo "HAXLAB_PROMOTION_AUTH_EXACT_SOURCE_SHA=$ACTUAL_SHA"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .promotion-auth-venv
          python3 -m venv .promotion-auth-venv
          .promotion-auth-venv/bin/pip install --upgrade pip
          .promotion-auth-venv/bin/pip install -e '.[dev]'

      - name: Compile authorization module
        shell: bash
        run: |
          set -euo pipefail
          .promotion-auth-venv/bin/python -m py_compile src/haxlab/evaluation/promotion_authorization.py

      - name: Run focused authorization regressions
        shell: bash
        run: |
          set -euo pipefail
          .promotion-auth-venv/bin/pytest -q tests/test_promotion_authorization.py
