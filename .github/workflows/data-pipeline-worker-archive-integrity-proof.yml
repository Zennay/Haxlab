name: HaxLab worker archive integrity proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch SHA to prove
        required: true
        type: string
  push:
    branches:
      - feature/data-pipeline-worker-archive-integrity-20261007
    paths:
      - "src/haxlab/runtime/worker.py"
      - "tests/test_worker.py"
      - "tests/test_worker_archive_integrity.py"
      - "docs/worker-archive-integrity.md"
      - ".github/workflows/data-pipeline-worker-archive-integrity-proof.yml"

permissions:
  contents: read

concurrency:
  group: haxlab-worker-archive-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head worker archive integrity
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .worker-archive-venv
          python3 -m venv .worker-archive-venv
          .worker-archive-venv/bin/pip install -q --upgrade pip
          .worker-archive-venv/bin/pip install -q -e '.[dev]'
          .worker-archive-venv/bin/python -m compileall -q src tests
          .worker-archive-venv/bin/pytest -q tests/test_worker.py tests/test_worker_archive_integrity.py tests/test_runtime_entrypoint_limits.py
          .worker-archive-venv/bin/pytest --collect-only -q >/dev/null
          echo "HAXLAB_WORKER_ARCHIVE_INTEGRITY_PROOF=success"
