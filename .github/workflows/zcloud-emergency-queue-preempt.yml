# retrigger 2026-10-06T06:25Z
name: HaxLab hosted zCloud recovery queue preempt

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-emergency-queue-preempt.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: haxlab-zcloud-emergency-queue-preempt
  cancel-in-progress: true

jobs:
  preempt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Free HaxLab runner for zCloud recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timezone

          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          current_run=int(os.environ["RUN_ID"])
          now=datetime.now(timezone.utc)
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"haxlab-zcloud-emergency-preempt/1",
          }

          def req(path, method="GET", payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              request=urllib.request.Request(
                  "https://api.github.com"+path,
                  data=data, method=method, headers=headers,
              )
              with urllib.request.urlopen(request,timeout=25) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else {}

          protected=("recover-zcloud-runner", "zcloud-emergency-queue-preempt")
          cancelled=[]
          preserved=[]

          for status in ("in_progress","queued"):
              runs=(req(f"/repos/{repo}/actions/runs?status={status}&per_page=100").get("workflow_runs") or [])
              for run in runs:
                  rid=int(run["id"])
                  if rid == current_run:
                      continue
                  path=str(run.get("path") or "")
                  name=str(run.get("name") or "")
                  hay=(path+" "+name).lower()
                  if any(x in hay for x in protected):
                      preserved.append({"id":rid,"status":status,"name":name,"path":path})
                      continue

                  created=datetime.fromisoformat(str(run["created_at"]).replace("Z","+00:00"))
                  age_s=int((now-created).total_seconds())
                  if age_s < 90:
                      preserved.append({"id":rid,"status":status,"age_s":age_s,"name":name})
                      continue

                  jobs=(req(f"/repos/{repo}/actions/runs/{rid}/jobs?filter=latest&per_page=100").get("jobs") or [])
                  self_hosted=[
                      j for j in jobs
                      if "self-hosted" in {str(x).lower() for x in (j.get("labels") or [])}
                      and str(j.get("status") or "") in {"queued","in_progress"}
                  ]
                  if not self_hosted:
                      continue
                  try:
                      req(f"/repos/{repo}/actions/runs/{rid}/cancel",method="POST")
                      cancelled.append({
                          "id":rid,"status":status,"age_s":age_s,"name":name,"path":path,
                          "jobs":[{"id":j.get("id"),"name":j.get("name"),"status":j.get("status")} for j in self_hosted],
                      })
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (409,422):
                          raise

          evidence={"ok":True,"cancelled":cancelled,"preserved":preserved}
          print("HAXLAB_ZCLOUD_PREEMPT="+json.dumps(evidence,sort_keys=True))

          payload={
              "state":"success",
              "context":"zcloud/haxlab-queue-preempt",
              "description":f"preempt green; cancelled={len(cancelled)} preserved={len(preserved)}"[:140],
              "target_url":f"{os.environ['SERVER_URL']}/{repo}/actions/runs/{current_run}",
          }
          req(f"/repos/{repo}/statuses/{os.environ['SHA']}",method="POST",payload=payload)
          PY
