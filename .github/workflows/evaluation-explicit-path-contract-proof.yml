name: Evaluation explicit-path contract proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact and live branch head
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "${GITHUB_SHA}"

          case "${GITHUB_REF}" in
            refs/heads/*) ;;
            *)
              echo "proof must be dispatched from a branch ref, got: ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac

          LIVE_SHA="$(
            git ls-remote --exit-code origin "${GITHUB_REF}" |
              awk 'NR == 1 { print $1 }'
          )"
          test -n "$LIVE_SHA"
          if [ "$LIVE_SHA" != "${GITHUB_SHA}" ]; then
            echo "branch moved after dispatch: live=$LIVE_SHA dispatched=${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Create isolated proof environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .proof-venv
          .proof-venv/bin/python -m pip install --disable-pip-version-check pytest

      - name: Compile evaluation package
        shell: bash
        run: |
          set -euo pipefail
          .proof-venv/bin/python -m compileall -q src/haxlab/evaluation

      - name: Run explicit-path contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src .proof-venv/bin/python -m pytest -q tests/test_evaluation_explicit_path_contract.py
          echo "HAXLAB_EVALUATION_EXPLICIT_PATH_RESULT=green"
