name: FTMO PR489 rollover activation exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr489-rollover-activation-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr489-rollover-activation-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      TARGET_SHA: 604f818810acb906b3ce56fa64cff0d445b68c06
      TARGET_PR: "489"
      EXPECTED_MAIN_SHA: 25c8af9980a9cfa85a050e68c4d9060fefa4ee17
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Checkout HaxLab receipt workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout exact FTMO PR489 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr489-hax-$GITHUB_RUN_ID"
          rm -rf "$src"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$src" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          pr=json.loads(subprocess.check_output(
              ["gh","api",f"repos/Zennay/Ftmo/pulls/{os.environ['TARGET_PR']}"],
              text=True,
          ))
          assert pr["state"] == "open"
          assert pr["head"]["sha"] == os.environ["TARGET_SHA"]
          assert pr["base"]["sha"] == os.environ["EXPECTED_MAIN_SHA"]
          main=subprocess.check_output(
              ["gh","api","repos/Zennay/Ftmo/commits/main","--jq",".sha"],
              text=True,
          ).strip()
          assert main == os.environ["EXPECTED_MAIN_SHA"]
          print("FTMO_PR489_IDENTITY=verified")
          PY

      - name: Prove rollover activation integrity
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr489-hax-$GITHUB_RUN_ID"
          venv="$RUNNER_TEMP/ftmo-pr489-hax-venv-$GITHUB_RUN_ID"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
          cd "$src"
          "$venv/bin/python" -m py_compile src/prop_trading_ai/ops/autonomous_rollover.py
          "$venv/bin/python" -m pytest -q tests/test_autonomous_rollover_activation_integrity.py
          "$venv/bin/python" -m pytest -q tests/test_provider_foundation_publication.py
          "$venv/bin/python" -m pytest -q tests/test_autonomous_provider_retry.py
          "$venv/bin/python" -m pytest -q \
            tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner \
            tests/test_zero_cost_workflow_boundary.py::test_diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"
          echo "FTMO_PR489_ROLLOVER_ACTIVATION_PROOF=success"

      - name: Persist proof receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload={
              "schema_version":1,
              "project":"ftmo",
              "pull_request":489,
              "target_sha":os.environ["TARGET_SHA"],
              "expected_main_sha":os.environ["EXPECTED_MAIN_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "runner":os.environ.get("RUNNER_NAME",""),
              "host":"vps-bb300bba",
              "result":"success",
              "proof":[
                  "exact-sha-checkout",
                  "rollover-runtime-compile",
                  "no-follow-activation-parent",
                  "no-follow-config-target",
                  "config-owner-permission-link-seal",
                  "random-exclusive-rollover-temp",
                  "pre-replace-target-identity-revalidation",
                  "file-and-directory-fsync",
                  "post-publication-verification",
                  "provider-publication-regressions",
                  "provider-retry-regressions",
                  "zero-cost-boundary"
              ],
              "paid_cloud_budget_usd":"0.00",
              "research_outcomes_accessed":False,
              "walk_forward_accessed":False,
              "final_holdout_accessed":False,
              "live_broker_authority_opened":False,
          }
          Path("runtime-evidence/ftmo-pr489-rollover-activation-proof.json").write_text(
              json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/ftmo-pr489-rollover-activation-proof.json
          git commit -m "Record FTMO PR489 exact-head proof $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr489-hax-$GITHUB_RUN_ID" "$RUNNER_TEMP/ftmo-pr489-hax-venv-$GITHUB_RUN_ID"
