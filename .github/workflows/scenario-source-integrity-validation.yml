name: Frozen scenario source integrity

on:
  push:
    branches:
      - validation/scenario-source-integrity-20261006
      - validation/scenario-source-structural-integrity-20261006
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-scenario-source-integrity
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify exact validation head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error title=Scenario-source provenance mismatch::checked out $ACTUAL_SHA, expected $EXPECTED_SHA"
            exit 1
          fi

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .scenario-source-validation-venv
          python3 -m venv .scenario-source-validation-venv
          .scenario-source-validation-venv/bin/pip install --upgrade pip
          .scenario-source-validation-venv/bin/pip install -e '.[dev]'

      - name: Compile scenario-source gate
        shell: bash
        run: |
          set -euo pipefail
          .scenario-source-validation-venv/bin/python -m compileall -q             src/haxlab/evaluation/scenario_source.py             tests/test_scenario_source.py

      - name: Run scenario-source integrity regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src"             .scenario-source-validation-venv/bin/pytest -q               tests/test_scenario_source.py               tests/test_multisource_suite.py

      - name: Verify current frozen suite replay bytes on VPS
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/var/lib/haxlab/derived/evaluation/candidate-d-multisource-holdout-v1
          DB=/var/lib/haxlab/state/haxlab.sqlite3
          sudo -u haxlab env ROOT="$ROOT" DB="$DB"             .scenario-source-validation-venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          import sqlite3
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          manifest = json.loads((root / "frozen-manifest.json").read_text())
          entries = list(manifest.get("sources") or [])
          if len(entries) != 3:
              raise SystemExit(
                  f"expected exactly 3 frozen replay sources, got {len(entries)}"
              )

          db = sqlite3.connect(os.environ["DB"])
          try:
              verified = []
              for index, entry in enumerate(entries, start=1):
                  replay_sha = str(
                      entry.get("replay_sha256")
                      or entry.get("sha256")
                      or (entry.get("source") or {}).get("sha256")
                      or ""
                  ).strip().lower()
                  if (
                      len(replay_sha) != 64
                      or any(ch not in "0123456789abcdef" for ch in replay_sha)
                  ):
                      raise SystemExit(
                          f"source-{index:02d}: invalid replay SHA-256"
                      )
                  row = db.execute(
                      "SELECT archive_path FROM raw_replays WHERE sha256 = ?",
                      (replay_sha,),
                  ).fetchone()
                  if row is None:
                      raise SystemExit(
                          f"source-{index:02d}: replay absent from raw_replays"
                      )
                  raw = Path(row[0])
                  if not raw.is_file():
                      raise SystemExit(
                          f"source-{index:02d}: archive missing: {raw}"
                      )
                  digest = hashlib.sha256()
                  with raw.open("rb") as handle:
                      for chunk in iter(
                          lambda: handle.read(1024 * 1024),
                          b"",
                      ):
                          digest.update(chunk)
                  actual = digest.hexdigest()
                  if actual != replay_sha:
                      raise SystemExit(
                          f"source-{index:02d}: archive hash mismatch "
                          f"{actual} != {replay_sha}"
                      )
                  verified.append(replay_sha)
          finally:
              db.close()

          if len(set(verified)) != 3:
              raise SystemExit("frozen suite replay sources are not disjoint")
          print(
              "FROZEN_SOURCE_BYTES_GREEN "
              + ",".join(verified)
          )
          PY

      - name: Record exact-head validation evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "SCENARIO_SOURCE_VALIDATION_HEAD=$(git rev-parse HEAD)"
          echo "SCENARIO_SOURCE_VALIDATION_RESULT=green"
