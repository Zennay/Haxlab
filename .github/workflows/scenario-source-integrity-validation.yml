name: Frozen scenario source integrity

on:
  push:
    branches:
      - validation/scenario-source-integrity-20261006
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-scenario-source-integrity
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .scenario-source-validation-venv
          python3 -m venv .scenario-source-validation-venv
          .scenario-source-validation-venv/bin/pip install --upgrade pip
          .scenario-source-validation-venv/bin/pip install -e '.[dev]'

      - name: Compile scenario-source gate
        shell: bash
        run: |
          set -euo pipefail
          .scenario-source-validation-venv/bin/python -m compileall -q             src/haxlab/evaluation/scenario_source.py             tests/test_scenario_source.py

      - name: Run scenario-source integrity regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src"             .scenario-source-validation-venv/bin/pytest -q               tests/test_scenario_source.py               tests/test_multisource_suite.py

      - name: Record exact-head validation evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "SCENARIO_SOURCE_VALIDATION_HEAD=$(git rev-parse HEAD)"
          echo "SCENARIO_SOURCE_VALIDATION_RESULT=green"
