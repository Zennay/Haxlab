name: FTMO PR427 exact-head Jetta header proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr427-exact-head-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    env:
      TARGET_SHA: cc0ee761da3edcb6f6aa335d6ce011fd50b5d2d5
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Fetch exact FTMO PR427 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr427-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR427_EXACT_SHA=$TARGET_SHA"
      - name: Install isolated environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr427-proof"
          venv="$RUNNER_TEMP/ftmo-pr427-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
      - name: Compile provider
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr427-proof"
          venv="$RUNNER_TEMP/ftmo-pr427-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/data/market/providers/dukascopy_jetta.py
          echo "FTMO_PR427_COMPILE_GREEN=1"
      - name: Prove Jetta header and framing integrity
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr427-proof"
          venv="$RUNNER_TEMP/ftmo-pr427-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_jetta.py
          echo "FTMO_PR427_JETTA_GREEN=1"
      - name: Prove adjacent sealed boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr427-proof"
          venv="$RUNNER_TEMP/ftmo-pr427-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_autonomous_provider_retry.py tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR427_ADJACENT_GREEN=1"
      - name: Collect full suite
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr427-proof"
          venv="$RUNNER_TEMP/ftmo-pr427-venv"
          cd "$src"
          "$venv/bin/python" -m pytest --collect-only -q >/tmp/ftmo-pr427-collect.txt
          tail -n 2 /tmp/ftmo-pr427-collect.txt
          echo "FTMO_PR427_COLLECTION_GREEN=1"
