name: HaxLab matcher confidence contract proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch SHA to prove
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: haxlab-matcher-confidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head matcher confidence contract
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ inputs.expected_sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .matcher-confidence-venv
          python3 -m venv .matcher-confidence-venv
          .matcher-confidence-venv/bin/pip install -q --upgrade pip
          .matcher-confidence-venv/bin/pip install -q -e '.[dev]'
          .matcher-confidence-venv/bin/python -m compileall -q src tests
          .matcher-confidence-venv/bin/pytest -q \
            tests/test_matcher.py \
            tests/test_pipeline.py \
            tests/test_ingestion_models.py
          .matcher-confidence-venv/bin/pytest --collect-only -q >/dev/null
          echo "HAXLAB_MATCHER_CONFIDENCE_PROOF=success"
