name: Data-pipeline audit builtins-state proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-hex candidate commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: haxlab-data-pipeline-audit-builtins-state
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Validate immutable candidate input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1

      - name: Checkout immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          clean: true
          persist-credentials: false

      - name: Prove exact commit and live candidate head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          live_head="$(git ls-remote origin refs/heads/validation/data-pipeline-audit-builtins-state-20261009 | awk 'NR==1 {print $1}')"
          test -n "$live_head"
          test "$live_head" = "$SOURCE_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .data-pipeline-builtins-state-venv
          .data-pipeline-builtins-state-venv/bin/python -m pip install --upgrade pip
          .data-pipeline-builtins-state-venv/bin/python -m pip install -e '.[dev]'

      - name: Compile, validate focused contract, collect suite
        shell: bash
        run: |
          set -euo pipefail
          .data-pipeline-builtins-state-venv/bin/python -m py_compile \
            tests/test_data_pipeline_audit_builtins_state_contract.py
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .data-pipeline-builtins-state-venv/bin/pytest -q \
              tests/test_data_pipeline_audit_builtins_state_contract.py
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .data-pipeline-builtins-state-venv/bin/pytest --collect-only -q >/dev/null
          echo "HAXLAB_DATA_PIPELINE_AUDIT_BUILTINS_STATE_RESULT=green"
