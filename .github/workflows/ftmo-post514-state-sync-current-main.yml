name: Dispatch FTMO post514 state sync on current main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftmo-post514-state-sync-current-main.yml'

permissions:
  contents: write

concurrency:
  group: ftmo-post514-state-sync-current-main
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5
    env:
      EXPECTED_MAIN: ac2a2563283c286b66aa409280339286bc05b366
    steps:
      - name: Dispatch exact-current-main FTMO research-state sync
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          current="$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)"
          test "$current" = "$EXPECTED_MAIN"

          existing="$(gh api 'repos/Zennay/Ftmo/actions/workflows/sync-autonomous-research-state.yml/runs?event=workflow_dispatch&per_page=20'             --jq --arg sha "$EXPECTED_MAIN" '[.workflow_runs[] | select(.head_sha==$sha)] | sort_by(.created_at) | last | .id // empty')"

          if [[ -z "$existing" ]]; then
            gh api --method POST repos/Zennay/Ftmo/actions/workflows/sync-autonomous-research-state.yml/dispatches               -f ref=main >/dev/null
            action=dispatched
          else
            action=reused-existing
          fi

          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh api 'repos/Zennay/Ftmo/actions/workflows/sync-autonomous-research-state.yml/runs?event=workflow_dispatch&per_page=20'               --jq --arg sha "$EXPECTED_MAIN" '[.workflow_runs[] | select(.head_sha==$sha)] | sort_by(.created_at) | last | .id // empty')"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          test -n "$run_id"

          status="$(gh api repos/Zennay/Ftmo/actions/runs/$run_id --jq .status)"
          conclusion="$(gh api repos/Zennay/Ftmo/actions/runs/$run_id --jq '.conclusion // ""')"

          receipt="$RUNNER_TEMP/ftmo-post514-state-sync-current-main.json"
          cat >"$receipt" <<EOF
{
  "schema_version": 1,
  "scope": "ftmo-post514-state-sync-current-main",
  "expected_main_sha": "$EXPECTED_MAIN",
  "action": "$action",
  "run_id": "$run_id",
  "status": "$status",
  "conclusion": "$conclusion",
  "carrier_run_id": "$GITHUB_RUN_ID"
}
EOF
          cat "$receipt"
          encoded="$(base64 -w0 "$receipt")"
          gh api --method PUT repos/Zennay/Haxlab/contents/runtime-evidence/ftmo-post514-state-sync-current-main.json             -f message="Record FTMO post514 state-sync dispatch"             -f content="$encoded"             -f branch=main >/dev/null
