name: FTMO PR506 exact-head strict JSON proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr506-strict-json-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr506-strict-json-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 35
    env:
      TARGET_SHA: 7f4bc79b9f13ae0dbcccb0a3c3286bce72121faa
      EXPECTED_MAIN_SHA: b2fbd35cf970813d9428da4aa9668070778654fd
      TARGET_PR: "506"
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Verify exact FTMO identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)" = "$EXPECTED_MAIN_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .state)" = "open"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .head.sha)" = "$TARGET_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .base.sha)" = "$EXPECTED_MAIN_SHA"

      - name: Fetch exact FTMO PR506 head
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr506-haxlab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$src"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$src" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_SRC=$src" >> "$GITHUB_ENV"

      - name: Install isolated environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/ftmo-pr506-haxlab-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$FTMO_SRC/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$FTMO_SRC"
          echo "FTMO_VENV=$venv" >> "$GITHUB_ENV"

      - name: Prove strict research-state JSON boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$FTMO_SRC"
          "$FTMO_VENV/bin/python" -m py_compile src/prop_trading_ai/research/state_sync.py
          "$FTMO_VENV/bin/python" -m pytest -q tests/test_research_state_sync_guard.py
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"

      - name: Run complete suite in bounded file batches
        shell: bash
        run: |
          set -euo pipefail
          cd "$FTMO_SRC"
          mkdir -p .scratch
          "$FTMO_VENV/bin/python" - <<'PY'
          from pathlib import Path
          import contextlib
          import io
          import pytest

          class Collector:
              paths = None
              count = None
              def pytest_collection_finish(self, session):
                  self.count = len(session.items)
                  self.paths = sorted({
                      Path(str(item.path)).resolve().relative_to(Path.cwd().resolve()).as_posix()
                      for item in session.items
                  })

          collector = Collector()
          captured = io.StringIO()
          with contextlib.redirect_stdout(captured), contextlib.redirect_stderr(captured):
              code = pytest.main(["--collect-only", "-q"], plugins=[collector])
          if code != pytest.ExitCode.OK or not collector.paths or not collector.count:
              raise SystemExit("pytest collection failed: " + captured.getvalue()[-2000:])
          Path(".scratch/pr506-test-files.txt").write_text(
              "\n".join(collector.paths) + "\n", encoding="utf-8"
          )
          Path(".scratch/pr506-test-count.txt").write_text(
              str(collector.count) + "\n", encoding="utf-8"
          )
          print(f"collected_tests={collector.count}")
          print(f"test_files={len(collector.paths)}")
          PY

          executed=0
          while IFS= read -r test_file; do
            [[ -n "$test_file" ]] || continue
            "$FTMO_VENV/bin/python" -m pytest -q "$test_file"
            executed=$((executed + 1))
          done < .scratch/pr506-test-files.txt
          test "$executed" -gt 0
          echo "FTMO_PR506_FULL_SUITE_GREEN=1"
          echo "planned_collected_tests=$(cat .scratch/pr506-test-count.txt)"
          echo "executed_test_files=$executed"

      - name: Revalidate exact identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)" = "$EXPECTED_MAIN_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .state)" = "open"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .head.sha)" = "$TARGET_SHA"
          test "$(gh api "repos/Zennay/Ftmo/pulls/$TARGET_PR" --jq .base.sha)" = "$EXPECTED_MAIN_SHA"

      - name: Persist sanitized proof receipt
        if: always()
        shell: bash
        env:
          PROOF_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr506-haxlab-proof-$GITHUB_RUN_ID.json"
          python3 - <<'PY' > "$receipt"
          import json, os, socket
          print(json.dumps({
              "schema_version": 1,
              "project": "ftmo",
              "pull_request": 506,
              "target_sha": os.environ["TARGET_SHA"],
              "expected_main_sha": os.environ["EXPECTED_MAIN_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_host": socket.gethostname(),
              "result": os.environ["PROOF_RESULT"],
              "paid_cloud_budget_usd": "0.00",
              "provider_io_forced": False,
              "research_outcomes_accessed": False,
              "walk_forward_accessed": False,
              "final_holdout_accessed": False,
              "live_or_broker_access_opened": False,
              "proof": [
                  "exact-pr-head-base-main-identity",
                  "strict-research-state-json-regressions",
                  "full-suite-file-batches",
                  "zero-cost-boundary"
              ]
          }, sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr506-haxlab-proof-$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/Zennay/Haxlab/contents/$path" \
            -f message="Record FTMO PR506 exact-head proof $GITHUB_RUN_ID" \
            -f content="$encoded" >/dev/null
          echo "FTMO_PR506_HAXLAB_RECEIPT_PATH=$path"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr506-haxlab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
                 "$RUNNER_TEMP/ftmo-pr506-haxlab-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
