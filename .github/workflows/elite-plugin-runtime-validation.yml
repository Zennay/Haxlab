name: Elite Plugin Runtime Validation

on:
  push:
    branches:
      - experiment/frozen-future-head-v01

permissions:
  contents: read

concurrency:
  group: haxlab-elite-plugin-runtime-validation
  cancel-in-progress: true

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[runtime-validation]')
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Preflight plugin runtime validation
        shell: bash
        run: |
          set -euo pipefail
          node --check "$GITHUB_WORKSPACE/tools/elite_plugin_runtime_validation.js"
          node --check "$GITHUB_WORKSPACE/tools/elite_bot_plugin.js"
          node --check "$GITHUB_WORKSPACE/tools/elite_champion_config.js"
          node "$GITHUB_WORKSPACE/tests/test_elite_champion_config.js"
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m py_compile \
            "$GITHUB_WORKSPACE/src/haxlab/evaluation/champion_registry.py" \
            "$GITHUB_WORKSPACE/src/haxlab/evaluation/scenario_source.py"

      - name: Require canary-validated current champion
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/var/lib/haxlab/derived/champions/elite-player")
          pointer = json.loads((root / "current.json").read_text())
          stage = str(pointer.get("validation_stage") or "promotion")
          if stage not in {"canary", "runtime"}:
              raise SystemExit(
                  "Plugin runtime validation requires canary stage first; "
                  f"got {stage!r}"
              )
          evidence = Path(pointer["validation_evidence_path"])
          if not evidence.is_file():
              raise SystemExit(f"Validation evidence missing: {evidence}")
          payload = json.loads(evidence.read_text())
          if payload.get("validated") is not True:
              raise SystemExit("Current validation evidence does not pass")

          print(json.dumps({
              "version_id": pointer["version_id"],
              "validation_stage": stage,
              "runtime_config": pointer.get("runtime_config"),
          }, indent=2))
          PY

      - name: Select healthy runtime replay
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.scenario_source \
            --state-db /var/lib/haxlab/state/haxlab.sqlite3 \
            --max-candidates 2500 \
            --output /tmp/haxlab-runtime-source.json

          mapfile -t SRC < <(
            sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          data = json.load(open("/tmp/haxlab-runtime-source.json"))
          print(data["raw_path"])
          print(data["analysis_path"])
          print(data["sha256"])
          PY
          )
          RAW="${SRC[0]}"
          ANALYSIS="${SRC[1]}"

          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_stadium_from_replay.js" \
            "$RAW" /tmp/haxlab-runtime-stadium.hbs

          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_replay_scenarios.js" \
            "$RAW" "$ANALYSIS" /tmp/haxlab-runtime-scenarios.json 12 6 6

      - name: Exercise actual plugin runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_plugin_runtime_validation.js" \
            --pointer /var/lib/haxlab/derived/champions/elite-player/current.json \
            --fallback-model-dir /var/lib/haxlab/derived/training/elite-player-champion-candidate/model \
            --stadium /tmp/haxlab-runtime-stadium.hbs \
            --scenarios /tmp/haxlab-runtime-scenarios.json \
            --max-scenarios 4 \
            --seconds 30 \
            --sample-every 6 \
            --output /tmp/haxlab-plugin-runtime-validation.json

      - name: Record passing runtime validation
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          data = json.load(open("/tmp/haxlab-plugin-runtime-validation.json"))
          if data.get("validated") is not True:
              raise SystemExit("Plugin runtime gate rejected champion")
          print(json.dumps({
              "validated": True,
              "candidate": data.get("candidate"),
              "aggregate": data.get("aggregate"),
              "checks": data.get("checks"),
          }, indent=2))
          PY

          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.champion_registry \
            --registry-root /var/lib/haxlab/derived/champions/elite-player \
            --record-validation /tmp/haxlab-plugin-runtime-validation.json \
            --validation-stage runtime \
            --output /tmp/haxlab-runtime-registry-validation.json

      - name: Publish runtime evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          copy_if_present() {
            local src="$1"
            local dst="$2"
            if sudo test -f "$src"; then
              sudo cat "$src" > "$dst"
            fi
          }

          copy_if_present /tmp/haxlab-runtime-source.json runtime-source.json
          copy_if_present /tmp/haxlab-plugin-runtime-validation.json runtime-validation.json
          copy_if_present /tmp/haxlab-runtime-registry-validation.json runtime-registry-validation.json

          echo '## HaxLab Plugin Runtime Validation' >> "$GITHUB_STEP_SUMMARY"
          if test -f runtime-validation.json; then
            cat runtime-validation.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Runtime validation did not produce evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elite-plugin-runtime-validation
          path: |
            runtime-source.json
            runtime-validation.json
            runtime-registry-validation.json
          retention-days: 30

      - name: Enforce runtime gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data = json.load(open("runtime-validation.json"))
          print(json.dumps({
              "validated": data.get("validated"),
              "candidate": data.get("candidate"),
              "aggregate": data.get("aggregate"),
              "checks": data.get("checks"),
              "boundary_reload": data.get("boundary_reload"),
          }, indent=2))
          raise SystemExit(0 if data.get("validated") else 1)
          PY
