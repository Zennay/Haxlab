name: Elite Plugin Runtime Validation

on:
  push:
    branches:
      - experiment/frozen-future-head-v01

permissions:
  contents: read

concurrency:
  group: haxlab-elite-plugin-runtime-validation
  cancel-in-progress: true

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[runtime]')
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Preflight actual plugin runtime tooling
        shell: bash
        run: |
          set -euo pipefail
          node --check "$GITHUB_WORKSPACE/tools/elite_bot_plugin.js"
          node --check "$GITHUB_WORKSPACE/tools/elite_plugin_runtime_validation.js"
          node --check "$GITHUB_WORKSPACE/tools/elite_champion_config.js"
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            python3 -m py_compile \
            "$GITHUB_WORKSPACE/src/haxlab/evaluation/champion_registry.py"

      - name: Require canary-approved current champion
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/var/lib/haxlab/derived/champions/elite-player")
          pointer = json.loads((root / "current.json").read_text())
          stage = str(pointer.get("validation_stage") or "promotion")
          if stage not in {"canary", "runtime", "live"}:
              raise SystemExit(
                  f"Runtime validation requires canary stage or higher; got {stage!r}"
              )

          evidence_path = Path(pointer["validation_evidence_path"])
          evidence = json.loads(evidence_path.read_text())
          if evidence.get("validated") is not True:
              raise SystemExit("Current champion validation evidence is not passing")

          sources = (evidence.get("source_set") or {}).get("sources") or []
          if not sources:
              raise SystemExit("Current canary evidence has no replay source set")
          source = sources[0]

          Path("/tmp/haxlab-plugin-runtime-source.json").write_text(
              json.dumps(
                  {
                      "version_id": pointer["version_id"],
                      "validation_stage": stage,
                      "raw_path": source["raw_path"],
                      "analysis_path": source["analysis_path"],
                      "sha256": source["sha256"],
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "version_id": pointer["version_id"],
              "validation_stage": stage,
              "source_sha256": source["sha256"],
          }, indent=2))
          PY

      - name: Export live-like stadium and replay starts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SRC < <(
            sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          data = json.load(open("/tmp/haxlab-plugin-runtime-source.json"))
          print(data["raw_path"])
          print(data["analysis_path"])
          PY
          )
          RAW="\${SRC[0]}"
          ANALYSIS="\${SRC[1]}"

          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_stadium_from_replay.js" \
            "$RAW" /tmp/haxlab-plugin-runtime-stadium.hbs

          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_replay_scenarios.js" \
            "$RAW" "$ANALYSIS" \
            /tmp/haxlab-plugin-runtime-scenarios.json 12 6 6

      - name: Exercise actual elite bot plugin in sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_plugin_runtime_validation.js" \
            --pointer /var/lib/haxlab/derived/champions/elite-player/current.json \
            --fallback-model-dir /var/lib/haxlab/derived/training/elite-player-champion-candidate/model \
            --stadium /tmp/haxlab-plugin-runtime-stadium.hbs \
            --scenarios /tmp/haxlab-plugin-runtime-scenarios.json \
            --max-scenarios 4 \
            --seconds 30 \
            --sample-every 6 \
            --output /tmp/haxlab-plugin-runtime-validation.json

      - name: Record passing runtime validation
        shell: bash
        run: |
          set -euo pipefail
          if sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          data = json.load(open("/tmp/haxlab-plugin-runtime-validation.json"))
          raise SystemExit(0 if data.get("validated") is True else 1)
          PY
          then
            sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
              /opt/haxlab/.venv/bin/python -m haxlab.evaluation.champion_registry \
              --registry-root /var/lib/haxlab/derived/champions/elite-player \
              --record-validation /tmp/haxlab-plugin-runtime-validation.json \
              --validation-stage runtime \
              --output /tmp/haxlab-plugin-runtime-registry.json
          else
            sudo -u haxlab sh -c \
              'echo '"'"'{"recorded": false, "reason": "runtime_gate_rejected"}'"'"' > /tmp/haxlab-plugin-runtime-registry.json'
          fi

      - name: Publish runtime evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          copy_if_present() {
            local src="$1"
            local dst="$2"
            if sudo test -f "$src"; then
              sudo cat "$src" > "$dst"
            fi
          }
          copy_if_present /tmp/haxlab-plugin-runtime-source.json plugin-runtime-source.json
          copy_if_present /tmp/haxlab-plugin-runtime-validation.json plugin-runtime-validation.json
          copy_if_present /tmp/haxlab-plugin-runtime-registry.json plugin-runtime-registry.json

          echo '## HaxLab Actual Plugin Runtime Validation' >> "$GITHUB_STEP_SUMMARY"
          if test -f plugin-runtime-validation.json; then
            cat plugin-runtime-validation.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Runtime validation did not produce evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elite-plugin-runtime-validation
          path: |
            plugin-runtime-source.json
            plugin-runtime-validation.json
            plugin-runtime-registry.json
          retention-days: 30

      - name: Enforce runtime gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data = json.load(open("plugin-runtime-validation.json"))
          print(json.dumps({
              "validated": data.get("validated"),
              "aggregate": data.get("aggregate"),
              "boundary_reload": data.get("boundary_reload"),
              "checks": data.get("checks"),
          }, indent=2))
          raise SystemExit(0 if data.get("validated") else 1)
          PY
