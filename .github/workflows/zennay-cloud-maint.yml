name: Zennay Cloud maintenance

on:
  push:
    branches: [zennay-cloud-maint]
    paths:
      - ".github/workflows/zennay-cloud-maint.yml"

permissions:
  contents: read

concurrency:
  group: zennay-cloud-maint
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    steps:
      - name: Inspect Zennay Cloud safely
        shell: bash
        run: |
          set -euo pipefail
          echo "WHOAMI=$(whoami)"
          sudo -n true && echo "SUDO_OK=1" || echo "SUDO_OK=0"
          echo "=== project config ==="
          python3 - <<'PY'
          import json
          p=json.load(open("/home/ubuntu/zennay-cloud/projects.json"))
          for x in p:
              print(x["id"], x.get("status"), x.get("phase"), [m.get("progress") for m in x["milestones"]])
          PY
          echo "=== watch home stats ==="
          grep -n -B18 -A35 -E 'CPU|RAM|activeProjects|active_projects' /home/ubuntu/zennay-cloud/wear-os/app/src/main/java/com/zennay/cloud/watch/ui/ZennayWearApp.kt | head -260 || true
          echo "=== watch activity ==="
          sed -n '1,240p' /home/ubuntu/zennay-cloud/wear-os/app/src/main/java/com/zennay/cloud/watch/MainActivity.kt || true
          echo "=== gradle ==="
          cat /home/ubuntu/zennay-cloud/wear-os/app/build.gradle.kts
          echo "=== models ==="
          cat /home/ubuntu/zennay-cloud/wear-os/app/src/main/java/com/zennay/cloud/watch/data/Models.kt
          echo "=== repo ==="
          cat /home/ubuntu/zennay-cloud/wear-os/app/src/main/java/com/zennay/cloud/watch/data/ZennayCloudRepository.kt
          echo "=== service pids ==="
          for s in haxlab-analyzer.service haxlab-ingest.service haxlab-worker.service ftmo-autonomous.timer actions.runner.Zennay-Haxlab.vps-bb300bba-haxlab.service actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service zennay-cloud.service; do
            echo -n "$s "
            systemctl show "$s" -p ActiveState -p SubState -p MainPID -p CPUWeight -p MemoryCurrent --value | tr '\n' ' '
            echo
          done
