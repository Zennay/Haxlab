name: Zennay Cloud maintenance

on:
  push:
    branches: [zennay-cloud-maint]
    paths:
      - ".github/workflows/zennay-cloud-maint.yml"

permissions:
  contents: write

concurrency:
  group: zennay-cloud-maint
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zennay-cloud-maint
      - name: Inspect Zennay Cloud safely
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/zcm-result.txt) 2>&1
          echo "WHOAMI=$(whoami)"
          sudo -n true && echo "SUDO_OK=1" || echo "SUDO_OK=0"
          echo "=== watch metric pill ==="
          sed -n '390,470p' /home/ubuntu/zennay-cloud/wear-os/app/src/main/java/com/zennay/cloud/watch/ui/ZennayWearApp.kt
          echo "=== manifest ==="
          cat /home/ubuntu/zennay-cloud/wear-os/app/src/main/AndroidManifest.xml
          echo "=== index ==="
          cat /home/ubuntu/zennay-cloud/public/index.html
          echo "=== server resource/alert insertion anchors ==="
          grep -n -E 'def replay_metrics|def collect|def persist|def sampler|def watch_warnings|def watch_summary|def watch_project|class Handler|def do_POST|def route' /home/ubuntu/zennay-cloud/server.py
          echo "=== service pids/resources ==="
          for s in haxlab-analyzer.service haxlab-ingest.service haxlab-worker.service ftmo-autonomous.timer actions.runner.Zennay-Haxlab.vps-bb300bba-haxlab.service actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service zennay-cloud.service; do
            echo -n "$s "
            systemctl show "$s" -p ActiveState -p SubState -p MainPID -p CPUWeight -p MemoryCurrent --value | tr '\n' ' '
            echo
          done
      - name: Publish maintenance result
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/zcm-result.txt zennay-cloud-maint-result.txt
          git config user.name "zennay-cloud-maint"
          git config user.email "actions@users.noreply.github.com"
          git add zennay-cloud-maint-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Zennay Cloud maintenance inspection"
          git push origin HEAD:zennay-cloud-maint
