name: Zennay Cloud maintenance
# retry: adaptive-backend

on:
  push:
    branches: [zennay-cloud-maint]
    paths:
      - ".github/workflows/zennay-cloud-maint.yml"

permissions:
  contents: write

concurrency:
  group: zennay-cloud-maint
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zennay-cloud-maint

      - name: Apply upgrade safely
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/zennay-cloud-upgrade-result.txt) 2>&1
          ROOT=/home/ubuntu/zennay-cloud
          echo "generated_at=$(date -Is)"
          echo "=== BEFORE ==="
          for s in haxlab-analyzer.service haxlab-ingest.service haxlab-worker.service actions.runner.Zennay-Haxlab.vps-bb300bba-haxlab.service actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service ftmo-autonomous.timer zennay-cloud.service; do
            echo -n "$s "
            systemctl show "$s" -p ActiveState -p SubState -p MainPID -p CPUWeight -p MemoryHigh --value | tr '\n' ' '
            echo
          done

          cp "$ROOT/server.py" "$ROOT/server.py.bak-resource-alerts"
          cp "$ROOT/projects.json" "$ROOT/projects.json.bak-resource-alerts"
          cp "$ROOT/public/app.js" "$ROOT/public/app.js.bak-resource-alerts"

          python3 zennay-cloud-maint/apply_backend.py
          base64 -d zennay-cloud-maint/apply_web.py.b64 >/tmp/apply_web.py
          python3 /tmp/apply_web.py
          base64 -d zennay-cloud-maint/apply_wear.py.b64 >/tmp/apply_wear.py
          python3 /tmp/apply_wear.py

          echo "=== VALIDATE SOURCE ==="
          cd "$ROOT"
          python3 -m json.tool projects.json >/dev/null
          python3 -m py_compile server.py
          node --check public/app.js

          echo "=== RESOURCE POLICY ==="
          sudo systemctl set-property haxlab-analyzer.service CPUWeight=15
          sudo systemctl set-property haxlab-ingest.service CPUWeight=10
          sudo systemctl set-property haxlab-worker.service CPUWeight=15
          sudo systemctl set-property actions.runner.Zennay-Haxlab.vps-bb300bba-haxlab.service CPUWeight=20 MemoryHigh=2560M
          sudo systemctl set-property actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service CPUWeight=100 MemoryHigh=4096M
          sudo systemctl set-property ftmo-autonomous.service CPUWeight=100 MemoryHigh=4096M
          sudo systemctl set-property zennay-cloud.service CPUWeight=40

          echo "=== RESTART CLOUD ONLY ==="
          sudo systemctl restart zennay-cloud.service
          sleep 3
          curl -fsS http://127.0.0.1:8765/api/status >/tmp/status.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/status.json"))
          print("visible",[(p["id"],p["progress"],p.get("priority"),(p.get("quality") or {}).get("headline_value")) for p in d["projects"]])
          print("archived",[p["id"] for p in d.get("archived_projects",[])])
          PY
          TOKEN="$(cat "$ROOT/.watch-token")"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/api/v1/watch >/tmp/watch.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/watch.json"))
          print("watch_projects",[p["id"] for p in d["projects"]])
          print("alerts",[(a["severity"],a.get("project"),a["title"]) for a in d.get("alerts",[])])
          PY

          echo "=== BUILD WATCH ==="
          JAVA_BIN="$(find /usr/lib/jvm /opt /home/ubuntu -type f -path '*/bin/java' -perm -111 2>/dev/null | head -1)"
          if [ -z "$JAVA_BIN" ]; then echo "No Java runtime found" >&2; exit 1; fi
          export JAVA_HOME="$(dirname "$(dirname "$JAVA_BIN")")"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd "$ROOT/wear-os"
          if [ -x ./gradlew ]; then GRADLE=./gradlew; else GRADLE=/home/ubuntu/.cache/zennay-gradle/gradle-8.13/bin/gradle; fi
          ZENNAY_WATCH_TOKEN="$TOKEN" "$GRADLE" :app:assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "=== AFTER ==="
          for s in haxlab-analyzer.service haxlab-ingest.service haxlab-worker.service actions.runner.Zennay-Haxlab.vps-bb300bba-haxlab.service actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service ftmo-autonomous.timer zennay-cloud.service; do
            echo -n "$s "
            systemctl show "$s" -p ActiveState -p SubState -p MainPID -p CPUWeight -p MemoryHigh --value | tr '\n' ' '
            echo
          done

      - name: Publish result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/zennay-cloud-upgrade-result.txt zennay-cloud-maint-result.txt 2>/dev/null || echo "upgrade failed before log creation" > zennay-cloud-maint-result.txt
          git config user.name "zennay-cloud-maint"
          git config user.email "actions@users.noreply.github.com"
          git add zennay-cloud-maint-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish Zennay Cloud upgrade result"
          git push origin HEAD:zennay-cloud-maint
