name: Zennay Cloud maintenance

on:
  push:
    branches: [zennay-cloud-maint]
    paths:
      - ".github/workflows/zennay-cloud-maint.yml"

permissions:
  contents: write

concurrency:
  group: zennay-cloud-maint
  cancel-in-progress: false

jobs:
  wear:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zennay-cloud-maint

      - name: Apply Wear alerts and metric layout
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/zennay-cloud-upgrade-result.txt) 2>&1
          ROOT=/home/ubuntu/zennay-cloud
          echo "generated_at=$(date -Is)"
          echo "=== BEFORE SERVICES ==="
          for s in haxlab-analyzer.service haxlab-ingest.service haxlab-worker.service actions.runner.Zennay-Haxlab.vps-bb300bba-haxlab.service actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service ftmo-autonomous.timer zennay-cloud.service; do
            echo -n "$s "
            systemctl show "$s" -p ActiveState -p SubState -p MainPID -p CPUWeight -p MemoryHigh --value | tr '\n' ' '
            echo
          done

          echo "=== WATCH API ==="
          TOKEN="$(cat "$ROOT/.watch-token")"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/api/v1/watch >/tmp/watch-before.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/watch-before.json"))
          print("keys",sorted(d.keys()))
          print("projects",[p["id"] for p in d.get("projects",[])])
          print("alerts_count",len(d.get("alerts",[])))
          if "alerts" not in d:
              raise SystemExit("Watch API has no alerts feed yet")
          PY

          base64 -d zennay-cloud-maint/apply_wear.py.b64 >/tmp/apply_wear.py
          python3 /tmp/apply_wear.py

          echo "=== BUILD WATCH ==="
          JAVA_BIN="$(find /usr/lib/jvm /opt /home/ubuntu -type f -path '*/bin/java' -perm -111 -print -quit 2>/dev/null)"
          test -n "$JAVA_BIN"
          export JAVA_HOME="$(dirname "$(dirname "$JAVA_BIN")")"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd "$ROOT/wear-os"
          if [ -x ./gradlew ]; then GRADLE=./gradlew; else GRADLE=/home/ubuntu/.cache/zennay-gradle/gradle-8.13/bin/gradle; fi
          ZENNAY_WATCH_TOKEN="$TOKEN" "$GRADLE" :app:assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "=== VERIFY UI/ALERT CODE ==="
          grep -n -A18 -B5 "MetricStack" app/src/main/java/com/zennay/cloud/watch/ui/ZennayWearApp.kt | head -80
          grep -n -E "POST_NOTIFICATIONS|AlertWorker|PeriodicWorkRequestBuilder" app/src/main/AndroidManifest.xml app/src/main/java/com/zennay/cloud/watch/MainActivity.kt app/src/main/java/com/zennay/cloud/watch/AlertWorker.kt

          echo "=== AFTER SERVICES ==="
          for s in haxlab-analyzer.service haxlab-ingest.service haxlab-worker.service actions.runner.Zennay-Haxlab.vps-bb300bba-haxlab.service actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service ftmo-autonomous.timer zennay-cloud.service; do
            echo -n "$s "
            systemctl show "$s" -p ActiveState -p SubState -p MainPID -p CPUWeight -p MemoryHigh --value | tr '\n' ' '
            echo
          done

      - name: Publish result
        if: ${{ always() }}
        shell: bash
        run: |
          cp /tmp/zennay-cloud-upgrade-result.txt zennay-cloud-maint-result.txt 2>/dev/null || echo "wear job failed before log creation" > zennay-cloud-maint-result.txt
          git config user.name "zennay-cloud-maint"
          git config user.email "actions@users.noreply.github.com"
          git add zennay-cloud-maint-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish Wear alert build result"
          git push origin HEAD:zennay-cloud-maint
