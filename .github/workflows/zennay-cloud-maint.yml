name: Zennay Cloud maintenance

on:
  push:
    branches: [zennay-cloud-maint]
    paths:
      - ".github/workflows/zennay-cloud-maint.yml"
      - "maintenance/apply_zennay_cloud.py"

permissions:
  contents: write

concurrency:
  group: zennay-cloud-maint
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zennay-cloud-maint
      - name: Apply Zennay Cloud resource, alert and Wear updates
        shell: bash
        run: |
          set -euo pipefail
          python3 maintenance/apply_zennay_cloud.py 2>&1 | tee /tmp/zcm-result.txt
      - name: Publish maintenance result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== workflow result ==="
            cat /tmp/zcm-result.txt 2>/dev/null || echo "patch did not produce output"
            echo
            echo "=== service health ==="
            systemctl is-active zennay-cloud.service || true
            systemctl is-active haxlab-analyzer.service || true
            systemctl is-active haxlab-ingest.service || true
            systemctl is-active haxlab-worker.service || true
            systemctl is-active actions.runner.Zennay-Haxlab.vps-bb300bba-haxlab.service || true
            systemctl is-active actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service || true
          } > zennay-cloud-maint-result.txt
          git config user.name "zennay-cloud-maint"
          git config user.email "actions@users.noreply.github.com"
          git add zennay-cloud-maint-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Zennay Cloud maintenance result"
          git push origin HEAD:zennay-cloud-maint
