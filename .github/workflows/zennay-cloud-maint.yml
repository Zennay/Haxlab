name: Zennay Cloud maintenance

on:
  push:
    branches: [zennay-cloud-maint]
    paths:
      - ".github/workflows/zennay-cloud-maint.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zennay-cloud-maint
      - name: Inspect alert and resource integration
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "generated_at=$(date -Is)"
            echo "=== SERVER WATCH ==="
            sed -n '260,380p' /home/ubuntu/zennay-cloud/server.py
            echo "=== ENHANCEMENTS ==="
            sed -n '1,360p' /home/ubuntu/zennay-cloud/enhancements.py
            echo "=== APP QUALITY/RESOURCE ==="
            grep -n -E "quality|resource|milestone-progress|priority" /home/ubuntu/zennay-cloud/public/app.js | head -120
            echo "=== LAYOUT ==="
            cat /home/ubuntu/zennay-cloud/project-layout.json
          } >/tmp/zennay-cloud-upgrade-result.txt
      - name: Publish result
        shell: bash
        run: |
          cp /tmp/zennay-cloud-upgrade-result.txt zennay-cloud-maint-result.txt
          git config user.name "zennay-cloud-maint"
          git config user.email "actions@users.noreply.github.com"
          git add zennay-cloud-maint-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish alert integration inspection"
          git push origin HEAD:zennay-cloud-maint
