name: Zennay Cloud maintenance

on:
  push:
    branches: [zennay-cloud-maint]
    paths:
      - ".github/workflows/zennay-cloud-maint.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zennay-cloud-maint
      - name: Inspect current Cloud code
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "generated_at=$(date -Is)"
            echo "=== SERVER COLLECT ==="
            sed -n '100,210p' /home/ubuntu/zennay-cloud/server.py
            echo "=== PROJECTS ==="
            cat /home/ubuntu/zennay-cloud/projects.json
            echo "=== WATCH UI METRICS ==="
            grep -n -A35 -B12 "OverviewHero" /home/ubuntu/zennay-cloud/wear-os/app/src/main/java/com/zennay/cloud/watch/ui/ZennayWearApp.kt
          } >/tmp/zennay-cloud-upgrade-result.txt
      - name: Publish result
        shell: bash
        run: |
          cp /tmp/zennay-cloud-upgrade-result.txt zennay-cloud-maint-result.txt
          git config user.name "zennay-cloud-maint"
          git config user.email "actions@users.noreply.github.com"
          git add zennay-cloud-maint-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish current Cloud code inspection"
          git push origin HEAD:zennay-cloud-maint
