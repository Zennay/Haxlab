name: Finalize FTMO Worker2 4ac package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-ftmo-4ac.yml"

permissions:
  contents: read

jobs:
  finalize:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5
    steps:
      - name: Verify merged proof and persist queue DONE
        shell: bash
        env:
          QUEUE_ID: ftmo-4ac271bbac008ae8
          PROOF_RUN: "37036778060"
          MERGE_SHA: 70dd2c40dacdcf0f073512e6d114381b9d6aa4fa
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          proof="$(gh api "repos/Zennay/HaxLab/actions/runs/$PROOF_RUN")"
          python3 -c 'import json,sys; d=json.load(sys.stdin); (d.get("status"),d.get("conclusion"))==("completed","success") or (_ for _ in ()).throw(SystemExit("exact-head proof not green")); print("PR455_PROOF_GREEN=1")' <<<"$proof"
          compare="$(gh api "repos/Zennay/Ftmo/compare/$MERGE_SHA...main")"
          python3 -c 'import json,sys; d=json.load(sys.stdin); d.get("status") in {"ahead","identical"} and d.get("behind_by")==0 or (_ for _ in ()).throw(SystemExit("merge is not in current main ancestry")); print("PR455_MERGE_ANCESTRY_GREEN=1")' <<<"$compare"
          python3 - <<'PY'
          import json, os, urllib.request
          base="http://127.0.0.1:8765"
          queue_id=os.environ["QUEUE_ID"]
          merge_sha=os.environ["MERGE_SHA"]
          proof_run=os.environ["PROOF_RUN"]
          evidence=(
              f"Worker2 Gen29 provider-validation evidence-envelope integrity completed. PR #455 merged as {merge_sha}; "
              f"exact-head VPS proof {proof_run} SUCCESS on vps-bb300bba-haxlab covering exact checkout, isolated install, "
              "provider-validation compile, strict JSON envelope + frozen V1 scope tests, provider-foundation publication, "
              "provider retry, autonomous deploy lockstep, zero-cost boundaries and full-suite collection. "
              "Generation 29 remains provider_foundation; Generation 10 remains terminally closed/rejected; "
              "development/walk-forward/final-holdout/live/broker and paid-cloud boundaries remain sealed."
          )
          def get(path):
              with urllib.request.urlopen(base+path,timeout=10) as r: return json.load(r)
          def post(path,payload):
              req=urllib.request.Request(base+path,data=json.dumps(payload).encode(),method="POST",headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=10) as r: return json.load(r)
          live=get("/api/portfolio-queue?all=1")
          item=next((x for x in live.get("items",[]) if x.get("queue_id")==queue_id),None)
          if not item: raise RuntimeError("queue item missing")
          if str(item.get("project_id") or "").lower()!="ftmo": raise RuntimeError("project mismatch")
          status=str(item.get("status") or "").lower()
          if status=="done":
              print("QUEUE_ALREADY_DONE",json.dumps(item,sort_keys=True))
          else:
              if status not in {"claimed","running","verifying","in_progress"}: raise RuntimeError("queue not actively owned: "+status)
              slot=item.get("worker_slot")
              if slot is None: raise RuntimeError("worker_slot missing")
              result=post("/api/portfolio-queue",{"action":"result","worker_slot":slot,"queue_id":queue_id,"result":"DONE","evidence":evidence})
              print("QUEUE_DONE_WRITE",json.dumps(result,sort_keys=True))
              if not result.get("ok"): raise RuntimeError("DONE write rejected")
          verify=get("/api/portfolio-queue?all=1")
          final=next((x for x in verify.get("items",[]) if x.get("queue_id")==queue_id),None)
          if not final or str(final.get("status") or "").lower()!="done" or bool(final.get("eligible")):
              raise RuntimeError("DONE state not persisted")
          print("QUEUE_DONE_VERIFIED",json.dumps({k:final.get(k) for k in ("queue_id","status","eligible","worker_slot","evidence")},sort_keys=True))
          PY
