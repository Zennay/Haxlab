name: FTMO PR455 exact-head provider validation proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr455-exact-head-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 16
    env:
      TARGET_SHA: a1bcba2758e59540237cd6ccdee393cea3c36745
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Fetch exact FTMO PR455 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr455-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR455_EXACT_SHA=$TARGET_SHA"
      - name: Install isolated environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr455-proof"
          venv="$RUNNER_TEMP/ftmo-pr455-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
      - name: Compile provider validation boundary
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr455-proof"
          venv="$RUNNER_TEMP/ftmo-pr455-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/research/provider_validation.py
          echo "FTMO_PR455_COMPILE_GREEN=1"
      - name: Prove strict provider-validation envelope and V1 scope
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr455-proof"
          venv="$RUNNER_TEMP/ftmo-pr455-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_provider_validation_json_integrity.py tests/test_provider_validation.py
          echo "FTMO_PR455_PROVIDER_VALIDATION_GREEN=1"
      - name: Prove adjacent provider-foundation boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr455-proof"
          venv="$RUNNER_TEMP/ftmo-pr455-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q tests/test_provider_foundation_publication.py tests/test_autonomous_provider_retry.py tests/test_autonomous_deploy_lockstep.py tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR455_ADJACENT_GREEN=1"
      - name: Collect full suite
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr455-proof"
          venv="$RUNNER_TEMP/ftmo-pr455-venv"
          cd "$src"
          "$venv/bin/python" -m pytest --collect-only -q >"$RUNNER_TEMP/ftmo-pr455-collect.txt"
          tail -n 2 "$RUNNER_TEMP/ftmo-pr455-collect.txt"
          echo "FTMO_PR455_COLLECTION_GREEN=1"
