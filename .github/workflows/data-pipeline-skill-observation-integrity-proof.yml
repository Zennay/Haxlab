name: HaxLab skill observation integrity proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch SHA to prove
        required: true
        type: string
  push:
    branches:
      - feature/data-pipeline-skill-observation-integrity-r1-20261007
    paths:
      - "src/haxlab/skill/models.py"
      - "tests/test_skill_models.py"
      - "docs/skill-observation-integrity.md"
      - ".github/workflows/data-pipeline-skill-observation-integrity-proof.yml"

permissions:
  contents: read

concurrency:
  group: haxlab-skill-observation-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head skill observation integrity
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .skill-observation-integrity-venv
          python3 -m venv .skill-observation-integrity-venv
          .skill-observation-integrity-venv/bin/pip install -q --upgrade pip
          .skill-observation-integrity-venv/bin/pip install -q -e '.[dev]'
          .skill-observation-integrity-venv/bin/python -m compileall -q src tests
          .skill-observation-integrity-venv/bin/pytest -q \
            tests/test_skill_models.py \
            tests/test_skill.py \
            tests/test_skill_leaderboard.py
          .skill-observation-integrity-venv/bin/pytest --collect-only -q >/dev/null
          echo "HAXLAB_SKILL_OBSERVATION_INTEGRITY_PROOF=success"
