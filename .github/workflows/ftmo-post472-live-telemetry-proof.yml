name: FTMO post-472 live telemetry proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftmo-post472-live-telemetry-proof.yml'

permissions:
  contents: write

concurrency:
  group: ftmo-post472-live-telemetry-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 25
    env:
      TARGET_SHA: e715786a700ef0598f3362798482a5ecce9264c8
      FTMO_STABLE_ROOT: /opt/ftmo-autonomous
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Prove merged telemetry against live Gen30 status
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          work="$RUNNER_TEMP/ftmo-post472-$GITHUB_RUN_ID"
          rm -rf "$work"
          gh repo clone Zennay/Ftmo "$work" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$work" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$work" rev-parse HEAD)" = "$TARGET_SHA"

          venv="$RUNNER_TEMP/ftmo-post472-venv-$GITHUB_RUN_ID"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$work/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$work"

          cd "$work"
          "$venv/bin/python" -m pytest -q             tests/test_project_telemetry.py             tests/test_project_telemetry_cli.py             tests/test_project_telemetry_runtime_status.py

          status="$FTMO_STABLE_ROOT/.scratch/autonomy/status.json"
          test -f "$status"
          test ! -L "$status"
          before="$(sha256sum "$status" | awk '{print $1}')"

          "$venv/bin/python" -m prop_trading_ai.cli.v1_project_telemetry             --root .             --config configs/research_machine.json             --runtime-status "$status"             --expected-runtime-revision "$TARGET_SHA"             --output "$RUNNER_TEMP/ftmo-post472.json"             --markdown-output "$RUNNER_TEMP/ftmo-post472.md"

          after="$(sha256sum "$status" | awk '{print $1}')"
          test "$before" = "$after"

          grep -F 'Live autonomous:** Generation **30**' "$RUNNER_TEMP/ftmo-post472.md"
          grep -F 'provider_foundation_window_not_elapsed' "$RUNNER_TEMP/ftmo-post472.md"
          grep -F '2026-12-25T21:00:00+00:00' "$RUNNER_TEMP/ftmo-post472.md"
          grep -F 'Repository lifecycle basis:** 25% confirmed' "$RUNNER_TEMP/ftmo-post472.md"
          ! grep -F 'Freeze preregistration.' "$RUNNER_TEMP/ftmo-post472.md"

          "$venv/bin/python" - "$RUNNER_TEMP/ftmo-post472.json" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          live=data["autonomous_runtime"]
          assert live["generation_number"] == 30
          assert live["stage"] == "provider_foundation"
          assert live["action"] == "provider_foundation_window_not_elapsed"
          assert live["provider_window_ready_at_utc"] == "2026-12-25T21:00:00+00:00"
          assert live["development_access_allowed"] is False
          assert live["walk_forward_access_allowed"] is False
          assert live["final_holdout_access_allowed"] is False
          assert live["live_trading_allowed"] is False
          assert live["broker_order_submission_allowed"] is False
          assert data["generation"]["number"] == 19
          print(json.dumps({
              "live_generation":live["generation_number"],
              "live_stage":live["stage"],
              "live_action":live["action"],
              "ready_at":live["provider_window_ready_at_utc"],
              "repository_lifecycle_generation":data["generation"]["number"],
              "runtime_revision_matches_telemetry_main":live["runtime_revision_matches_expected"],
          }, sort_keys=True))
          PY
          echo "FTMO_POST472_LIVE_TELEMETRY_GREEN=1"

      - name: Dispatch canonical FTMO project telemetry
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)"
          test "$current" = "$TARGET_SHA"
          gh workflow run project-telemetry.yml --repo Zennay/Ftmo --ref main
          echo "FTMO_CANONICAL_TELEMETRY_DISPATCHED=1"
