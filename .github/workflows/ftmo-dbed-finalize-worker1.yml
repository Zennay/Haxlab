name: Finalize FTMO dbed Worker1 package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-dbed-finalize-worker1.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-dbed-finalize-worker1
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    env:
      QUEUE_ID: ftmo-dbed0545ffd3cec5
      WORKER_SLOT: "1"
      EXACT_HEAD: 353541e8e5208233ccdc67f5ac3582e627c3b280
      MERGE_SHA: 924df8eef5e7270ee952cdc4292f3b06a473a081
      PROOF_RUN: "37156545848"
    steps:
      - name: Verify exact-head proof and merge ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 - <<'PY'
          import json, os, subprocess

          proof_run=json.loads(subprocess.check_output(
              ["gh","api",f"repos/Zennay/Haxlab/actions/runs/{os.environ['PROOF_RUN']}"],
              text=True,
          ))
          if (proof_run.get("status"), proof_run.get("conclusion")) != ("completed","success"):
              raise SystemExit("exact-head proof is not green")

          receipt=json.loads(subprocess.check_output(
              [
                  "gh","api",
                  f"repos/Zennay/Haxlab/contents/runtime-evidence/ftmo-pr464-haxlab-proof-{os.environ['PROOF_RUN']}.json",
                  "-H","Accept: application/vnd.github.raw+json",
              ],
              text=True,
          ))
          if receipt.get("target_sha") != os.environ["EXACT_HEAD"]:
              raise SystemExit("proof receipt exact-head mismatch")
          if receipt.get("result") != "success":
              raise SystemExit("proof receipt is not successful")
          if receipt.get("queue_id") != os.environ["QUEUE_ID"]:
              raise SystemExit("proof receipt queue mismatch")

          main=json.loads(subprocess.check_output(
              ["gh","api","repos/Zennay/Ftmo/git/ref/heads/main"], text=True
          ))["object"]["sha"]
          compare=json.loads(subprocess.check_output(
              ["gh","api",f"repos/Zennay/Ftmo/compare/{os.environ['MERGE_SHA']}...{main}"],
              text=True,
          ))
          if compare.get("status") not in {"ahead","identical"}:
              raise SystemExit(f"merge not in current main ancestry: {compare.get('status')}")
          print("FTMO_DBED_PROVEN_MERGE_GREEN=1")
          print("FTMO_MAIN_SHA="+main)
          PY

      - name: Finalize live SQLite queue item
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/ftmo-dbed-finalizer.json
          import importlib.util, json, os, sqlite3, sys
          from pathlib import Path

          queue_id=os.environ["QUEUE_ID"]
          worker_slot=int(os.environ["WORKER_SLOT"])
          root=Path("/home/ubuntu/zennay-cloud")
          db=root/"history.db"
          server_path=root/"server.py"
          if not db.is_file() or not server_path.is_file():
              raise SystemExit("live zCloud queue files missing")

          def read_item():
              with sqlite3.connect(db) as c:
                  c.row_factory=sqlite3.Row
                  row=c.execute(
                      "SELECT queue_id,project_id,title,status,eligible,worker_slot,evidence,updated_at,parent_queue_id "
                      "FROM portfolio_queue WHERE queue_id=?",(queue_id,),
                  ).fetchone()
              return dict(row) if row else None

          before=read_item()
          if not before:
              raise SystemExit("queue item missing")
          if before["project_id"]!="ftmo":
              raise SystemExit("queue project mismatch")

          evidence=(
              "Worker1 provider-validation ancestor path integrity complete. "
              "PR #464 exact head "+os.environ["EXACT_HEAD"]+" adds no-follow traversal for every "
              "provider-validation parent path component, absolute-path binding, end-of-read ancestry revalidation, "
              "focused symlink-ancestor regressions, and a permanent self-hosted zero-cost integrity gate. "
              "Initial exact-head run 37156452133 correctly failed because the new workflow was absent from the "
              "zero-cost registry; commit 353541e8e5208233ccdc67f5ac3582e627c3b280 registered it. "
              "Fixed exact-head HaxLab VPS proof "+os.environ["PROOF_RUN"]+" SUCCESS on vps-bb300bba; "
              "PR #464 squash-merged as "+os.environ["MERGE_SHA"]+". "
              "Provider-foundation remains sealed from development/walk-forward/final-holdout/live/broker/paid-cloud stages."
          )

          if before["status"]=="done" and int(before["eligible"] or 0)==0 and before["worker_slot"] is None:
              result={"updated":False,"already_done":True}
          elif (
              before["status"] in {"claimed","running","verifying","in_progress"}
              and int(before["eligible"] or 0)==1
              and before["worker_slot"]==worker_slot
          ):
              sys.path.insert(0,str(root))
              spec=importlib.util.spec_from_file_location("zcloud_live_server",server_path)
              if spec is None or spec.loader is None:
                  raise SystemExit("cannot load live zCloud server")
              server=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(server)
              server.DB=db
              result=server.portfolio_queue_finish(worker_slot,queue_id,"DONE",evidence)
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused claimed assignment")
          else:
              raise SystemExit(
                  f"refusing queue mutation status={before['status']} eligible={before['eligible']} "
                  f"worker_slot={before['worker_slot']}"
              )

          after=read_item()
          if (
              not after
              or after["status"]!="done"
              or int(after["eligible"] or 0)!=0
              or after["worker_slot"] is not None
          ):
              raise SystemExit("queue did not reach terminal done state")
          print(json.dumps({
              "project":"ftmo",
              "queue_id":queue_id,
              "before":before,
              "finish_result":result,
              "after":after,
              "proof_run":int(os.environ["PROOF_RUN"]),
              "exact_head":os.environ["EXACT_HEAD"],
              "merge_sha":os.environ["MERGE_SHA"],
          },sort_keys=True,default=str))
          PY
          cat /tmp/ftmo-dbed-finalizer.json

      - name: Persist finalizer receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 /tmp/ftmo-dbed-finalizer.json)"
          path="runtime-evidence/ftmo-dbed-worker1-finalizer-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/Haxlab/contents/$path"             -f message="Record FTMO dbed Worker1 finalizer ${GITHUB_RUN_ID}"             -f content="$encoded" >/dev/null
# trigger: worker1-dbed-finalize
