name: Elite Player Champion Candidate

on:
  workflow_dispatch:
    inputs:
      replay_limit:
        description: "Maximum replays per split; 0 means full available split"
        required: true
        default: "0"
      epochs:
        description: "Training epochs"
        required: true
        default: "6"
      window:
        description: "Temporal state window"
        required: true
        default: "8"
      benchmark_matches:
        description: "Sandbox benchmark matches"
        required: true
        default: "18"
      benchmark_minutes:
        description: "Minutes per sandbox match"
        required: true
        default: "2"

permissions:
  contents: read

concurrency:
  group: haxlab-elite-champion-candidate
  cancel-in-progress: false

jobs:
  train-and-benchmark:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Build alias-aware 4v4 leaderboard
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab mkdir -p /var/lib/haxlab/derived/leaderboards
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.skill.leaderboard \
            --root /var/lib/haxlab/derived/state-pass-v4 \
            --top 10000 \
            --min-matches 1 \
            --min-minutes 0 \
            --aliases "$GITHUB_WORKSPACE/configs/player_aliases.json" \
            --format json \
            --output /var/lib/haxlab/derived/leaderboards/elite-champion.json \
            >/tmp/haxlab-elite-champion-leaderboard.json

      - name: Train champion candidate
        shell: bash
        run: |
          set -euo pipefail
          WORK_ROOT=/var/lib/haxlab/derived/training/elite-player-champion-candidate
          sudo -u haxlab rm -rf "$WORK_ROOT"

          LIMIT_ARGS=()
          if [ "\${{ inputs.replay_limit }}" != "0" ]; then
            LIMIT_ARGS=(--replay-limit "\${{ inputs.replay_limit }}")
          fi

          sudo -u haxlab env \
            PYTHONPATH="$GITHUB_WORKSPACE/src" \
            NODE_PATH=/opt/haxlab/node_modules \
            /opt/haxlab/.venv/bin/python -m haxlab.learning.elite_pipeline \
            --analysis-root /var/lib/haxlab/derived/state-pass-v4 \
            --leaderboard /var/lib/haxlab/derived/leaderboards/elite-champion.json \
            --raw-root /var/lib/haxlab/raw/replays \
            --work-root "$WORK_ROOT" \
            --node-script "$GITHUB_WORKSPACE/tools/extract_elite_imitation.js" \
            --aliases "$GITHUB_WORKSPACE/configs/player_aliases.json" \
            --epochs "\${{ inputs.epochs }}" \
            --window "\${{ inputs.window }}" \
            --hidden-dim 192 \
            --hidden-dim-2 128 \
            --batch-size 2048 \
            --shard-workers 3 \
            "\${LIMIT_ARGS[@]}" \
            | tee /tmp/haxlab-elite-champion.log

      - name: Verify offline live-test gate
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.elite_gate \
            /var/lib/haxlab/derived/training/elite-player-champion-candidate/model/metrics.json \
            --output /var/lib/haxlab/derived/training/elite-player-champion-candidate/offline-gate.json

      - name: Extract exact replay stadium
        shell: bash
        run: |
          set -euo pipefail
          RAW_REPLAY="$(
            /opt/haxlab/.venv/bin/python - <<'PY'
          import sqlite3
          db = sqlite3.connect("/var/lib/haxlab/state/haxlab.sqlite3")
          row = db.execute("""
          SELECT r.archive_path
          FROM source_files s
          JOIN raw_replays r ON r.sha256 = s.sha256
          WHERE lower(s.source_path) LIKE '%kjambvsado%'
          ORDER BY s.last_seen_at DESC
          LIMIT 1
          """).fetchone()
          if row:
              print(row[0])
          PY
          )"
          test -n "$RAW_REPLAY"
          test -f "$RAW_REPLAY"

          NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_stadium_from_replay.js" \
            "$RAW_REPLAY" \
            /tmp/haxlab-champion-stadium.hbs

      - name: Run 4v4 sandbox arena
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_sandbox_benchmark.js" \
            --model /var/lib/haxlab/derived/training/elite-player-champion-candidate/model/runtime-model.json \
            --stadium /tmp/haxlab-champion-stadium.hbs \
            --matches "\${{ inputs.benchmark_matches }}" \
            --minutes "\${{ inputs.benchmark_minutes }}" \
            --sample-every 6 \
            --output /var/lib/haxlab/derived/training/elite-player-champion-candidate/sandbox-benchmark.json

      - name: Collect candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=elite-champion-evidence
          mkdir -p "$OUT"
          sudo cp /var/lib/haxlab/derived/training/elite-player-champion-candidate/pipeline-summary.json "$OUT/pipeline-summary.json"
          sudo cp /var/lib/haxlab/derived/training/elite-player-champion-candidate/model/metrics.json "$OUT/model-metrics.json"
          sudo cp /var/lib/haxlab/derived/training/elite-player-champion-candidate/offline-gate.json "$OUT/offline-gate.json"
          sudo cp /var/lib/haxlab/derived/training/elite-player-champion-candidate/sandbox-benchmark.json "$OUT/sandbox-benchmark.json"
          sudo chown -R "$USER":"$USER" "$OUT"

          {
            echo "## HaxLab Elite Champion Candidate"
            echo
            echo "### Offline gate"
            cat "$OUT/offline-gate.json"
            echo
            echo "### Sandbox benchmark"
            cat "$OUT/sandbox-benchmark.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: elite-champion-candidate-evidence
          path: elite-champion-evidence
          retention-days: 30
