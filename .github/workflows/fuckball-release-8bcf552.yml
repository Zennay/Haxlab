name: Explicit Fuckball native-engine release 8bcf552
# Deliberate one-release promotion. This branch-only trigger does not resume
# automatic deployment of Fuckball main or touch the frozen legacy workflow.
on:
  push:
    branches: [codex/fuckball-release-8bcf552]
    paths: ['.github/workflows/fuckball-release-8bcf552.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuckball-vps-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 12
    env:
      APPROVED_SHA: 8bcf552a1a39269b825bc5cf5f23d0528928fb3e
      APP_PORT: '3417'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage and test the exact recovered release
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fuckball-release-$GITHUB_RUN_ID"
          git clone --no-checkout --filter=blob:none https://github.com/Zennay/fuckball.git "$stage"
          cd "$stage"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          git fetch --depth 1 origin "$APPROVED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          npm test
          npm run build:solo
          node --check dist/match-ui.js
          node --check dist/server-client.js
          echo "RELEASE_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Install immutable release and verify live physics
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_STAGE"
          release="/opt/fuckball-releases/$APPROVED_SHA-$GITHUB_RUN_ID"
          backup="/opt/fuckball-release-backups/$GITHUB_RUN_ID"
          # Deliberately leave /opt/fuckball and every uncommitted file intact.
          sudo -n mkdir -p "$release" "$backup"
          if [ -e /etc/systemd/system/fuckball.service ]; then
            sudo -n cp -a /etc/systemd/system/fuckball.service "$backup/fuckball.service"
          fi
          tar --exclude=.git -cf - . | sudo -n tar -xf - -C "$release"
          sudo -n chmod -R a+rX "$release"
          node_binary="$(command -v node)"
          run_user="$(id -un)"
          run_group="$(id -gn)"
          rollback() {
            code=$?
            if [ -f "$backup/fuckball.service" ]; then
              sudo -n cp "$backup/fuckball.service" /etc/systemd/system/fuckball.service
              sudo -n systemctl daemon-reload
              sudo -n systemctl restart fuckball.service
            fi
            echo "::error::Release verification failed; previous service restored. All source directories preserved."
            exit "$code"
          }
          trap rollback ERR
          printf '[Unit]\nDescription=Fuckball native engine release\nAfter=network-online.target\nWants=network-online.target\n\n[Service]\nType=simple\nUser=%s\nGroup=%s\nWorkingDirectory=%s\nEnvironment=NODE_ENV=production\nEnvironment=PORT=%s\nEnvironment=FUCKBALL_RELEASE_SHA=%s\nExecStart=%s %s/server.js\nRestart=always\nRestartSec=3\nNoNewPrivileges=true\nPrivateTmp=true\nProtectSystem=strict\n\n[Install]\nWantedBy=multi-user.target\n' "$run_user" "$run_group" "$release" "$APP_PORT" "$APPROVED_SHA" "$node_binary" "$release" | sudo -n tee /etc/systemd/system/fuckball.service >/dev/null
          sudo -n systemctl daemon-reload
          sudo -n systemctl restart fuckball.service
          ready=0
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 3 "http://127.0.0.1:$APP_PORT/health" >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/verify-live.cjs "http://127.0.0.1:$APP_PORT" "$APPROVED_SHA" | tee "$RUNNER_TEMP/fuckball-release-proof.json"
          sudo -n systemctl is-active --quiet fuckball.service
          trap - ERR
          echo "Recovered Fuckball release verified: $APPROVED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "New immutable directory: $release" >> "$GITHUB_STEP_SUMMARY"
          echo "Previous service backup: $backup" >> "$GITHUB_STEP_SUMMARY"
          echo "Original /opt/fuckball was not reset, cleaned or overwritten. Legacy scheduled deployment remains disabled." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fuckball-native-release-proof
          path: ${{ runner.temp }}/fuckball-release-proof.json
          retention-days: 14

      - name: Install and start checkpointed twelve-hour VPS training
        shell: bash
        run: |
          set -euo pipefail
          if sudo -n systemctl is-active --quiet fuckball-training.service; then
            echo "Existing Fuckball trainer is active; preserving its current batch."
            curl -fsS http://127.0.0.1:3417/api/training
            exit 0
          fi
          training=/opt/fuckball-training
          run_user="$(id -un)"
          run_group="$(id -gn)"
          release="/opt/fuckball-releases/$APPROVED_SHA-$GITHUB_RUN_ID"
          sudo -n install -d -o "$run_user" -g "$run_group" "$training"
          python3 -m venv "$training/venv"
          "$training/venv/bin/pip" install 'numpy>=2.1,<3'
          cd "$release"
          "$training/venv/bin/python" tests/checkpoint-resume.py
          node_binary="$(command -v node)"
          printf '[Unit]\nDescription=Fuckball checkpointed HaxLab training\nAfter=network-online.target\n\n[Service]\nType=simple\nUser=%s\nGroup=%s\nWorkingDirectory=%s\nEnvironment=CODEX_PRIMARY_RUNTIME_PYTHON=%s/venv/bin/python\nEnvironment=OPENBLAS_NUM_THREADS=2\nEnvironment=OMP_NUM_THREADS=2\nExecStart=%s %s/training/continuous.cjs %s 12\nRestart=on-failure\nRestartSec=30\nNice=10\nCPUQuota=200%%\nMemoryMax=3G\nTimeoutStopSec=30\nKillMode=control-group\nNoNewPrivileges=true\nPrivateTmp=true\nProtectSystem=strict\nReadWritePaths=%s\n' "$run_user" "$run_group" "$release" "$training" "$node_binary" "$release" "$training" "$training" | sudo -n tee /etc/systemd/system/fuckball-training.service >/dev/null
          sudo -n systemctl daemon-reload
          sudo -n systemctl start fuckball-training.service
          for attempt in $(seq 1 20); do
            if [ -f "$training/status.json" ]; then break; fi
            sleep 1
          done
          sudo -n systemctl is-active --quiet fuckball-training.service
          cat "$training/status.json"
          curl -fsS http://127.0.0.1:3417/api/training
          echo "Twelve-hour training active: 192 matches per cycle, resumable weights, two CPU quota, 3GB RAM cap." >> "$GITHUB_STEP_SUMMARY"
