name: HaxLab raw archive audit ledger evidence proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch SHA to prove
        required: true
        type: string
  push:
    branches:
      - feature/data-pipeline-archive-audit-ledger-evidence-20261007
    paths:
      - "src/haxlab/runtime/archive_audit.py"
      - "tests/test_archive_audit.py"
      - "docs/raw-archive-audit-ledger-evidence.md"
      - ".github/workflows/data-pipeline-archive-audit-ledger-evidence-proof.yml"

permissions:
  contents: read

concurrency:
  group: haxlab-archive-audit-ledger-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head archive audit ledger evidence
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .archive-audit-ledger-evidence-venv
          python3 -m venv .archive-audit-ledger-evidence-venv
          .archive-audit-ledger-evidence-venv/bin/pip install -q --upgrade pip
          .archive-audit-ledger-evidence-venv/bin/pip install -q -e '.[dev]'
          .archive-audit-ledger-evidence-venv/bin/python -m compileall -q src tests
          .archive-audit-ledger-evidence-venv/bin/pytest -q tests/test_archive_audit.py
          .archive-audit-ledger-evidence-venv/bin/pytest --collect-only -q >/dev/null
          echo "HAXLAB_ARCHIVE_AUDIT_LEDGER_EVIDENCE_PROOF=success"
