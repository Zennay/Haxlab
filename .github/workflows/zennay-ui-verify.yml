name: Zennay Cloud UI verification

on:
  push:
    branches: [zennay-cloud-maint]
    paths:
      - ".github/workflows/zennay-ui-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zennay-cloud-maint
      - name: Inspect desktop mobile controls
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/zennay-ui-verify-result.txt"
          {
            echo "generated_at=$(date -Is)"
            echo "=== APP SOURCE ==="
            sed -n '1,95p' /home/ubuntu/zennay-cloud/public/app.js
            echo "=== RESOURCE IMPLEMENTATION ==="
            sed -n '1,125p' /home/ubuntu/zennay-cloud/enhancements.py
            echo "=== WATCH PROJECT / ALERTS ==="
            sed -n '285,390p' /home/ubuntu/zennay-cloud/server.py
            echo "=== ALERT ENGINE ==="
            grep -n -A180 -B20 "def evaluate_alerts" /home/ubuntu/zennay-cloud/enhancements.py || true
            echo "=== WEAR MODELS ==="
            cat /home/ubuntu/zennay-cloud/wear-os/app/src/main/java/com/zennay/cloud/watch/data/Models.kt
            echo "=== WEAR REPOSITORY ==="
            sed -n '1,240p' /home/ubuntu/zennay-cloud/wear-os/app/src/main/java/com/zennay/cloud/watch/data/ZennayCloudRepository.kt
            echo "=== WEAR DETAIL ==="
            sed -n '155,285p' /home/ubuntu/zennay-cloud/wear-os/app/src/main/java/com/zennay/cloud/watch/ui/ZennayWearApp.kt
          } > "$OUT"
      - name: Publish
        shell: bash
        run: |
          git config user.name "zennay-cloud-maint"
          git config user.email "actions@users.noreply.github.com"
          git add zennay-ui-verify-result.txt
          git commit -m "chore: publish Zennay Cloud UI verification" || exit 0
          git push origin HEAD:zennay-cloud-maint
