name: Recover FTMO runner for Worker1 post-merge verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-worker1-postmerge-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-worker1-postmerge-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 6
    env:
      FTMO_SERVICE: actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
      FTMO_RUN_USER: ftmo-runner
      MERGE_SHA: 2eca20de3cdec21873874d92902c3d954d3d9b9b
      SUPERSEDED_HEAD: 21ae700b96e21538360357679bc13ba5166b0667
      STALE_RUNS: "37006339960 37006339754 37006339875"
      PROTECTED_RUNS: "37006812031 37006812032"
    steps:
      - name: Verify VPS and merged package
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          python3 - <<'PY'
          import json, os, subprocess
          d=json.loads(subprocess.check_output(['gh','api','repos/Zennay/Ftmo/pulls/445'],text=True))
          assert d.get('merged') is True, d
          assert d.get('merge_commit_sha') == os.environ['MERGE_SHA'], d.get('merge_commit_sha')
          print('FTMO_PR445_MERGE_GREEN=1')
          PY

      - name: Cancel only superseded PR445 branch runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          for rid in os.environ['STALE_RUNS'].split():
              d=json.loads(subprocess.check_output(['gh','api',f'repos/Zennay/Ftmo/actions/runs/{rid}'],text=True))
              if d.get('head_sha') != os.environ['SUPERSEDED_HEAD']:
                  raise SystemExit(f'refusing stale-run identity mismatch {rid}')
              status=d.get('status')
              if status in {'queued','waiting','pending'}:
                  subprocess.check_call(['gh','api','--method','POST',f'repos/Zennay/Ftmo/actions/runs/{rid}/cancel'])
                  print(f'CANCELLED_SUPERSEDED_RUN={rid}')
              else:
                  print(f'KEEP_TERMINAL_OR_ACTIVE={rid}:{status}:{d.get("conclusion")}')
          PY

      - name: Recover listener only when no FTMO worker is active
        shell: bash
        run: |
          set -euo pipefail
          state="$(systemctl is-active "$FTMO_SERVICE" || true)"
          worker=0
          pgrep -u "$FTMO_RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1 && worker=1 || true
          pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
          listener=0
          if [[ "$pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$pid/cmdline"; then
            cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
            [[ "$cmd" == *"Runner.Listener"* || "$cmd" == *"runsvc.sh"* ]] && listener=1 || true
          fi
          echo "FTMO_RUNNER_PRE state=$state worker=$worker listener=$listener pid=$pid"
          if [[ "$worker" -eq 1 ]]; then
            action=preserve-active-worker
          elif [[ "$state" == active && "$listener" -eq 1 ]]; then
            action=preserve-healthy-listener
          else
            sudo -n systemctl reset-failed "$FTMO_SERVICE" || true
            sudo -n systemctl restart "$FTMO_SERVICE"
            action=restart-listener
          fi
          for _ in $(seq 1 30); do
            post="$(systemctl is-active "$FTMO_SERVICE" || true)"
            [[ "$post" == active ]] && break
            sleep 2
          done
          test "${post:-}" = active
          echo "FTMO_RUNNER_RECOVERY_ACTION=$action"

      - name: Prove protected main runs schedule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time
          protected=os.environ['PROTECTED_RUNS'].split()
          scheduled=None
          for _ in range(36):
              for rid in protected:
                  d=json.loads(subprocess.check_output(['gh','api',f'repos/Zennay/Ftmo/actions/runs/{rid}'],text=True))
                  if d.get('head_sha') != os.environ['MERGE_SHA']:
                      raise SystemExit(f'protected run sha mismatch {rid}')
                  print(f'PROTECTED_RUN={rid}:{d.get("status")}:{d.get("conclusion")}')
                  if d.get('status') in {'in_progress','completed'}:
                      scheduled=rid
              if scheduled:
                  break
              time.sleep(5)
          if not scheduled:
              raise SystemExit('protected main runs did not schedule')
          print(f'FTMO_POSTMERGE_SCHEDULING_GREEN={scheduled}')
          PY

      - name: Persist recovery receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, socket, subprocess
          runs=[]
          for rid in (os.environ['STALE_RUNS']+' '+os.environ['PROTECTED_RUNS']).split():
              d=json.loads(subprocess.check_output(['gh','api',f'repos/Zennay/Ftmo/actions/runs/{rid}'],text=True))
              runs.append({'run_id':int(rid),'name':d.get('name'),'status':d.get('status'),'conclusion':d.get('conclusion'),'head_sha':d.get('head_sha')})
          payload=json.dumps({'schema_version':1,'scope':'ftmo-worker1-postmerge-runner-recovery','host':socket.gethostname(),'workflow_run_id':os.environ['GITHUB_RUN_ID'],'merge_sha':os.environ['MERGE_SHA'],'runs':runs},sort_keys=True,indent=2)+'\n'
          encoded=base64.b64encode(payload.encode()).decode()
          path=f"runtime-evidence/ftmo-worker1-postmerge-recovery-{os.environ['GITHUB_RUN_ID']}.json"
          subprocess.check_call(['gh','api','--method','PUT',f'repos/Zennay/Haxlab/contents/{path}','-f',f'message=Record FTMO Worker1 post-merge runner recovery {os.environ["GITHUB_RUN_ID"]}','-f',f'content={encoded}'])
          print('RECOVERY_RECEIPT_PATH='+path)
          PY
