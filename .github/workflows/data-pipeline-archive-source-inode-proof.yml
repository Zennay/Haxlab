name: HaxLab archive source inode proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch SHA to prove
        required: true
        type: string
  push:
    branches:
      - feature/data-pipeline-archive-source-inode-20261007
    paths:
      - "src/haxlab/runtime/archive.py"
      - "tests/test_runtime_archive.py"
      - "docs/archive-source-inode-snapshot.md"
      - ".github/workflows/data-pipeline-archive-source-inode-proof.yml"

permissions:
  contents: read

concurrency:
  group: haxlab-archive-source-inode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head archive source inode boundary
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .archive-source-venv
          python3 -m venv .archive-source-venv
          .archive-source-venv/bin/pip install -q --upgrade pip
          .archive-source-venv/bin/pip install -q -e '.[dev]'
          .archive-source-venv/bin/python -m compileall -q src tests
          .archive-source-venv/bin/pytest -q tests/test_runtime_archive.py tests/test_runtime_scanner.py
          .archive-source-venv/bin/pytest --collect-only -q >/dev/null
