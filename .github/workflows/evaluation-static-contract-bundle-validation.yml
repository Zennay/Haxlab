name: Evaluation static contract bundle validation

on:
  push:
    branches:
      - validation/evaluation-static-contract-bundle-20261007
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-evaluation-static-contract-bundle-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    steps:
      - name: Checkout exact bundle head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "HAXLAB_EVALUATION_STATIC_CONTRACT_BUNDLE_HEAD=$(git rev-parse HEAD)"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-static-contract-bundle-venv
          python3 -m venv .evaluation-static-contract-bundle-venv
          .evaluation-static-contract-bundle-venv/bin/pip install --upgrade pip
          .evaluation-static-contract-bundle-venv/bin/pip install -e '.[dev]'

      - name: Compile canonical evaluation and bundled contracts
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-static-contract-bundle-venv/bin/python -m compileall -q \
            src/haxlab/evaluation \
            tests/test_evaluation_safe_deserialization_contract.py \
            tests/test_evaluation_control_plane_import_contract.py \
            tests/test_evaluation_exception_boundary_contract.py \
            tests/test_evaluation_global_state_contract.py

      - name: Run bundled evaluation contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .evaluation-static-contract-bundle-venv/bin/pytest -q \
              tests/test_evaluation_safe_deserialization_contract.py \
              tests/test_evaluation_control_plane_import_contract.py \
              tests/test_evaluation_exception_boundary_contract.py \
              tests/test_evaluation_global_state_contract.py

      - name: Record bundle green result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_EVALUATION_STATIC_CONTRACT_BUNDLE_RESULT=green"
