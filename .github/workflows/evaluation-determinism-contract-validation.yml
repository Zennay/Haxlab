name: Evaluation determinism contract validation

on:
  push:
    branches:
      - validation/evaluation-determinism-contract-20261007
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-evaluation-determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "HAXLAB_EVALUATION_DETERMINISM_HEAD=$(git rev-parse HEAD)"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-determinism-venv
          python3 -m venv .evaluation-determinism-venv
          .evaluation-determinism-venv/bin/pip install --upgrade pip
          .evaluation-determinism-venv/bin/pip install -e '.[dev]'

      - name: Compile evaluation package and contract
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-determinism-venv/bin/python -m compileall -q src/haxlab/evaluation tests/test_evaluation_determinism_contract.py

      - name: Run determinism contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" .evaluation-determinism-venv/bin/pytest -q tests/test_evaluation_determinism_contract.py

      - name: Record green marker
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_EVALUATION_DETERMINISM_RESULT=green"
