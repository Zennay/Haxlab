name: Frozen Future Head Challenger

on:
  push:
    branches:
      - experiment/frozen-future-head-v01

permissions:
  contents: read

concurrency:
  group: haxlab-frozen-future-head-challenger
  cancel-in-progress: false

jobs:
  challenger:
    if: contains(github.event.head_commit.message, '[frozen-future]')
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Preflight frozen future tooling
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m py_compile \
            "$GITHUB_WORKSPACE/src/haxlab/learning/frozen_future.py" \
            "$GITHUB_WORKSPACE/src/haxlab/evaluation/elite_model_eval.py" \
            "$GITHUB_WORKSPACE/src/haxlab/evaluation/champion_registry.py"
          node --check "$GITHUB_WORKSPACE/tools/select_future_assist.js"
          node --check "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js"
          node "$GITHUB_WORKSPACE/tests/test_frozen_future_role_gate.js"
          node "$GITHUB_WORKSPACE/tests/test_elite_champion_config.js"

      - name: Verify frozen champion evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/var/lib/haxlab/derived/training/elite-player-champion-candidate
          test -f "$ROOT/model/model.npz"
          test -f "$ROOT/model/runtime-model.json"
          test -f "$ROOT/model/metrics.json"
          test -f "$ROOT/shards/train/_index.json"
          test -f "$ROOT/shards/validation/_index.json"
          test -f "$ROOT/shards/holdout/_index.json"

      - name: Reuse or train future head only on frozen champion
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/var/lib/haxlab/derived/training/elite-player-champion-candidate
          OUT=/var/lib/haxlab/derived/training/elite-player-frozen-future-v01/model

          if sudo -u haxlab /opt/haxlab/.venv/bin/python - "$OUT/metrics.json" "$OUT/runtime-model.json" <<'PY'
          import json
          import math
          import sys
          from pathlib import Path

          metrics_path = Path(sys.argv[1])
          runtime_path = Path(sys.argv[2])
          if not metrics_path.is_file() or not runtime_path.is_file():
              raise SystemExit(1)
          metrics = json.loads(metrics_path.read_text())
          train = metrics.get("training") or {}
          integrity = train.get("frozen_base_parameter_integrity") or {}
          checks = [
              metrics.get("schema") == "haxlab-elite-frozen-future-head-v1",
              train.get("mode") == "future_head_only",
              int(train.get("seed") or -1) == 1337,
              int(train.get("epochs_requested") or 0) == 2,
              int(train.get("batch_size") or 0) == 4096,
              int(train.get("future_horizon_steps") or 0) == 5,
              math.isclose(float(train.get("learning_rate") or -1), 0.002, abs_tol=1e-12),
              all(bool(v) for v in integrity.values()) and len(integrity) == 8,
              int((metrics.get("final_holdout") or {}).get("samples") or 0) > 0,
          ]
          raise SystemExit(0 if all(checks) else 1)
          PY
          then
            echo "Reusing completed frozen-future model."
          else
            sudo -u haxlab rm -rf "$OUT"
            sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
              /opt/haxlab/.venv/bin/python -m haxlab.learning.frozen_future \
              --champion-model-dir "$ROOT/model" \
              --train-index "$ROOT/shards/train/_index.json" \
              --validation-index "$ROOT/shards/validation/_index.json" \
              --holdout-index "$ROOT/shards/holdout/_index.json" \
              --output-dir "$OUT" \
              --epochs 2 \
              --batch-size 4096 \
              --learning-rate 0.002 \
              --l2 0.00001 \
              --future-horizon-steps 5 \
              --seed 1337 \
              | tee /tmp/haxlab-frozen-future-training.log
          fi

      - name: Re-evaluate both models on identical frozen holdout
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/var/lib/haxlab/derived/training/elite-player-champion-candidate
          HOLDOUT="$ROOT/shards/holdout/_index.json"
          OUT=/var/lib/haxlab/derived/training/elite-player-frozen-future-v01/model

          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.elite_model_eval \
            --model-dir "$ROOT/model" \
            --index "$HOLDOUT" \
            --future-horizon-steps 5 \
            --output /tmp/haxlab-frozen-champion-offline.json

          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.elite_model_eval \
            --model-dir "$OUT" \
            --index "$HOLDOUT" \
            --future-horizon-steps 5 \
            --output /tmp/haxlab-frozen-challenger-offline.json

      - name: Select healthy 4v4 replay
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.scenario_source \
            --state-db /var/lib/haxlab/state/haxlab.sqlite3 \
            --max-candidates 1500 \
            --output /tmp/haxlab-frozen-scenario-source.json

      - name: Export identical stadium and scenarios
        shell: bash
        run: |
          set -euo pipefail
          RAW_REPLAY="$(
            sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          print(json.load(open("/tmp/haxlab-frozen-scenario-source.json"))["raw_path"])
          PY
          )"
          ANALYSIS="$(
            sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          print(json.load(open("/tmp/haxlab-frozen-scenario-source.json"))["analysis_path"])
          PY
          )"

          NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_stadium_from_replay.js" \
            "$RAW_REPLAY" \
            /tmp/haxlab-frozen-stadium.hbs

          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_replay_scenarios.js" \
            "$RAW_REPLAY" \
            "$ANALYSIS" \
            /tmp/haxlab-frozen-scenarios.json \
            16 \
            8 \
            6

      - name: Benchmark current champion
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js" \
            --model /var/lib/haxlab/derived/training/elite-player-champion-candidate/model/runtime-model.json \
            --stadium /tmp/haxlab-frozen-stadium.hbs \
            --scenarios /tmp/haxlab-frozen-scenarios.json \
            --max-scenarios 8 \
            --seconds 30 \
            --sample-every 6 \
            --disable-recovery \
            --output /tmp/haxlab-frozen-champion.json

      - name: Benchmark frozen challenger without assist
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js" \
            --model /var/lib/haxlab/derived/training/elite-player-frozen-future-v01/model/runtime-model.json \
            --stadium /tmp/haxlab-frozen-stadium.hbs \
            --scenarios /tmp/haxlab-frozen-scenarios.json \
            --max-scenarios 8 \
            --seconds 30 \
            --sample-every 6 \
            --disable-recovery \
            --output /tmp/haxlab-frozen-plain.json

      - name: Benchmark role-gated frozen future sweep
        shell: bash
        run: |
          set -euo pipefail
          MODEL=/var/lib/haxlab/derived/training/elite-player-frozen-future-v01/model/runtime-model.json

          run_assist() {
            CONF="$1"
            ROLES="$2"
            LABEL="$3"
            sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
              "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js" \
              --model "$MODEL" \
              --stadium /tmp/haxlab-frozen-stadium.hbs \
              --scenarios /tmp/haxlab-frozen-scenarios.json \
              --max-scenarios 8 \
              --seconds 30 \
              --sample-every 6 \
              --disable-recovery \
              --future-assist \
              --future-assist-confidence "$CONF" \
              --future-assist-min-distance 80 \
              --future-assist-roles "$ROLES" \
              --output "/tmp/haxlab-frozen-role-$LABEL.json"
          }

          for CONF in 0.56 0.60 0.62 0.64 0.66 0.68 0.70; do
            C="$(printf '%s' "$CONF" | tr '.' '_')"
            run_assist "$CONF" "am" "c${C}_ra"
            run_assist "$CONF" "dm,am" "c${C}_rda"
            run_assist "$CONF" "dm,am,st" "c${C}_rdma"
          done

      - name: Select role-gated frozen future promotion
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            /tmp/haxlab-frozen-champion-offline.json
            /tmp/haxlab-frozen-challenger-offline.json
            /tmp/haxlab-frozen-champion.json
            /tmp/haxlab-frozen-plain.json
          )

          for CONF in 0_56 0_60 0_62 0_64 0_66 0_68 0_70; do
            for ROLE in ra rda rdma; do
              LABEL="c${CONF}_${ROLE}"
              ARGS+=(
                "$LABEL"
                "/tmp/haxlab-frozen-role-${LABEL}.json"
              )
            done
          done

          ARGS+=(/tmp/haxlab-frozen-promotion.json)
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/select_future_assist.js" "${ARGS[@]}"

      - name: Promote only if all gates pass
        shell: bash
        run: |
          set -euo pipefail
          if sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          p = json.load(open("/tmp/haxlab-frozen-promotion.json"))
          raise SystemExit(0 if p.get("promote_future_challenger") else 1)
          PY
          then
            sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" GITHUB_SHA="$GITHUB_SHA" \
              /opt/haxlab/.venv/bin/python -m haxlab.evaluation.champion_registry \
              --model-dir /var/lib/haxlab/derived/training/elite-player-frozen-future-v01/model \
              --promotion-evidence /tmp/haxlab-frozen-promotion.json \
              --registry-root /var/lib/haxlab/derived/champions/elite-player \
              --candidate-name frozen-future-v01 \
              --output /var/lib/haxlab/derived/champions/elite-player/last-promotion.json
          else
            sudo -u haxlab sh -c \
              'echo '"'"'{"promoted": false, "reason": "promotion_gate_rejected"}'"'"' > /var/lib/haxlab/derived/champions/elite-player/last-promotion.json'
          fi

      - name: Validate frozen champion pointer
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/var/lib/haxlab/derived/champions/elite-player")
          pointer = json.loads((root / "current.json").read_text())
          evidence = json.loads(Path("/tmp/haxlab-frozen-promotion.json").read_text())
          promotion = json.loads((root / "last-promotion.json").read_text())

          assert pointer.get("schema") == "haxlab-champion-pointer-v1", pointer
          manifest_path = Path(pointer["manifest_path"])
          assert manifest_path.is_file(), manifest_path

          runtime_path = Path(
              pointer.get("runtime_model_path")
              or manifest_path.parent / "runtime-model.json"
          )
          metrics_path = Path(
              pointer.get("metrics_path")
              or manifest_path.parent / "metrics.json"
          )
          assert runtime_path.is_file(), runtime_path
          assert metrics_path.is_file(), metrics_path

          if evidence.get("promote_future_challenger"):
              selected = evidence.get("selected") or {}
              expected_config = selected.get("future_assist_config") or {}
              assert promotion.get("promoted") is True, promotion
              assert pointer.get("version_id") == promotion.get("version_id"), (
                  pointer,
                  promotion,
              )
              assert str(pointer.get("version_id") or "").startswith(
                  "frozen-future-v01-"
              ), pointer
              assert pointer.get("runtime_config") == expected_config, (
                  pointer.get("runtime_config"),
                  expected_config,
              )

          runtime = json.loads(runtime_path.read_text())
          weights = runtime.get("weights") or {}
          assert isinstance(weights.get("wf"), list) and weights["wf"], (
              "future head wf missing"
          )
          assert isinstance(weights.get("bf"), list) and weights["bf"], (
              "future head bf missing"
          )

          print(json.dumps({
              "version_id": pointer.get("version_id"),
              "runtime_config": pointer.get("runtime_config"),
              "runtime_model_path": str(runtime_path),
              "future_head_available": True,
              "selector_promoted": bool(evidence.get("promote_future_challenger")),
              "registry_promoted": promotion.get("promoted"),
              "idempotent": promotion.get("idempotent"),
          }, indent=2))
          PY

      - name: Publish frozen challenger evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo cat /var/lib/haxlab/derived/training/elite-player-frozen-future-v01/model/metrics.json > frozen-metrics.json
          sudo cat /tmp/haxlab-frozen-champion-offline.json > frozen-champion-offline.json
          sudo cat /tmp/haxlab-frozen-challenger-offline.json > frozen-challenger-offline.json
          sudo cat /tmp/haxlab-frozen-champion.json > frozen-champion.json
          sudo cat /tmp/haxlab-frozen-plain.json > frozen-plain.json
          for FILE in /tmp/haxlab-frozen-role-*.json; do
            sudo cat "$FILE" > "$(basename "$FILE")"
          done
          sudo cat /tmp/haxlab-frozen-promotion.json > frozen-promotion.json
          sudo cat /var/lib/haxlab/derived/champions/elite-player/last-promotion.json > frozen-registry-promotion.json

          echo '## HaxLab Frozen Future Head Challenger' >> "$GITHUB_STEP_SUMMARY"
          cat frozen-promotion.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '### Registry decision' >> "$GITHUB_STEP_SUMMARY"
          cat frozen-registry-promotion.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: frozen-future-head-challenger
          path: |
            frozen-metrics.json
            frozen-champion-offline.json
            frozen-challenger-offline.json
            frozen-champion.json
            frozen-plain.json
            haxlab-frozen-role-*.json
            frozen-promotion.json
            frozen-registry-promotion.json
          retention-days: 30
