name: Closed-loop Arena policy contract validation

on:
  push:
    branches:
      - validation/closed-loop-arena-policy-contract-20261007
  pull_request:
    branches:
      - feature/arena-v2-current-main-20261004
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-arena-policy-contract-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          clean: true
          fetch-depth: 0

      - name: Verify exact live head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          live="$(git ls-remote --heads origin "refs/heads/$EXPECTED_REF" | awk 'NR == 1 {print $1}')"
          test -n "$live"
          test "$live" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          echo "HAXLAB_ARENA_POLICY_CONTRACT_HEAD=$live"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .arena-policy-contract-venv
          python3 -m venv .arena-policy-contract-venv
          .arena-policy-contract-venv/bin/pip install --upgrade pip
          .arena-policy-contract-venv/bin/pip install -e '.[dev]'

      - name: Compile changed evaluation surface
        shell: bash
        run: |
          set -euo pipefail
          .arena-policy-contract-venv/bin/python -m compileall -q             src/haxlab/evaluation/closed_loop_arena.py             tests/test_closed_loop_arena.py

      - name: Run focused Arena v2 regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" .arena-policy-contract-venv/bin/pytest -q             tests/test_closed_loop_arena.py

      - name: Run adjacent evaluation regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" .arena-policy-contract-venv/bin/pytest -q             tests/test_multisource_duel.py             tests/test_calibration_gate.py             tests/test_calibration_resume.py             tests/test_arena_v2_integration_workflow_contract.py

      - name: Record proof result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_CLOSED_LOOP_ARENA_POLICY_CONTRACT_RESULT=green"
