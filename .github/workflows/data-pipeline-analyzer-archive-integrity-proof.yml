name: HaxLab analyzer archive integrity proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch SHA to prove
        required: true
        type: string
  push:
    branches:
      - feature/data-pipeline-analyzer-archive-integrity-20261007
    paths:
      - "src/haxlab/runtime/analyzer.py"
      - "tests/test_analyzer_archive_integrity.py"
      - "tests/test_analyzer_orphan_recovery.py"
      - "docs/analyzer-archive-integrity.md"
      - ".github/workflows/data-pipeline-analyzer-archive-integrity-proof.yml"

permissions:
  contents: read

concurrency:
  group: haxlab-analyzer-archive-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head analyzer archive integrity
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .analyzer-archive-integrity-venv
          python3 -m venv .analyzer-archive-integrity-venv
          .analyzer-archive-integrity-venv/bin/pip install -q --upgrade pip
          .analyzer-archive-integrity-venv/bin/pip install -q -e '.[dev]'
          .analyzer-archive-integrity-venv/bin/python -m compileall -q src tests
          .analyzer-archive-integrity-venv/bin/pytest -q \
            tests/test_analyzer_archive_integrity.py \
            tests/test_analyzer_orphan_recovery.py \
            tests/test_runtime_entrypoint_limits.py
          .analyzer-archive-integrity-venv/bin/pytest --collect-only -q >/dev/null
          echo "HAXLAB_ANALYZER_ARCHIVE_INTEGRITY_PROOF=success"
