name: Calibration pointer invariant validation

on:
  push:
    branches:
      - validation/calibration-pointer-invariant-20261006
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-calibration-pointer-invariant-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Verify calibration provenance inputs are readable and stable
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=/var/lib/haxlab/derived/champions/elite-player/current.json
          LIVE=/var/lib/haxlab/derived/champions/elite-player/live.json
          CAND_D=/var/lib/haxlab/derived/training/elite-player-candidate-d/model/runtime-model.json
          PARTNER_B=/var/lib/haxlab/derived/training/elite-player-candidate-b/model/runtime-model.json
          PARTNER_C=/var/lib/haxlab/derived/training/elite-player-candidate-c/model/runtime-model.json
          LIVE_RUNTIME="$(
            sudo -u haxlab /opt/haxlab/.venv/bin/python -c               'import json; print(json.load(open("/var/lib/haxlab/derived/champions/elite-player/current.json"))["runtime_model_path"])'
          )"

          for path in "$CURRENT" "$LIVE" "$LIVE_RUNTIME" "$CAND_D" "$PARTNER_B" "$PARTNER_C"; do
            sudo -u haxlab test -r "$path"
          done

          snapshot() {
            local path="$1"
            sudo -u haxlab sha256sum "$path" | awk '{print $1}'
          }

          CURRENT_A="$(snapshot "$CURRENT")"
          LIVE_A="$(snapshot "$LIVE")"
          LIVE_RUNTIME_A="$(snapshot "$LIVE_RUNTIME")"
          CAND_D_A="$(snapshot "$CAND_D")"
          PARTNER_B_A="$(snapshot "$PARTNER_B")"
          PARTNER_C_A="$(snapshot "$PARTNER_C")"

          sleep 1

          test "$CURRENT_A" = "$(snapshot "$CURRENT")"
          test "$LIVE_A" = "$(snapshot "$LIVE")"
          test "$LIVE_RUNTIME_A" = "$(snapshot "$LIVE_RUNTIME")"
          test "$CAND_D_A" = "$(snapshot "$CAND_D")"
          test "$PARTNER_B_A" = "$(snapshot "$PARTNER_B")"
          test "$PARTNER_C_A" = "$(snapshot "$PARTNER_C")"

          echo "CALIBRATION_POINTER_INPUTS_STABLE"
          echo "CURRENT_POINTER_SHA256=$CURRENT_A"
          echo "LIVE_POINTER_SHA256=$LIVE_A"
          echo "LIVE_RUNTIME_SHA256=$LIVE_RUNTIME_A"
          echo "CANDIDATE_D_SHA256=$CAND_D_A"
          echo "PARTNER_B_SHA256=$PARTNER_B_A"
          echo "PARTNER_C_SHA256=$PARTNER_C_A"

      - name: Record exact-head validation evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "CALIBRATION_POINTER_VALIDATION_HEAD=$(git rev-parse HEAD)"
          echo "CALIBRATION_POINTER_VALIDATION_RESULT=green"
