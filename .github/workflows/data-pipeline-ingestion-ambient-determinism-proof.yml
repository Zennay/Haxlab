name: HaxLab ingestion ambient determinism proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch SHA to prove
        required: true
        type: string
  push:
    branches:
      - validation/ingestion-ambient-determinism-20261007

permissions:
  contents: read

concurrency:
  group: haxlab-ingestion-ambient-determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head ingestion determinism contract
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ingestion-ambient-determinism-venv
          python3 -m venv .ingestion-ambient-determinism-venv
          .ingestion-ambient-determinism-venv/bin/pip install -q --upgrade pip
          .ingestion-ambient-determinism-venv/bin/pip install -q -e '.[dev]'
          .ingestion-ambient-determinism-venv/bin/python -m compileall -q tests/test_ingestion_ambient_determinism_contract.py
          .ingestion-ambient-determinism-venv/bin/pytest -q tests/test_ingestion_ambient_determinism_contract.py
          .ingestion-ambient-determinism-venv/bin/pytest --collect-only -q >/dev/null
          echo "HAXLAB_INGESTION_AMBIENT_DETERMINISM=green"
