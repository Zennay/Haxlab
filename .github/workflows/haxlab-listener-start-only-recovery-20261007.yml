name: HaxLab listener start-only incident recovery

on:
  push:
    branches:
      - ops/evaluation-haxlab-listener-start-only-20261007
    paths:
      - ".github/workflows/haxlab-listener-start-only-recovery-20261007.yml"
      - "tests/test_haxlab_listener_start_only_recovery_contract.py"

permissions:
  contents: read

concurrency:
  group: haxlab-listener-start-only-incident-20261007
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 3
    steps:
      - name: Checkout exact incident branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove start-only recovery contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tests/test_haxlab_listener_start_only_recovery_contract.py

      - name: Start HaxLab listener only when inactive and worker-free
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"

          SERVICE=actions.runner.Zennay-Haxlab.vps-bb300bba-haxlab.service
          RUN_USER=haxlab-runner
          pre_state="$(systemctl is-active "$SERVICE" || true)"
          pre_pid="$(systemctl show "$SERVICE" -p MainPID --value || true)"
          worker_before=0
          if pgrep -u "$RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1; then
            worker_before=1
          fi

          if [ "$worker_before" -eq 1 ]; then
            # An active job is authoritative even if systemd's listener state is stale.
            # Recovery must not change service state around an existing Worker.
            pgrep -u "$RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1
            echo "HAXLAB_START_ONLY_RECOVERY action=preserve-active-worker pre_state=$pre_state pre_pid=$pre_pid worker_before=1"
            exit 0
          fi

          action="preserve-$pre_state"
          case "$pre_state" in
            active)
              action=preserve-active-listener
              ;;
            inactive|failed)
              sudo -n systemctl reset-failed "$SERVICE" || true
              sudo -n systemctl start "$SERVICE"
              action="start-$pre_state"
              ;;
            activating)
              action=preserve-activating
              ;;
            *)
              echo "HAXLAB_START_ONLY_UNSAFE pre_state=$pre_state pre_pid=$pre_pid worker_before=0"
              exit 2
              ;;
          esac

          state="$pre_state"
          for _ in $(seq 1 30); do
            state="$(systemctl is-active "$SERVICE" || true)"
            [ "$state" = "active" ] && break
            sleep 1
          done
          test "$state" = "active"

          pid="$(systemctl show "$SERVICE" -p MainPID --value)"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]]
          cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
          [[ "$cmdline" == *"Runner.Listener"* || "$cmdline" == *"runsvc.sh"* ]]

          echo "HAXLAB_START_ONLY_RECOVERY action=$action pre_state=$pre_state pre_pid=$pre_pid worker_before=0 post_state=$state post_pid=$pid"
          if pgrep -u "$RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1; then
            echo "HAXLAB_START_ONLY_WORKER=present-after"
          else
            echo "HAXLAB_START_ONLY_WORKER=absent-after"
          fi
