name: HaxLab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "deploy/**"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/vps-control.yml"
      - ".github/workflows/zcloud-runner-bridge.yml"
      - ".github/workflows/imitation-baseline-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: haxlab-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-venv
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install -e '.[dev]'

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail
          .ci-venv/bin/python -m compileall -q src/haxlab

      - name: Validate Node decoder syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/decode_replay.js
          node --check tools/extract_imitation.js

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          .ci-venv/bin/pytest -q

  deploy:
    name: Deploy after green CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 30

    steps:
      - name: Wait for current replay pass to finish
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..120}; do
            JSON="$(sudo /usr/local/sbin/haxlab-actions-control status | sed -n '/^{/,$p')"
            PENDING="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["analysis_pending"])' <<<"$JSON")"
            echo "Current analysis pending: $PENDING"
            if [[ "$PENDING" == "0" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Current replay analysis is still active; refusing to swap decoder mid-pass." >&2
          exit 1

      - name: Deploy verified main to VPS
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/haxlab-actions-control deploy

      - name: Smoke test replay features on real data
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/haxlab-actions-control feature-smoke

  zcloud_coordination_probe:
    name: zCloud coordination probe
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 8

    steps:
      - name: Acquire, verify and release zCloud deploylane claim
        id: probe
        shell: bash
        run: |
          set +e
          ROOT=/home/ubuntu/zennay-cloud
          TMP_BASE="$(mktemp -d /tmp/zcloud-ci-probe.XXXXXX)"
          CANDIDATE="$TMP_BASE/candidate"
          RECEIPT="$RUNNER_TEMP/zcloud-coordination-receipt.md"
          MAIN_SHA=""
          ACQUIRE_EXIT=99
          VERIFY_EXIT=99
          RELEASE_EXIT=99
          NATIVE_UNITS="NONE"
          PROBE_RUNS="unavailable"

          git -C "$ROOT" fetch --prune origin main >/tmp/zcloud-ci-fetch.log 2>&1
          FETCH_EXIT=$?
          if [[ "$FETCH_EXIT" == "0" ]]; then
            MAIN_SHA="$(git -C "$ROOT" rev-parse origin/main 2>/dev/null)"
            git -C "$ROOT" worktree add --detach "$CANDIDATE" "$MAIN_SHA" >/tmp/zcloud-ci-worktree.log 2>&1
            WORKTREE_EXIT=$?
          else
            WORKTREE_EXIT=99
          fi

          if [[ "${WORKTREE_EXIT:-99}" == "0" ]]; then
            env -u GITHUB_TOKEN python3 "$CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" acquire >/tmp/zcloud-ci-acquire.log 2>&1
            ACQUIRE_EXIT=$?
            if [[ "$ACQUIRE_EXIT" == "0" ]]; then
              env -u GITHUB_TOKEN python3 "$CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" verify >/tmp/zcloud-ci-verify.log 2>&1
              VERIFY_EXIT=$?
            fi
          fi

          NATIVE_UNITS="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '/actions\.runner\.Zennay-zCloud|actions\.runner\.Zennay-zcloud/ {print $1}' | paste -sd, -)"
          [[ -n "$NATIVE_UNITS" ]] || NATIVE_UNITS="NONE"

          curl -fsS             -H "Accept: application/vnd.github+json"             -H "User-Agent: zcloud-ci-probe"             "https://api.github.com/repos/Zennay/zCloud/actions/workflows/zcloud-vps-execution-probe.yml/runs?per_page=5"             -o /tmp/zcloud-native-runs.json
          if [[ "$?" == "0" ]]; then
            PROBE_RUNS="$(python3 - <<'PY'
import json
p=json.load(open("/tmp/zcloud-native-runs.json"))
parts=[]
for r in p.get("workflow_runs",[])[:5]:
    parts.append(f"{r.get('id')}:{r.get('status')}:{r.get('conclusion')}:{str(r.get('head_sha') or '')[:8]}")
print(",".join(parts) or "none")
PY
)"
          fi

          if [[ "$ACQUIRE_EXIT" == "0" && -f "$CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" ]]; then
            env -u GITHUB_TOKEN python3 "$CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" release >/tmp/zcloud-ci-release.log 2>&1
            RELEASE_EXIT=$?
          fi

          {
            echo "### zCloud coordination probe"
            echo "- workflow_run_id: ${GITHUB_RUN_ID}"
            echo "- host: $(hostname)"
            echo "- zcloud_main_sha: ${MAIN_SHA:-unknown}"
            echo "- claim_key: cloud-permanent-vps-first-deploylane"
            echo "- worker_id: cloud::w1"
            echo "- fetch_exit: $FETCH_EXIT"
            echo "- worktree_exit: ${WORKTREE_EXIT:-99}"
            echo "- acquire_exit: $ACQUIRE_EXIT"
            echo "- verify_exit: $VERIFY_EXIT"
            echo "- release_exit: $RELEASE_EXIT"
            echo "- native_runner_units: $NATIVE_UNITS"
            echo "- recent_native_probe_runs: $PROBE_RUNS"
          } > "$RECEIPT"

          if [[ -d "$CANDIDATE" ]]; then
            git -C "$ROOT" worktree remove --force "$CANDIDATE" >/dev/null 2>&1 || true
          fi
          rm -rf "$TMP_BASE"

          cat "$RECEIPT"
          if [[ "$ACQUIRE_EXIT" != "0" || "$VERIFY_EXIT" != "0" || "$RELEASE_EXIT" != "0" ]]; then
            exit 1
          fi

      - name: Post sanitized probe receipt to PR
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/zcloud-coordination-receipt.md"
          if [[ ! -f "$RECEIPT" ]]; then
            printf '### zCloud coordination probe\n- receipt: missing before post step\n' > "$RECEIPT"
          fi
          python3 - <<'PY' > /tmp/zcloud-pr-comment.json
import json, os
body=open(os.environ["RUNNER_TEMP"]+"/zcloud-coordination-receipt.md",encoding="utf-8").read()
print(json.dumps({"body":body}))
PY
          curl -fsS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${{ github.token }}"             -H "X-GitHub-Api-Version: 2022-11-28"             --data-binary @/tmp/zcloud-pr-comment.json             "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
