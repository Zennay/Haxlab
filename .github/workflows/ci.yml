name: HaxLab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "deploy/**"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/vps-control.yml"
      - ".github/workflows/imitation-baseline-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zcloud-live-fd-fix:
    name: zCloud live FD leak fix
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/zcloud-recovery-pr-20260927'
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 8
    steps:
      - name: Patch and validate live zCloud
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/ubuntu/zennay-cloud
          LIVE="$ROOT/enhancements.py"
          BACKUP=/tmp/zcloud-enhancements-pre-fd-fix.py
          HEALTH=http://127.0.0.1:8765/api/status
          cp -p "$LIVE" "$BACKUP"
          
          python3 - <<'PY'
          from pathlib import Path
          import os, stat
          p=Path("/home/ubuntu/zennay-cloud/enhancements.py")
          text=p.read_text(encoding="utf-8")
          old="        with sqlite3.connect(db_path) as c:\n"
          new="        with _db_connect(db_path) as c:\n"
          count=text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one vulnerable sqlite context, found {count}")
          tmp=p.with_suffix(".py.fd-fix.tmp")
          tmp.write_text(text.replace(old,new),encoding="utf-8")
          os.chmod(tmp, stat.S_IMODE(p.stat().st_mode))
          os.replace(tmp,p)
          print("patched_live_source=1")
          PY
          
          if ! python3 -m py_compile "$LIVE"; then
            cp -p "$BACKUP" "$LIVE"
            echo "compile_failed_restored=1"
            exit 1
          fi
          if ! (cd "$ROOT" && python3 tests/test_incident_center.py); then
            cp -p "$BACKUP" "$LIVE"
            echo "tests_failed_restored=1"
            exit 1
          fi
          
          sudo -n systemctl restart zennay-cloud.service
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 "$HEALTH" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 3 "$HEALTH" >/dev/null
          
          PID="$(systemctl show zennay-cloud.service -p MainPID --value)"
          sleep 2
          before="$(find "/proc/$PID/fd" -mindepth 1 -maxdepth 1 2>/dev/null | wc -l)"
          echo "fd_before_stress=$before"
          fail=0
          for _ in $(seq 1 150); do
            curl -fsS --max-time 3 "$HEALTH" >/dev/null 2>&1 || fail=$((fail+1))
          done
          sleep 3
          after="$(find "/proc/$PID/fd" -mindepth 1 -maxdepth 1 2>/dev/null | wc -l)"
          history="$(for fd in /proc/"$PID"/fd/*; do readlink "$fd" 2>/dev/null || true; done | grep -c 'history.db' || true)"
          echo "fd_after_stress=$after"
          echo "history_db_fds_after=$history"
          echo "health_failures=$fail"
          if (( fail > 0 || after > before + 20 || history > 20 )); then
            echo "fd_fix_validation_failed=1"
            cp -p "$BACKUP" "$LIVE"
            sudo -n systemctl restart zennay-cloud.service
            exit 1
          fi
          echo "fd_fix_validation=green"
          systemctl show zennay-cloud.service -p ActiveState -p SubState -p MainPID -p Restart -p RestartUSec
          sqlite3 -noheader "$ROOT/history.db" "SELECT 'active_chat_targets='||COUNT(*) FROM runner_targets WHERE active=1;"

  test:
    if: github.event_name != 'pull_request' || github.head_ref != 'ops/zcloud-recovery-pr-20260927'
    name: Python tests
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-venv
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install -e '.[dev]'

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail
          .ci-venv/bin/python -m compileall -q src/haxlab

      - name: Validate Node decoder syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/decode_replay.js
          node --check tools/extract_imitation.js

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          .ci-venv/bin/pytest -q

  deploy:
    name: Deploy after green CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 30

    steps:
      - name: Wait for current replay pass to finish
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..120}; do
            JSON="$(sudo /usr/local/sbin/haxlab-actions-control status | sed -n '/^{/,$p')"
            PENDING="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["analysis_pending"])' <<<"$JSON")"
            echo "Current analysis pending: $PENDING"
            if [[ "$PENDING" == "0" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Current replay analysis is still active; refusing to swap decoder mid-pass." >&2
          exit 1

      - name: Deploy verified main to VPS
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/haxlab-actions-control deploy

      - name: Smoke test replay features on real data
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/haxlab-actions-control feature-smoke
