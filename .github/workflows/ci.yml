name: HaxLab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "deploy/**"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/vps-control.yml"
      - ".github/workflows/imitation-baseline-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-venv
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install -e '.[dev]'

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail
          .ci-venv/bin/python -m compileall -q src/haxlab

      - name: Validate Node decoder syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/decode_replay.js
          node --check tools/extract_imitation.js

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          .ci-venv/bin/pytest -q

  deploy:
    name: Deploy after green CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 30

    steps:
      - name: Wait for current replay pass to finish
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..120}; do
            JSON="$(sudo /usr/local/sbin/haxlab-actions-control status | sed -n '/^{/,$p')"
            PENDING="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["analysis_pending"])' <<<"$JSON")"
            echo "Current analysis pending: $PENDING"
            if [[ "$PENDING" == "0" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Current replay analysis is still active; refusing to swap decoder mid-pass." >&2
          exit 1

      - name: Deploy verified main to VPS
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/haxlab-actions-control deploy

      - name: Smoke test replay features on real data
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/haxlab-actions-control feature-smoke

  zcloud_coordination_probe:
    name: zCloud coordination probe
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 8

    steps:
      - name: Acquire, verify and release zCloud deploylane claim
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/ubuntu/zennay-cloud
          TMP_BASE="$(mktemp -d /tmp/zcloud-ci-probe.XXXXXX)"
          CANDIDATE="$TMP_BASE/candidate"
          cleanup() {
            if [[ -f "$CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" ]]; then
              env -u GITHUB_TOKEN python3 "$CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" release || true
            fi
            git -C "$ROOT" worktree remove --force "$CANDIDATE" >/dev/null 2>&1 || true
            rm -rf "$TMP_BASE"
          }
          trap cleanup EXIT

          git -C "$ROOT" fetch --prune origin main
          MAIN_SHA="$(git -C "$ROOT" rev-parse origin/main)"
          git -C "$ROOT" worktree add --detach "$CANDIDATE" "$MAIN_SHA"

          env -u GITHUB_TOKEN python3 "$CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" acquire
          env -u GITHUB_TOKEN python3 "$CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" verify

          echo "ZCLOUD_COORDINATION_PROBE_GREEN main_sha=$MAIN_SHA"
          echo "host=$(hostname)"
          systemctl list-unit-files --type=service --no-legend 2>/dev/null \
            | awk '/actions\.runner\.Zennay-zCloud|actions\.runner\.Zennay-zcloud/ {print "native_runner_unit=" $1}' \
            || true

          python3 - <<'PY'
import json, urllib.request
url="https://api.github.com/repos/Zennay/zCloud/actions/workflows/zcloud-vps-execution-probe.yml/runs?per_page=5"
req=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json","User-Agent":"zcloud-ci-probe"})
with urllib.request.urlopen(req,timeout=15) as r:
    payload=json.load(r)
for run in payload.get("workflow_runs",[])[:5]:
    print("native_probe_run="+json.dumps({
        "id":run.get("id"),
        "status":run.get("status"),
        "conclusion":run.get("conclusion"),
        "head_sha":run.get("head_sha"),
        "event":run.get("event"),
        "created_at":run.get("created_at"),
    },sort_keys=True))
PY
