name: HaxLab CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "deploy/**"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/vps-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-ci
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-venv
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install -e '.[dev]'

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail
          .ci-venv/bin/python -m compileall -q src/haxlab

      - name: Validate Node decoder syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/decode_replay.js

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          .ci-venv/bin/pytest -q

  deploy:
    name: Deploy after green CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 30

    steps:
      - name: Deploy verified main to VPS
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/haxlab-actions-control deploy

      - name: Smoke test replay features on real data
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/haxlab-actions-control feature-smoke
