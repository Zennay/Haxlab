name: Arena calibration resume integrity

on:
  push:
    branches:
      - validation/calibration-resume-integrity-20261006
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-calibration-resume-integrity
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .calibration-resume-venv
          python3 -m venv .calibration-resume-venv
          .calibration-resume-venv/bin/pip install --upgrade pip
          .calibration-resume-venv/bin/pip install -e '.[dev]'

      - name: Compile resume validator
        shell: bash
        run: |
          set -euo pipefail
          .calibration-resume-venv/bin/python -m py_compile \
            src/haxlab/evaluation/calibration_resume.py

      - name: Run focused resume and calibration regressions
        shell: bash
        run: |
          set -euo pipefail
          .calibration-resume-venv/bin/pytest -q \
            tests/test_calibration_resume.py \
            tests/test_closed_loop_arena.py \
            tests/test_calibration_gate.py

      - name: Assert workflow retains fail-closed resume wiring
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/closed-loop-arena-v2-calibration.yml
          grep -F 'haxlab.evaluation.calibration_resume' "$workflow"
          grep -F 'ARENA_CALIBRATION_SOURCE_REUSED' "$workflow"
          if grep -F 'rm -rf "$OUT"' "$workflow"; then
            echo "::error title=Resume disabled::same-SHA output directory is still deleted"
            exit 1
          fi
