name: FTMO PR441 final-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr441-final-head-proof.yml"

permissions:
  contents: write

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      TARGET_SHA: a127d8b25ac7d652df077924cb536daa8a7fd503
      RECEIPT_PATH: runtime-evidence/ftmo-pr441-final-head-proof.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Exact checkout and focused proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr441-final-haxlab"
          venv="$RUNNER_TEMP/ftmo-pr441-final-haxlab-venv"
          rm -rf "$src" "$venv"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/data/market/providers/dukascopy_public.py
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_public.py
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_timeout_transport.py tests/test_autonomous_provider_retry.py
          "$venv/bin/python" -m pytest -q             tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner             tests/test_zero_cost_workflow_boundary.py::test_diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free
          "$venv/bin/python" -m pytest --collect-only -q >/tmp/ftmo-pr441-hax-collect.txt
          test -s /tmp/ftmo-pr441-hax-collect.txt
      - name: Persist proof receipt
        if: always()
        shell: bash
        env:
          PROOF_STATUS: ${{ job.status }}
          PROOF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            "project":"ftmo",
            "queue_item":"ftmo-7f9609eabd4ad2c8",
            "pull_request":441,
            "target_sha":os.environ["TARGET_SHA"],
            "workflow_run_id":int(os.environ["PROOF_RUN_ID"]),
            "result":os.environ["PROOF_STATUS"],
            "runner_host":"vps-bb300bba",
            "scope":"exact final head; compile; full Dukascopy public tests; timeout/retry; provider retry; zero-cost boundary; repo collection"
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name "HaxLab FTMO proof"
          git config user.email "haxlab-ftmo-proof@users.noreply.github.com"
          git add "$RECEIPT_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Record FTMO PR441 final-head proof"
            git push origin HEAD:main
          fi
