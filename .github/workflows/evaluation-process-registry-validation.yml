name: Evaluation process registry validation

on:
  push:
    branches:
      - validation/evaluation-process-registry-contract-20261007
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: haxlab-evaluation-process-registry-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "HAXLAB_EVALUATION_PROCESS_REGISTRY_HEAD=$(git rev-parse HEAD)"

      - name: Verify candidate is still the live branch head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 {print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "${{ github.sha }}"
          echo "HAXLAB_EVALUATION_PROCESS_REGISTRY_LIVE_HEAD=$remote_head"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-process-registry-venv
          python3 -m venv .evaluation-process-registry-venv
          .evaluation-process-registry-venv/bin/pip install --upgrade pip
          .evaluation-process-registry-venv/bin/pip install -e '.[dev]'

      - name: Compile evaluation package and contract
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-process-registry-venv/bin/python -m compileall -q             src/haxlab/evaluation             tests/test_evaluation_process_registry_contract.py

      - name: Run process registry contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src"             .evaluation-process-registry-venv/bin/pytest -q               tests/test_evaluation_process_registry_contract.py

      - name: Run adjacent canonical evaluation regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src"             .evaluation-process-registry-venv/bin/pytest -q               tests/test_arena_v2_integration_workflow_contract.py               tests/test_calibration_cross_sha_resume_contract.py               tests/test_calibration_gate.py               tests/test_calibration_resume.py               tests/test_calibration_workflow_evidence_contract.py               tests/test_closed_loop_arena.py               tests/test_duel_gate.py               tests/test_elite_gate_preflight.py               tests/test_multisource_duel.py               tests/test_multisource_suite.py               tests/test_promotion.py               tests/test_scenario_source.py

      - name: Record green result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_EVALUATION_PROCESS_REGISTRY_RESULT=green"

      - name: Publish exact-head proof receipt
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 355,
              body: [
                "Exact-head self-hosted proof: **SUCCESS**",
                "",
                `- run: \`${context.runId}\``,
                `- exact head: \`${context.sha}\``,
                `- branch: \`${context.ref.replace("refs/heads/", "")}\``,
                "- exact checkout + live-head verification: green",
                "- evaluation package + contract compile: green",
                "- focused process-registry contract: green",
                "- adjacent canonical Arena-v2 evaluation regressions: green",
                "- marker: `HAXLAB_EVALUATION_PROCESS_REGISTRY_RESULT=green`",
              ].join("\n"),
            });
