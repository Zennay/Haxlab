name: HaxLab promotion nested evidence proof

on:
  push:
    branches:
      - validation/promotion-nested-regression-failclosed-20261007
  workflow_dispatch:

concurrency:
  group: haxlab-promotion-nested-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact live branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_sha"
          test "$remote_sha" = "${GITHUB_SHA}"

      - name: Compile evaluation and promotion tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q src/haxlab/evaluation tests/test_promotion.py

      - name: Run focused promotion regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m pytest -q tests/test_promotion.py

      - name: Green marker
        shell: bash
        run: echo "HAXLAB_PROMOTION_NESTED_EVIDENCE_RESULT=green"
