name: Finalize FTMO queue ftmo-7f9609eabd4ad2c8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-ftmo-7f9609eabd4ad2c8.yml"

permissions:
  contents: write

concurrency:
  group: finalize-ftmo-7f9609eabd4ad2c8
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      QUEUE_ID: ftmo-7f9609eabd4ad2c8
      MERGE_SHA: f761bc3af1e62a16cdc441df7d4585d4a6e32f54
      PROVEN_HEAD: 9e99499cfd6ab8ee78841317b147aad54fa5d41f
      EXACT_PROOF_RUN: "37003970627"
    steps:
      - name: Verify host, merge ancestry and exact-head proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          main_sha="$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)"
          cmp="$(gh api "repos/Zennay/Ftmo/compare/$MERGE_SHA...$main_sha")"
          CMP_JSON="$cmp" python3 - <<'PY'
          import json, os
          d=json.loads(os.environ["CMP_JSON"])
          if d.get("status") not in {"identical","ahead"}:
              raise SystemExit("FTMO merge is not in current main ancestry")
          print("MERGE_IN_MAIN=1")
          PY
          proof="$(gh api "repos/Zennay/zCloud/actions/runs/$EXACT_PROOF_RUN")"
          PROOF_JSON="$proof" python3 - <<'PY'
          import json, os
          d=json.loads(os.environ["PROOF_JSON"])
          if (d.get("status"),d.get("conclusion")) != ("completed","success"):
              raise SystemExit("exact-head proof is not green")
          print("EXACT_HEAD_PROOF_GREEN=1")
          PY
          receipt="$(gh api repos/Zennay/zCloud/contents/runtime-evidence/ftmo-pr441-exact-head-proof.json --jq .content | tr -d '\n' | base64 -d)"
          RECEIPT_JSON="$receipt" python3 - <<'PY'
          import json, os
          d=json.loads(os.environ["RECEIPT_JSON"])
          if d.get("target_sha") != os.environ["PROVEN_HEAD"]:
              raise SystemExit("proof receipt target mismatch")
          if int(d.get("workflow_run_id") or 0) != int(os.environ["EXACT_PROOF_RUN"]):
              raise SystemExit("proof receipt run mismatch")
          if d.get("result") != "success" or d.get("runner_host") != "vps-bb300bba":
              raise SystemExit("proof receipt is not canonical green VPS evidence")
          if any(d.get(k) is not False for k in (
              "generation_10_reopened",
              "development_access_relaxed",
              "walk_forward_access_relaxed",
              "final_holdout_access_relaxed",
              "live_or_broker_access_relaxed",
              "paid_cloud_budget_relaxed",
          )):
              raise SystemExit("sealed-boundary receipt mismatch")
          print("PROOF_RECEIPT_VERIFIED=1")
          PY

      - name: Finish exact SQLite queue item
        shell: bash
        env:
          FINALIZER_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import importlib.util, json, os, sqlite3, sys
          from pathlib import Path

          queue_id=os.environ["QUEUE_ID"]
          merge_sha=os.environ["MERGE_SHA"]
          proof_run=os.environ["EXACT_PROOF_RUN"]
          proven_head=os.environ["PROVEN_HEAD"]
          finalizer_run=os.environ["FINALIZER_RUN_ID"]
          live_root=Path("/home/ubuntu/zennay-cloud")
          server_path=live_root/"server.py"
          db_path=live_root/"history.db"
          if not server_path.is_file() or not db_path.is_file():
              raise SystemExit("live zCloud backend missing")

          sys.path.insert(0,str(live_root))
          spec=importlib.util.spec_from_file_location("zcloud_live_server",server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server")
          server=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB=db_path

          evidence=(
              f"Worker2 Gen29 BI5 payload decompression integrity completed. "
              f"PR #442 merged as {merge_sha}; exact tested head {proven_head}; "
              f"self-hosted VPS proof {proof_run} SUCCESS on vps-bb300bba "
              f"(exact checkout, isolated install, compile, full Dukascopy public provider regressions, "
              f"timeout/retry compatibility, autonomous provider retry compatibility, zero-cost boundaries, "
              f"repository test collection). Generation 10 remained terminally closed; Generation 29 remained "
              f"provider_foundation; development/walk-forward/final-holdout/live/broker/paid-cloud boundaries unchanged. "
              f"SQLite finalizer workflow {finalizer_run}."
          )

          def read():
              with sqlite3.connect(db_path) as c:
                  c.row_factory=sqlite3.Row
                  row=c.execute(
                      "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                      "FROM portfolio_queue WHERE queue_id=?",(queue_id,)
                  ).fetchone()
              return dict(row) if row else None

          before=read()
          print("QUEUE_BEFORE="+json.dumps(before,sort_keys=True,default=str))
          if before is None:
              raise SystemExit("queue item missing")
          if before.get("project_id")!="ftmo":
              raise SystemExit("queue project mismatch")

          if before.get("status")=="done":
              print("QUEUE_ALREADY_DONE=1")
          elif before.get("status") in {"claimed","running","verifying","in_progress"} and before.get("worker_slot") is not None:
              result=server.portfolio_queue_finish(int(before["worker_slot"]),queue_id,"DONE",evidence)
              print("QUEUE_FINISH_RESULT="+json.dumps(result,sort_keys=True,default=str))
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active assignment")
          else:
              raise SystemExit(
                  f"refusing non-active queue mutation status={before.get('status')} slot={before.get('worker_slot')}"
              )

          after=read()
          print("QUEUE_AFTER="+json.dumps(after,sort_keys=True,default=str))
          if (
              not after
              or after.get("status")!="done"
              or int(after.get("eligible") or 0)!=0
              or after.get("worker_slot") is not None
          ):
              raise SystemExit("queue readback is not canonical DONE")
          if before.get("status")!="done" and merge_sha not in str(after.get("evidence") or ""):
              raise SystemExit("queue evidence missing merge SHA")
          print("SQLITE_QUEUE_DONE=1")
          PY

      - name: Persist finalizer receipt
        if: always()
        shell: bash
        env:
          FINALIZER_STATUS: ${{ job.status }}
          FINALIZER_RUN_ID: ${{ github.run_id }}
          RECEIPT_PATH: runtime-evidence/ftmo-7f9609eabd4ad2c8-finalizer.json
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git pull --rebase origin main
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python3 - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          db=Path("/home/ubuntu/zennay-cloud/history.db")
          row=None
          if db.is_file():
              with sqlite3.connect(db) as c:
                  c.row_factory=sqlite3.Row
                  got=c.execute(
                      "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                      "FROM portfolio_queue WHERE queue_id=?",
                      (os.environ["QUEUE_ID"],)
                  ).fetchone()
                  row=dict(got) if got else None
          payload={
              "project":"ftmo",
              "queue_id":os.environ["QUEUE_ID"],
              "merge_sha":os.environ["MERGE_SHA"],
              "proven_head":os.environ["PROVEN_HEAD"],
              "exact_proof_run":int(os.environ["EXACT_PROOF_RUN"]),
              "finalizer_workflow_run_id":int(os.environ["FINALIZER_RUN_ID"]),
              "job_status":os.environ["FINALIZER_STATUS"],
              "runner_host":"vps-bb300bba",
              "queue_readback":row,
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(payload,indent=2,sort_keys=True,default=str)+"\n",encoding="utf-8"
          )
          PY
          git config user.name "HaxLab FTMO finalizer"
          git config user.email "haxlab-ftmo-finalizer@users.noreply.github.com"
          git add "$RECEIPT_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Record FTMO queue finalizer receipt"
            git push origin HEAD:main
          fi
