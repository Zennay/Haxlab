name: Evaluation calibration decision sanity proof

on:
  push:
    branches:
      - validation/calibration-decision-sanity-immutability-20261007
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-evaluation-calibration-decision-sanity-proof
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Verify exact live branch head
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          LIVE_SHA="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "${GITHUB_SHA}"
          test -n "$LIVE_SHA"
          test "$LIVE_SHA" = "${GITHUB_SHA}"

      - name: Create isolated proof environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .calibration-sanity-proof-venv
          python3 -m venv .calibration-sanity-proof-venv
          .calibration-sanity-proof-venv/bin/pip install --upgrade pip
          .calibration-sanity-proof-venv/bin/pip install -e '.[dev]'

      - name: Compile focused boundary
        shell: bash
        run: |
          set -euo pipefail
          .calibration-sanity-proof-venv/bin/python -m compileall -q \
            src/haxlab/evaluation/calibration_gate.py \
            tests/test_calibration_gate.py

      - name: Run calibration gate regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .calibration-sanity-proof-venv/bin/pytest -q \
              tests/test_calibration_gate.py

      - name: Record exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_CALIBRATION_SANITY_IMMUTABILITY_HEAD=$(git rev-parse HEAD)"
          echo "HAXLAB_CALIBRATION_SANITY_IMMUTABILITY_RESULT=green"
