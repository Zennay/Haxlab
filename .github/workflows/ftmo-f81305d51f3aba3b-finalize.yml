name: Finalize FTMO f813 queue via HaxLab

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-f81305d51f3aba3b-finalize.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-f81305d51f3aba3b-finalize-haxlab
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      QUEUE_ID: ftmo-f81305d51f3aba3b
      MERGE_SHA: f028eea5f0b6cd3c11ea821cdc92096facde8c8f
      PROVEN_HEAD: a156246682bd836c071b461f66009e7d620c00b4
      EXACT_PROOF_RUN: "37005946247"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact-head receipt and merged ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          receipt_path = Path("runtime-evidence/ftmo-pr444-haxlab-proof-37005946247.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("result") != "success":
              raise SystemExit("PR444 exact-head proof is not green")
          if receipt.get("target_sha") != os.environ["PROVEN_HEAD"]:
              raise SystemExit("PR444 proof target SHA mismatch")
          if str(receipt.get("workflow_run_id")) != os.environ["EXACT_PROOF_RUN"]:
              raise SystemExit("PR444 proof run mismatch")
          if receipt.get("runner_host") != "vps-bb300bba":
              raise SystemExit("PR444 proof did not run on required VPS")
          if str(receipt.get("paid_cloud_budget_usd")) != "0.00":
              raise SystemExit("PR444 proof did not preserve zero cloud budget")

          main_sha = json.loads(subprocess.check_output(
              ["gh","api","repos/Zennay/Ftmo/commits/main"], text=True
          ))["sha"]
          ancestry = json.loads(subprocess.check_output(
              ["gh","api",f"repos/Zennay/Ftmo/compare/{os.environ['MERGE_SHA']}...{main_sha}"],
              text=True,
          ))
          if ancestry.get("status") not in {"ahead","identical"}:
              raise SystemExit("merged FTMO package is not in current main ancestry")
          print("FTMO_F813_MERGE_AND_PROOF_GREEN=1")
          print("FTMO_MAIN_SHA=" + main_sha)
          PY

      - name: Finalize live SQLite queue item and persist receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import importlib.util
          import json
          import os
          import sqlite3
          import sys
          from pathlib import Path

          queue_id = os.environ["QUEUE_ID"]
          live_root = Path("/home/ubuntu/zennay-cloud")
          db_path = live_root / "history.db"
          server_path = live_root / "server.py"
          if not db_path.is_file() or not server_path.is_file():
              raise SystemExit("live zCloud SQLite/server missing")

          sys.path.insert(0, str(live_root))
          spec = importlib.util.spec_from_file_location("zcloud_live_server", server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = db_path

          def get_item(qid):
              with sqlite3.connect(db_path) as conn:
                  conn.row_factory = sqlite3.Row
                  row = conn.execute(
                      "SELECT queue_id,project_id,title,status,priority,eligible,worker_slot,"
                      "evidence,parent_queue_id,updated_at FROM portfolio_queue WHERE queue_id=?",
                      (qid,),
                  ).fetchone()
              return dict(row) if row else None

          before = get_item(queue_id)
          print("QUEUE_BEFORE=" + json.dumps(before, sort_keys=True, default=str))
          if not before:
              raise SystemExit("queue item missing")
          if before["project_id"] != "ftmo":
              raise SystemExit("queue project mismatch")

          evidence = (
              "Worker5 Gen29 BI5 transfer-framing package complete. PR #444 merged as "
              + os.environ["MERGE_SHA"] + " from exact proven head " + os.environ["PROVEN_HEAD"]
              + ". HaxLab exact-head VPS proof run " + os.environ["EXACT_PROOF_RUN"]
              + " SUCCESS on vps-bb300bba: isolated install, compile, Dukascopy public provider "
              "tests, timeout/retry, autonomous-provider-retry, zero-cost boundary and full-suite "
              "collection. Transfer-Encoding/Content-Length ambiguity and unsupported transfer "
              "codings fail closed; bounded chunked framing remains supported. Gen29 stays "
              "provider_foundation; development, walk-forward, final holdout, live/broker and "
              "paid-cloud boundaries remain sealed."
          )

          finish_result = None
          if before["status"] == "done" and int(before["eligible"] or 0) == 0 and before["worker_slot"] is None:
              print("QUEUE_ALREADY_DONE=1")
          elif before["status"] in {"claimed","running","verifying","in_progress"} and before["worker_slot"] is not None:
              finish_result = server.portfolio_queue_finish(
                  int(before["worker_slot"]), queue_id, "DONE", evidence
              )
              print("QUEUE_FINISH_RESULT=" + json.dumps(finish_result, sort_keys=True, default=str))
              if not finish_result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active assignment")
          else:
              raise SystemExit(
                  f"refusing nonstandard queue state status={before['status']} slot={before['worker_slot']}"
              )

          after = get_item(queue_id)
          print("QUEUE_AFTER=" + json.dumps(after, sort_keys=True, default=str))
          if (
              not after or after["status"] != "done"
              or int(after["eligible"] or 0) != 0
              or after["worker_slot"] is not None
          ):
              raise SystemExit("final queue readback is not done/eligible=0/slot=null")

          with sqlite3.connect(db_path) as conn:
              conn.row_factory = sqlite3.Row
              rows = conn.execute(
                  "SELECT queue_id,project_id,status,priority,eligible,worker_slot,parent_queue_id,"
                  "updated_at FROM portfolio_queue WHERE parent_queue_id=? ORDER BY created_at",
                  (queue_id,),
              ).fetchall()
              successors = [dict(row) for row in rows]

          receipt = {
              "schema_version": 1,
              "project": "ftmo",
              "queue_id": queue_id,
              "merge_sha": os.environ["MERGE_SHA"],
              "proven_head": os.environ["PROVEN_HEAD"],
              "exact_proof_run": int(os.environ["EXACT_PROOF_RUN"]),
              "finalizer_workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "job_status": "success",
              "queue_before": before,
              "queue_readback": after,
              "finish_result": finish_result,
              "successors": successors,
          }
          out = Path("runtime-evidence/ftmo-f81305d51f3aba3b-finalizer.json")
          out.write_text(json.dumps(receipt, sort_keys=True, indent=2, default=str) + "\n", encoding="utf-8")
          print("ZCLOUD_SQLITE_QUEUE_FINALIZE_GREEN=1")
          print("QUEUE_SUCCESSORS=" + json.dumps(successors, sort_keys=True, default=str))
          PY

          git config user.name "haxlab-automation"
          git config user.email "haxlab-automation@users.noreply.github.com"
          git add runtime-evidence/ftmo-f81305d51f3aba3b-finalizer.json
          if git diff --cached --quiet; then
            echo "Finalizer receipt unchanged"
          else
            git commit -m "Record FTMO f813 queue finalizer"
            git push origin HEAD:main
          fi
