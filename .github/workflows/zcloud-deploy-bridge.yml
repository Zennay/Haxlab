name: Temporary zCloud production bridge

on:
  push:
    branches: [zcloud-deploy-bridge-20260929]
    paths:
      - .github/workflows/zcloud-deploy-bridge.yml

permissions:
  contents: read

concurrency:
  group: temporary-zcloud-deploy-bridge
  cancel-in-progress: true

jobs:
  deploy:
    name: Promote zCloud through HaxLab VPS runner
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    steps:
      - name: Promote exact validated zCloud main
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/ubuntu/zennay-cloud
          EXPECTED=22646e674a705e9266cb887f72fcefd828b9f5a8
          TMP_BASE="$(mktemp -d /tmp/zcloud-bridge.XXXXXX)"
          CANDIDATE="$TMP_BASE/candidate"
          cleanup() {
            git -C "$ROOT" worktree remove --force "$CANDIDATE" >/dev/null 2>&1 || true
            rm -rf "$TMP_BASE"
          }
          trap cleanup EXIT

          git -C "$ROOT" fetch --prune origin main
          git -C "$ROOT" cat-file -e "$EXPECTED^{commit}"
          git -C "$ROOT" worktree add --detach "$CANDIDATE" "$EXPECTED"
          test "$(git -C "$CANDIDATE" rev-parse HEAD)" = "$EXPECTED"

          # One-time guarded migration from the previous per-project >2 worker model.
          # Never evict a legacy worker that still owns a live task claim.
          python3 - <<'PY'
          import json
          import sqlite3
          from datetime import datetime, timezone
          from pathlib import Path

          db = Path("/home/ubuntu/zennay-cloud/history.db")
          conn = sqlite3.connect(db, timeout=10)
          conn.row_factory = sqlite3.Row
          conn.execute("BEGIN IMMEDIATE")
          legacy = [dict(r) for r in conn.execute(
              "SELECT project_id,worker_slot,desired_state,conversation_id "
              "FROM runner_workers WHERE worker_slot>2 ORDER BY project_id,worker_slot"
          )]
          blockers = []
          now = datetime.now(timezone.utc)
          for row in conn.execute(
              "SELECT project_id,claim_key,owner_id,worker_id,lease_until "
              "FROM task_claims WHERE worker_id IS NOT NULL AND worker_id!=''"
          ):
              worker_id = str(row["worker_id"])
              try:
                  slot = int(worker_id.rsplit("::w", 1)[1])
              except Exception:
                  continue
              if slot <= 2:
                  continue
              try:
                  lease = datetime.fromisoformat(str(row["lease_until"])).astimezone(timezone.utc)
              except Exception:
                  lease = now
              if lease > now:
                  blockers.append(dict(row))
          if blockers:
              conn.rollback()
              print(json.dumps({"ok": False, "reason": "live_legacy_claims", "blockers": blockers}, default=str))
              raise SystemExit(3)

          target_rows = [dict(r) for r in conn.execute(
              "SELECT project_id,worker_count FROM runner_targets WHERE worker_count>2 ORDER BY project_id"
          )]
          conn.execute("DELETE FROM task_claims WHERE worker_id LIKE '%::w%' AND lease_until<=?", (now.isoformat(),))
          conn.execute("DELETE FROM runner_workers WHERE worker_slot>2")
          conn.execute("UPDATE runner_targets SET worker_count=2 WHERE worker_count>2")
          if conn.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='ai_global_slots'").fetchone():
              conn.execute("DELETE FROM ai_global_slots WHERE worker_slot>2 OR slot>2")
          if conn.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='config_audit'").fetchone():
              ts = now.isoformat()
              for row in target_rows:
                  conn.execute(
                      "INSERT INTO config_audit(ts,actor,config_key,target,old_value_json,new_value_json,result,detail) "
                      "VALUES(?,?,?,?,?,?,?,?)",
                      (ts, "haxlab-runner-zcloud-bridge", "runner.worker_count", row["project_id"],
                       json.dumps(row["worker_count"]), json.dumps(2), "succeeded",
                       "one-time migration to GLOBAL_CHATGPT_WORKER_LIMIT=2"),
                  )
              for row in legacy:
                  conn.execute(
                      "INSERT INTO config_audit(ts,actor,config_key,target,old_value_json,new_value_json,result,detail) "
                      "VALUES(?,?,?,?,?,?,?,?)",
                      (ts, "haxlab-runner-zcloud-bridge", "runner.legacy_worker_slot",
                       f"{row['project_id']}::w{row['worker_slot']}", json.dumps(row), json.dumps(None),
                       "succeeded", "removed legacy worker slot above global hard limit"),
                  )
          conn.commit()
          print(json.dumps({"ok": True, "legacy_workers_removed": legacy, "targets_clamped": target_rows}, default=str))
          PY

          python3 "$CANDIDATE/scripts/zcloud_transactional_promote.py" \
            --candidate "$CANDIDATE" \
            --root "$ROOT" \
            --path server.py \
            --path autonomy-policy.json \
            --actor "haxlab-runner-zcloud-bridge" \
            --json

          # Browser reloads are safe only between AI cycles. Wait until every
          # currently allocated global slot is idle for a stable window.
          python3 - <<'PY'
          import sqlite3,time,sys
          from pathlib import Path
          db=Path("/home/ubuntu/zennay-cloud/history.db")
          deadline=time.time()+240
          stable_since=None
          while time.time()<deadline:
              conn=sqlite3.connect(f"file:{db}?mode=ro",uri=True,timeout=3)
              conn.row_factory=sqlite3.Row
              slots=[dict(r) for r in conn.execute(
                  "SELECT slot,project_id,worker_slot FROM ai_global_slots ORDER BY slot"
              )]
              states=[]
              for slot in slots:
                  p,s=slot["project_id"],slot["worker_slot"]
                  latest=conn.execute(
                      "SELECT id,event,generating,sending FROM runner_events "
                      "WHERE project_id=? AND worker_slot=? ORDER BY id DESC LIMIT 1",(p,s)
                  ).fetchone()
                  last_start=conn.execute(
                      "SELECT MAX(id) FROM runner_events WHERE project_id=? AND worker_slot=? AND event='generation-started'",(p,s)
                  ).fetchone()[0] or 0
                  last_finish=conn.execute(
                      "SELECT MAX(id) FROM runner_events WHERE project_id=? AND worker_slot=? AND event='generation-finished'",(p,s)
                  ).fetchone()[0] or 0
                  busy=(not latest) or bool(latest["generating"]) or bool(latest["sending"]) or last_start>last_finish
                  states.append((p,s,busy))
              conn.close()
              if slots and len(slots)<=2 and all(not x[2] for x in states):
                  stable_since=stable_since or time.time()
                  if time.time()-stable_since>=8:
                      print({"safe_idle":True,"slots":[f"{x[0]}::w{x[1]}" for x in states]})
                      sys.exit(0)
              else:
                  stable_since=None
              time.sleep(2)
          print({"safe_idle":False,"reason":"allocated workers did not become idle"})
          sys.exit(75)
          PY

          python3 "$CANDIDATE/scripts/zcloud_transactional_promote.py" \
            --candidate "$CANDIDATE" \
            --root "$ROOT" \
            --path firefox-extension/background.js \
            --actor "haxlab-runner-zcloud-bridge" \
            --json
