name: HaxLab data pipeline audit determinism proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch SHA to prove
        required: true
        type: string
  push:
    branches:
      - validation/data-pipeline-audit-determinism-contract-20261007
      - validation/data-pipeline-audit-determinism-aliases-20261007
      - validation/data-pipeline-audit-numpy-entropy-20261007
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/data-pipeline-audit-determinism-proof.yml"
      - "docs/data-pipeline-audit-determinism.md"
      - "tests/test_data_pipeline_audit_determinism_contract.py"

permissions:
  contents: read

concurrency:
  group: haxlab-audit-determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head audit determinism contract
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          clean: true
          persist-credentials: false

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Verify candidate is still the live branch head
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            branch="${{ github.head_ref }}"
          else
            branch="$GITHUB_REF_NAME"
          fi
          test -n "$branch"
          remote_head="$(git ls-remote origin "refs/heads/$branch" | awk 'NR == 1 {print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$EXPECTED_HEAD"
          echo "HAXLAB_AUDIT_DETERMINISM_LIVE_HEAD=$remote_head"

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-determinism-venv
          python3 -m venv .audit-determinism-venv
          .audit-determinism-venv/bin/pip install -q --upgrade pip
          .audit-determinism-venv/bin/pip install -q -e '.[dev]'
          .audit-determinism-venv/bin/python -m compileall -q tests/test_data_pipeline_audit_determinism_contract.py
          .audit-determinism-venv/bin/pytest -q tests/test_data_pipeline_audit_determinism_contract.py
          .audit-determinism-venv/bin/pytest --collect-only -q >/dev/null
