name: Data-pipeline autonomy status exact-head proof

on:
  push:
    branches:
      - feature/data-pipeline-autonomy-status-integrity-20261007
  pull_request:
    branches:
      - main
    paths:
      - deploy/haxlab-autonomy-tick.sh
      - src/haxlab/runtime/autonomy_status.py
      - tests/test_autonomy_status.py
      - docs/autonomy-status-contract.md
      - .github/workflows/data-pipeline-autonomy-status-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pipeline-autonomy-status-exact-head
  cancel-in-progress: true

jobs:
  proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.message, '[autonomy-status-proof]')
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify immutable candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run focused autonomy-status proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-autonomy-status-proof
          .venv-autonomy-status-proof/bin/python -m pip install -q -e ".[dev]"
          .venv-autonomy-status-proof/bin/python -m py_compile src/haxlab/runtime/autonomy_status.py
          bash -n deploy/haxlab-autonomy-tick.sh
          .venv-autonomy-status-proof/bin/python -m pytest -q tests/test_autonomy_status.py
          .venv-autonomy-status-proof/bin/python -m pytest --collect-only -q >"$RUNNER_TEMP/haxlab-autonomy-status-$GITHUB_RUN_ID.collect"
          test -s "$RUNNER_TEMP/haxlab-autonomy-status-$GITHUB_RUN_ID.collect"
          echo "HAXLAB_AUTONOMY_STATUS_PROOF=success"
