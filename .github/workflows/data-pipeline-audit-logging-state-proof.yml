name: Data-pipeline audit logging-state proof

on:
  push:
    branches:
      - validation/data-pipeline-audit-logging-state-20261007
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-data-pipeline-audit-logging-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "HAXLAB_DATA_PIPELINE_AUDIT_LOGGING_STATE_HEAD=$(git rev-parse HEAD)"

      - name: Verify candidate is still the live branch head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 {print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "${{ github.sha }}"
          echo "HAXLAB_DATA_PIPELINE_AUDIT_LOGGING_STATE_LIVE_HEAD=$remote_head"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .data-pipeline-audit-logging-state-venv
          python3 -m venv .data-pipeline-audit-logging-state-venv
          .data-pipeline-audit-logging-state-venv/bin/pip install --upgrade pip
          .data-pipeline-audit-logging-state-venv/bin/pip install -e '.[dev]'

      - name: Compile repository Python
        shell: bash
        run: |
          set -euo pipefail
          .data-pipeline-audit-logging-state-venv/bin/python -m compileall -q src tests

      - name: Run logging-state contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .data-pipeline-audit-logging-state-venv/bin/pytest -q \
              tests/test_data_pipeline_audit_logging_state_contract.py

      - name: Run adjacent audit state contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .data-pipeline-audit-logging-state-venv/bin/pytest -q \
              tests/test_data_pipeline_audit_global_state_contract.py \
              tests/test_data_pipeline_audit_determinism_contract.py \
              tests/test_data_pipeline_audit_process_termination_contract.py

      - name: Record green result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_DATA_PIPELINE_AUDIT_LOGGING_STATE_RESULT=green"
