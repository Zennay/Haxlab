name: FTMO PR467 exact-head monotonic sync proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr467-monotonic-sync-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr467-monotonic-sync-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 35
    env:
      TARGET_SHA: 8fff315440d65c1511c4cb452ae1ca99c3e72fcd
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Fetch exact FTMO PR467 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr467-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_PR467_EXACT_SHA=$TARGET_SHA"

      - name: Install isolated environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr467-proof"
          venv="$RUNNER_TEMP/ftmo-pr467-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove monotonic generation and stage guard
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr467-proof"
          venv="$RUNNER_TEMP/ftmo-pr467-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q \
            src/prop_trading_ai/research/state_sync.py \
            src/prop_trading_ai/research/immutable.py \
            src/prop_trading_ai/research/research_machine.py
          "$venv/bin/python" -m pytest -q \
            tests/test_research_state_sync_guard.py \
            tests/test_autonomous_research_state_sync.py
          echo "FTMO_PR467_MONOTONIC_GUARD_GREEN=1"

      - name: Prove immutable deploy and adjacent safety
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr467-proof"
          venv="$RUNNER_TEMP/ftmo-pr467-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q \
            tests/test_autonomous_deploy_lockstep.py \
            tests/test_immutable_evidence.py \
            tests/test_provider_validation_ancestor_integrity.py \
            tests/test_provider_validation_json_integrity.py \
            tests/test_provider_foundation_publication.py \
            tests/test_autonomous_provider_retry.py \
            tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR467_ADJACENT_BOUNDARIES_GREEN=1"

      - name: Run complete suite in bounded file batches
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr467-proof"
          venv="$RUNNER_TEMP/ftmo-pr467-venv"
          cd "$src"
          "$venv/bin/python" - <<'PY'
          from pathlib import Path
          import contextlib
          import io
          import pytest

          class Collector:
              paths = None
              count = None

              def pytest_collection_finish(self, session):
                  self.count = len(session.items)
                  self.paths = sorted({
                      Path(str(item.path)).resolve().relative_to(Path.cwd().resolve()).as_posix()
                      for item in session.items
                  })

          collector = Collector()
          captured = io.StringIO()
          with contextlib.redirect_stdout(captured), contextlib.redirect_stderr(captured):
              code = pytest.main(["--collect-only", "-q"], plugins=[collector])
          if code != pytest.ExitCode.OK or not collector.paths or not collector.count:
              raise SystemExit("pytest collection failed: " + captured.getvalue()[-2000:])
          scratch = Path(".scratch")
          scratch.mkdir(exist_ok=True)
          (scratch / "pr467-test-files.txt").write_text(
              "\n".join(collector.paths) + "\n", encoding="utf-8"
          )
          (scratch / "pr467-test-count.txt").write_text(
              str(collector.count) + "\n", encoding="utf-8"
          )
          print(f"collected_tests={collector.count}")
          print(f"test_files={len(collector.paths)}")
          PY

          executed=0
          while IFS= read -r test_file; do
            [[ -n "$test_file" ]] || continue
            "$venv/bin/python" -m pytest -q "$test_file"
            executed=$((executed + 1))
          done < .scratch/pr467-test-files.txt
          test "$executed" -gt 0
          echo "FTMO_PR467_FULL_SUITE_GREEN=1"
          echo "planned_collected_tests=$(cat .scratch/pr467-test-count.txt)"
          echo "executed_test_files=$executed"

      - name: Persist sanitized proof receipt
        if: always()
        shell: bash
        env:
          PROOF_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr467-proof-${GITHUB_RUN_ID}.json"
          python3 - <<'PY' > "$receipt"
          import json, os, socket
          print(json.dumps({
              "project":"ftmo",
              "queue_id":"ftmo-9c518045b0d66472",
              "pr":467,
              "target_sha":os.environ["TARGET_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "runner_host":socket.gethostname(),
              "result":os.environ["PROOF_RESULT"],
              "paid_cloud_budget_usd":os.environ["FTMO_AUTONOMOUS_CLOUD_BUDGET_USD"],
              "walk_forward_accessed":False,
              "final_holdout_accessed":False,
              "proof":[
                  "exact-sha-checkout",
                  "monotonic-generation-stage-guard",
                  "research-state-sync",
                  "immutable-deploy-lockstep",
                  "provider-ancestor-integrity",
                  "provider-foundation-safety",
                  "zero-cost-boundary",
                  "full-suite-file-batches"
              ]
          }, sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr467-haxlab-proof-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/Haxlab/contents/$path" \
            -f message="Record FTMO PR467 exact-head proof ${GITHUB_RUN_ID}" \
            -f content="$encoded" >/dev/null
          echo "FTMO_PR467_RECEIPT_PATH=$path"
