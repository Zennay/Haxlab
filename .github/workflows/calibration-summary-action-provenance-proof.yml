name: Calibration summary action provenance proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-calibration-summary-action-provenance-proof
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify exact and live branch head
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "${GITHUB_SHA}"
          case "${GITHUB_REF}" in
            refs/heads/*) ;;
            *)
              echo "proof must be dispatched from a branch ref, got: ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac
          LIVE_SHA="$(
            git ls-remote --exit-code origin "${GITHUB_REF}" |
              awk 'NR == 1 { print $1 }'
          )"
          test -n "$LIVE_SHA"
          if [ "$LIVE_SHA" != "${GITHUB_SHA}" ]; then
            echo "branch moved after dispatch: live=$LIVE_SHA dispatched=${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Create isolated proof environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .calibration-summary-action-provenance-venv
          python3 -m venv .calibration-summary-action-provenance-venv
          .calibration-summary-action-provenance-venv/bin/pip install --upgrade pip
          .calibration-summary-action-provenance-venv/bin/pip install -e '.[dev]'

      - name: Run provenance contract
        shell: bash
        run: |
          set -euo pipefail
          .calibration-summary-action-provenance-venv/bin/python -m compileall -q tests/test_calibration_summary_action_provenance.py
          PYTHONPATH="$GITHUB_WORKSPACE/src" .calibration-summary-action-provenance-venv/bin/pytest -q tests/test_calibration_summary_action_provenance.py

      - name: Run calibration summary adjacent regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .calibration-summary-action-provenance-venv/bin/pytest -q \
              tests/test_calibration_summary_pythonpath_contract.py \
              tests/test_calibration_gate.py \
              tests/test_calibration_resume.py \
              tests/test_calibration_workflow_evidence_contract.py

      - name: Record exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "CALIBRATION_SUMMARY_ACTION_PROVENANCE_HEAD=$(git rev-parse HEAD)"
          echo "CALIBRATION_SUMMARY_ACTION_PROVENANCE_RESULT=green"
