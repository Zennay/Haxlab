name: zSSH signed agent HTTP exact-head VPS proof

on:
  push:
    branches:
      - ops/zssh-agent-http-proof-20261003
    paths:
      - .github/workflows/zssh-agent-http-proof-20261003.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    env:
      ZSSH_TARGET_SHA: ab6eae7879d0d1f7a99f943e3c625d0cf7bed65a
    steps:
      - name: Verify VPS host
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"
          echo "ZSSH_AGENT_HTTP_HOST=$(hostname)"
      - name: Checkout exact zSSH head
        uses: actions/checkout@v4
        with:
          repository: Zennay/zSSH
          ref: ${{ env.ZSSH_TARGET_SHA }}
          path: zssh-proof
          fetch-depth: 1
      - name: Prove exact checkout
        shell: bash
        working-directory: zssh-proof
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ZSSH_TARGET_SHA"
          echo "ZSSH_AGENT_HTTP_EXACT_HEAD=$ZSSH_TARGET_SHA"
      - name: Install dependencies
        working-directory: zssh-proof
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run signed transport tests
        working-directory: zssh-proof
        run: |
          node --test             test/agent-transport.test.mjs             test/agent-http.test.mjs             test/target-agent-client.test.mjs             test/agent-identity.test.mjs             test/target-routing.test.mjs
      - name: Run full zSSH suite
        working-directory: zssh-proof
        run: npm test
      - name: Validate deployment and runtime syntax
        shell: bash
        working-directory: zssh-proof
        run: |
          set -Eeuo pipefail
          bash -n deploy/install-target-agent.sh
          node --check agent-http.mjs
          node --check agent-transport.mjs
          node --check target-agent-client.mjs
          node --check target-agent.mjs
          node --check scripts/create-agent-identity.mjs
          echo "ZSSH_AGENT_HTTP_VPS_PROOF_GREEN=1"
