name: Multisource suite integrity validation

on:
  push:
    branches:
      - validation/multisource-suite-integrity-20261006
      - validation/multisource-suite-workflow-provenance-20261007
  pull_request:
    branches:
      - feature/arena-v2-current-main-20261004
    paths:
      - .github/workflows/multisource-suite-integrity-validation.yml
      - tests/test_multisource_suite_workflow_provenance_contract.py
      - docs/multisource-suite-workflow-provenance.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-multisource-suite-integrity-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify exact validation checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "multisource-suite validation checkout mismatch: $actual_sha != $EXPECTED_SHA" >&2
            exit 1
          fi
          echo "MULTISOURCE_SUITE_INTEGRITY_EXACT_SHA=$actual_sha"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .multisource-suite-validation-venv
          python3 -m venv .multisource-suite-validation-venv
          .multisource-suite-validation-venv/bin/pip install --upgrade pip
          .multisource-suite-validation-venv/bin/pip install -e '.[dev]'

      - name: Compile frozen suite code and provenance contract
        shell: bash
        run: |
          set -euo pipefail
          .multisource-suite-validation-venv/bin/python -m compileall -q \
            src/haxlab/evaluation/multisource_suite.py \
            tests/test_multisource_suite.py \
            tests/test_multisource_suite_workflow_provenance_contract.py

      - name: Run workflow provenance contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .multisource-suite-validation-venv/bin/pytest -q \
              tests/test_multisource_suite_workflow_provenance_contract.py

      - name: Run frozen suite and adjacent regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .multisource-suite-validation-venv/bin/pytest -q \
              tests/test_multisource_suite.py \
              tests/test_scenario_source.py \
              tests/test_multisource_duel.py

      - name: Record exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "MULTISOURCE_SUITE_INTEGRITY_HEAD=$(git rev-parse HEAD)"
          echo "MULTISOURCE_SUITE_INTEGRITY_RESULT=green"
