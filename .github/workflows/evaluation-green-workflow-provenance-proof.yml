name: Evaluation green workflow provenance proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-evaluation-green-workflow-provenance-proof
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify exact and live branch head
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "${GITHUB_SHA}"
          case "${GITHUB_REF}" in
            refs/heads/*) ;;
            *)
              echo "proof must be dispatched from a branch ref, got: ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac
          LIVE_SHA="$(
            git ls-remote --exit-code origin "${GITHUB_REF}" |
              awk 'NR == 1 { print $1 }'
          )"
          test -n "$LIVE_SHA"
          if [ "$LIVE_SHA" != "${GITHUB_SHA}" ]; then
            echo "branch moved after dispatch: live=$LIVE_SHA dispatched=${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Create isolated proof environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-green-provenance-proof-venv
          python3 -m venv .evaluation-green-provenance-proof-venv
          .evaluation-green-provenance-proof-venv/bin/pip install --disable-pip-version-check pytest

      - name: Run source-only provenance contract
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-green-provenance-proof-venv/bin/python -m compileall -q tests/test_evaluation_green_workflow_provenance.py
          .evaluation-green-provenance-proof-venv/bin/python -m pytest -q tests/test_evaluation_green_workflow_provenance.py

      - name: Record exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "EVALUATION_GREEN_PROVENANCE_HEAD=$(git rev-parse HEAD)"
          echo "EVALUATION_GREEN_PROVENANCE_RESULT=green"
