name: Promotion evidence validation

on:
  push:
    branches:
      - validation/promotion-evidence-fail-closed-20261006
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-promotion-evidence-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify exact validation head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error title=Promotion evidence provenance mismatch::checked out $ACTUAL_SHA, expected $EXPECTED_SHA"
            exit 1
          fi

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .promotion-validation-venv
          python3 -m venv .promotion-validation-venv
          .promotion-validation-venv/bin/pip install --upgrade pip
          .promotion-validation-venv/bin/pip install -e '.[dev]'

      - name: Compile promotion gate
        shell: bash
        run: |
          set -euo pipefail
          .promotion-validation-venv/bin/python -m compileall -q             src/haxlab/evaluation/promotion.py             src/haxlab/evaluation/models.py             tests/test_promotion.py

      - name: Run promotion evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src"             .promotion-validation-venv/bin/pytest -q tests/test_promotion.py

      - name: Run promotion-adjacent evaluation regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src"             .promotion-validation-venv/bin/pytest -q               tests/test_closed_loop_arena.py               tests/test_multisource_duel.py               tests/test_multisource_suite.py

      - name: Record exact-head validation evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "PROMOTION_EVIDENCE_VALIDATION_HEAD=$(git rev-parse HEAD)"
          echo "PROMOTION_EVIDENCE_VALIDATION_RESULT=green"
