name: VPS cleanup once

on:
  pull_request:
    branches:
      - main
    types: [opened]
    paths:
      - .github/workflows/vps-cleanup-once.yml

permissions:
  contents: read

jobs:
  cleanup:
    name: Safe VPS cleanup
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    steps:
      - name: Disk usage before
        shell: bash
        run: |
          set -euo pipefail
          echo "=== HOST ==="
          hostname
          date -Is
          echo "=== ROOT FILESYSTEM ==="
          df -h /
          echo "=== TOP-LEVEL USAGE (read-only inventory) ==="
          sudo du -xhd1 / 2>/dev/null | sort -h | tail -n 20 || true
          echo "=== /var USAGE ==="
          sudo du -xhd1 /var 2>/dev/null | sort -h | tail -n 20 || true
          echo "=== /home USAGE ==="
          sudo du -xhd2 /home 2>/dev/null | sort -h | tail -n 25 || true

      - name: Conservative cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning APT package cache..."
          sudo apt-get clean

          echo "Vacuuming systemd journal older than 14 days..."
          sudo journalctl --vacuum-time=14d || true

          echo "Applying configured systemd tmpfile retention rules..."
          sudo systemd-tmpfiles --clean || true

          echo "Purging old Python package download caches for known service users..."
          for home in /home/ubuntu /home/haxlab; do
            [ -d "$home" ] || continue
            [ ! -d "$home/.cache/pip" ] || sudo rm -rf -- "$home/.cache/pip"
            [ ! -d "$home/.cache/uv" ] || sudo rm -rf -- "$home/.cache/uv"
          done

          echo "Removing stale Python bytecode only from project code trees..."
          for root in /opt/haxlab /opt/zcloud /opt/ftmo /opt/raise-ai /opt/raiseai; do
            [ -d "$root" ] || continue
            sudo find "$root" -xdev -type d -name __pycache__ -mtime +2 -prune -exec rm -rf -- {} + 2>/dev/null || true
            sudo find "$root" -xdev -type f -name '*.pyc' -mtime +2 -delete 2>/dev/null || true
          done

          echo "No databases, datasets, Docker volumes/images, Git repos, active runner workspaces, or application state were deleted."

      - name: Disk usage after
        shell: bash
        run: |
          set -euo pipefail
          echo "=== ROOT FILESYSTEM AFTER ==="
          df -h /
          echo "=== /var AFTER ==="
          sudo du -xhd1 /var 2>/dev/null | sort -h | tail -n 20 || true
          echo "=== LARGE FILES OVER 1 GiB (inventory only) ==="
          sudo find / -xdev -type f -size +1G -printf '%s %p\n' 2>/dev/null | sort -nr | head -n 30 || true
