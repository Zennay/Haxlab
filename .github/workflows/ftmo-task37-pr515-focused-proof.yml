name: FTMO TASK-37 PR515 focused proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-task37-pr515-focused-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-task37-pr515-focused-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    env:
      TARGET_SHA: 1d45ed3edc0c7ac82e59104ec507ab6b0666e730
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Verify safe VPS boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"

      - name: Checkout exact FTMO PR515 head
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ftmo-task37-pr515-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$work"
          git init -q "$work"
          git -C "$work" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$work" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$work" checkout -q --detach FETCH_HEAD
          test "$(git -C "$work" rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_WORK=$work" >> "$GITHUB_ENV"

      - name: Run focused TASK-37 proof
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/ftmo-task37-pr515-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$FTMO_WORK/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$FTMO_WORK"
          cd "$FTMO_WORK"
          "$venv/bin/python" -m py_compile             src/prop_trading_ai/cli/v1_research_readiness.py             src/prop_trading_ai/cli/v1_research_status.py             tests/test_research_readiness_cli.py
          "$venv/bin/python" -m pytest -q tests/test_research_readiness_cli.py
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "FTMO_VENV=$venv" >> "$GITHUB_ENV"

      - name: Publish receipt
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ftmo-task37-pr515-focused-proof.json"
          cat >"$receipt" <<EOF
{
  "schema_version": 1,
  "scope": "ftmo-task37-pr515-focused-proof",
  "target_sha": "$TARGET_SHA",
  "runner_host": "$(hostname)",
  "workflow_run_id": "$GITHUB_RUN_ID",
  "workflow_run_attempt": "$GITHUB_RUN_ATTEMPT",
  "result": "success",
  "focused_test": "tests/test_research_readiness_cli.py",
  "paid_cloud_budget_usd": "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD",
  "walk_forward_accessed": false,
  "final_holdout_accessed": false
}
EOF
          encoded="$(base64 -w0 "$receipt")"
          gh api --method PUT repos/Zennay/Haxlab/contents/runtime-evidence/ftmo-task37-pr515-focused-proof.json             -f message="Record FTMO TASK-37 PR515 focused proof"             -f content="$encoded"             -f branch=main >/dev/null

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-task37-pr515-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"                  "$RUNNER_TEMP/ftmo-task37-pr515-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"                  "$RUNNER_TEMP/ftmo-task37-pr515-focused-proof.json"
