name: HaxLab Failure Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/failure-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose one failed replay
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5

    steps:
      - name: Inspect failed replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          import subprocess
          from pathlib import Path

          db = "/var/lib/haxlab/state/haxlab.sqlite3"
          conn = sqlite3.connect(db)
          conn.row_factory = sqlite3.Row

          rows = conn.execute("""
              SELECT a.sha256, r.archive_path, r.size_bytes,
                     p.total_frames, p.duration_seconds, a.error
              FROM replay_analysis a
              JOIN raw_replays r ON r.sha256 = a.sha256
              JOIN replay_processing p ON p.sha256 = a.sha256
              WHERE a.analyzer_version='state-pass-v2'
                AND a.status='failed'
              ORDER BY p.total_frames DESC
              LIMIT 5
          """).fetchall()

          print("=== failed replay sample ===")
          for row in rows:
              print(dict(row) | {"error": str(row["error"] or "")[:180]})

          if not rows:
              raise SystemExit("No failed replay found")

          replay = rows[0]["archive_path"]
          print("\n=== decoder diagnostic ===")
          print("replay:", replay)

          try:
              proc = subprocess.run(
                  ["node", "/opt/haxlab/tools/decode_replay.js", replay, "6"],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  timeout=30,
                  check=False,
              )
              print("returncode:", proc.returncode)
              print("stdout chars:", len(proc.stdout))
              print("stderr chars:", len(proc.stderr))

              useful = []
              for line in proc.stderr.splitlines():
                  stripped = line.strip()
                  if not stripped:
                      continue
                  if len(stripped) <= 800:
                      useful.append(stripped)

              print("\n=== useful stderr lines ===")
              if useful:
                  for line in useful[-40:]:
                      print(line)
              else:
                  print("<no short stderr lines>")
                  print(proc.stderr[-2000:])
          except subprocess.TimeoutExpired as exc:
              print("decoder timed out after 30s")
              print("stderr:", (exc.stderr or "")[-2000:])
          PY
