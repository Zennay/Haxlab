name: FTMO PR431 integrated-main proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr431-exact-head-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftmo-pr431-exact-head-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      TARGET_SHA: 82fdec619e09d9c55e774b7aafeff21b73b1bec3
    steps:
      - name: Verify VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          echo "runner_host=$(hostname)"
      - name: Checkout exact FTMO head
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr431-haxlab-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_head_sha=$TARGET_SHA"
      - name: Install isolated environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr431-haxlab-proof"
          venv="$RUNNER_TEMP/ftmo-pr431-haxlab-proof-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
      - name: Prove implementation and sealed boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr431-haxlab-proof"
          venv="$RUNNER_TEMP/ftmo-pr431-haxlab-proof-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/data/market/providers/dukascopy_jetta.py
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_jetta.py -k 'default_fetch'
          "$venv/bin/python" -m pytest -q tests/test_dukascopy_jetta.py
          "$venv/bin/python" -m pytest -q tests/test_autonomous_provider_retry.py
          "$venv/bin/python" -m pytest -q             tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner             tests/test_zero_cost_workflow_boundary.py::test_diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free
