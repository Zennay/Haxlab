name: Elite Canary Validation

on:
  push:
    branches:
      - experiment/frozen-future-head-v01

permissions:
  contents: read

concurrency:
  group: haxlab-elite-canary-validation
  cancel-in-progress: true

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[canary]')
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Preflight canary tooling
        shell: bash
        run: |
          set -euo pipefail
          node --check "$GITHUB_WORKSPACE/tools/validate_canary_champion.js"
          node "$GITHUB_WORKSPACE/tests/test_canary_champion.js"
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            python3 -m py_compile \
            "$GITHUB_WORKSPACE/src/haxlab/evaluation/scenario_source.py" \
            "$GITHUB_WORKSPACE/src/haxlab/evaluation/champion_registry.py"

      - name: Require multi-replay validated current champion
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/var/lib/haxlab/derived/champions/elite-player")
          pointer = json.loads((root / "current.json").read_text())
          stage = pointer.get("validation_stage")
          if stage not in {"multi_replay", "canary"}:
              raise SystemExit(
                  f"Current champion must be multi_replay validated before canary; got {stage!r}"
              )

          evidence_path = Path(pointer["validation_evidence_path"])
          evidence = json.loads(evidence_path.read_text())
          if evidence.get("validated") is not True:
              raise SystemExit("Current validation evidence is not passing")

          shas = [
              str(row["sha256"])
              for row in (evidence.get("source_set") or {}).get("sources", [])
              if row.get("sha256")
          ]
          if not shas:
              raise SystemExit("No replay SHA values found in current validation evidence")

          Path("/tmp/haxlab-canary-exclude.txt").write_text(
              "\n".join(shas) + "\n",
              encoding="utf-8",
          )
          Path("/tmp/haxlab-canary-current.json").write_text(
              json.dumps(
                  {
                      "version_id": pointer["version_id"],
                      "runtime_model_path": pointer["runtime_model_path"],
                      "runtime_config": pointer.get("runtime_config") or {},
                      "validation_stage": stage,
                      "excluded_replays": shas,
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "version_id": pointer["version_id"],
              "validation_stage": stage,
              "excluded_replays": len(shas),
          }, indent=2))
          PY

      - name: Select ten new diverse 4v4 canary replays
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.scenario_source \
            --state-db /var/lib/haxlab/state/haxlab.sqlite3 \
            --max-candidates 4000 \
            --count 10 \
            --max-shared-players 3 \
            --exclude-sha-file /tmp/haxlab-canary-exclude.txt \
            --output /tmp/haxlab-canary-sources.json

      - name: Benchmark current champion across canary set
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CFG < <(
            sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/haxlab-canary-current.json").read_text())
          cfg = data.get("runtime_config") or {}
          roles = ",".join(cfg.get("allowed_roles") or ["gk", "dm", "am", "st"])
          print(data["runtime_model_path"])
          print(float(cfg.get("minimum_confidence", 0.68)))
          print(int(cfg.get("minimum_ball_distance", 80)))
          print(roles)
          print(data["version_id"])
          PY
          )
          CANDIDATE_MODEL="\${CFG[0]}"
          CONF="\${CFG[1]}"
          DIST="\${CFG[2]}"
          ROLES="\${CFG[3]}"
          VERSION="\${CFG[4]}"

          mapfile -t SOURCES < <(
            sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/haxlab-canary-sources.json").read_text())
          for index, source in enumerate(payload["sources"], start=1):
              print("\t".join([
                  str(index),
                  source["sha256"],
                  source["raw_path"],
                  source["analysis_path"],
              ]))
          PY
          )

          for ROW in "\${SOURCES[@]}"; do
            IFS=$'\t' read -r IDX SHA RAW ANALYSIS <<< "$ROW"
            PREFIX="/tmp/haxlab-canary-\${IDX}"

            sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
              "$GITHUB_WORKSPACE/tools/extract_stadium_from_replay.js" \
              "$RAW" "\${PREFIX}.hbs"

            sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
              "$GITHUB_WORKSPACE/tools/extract_replay_scenarios.js" \
              "$RAW" "$ANALYSIS" "\${PREFIX}-scenarios.json" 20 10 6

            sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
              "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js" \
              --model /var/lib/haxlab/derived/training/elite-player-champion-candidate/model/runtime-model.json \
              --stadium "\${PREFIX}.hbs" \
              --scenarios "\${PREFIX}-scenarios.json" \
              --max-scenarios 10 \
              --seconds 60 \
              --sample-every 6 \
              --disable-recovery \
              --output "\${PREFIX}-champion.json"

            sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
              "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js" \
              --model "$CANDIDATE_MODEL" \
              --stadium "\${PREFIX}.hbs" \
              --scenarios "\${PREFIX}-scenarios.json" \
              --max-scenarios 10 \
              --seconds 60 \
              --sample-every 6 \
              --disable-recovery \
              --future-assist \
              --future-assist-confidence "$CONF" \
              --future-assist-min-distance "$DIST" \
              --future-assist-roles "$ROLES" \
              --output "\${PREFIX}-candidate.json"
          done

          sudo -u haxlab /opt/haxlab/.venv/bin/python - \
            "$VERSION" "$CANDIDATE_MODEL" "$CONF" "$DIST" "$ROLES" <<'PY'
          import json
          import sys
          from pathlib import Path

          version, model, confidence, distance, roles = sys.argv[1:]
          source_set = json.loads(Path("/tmp/haxlab-canary-sources.json").read_text())
          cases = []
          for index, source in enumerate(source_set["sources"], start=1):
              cases.append({
                  "label": f"{index}:{source['sha256'][:12]}",
                  "sha256": source["sha256"],
                  "champion_path": f"/tmp/haxlab-canary-{index}-champion.json",
                  "candidate_path": f"/tmp/haxlab-canary-{index}-candidate.json",
              })
          payload = {
              "schema": "haxlab-canary-validation-manifest-v1",
              "candidate": {
                  "version_id": version,
                  "runtime_model_path": model,
                  "future_assist_config": {
                      "minimum_confidence": float(confidence),
                      "minimum_ball_distance": int(distance),
                      "allowed_roles": [row for row in roles.split(",") if row],
                  },
              },
              "canary_config": {
                  "replay_count": len(cases),
                  "seconds_per_scenario": 60,
                  "scenarios_per_replay": 10,
                  "max_shared_players": 3,
                  "excluded_prior_validation_replays": True,
              },
              "source_set": source_set,
              "cases": cases,
          }
          Path("/tmp/haxlab-canary-manifest.json").write_text(
              json.dumps(payload, indent=2) + "\n"
          )
          PY

      - name: Evaluate canary generalization
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/validate_canary_champion.js" \
            /tmp/haxlab-canary-manifest.json \
            /tmp/haxlab-canary-validation.json

      - name: Record passing canary validation
        shell: bash
        run: |
          set -euo pipefail
          if sudo -u haxlab /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          data = json.load(open("/tmp/haxlab-canary-validation.json"))
          raise SystemExit(0 if data.get("validated") is True else 1)
          PY
          then
            sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
              /opt/haxlab/.venv/bin/python -m haxlab.evaluation.champion_registry \
              --registry-root /var/lib/haxlab/derived/champions/elite-player \
              --record-validation /tmp/haxlab-canary-validation.json \
              --validation-stage canary \
              --output /tmp/haxlab-canary-registry-validation.json
          else
            sudo -u haxlab sh -c \
              'echo '"'"'{"recorded": false, "reason": "canary_gate_rejected"}'"'"' > /tmp/haxlab-canary-registry-validation.json'
          fi

      - name: Publish canary evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          copy_if_present() {
            local src="$1"
            local dst="$2"
            if sudo test -f "$src"; then
              sudo cat "$src" > "$dst"
            fi
          }

          copy_if_present /tmp/haxlab-canary-current.json canary-current.json
          copy_if_present /tmp/haxlab-canary-sources.json canary-sources.json
          copy_if_present /tmp/haxlab-canary-manifest.json canary-manifest.json
          copy_if_present /tmp/haxlab-canary-validation.json canary-validation.json
          copy_if_present /tmp/haxlab-canary-registry-validation.json canary-registry-validation.json

          shopt -s nullglob
          for FILE in /tmp/haxlab-canary-*-champion.json /tmp/haxlab-canary-*-candidate.json; do
            sudo cat "$FILE" > "$(basename "$FILE")"
          done

          echo '## HaxLab Canary Validation' >> "$GITHUB_STEP_SUMMARY"
          if test -f canary-validation.json; then
            cat canary-validation.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Canary did not reach aggregate validation.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elite-canary-validation
          path: |
            canary-current.json
            canary-sources.json
            canary-manifest.json
            canary-validation.json
            canary-registry-validation.json
            haxlab-canary-*-champion.json
            haxlab-canary-*-candidate.json
          retention-days: 30

      - name: Enforce canary gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data = json.load(open("canary-validation.json"))
          print(json.dumps({
              "validated": data.get("validated"),
              "aggregate": data.get("aggregate"),
              "checks": data.get("checks"),
          }, indent=2))
          raise SystemExit(0 if data.get("validated") else 1)
          PY
