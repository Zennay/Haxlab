name: Evaluation filesystem mutation validation

on:
  pull_request:
    branches:
      - feature/arena-v2-current-main-20261004
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-evaluation-filesystem-mutation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          clean: true

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "HAXLAB_EVALUATION_FILESYSTEM_MUTATION_HEAD=$(git rev-parse HEAD)"

      - name: Verify candidate is still the live branch head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$CANDIDATE_REF" | awk 'NR == 1 {print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$CANDIDATE_SHA"
          echo "HAXLAB_EVALUATION_FILESYSTEM_MUTATION_LIVE_HEAD=$remote_head"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-filesystem-mutation-venv
          python3 -m venv .evaluation-filesystem-mutation-venv
          .evaluation-filesystem-mutation-venv/bin/pip install --upgrade pip
          .evaluation-filesystem-mutation-venv/bin/pip install -e '.[dev]'

      - name: Compile evaluation package and contract
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-filesystem-mutation-venv/bin/python -m compileall -q \
            src/haxlab/evaluation \
            tests/test_evaluation_filesystem_mutation_contract.py

      - name: Run filesystem mutation contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .evaluation-filesystem-mutation-venv/bin/pytest -q \
              tests/test_evaluation_filesystem_mutation_contract.py

      - name: Run adjacent canonical evaluation regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .evaluation-filesystem-mutation-venv/bin/pytest -q \
              tests/test_arena_v2_integration_workflow_contract.py \
              tests/test_calibration_cross_sha_resume_contract.py \
              tests/test_calibration_gate.py \
              tests/test_calibration_resume.py \
              tests/test_calibration_workflow_evidence_contract.py \
              tests/test_closed_loop_arena.py \
              tests/test_duel_gate.py \
              tests/test_elite_gate_preflight.py \
              tests/test_multisource_duel.py \
              tests/test_multisource_suite.py \
              tests/test_promotion.py \
              tests/test_scenario_source.py

      - name: Record green result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_EVALUATION_FILESYSTEM_MUTATION_RESULT=green"
