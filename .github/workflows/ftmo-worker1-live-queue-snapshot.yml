name: FTMO live queue snapshot worker1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-worker1-live-queue-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-worker1-live-queue-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 8
    steps:
      - name: Read live FTMO queue
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          python3 - <<'PY' > /tmp/ftmo-worker1-live-queue.json
          import json, sqlite3
          from pathlib import Path
          db=Path("/home/ubuntu/zennay-cloud/history.db")
          if not db.is_file():
              raise SystemExit("live zCloud history.db missing")
          with sqlite3.connect(db) as c:
              c.row_factory=sqlite3.Row
              rows=c.execute(
                  "SELECT queue_id,project_id,title,status,eligible,worker_slot,parent_queue_id,priority,created_at,updated_at,evidence "
                  "FROM portfolio_queue WHERE project_id='ftmo' "
                  "ORDER BY created_at DESC LIMIT 12"
              ).fetchall()
          items=[dict(r) for r in rows]
          print(json.dumps(items,sort_keys=True,default=str))
          PY
          cat /tmp/ftmo-worker1-live-queue.json

      - name: Persist sanitized snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 /tmp/ftmo-worker1-live-queue.json)"
          path="runtime-evidence/ftmo-worker1-live-queue-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/Haxlab/contents/$path"             -f message="Record FTMO Worker1 live queue snapshot ${GITHUB_RUN_ID}"             -f content="$encoded" >/dev/null
          echo "FTMO_QUEUE_RECEIPT=$path"
# trigger: worker1-20261003-followup
