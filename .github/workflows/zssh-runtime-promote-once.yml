name: zSSH one-time runtime promotion

on:
  push:
    branches:
      - "ops/zssh-github-runtime-promote"
    paths:
      - ".github/workflows/zssh-runtime-promote-once.yml"
      - ".github/scripts/zssh-runtime-promote.sh"

permissions:
  contents: read

concurrency:
  group: zssh-runtime-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote zSSH through VPS runner
    runs-on:
      - self-hosted
      - haxlab
    timeout-minutes: 20

    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4

      - name: Validate promotion script syntax
        shell: bash
        run: bash -n .github/scripts/zssh-runtime-promote.sh

      - name: Run guarded zSSH runtime promotion
        shell: bash
        env:
          ZSSH_CANONICAL_SHA: ba3e261a036897970ad9af1e1a2c1bba62efa9af
        run: bash .github/scripts/zssh-runtime-promote.sh
