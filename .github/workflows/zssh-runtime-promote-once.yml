name: zSSH one-time runtime promotion

on:
  push:
    branches:
      - "ops/zssh-github-runtime-promote"
    paths:
      - ".github/workflows/zssh-runtime-promote-once.yml"
      - ".github/scripts/zssh-runtime-promote.sh"
      - ".github/scripts/zssh-diagnose.sh"

permissions:
  contents: read

concurrency:
  group: zssh-runtime-promote
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose zSSH runtime blockers
    runs-on:
      - self-hosted
      - haxlab
    timeout-minutes: 10

    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4

      - name: Validate diagnostic script syntax
        shell: bash
        run: bash -n .github/scripts/zssh-diagnose.sh

      - name: Diagnose current VPS state
        shell: bash
        run: bash .github/scripts/zssh-diagnose.sh
