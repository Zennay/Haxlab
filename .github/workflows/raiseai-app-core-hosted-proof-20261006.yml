name: RaiseAI app-core hosted exact-head proof

on:
  push:
    branches:
      - ops/raiseai-runner-recovery-20261006-1545
    paths:
      - ".github/workflows/raiseai-app-core-hosted-proof-20261006.yml"

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: runtime-counter-saturation
            sha: a2730d215ca0a585d586d48b6e1ca7f562165db6
          - lane: sensor-registration-fail-closed
            sha: 6a9a9f10c1d1f1e157eef4171887ea392dddb243
    steps:
      - name: Checkout exact RaiseAI head
        uses: actions/checkout@v4
        with:
          repository: Zennay/RaiseAI
          ref: ${{ matrix.sha }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android 35 toolchain
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run exact-head app tests and build
        shell: bash
        env:
          RAISE_BUILD_REVISION: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx1280m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=1 \
            :app:verifyEvidenceBuildIdentity testDebugUnitTest assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "RAISEAI_HOSTED_EXACT_HEAD_GREEN lane=${{ matrix.lane }} sha=${{ matrix.sha }}"
