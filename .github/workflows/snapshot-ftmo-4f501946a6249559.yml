name: Snapshot FTMO queue ftmo-4f501946a6249559

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snapshot-ftmo-4f501946a6249559.yml"

permissions:
  contents: write

concurrency:
  group: snapshot-ftmo-4f501946a6249559
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Read exact SQLite queue item
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          export SNAPSHOT_RUN_ID="$GITHUB_RUN_ID"
          python3 - <<'PY' > /tmp/ftmo-4f501946a6249559.json
          import json, os, sqlite3, socket
          from pathlib import Path
          db=Path("/home/ubuntu/zennay-cloud/history.db")
          if not db.is_file():
              raise SystemExit("history.db missing")
          with sqlite3.connect(db) as c:
              c.row_factory=sqlite3.Row
              row=c.execute(
                  "SELECT queue_id,project_id,title,status,eligible,worker_slot,evidence,updated_at "
                  "FROM portfolio_queue WHERE queue_id=?",
                  ("ftmo-4f501946a6249559",)
              ).fetchone()
          if row is None:
              raise SystemExit("queue item missing")
          item=dict(row)
          if item["project_id"]!="ftmo":
              raise SystemExit("project mismatch")
          print(json.dumps({
              "scope":"ftmo-queue-snapshot",
              "workflow_run_id":os.environ["SNAPSHOT_RUN_ID"],
              "runner_host":socket.gethostname(),
              "item":item,
          },sort_keys=True,default=str))
          PY
          encoded="$(base64 -w0 /tmp/ftmo-4f501946a6249559.json)"
          gh api --method PUT             "repos/Zennay/Haxlab/contents/runtime-evidence/ftmo-4f501946a6249559-snapshot.json"             -f message="Snapshot FTMO queue ftmo-4f501946a6249559 run ${GITHUB_RUN_ID}"             -f content="$encoded" >/dev/null
