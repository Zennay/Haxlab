name: Retire superseded FTMO pre-current runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-superseded-ftmo-precurrent-runs.yml"

permissions:
  contents: read

jobs:
  retire:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 6
    env:
      CURRENT_MAIN: 27ed1bf808d97e168a200c301f820d16894516b4
    steps:
      - name: Cancel only exact superseded runs
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          current="$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)"
          test "$current" = "$CURRENT_MAIN"

          cancel_if_live() {
            run_id="$1"
            expected_name="$2"
            expected_sha="$3"
            payload="$(gh api "repos/Zennay/Ftmo/actions/runs/$run_id")"
            name="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])' <<<"$payload")"
            sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<<"$payload")"
            status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$payload")"
            test "$name" = "$expected_name"
            test "$sha" = "$expected_sha"
            if [[ "$status" == "queued" || "$status" == "pending" || "$status" == "in_progress" ]]; then
              gh api --method POST "repos/Zennay/Ftmo/actions/runs/$run_id/cancel" >/dev/null
              echo "CANCELLED run=$run_id name=$name sha=$sha"
            else
              echo "ALREADY_TERMINAL run=$run_id status=$status"
            fi
          }

          cancel_if_live 37160555183 "Test suite" 65eec5273ab1d7bad8892b20b2900c73759b8664
          cancel_if_live 37160526156 "Test suite" 0ff8fd49547a141dc87d5c4a933be758a4a1d6c8
          cancel_if_live 37160852415 "Test suite" 0722263a522ad41f3af8a81adc63545c841bbefe
          cancel_if_live 37160753650 "Sync autonomous VPS research state" 1c5ca5cda99845c425f6f04cc5fa459d5085cebe
