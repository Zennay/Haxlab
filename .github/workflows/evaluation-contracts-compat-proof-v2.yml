name: Evaluation validation compatibility v2

on:
  push:
    branches:
      - ops/evaluation-contracts-compat-v2-20261007
    paths:
      - .github/workflows/evaluation-contracts-compat-proof-v2.yml
      - ops/evaluation-contracts-compat-proof-v2.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-evaluation-contracts-compat-v2
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    steps:
      - name: Checkout exact canonical Arena v2
        uses: actions/checkout@v4
        with:
          ref: ee5ab508e9d8504de12b7cbb5fdeca43a58ae1a4
          clean: true
          fetch-depth: 0

      - name: Verify canonical base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ee5ab508e9d8504de12b7cbb5fdeca43a58ae1a4"
          test -z "$(git status --porcelain)"
          echo "HAXLAB_EVALUATION_COMPAT_V2_BASE=$(git rev-parse HEAD)"

      - name: Materialize exact additive validation contracts
        shell: bash
        run: |
          set -euo pipefail
          while read -r sha path; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${sha}"
            fi
            git show "${sha}:${path}" > "${path}"
          done <<'EOF'
          df5184b54c40a0df4f73a2adb1923e8a85e3f87e tests/test_evaluation_no_assert_contract.py
          69646fd0817b162be31add2bf8e87be3cb9b4fc7 tests/test_evaluation_determinism_contract.py
          9e82831b22e000c773284223bfa53a02f116a87f tests/test_evaluation_hermeticity_contract.py
          8d1a1039bd985b1d4860cc219d205e9d2e2fe9e6 tests/test_evaluation_safe_deserialization_contract.py
          c738bad12c1092812ac1d1ad6b9f02d8b3df262c tests/test_evaluation_control_plane_import_contract.py
          17d21965140f61736b16fa9dba23c823346b58d2 tests/test_evaluation_import_purity_contract.py
          be70c0158b8c0aad90166997ef49e19b9bccf4d1 tests/test_evaluation_exception_boundary_contract.py
          9f16cb83e1b3aad9242cf04ead6291b3f40bb982 tests/test_evaluation_global_state_contract.py
          5ab757bd76e2594b82cc936782455be9844a4fba tests/test_evaluation_dynamic_loading_contract.py
          523694b02be5262091ec2d61a8f6b06e4c6fe563 tests/test_evaluation_process_state_contract.py
          87f2b01d6975f5ce90e6a602c2ac1eea77eec887 tests/test_evaluation_process_termination_contract.py
          5445483fc0301d606b3dd831288ca11bd21578cc tests/test_evaluation_background_execution_contract.py
          b9ae444bd437a07667ab80086cc0ff0d22bf4ace tests/test_evaluation_import_cycle_contract.py
          0d75bda2a496a1d84ea9f2b01084fef56d374cff tests/test_evaluation_immutability_bypass_contract.py
          8fa40c0748f6130d2ac3f51be4dda9b5bb0206e8 tests/test_evaluation_liveness_contract.py
          EOF
          sha256sum             tests/test_evaluation_no_assert_contract.py             tests/test_evaluation_determinism_contract.py             tests/test_evaluation_hermeticity_contract.py             tests/test_evaluation_safe_deserialization_contract.py             tests/test_evaluation_control_plane_import_contract.py             tests/test_evaluation_import_purity_contract.py             tests/test_evaluation_exception_boundary_contract.py             tests/test_evaluation_global_state_contract.py             tests/test_evaluation_dynamic_loading_contract.py             tests/test_evaluation_process_state_contract.py             tests/test_evaluation_process_termination_contract.py             tests/test_evaluation_background_execution_contract.py             tests/test_evaluation_import_cycle_contract.py             tests/test_evaluation_immutability_bypass_contract.py             tests/test_evaluation_liveness_contract.py

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-contract-compat-v2-venv
          python3 -m venv .evaluation-contract-compat-v2-venv
          .evaluation-contract-compat-v2-venv/bin/pip install --upgrade pip
          .evaluation-contract-compat-v2-venv/bin/pip install -e '.[dev]'

      - name: Compile canonical evaluation and synthetic contracts
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-contract-compat-v2-venv/bin/python -m compileall -q             src/haxlab/evaluation             tests/test_evaluation_no_assert_contract.py             tests/test_evaluation_determinism_contract.py             tests/test_evaluation_hermeticity_contract.py             tests/test_evaluation_safe_deserialization_contract.py             tests/test_evaluation_control_plane_import_contract.py             tests/test_evaluation_import_purity_contract.py             tests/test_evaluation_exception_boundary_contract.py             tests/test_evaluation_global_state_contract.py             tests/test_evaluation_dynamic_loading_contract.py             tests/test_evaluation_process_state_contract.py             tests/test_evaluation_process_termination_contract.py             tests/test_evaluation_background_execution_contract.py             tests/test_evaluation_import_cycle_contract.py             tests/test_evaluation_immutability_bypass_contract.py             tests/test_evaluation_liveness_contract.py

      - name: Run all additive evaluation validation contracts together
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" .evaluation-contract-compat-v2-venv/bin/pytest -q             tests/test_evaluation_no_assert_contract.py             tests/test_evaluation_determinism_contract.py             tests/test_evaluation_hermeticity_contract.py             tests/test_evaluation_safe_deserialization_contract.py             tests/test_evaluation_control_plane_import_contract.py             tests/test_evaluation_import_purity_contract.py             tests/test_evaluation_exception_boundary_contract.py             tests/test_evaluation_global_state_contract.py             tests/test_evaluation_dynamic_loading_contract.py             tests/test_evaluation_process_state_contract.py             tests/test_evaluation_process_termination_contract.py             tests/test_evaluation_background_execution_contract.py             tests/test_evaluation_import_cycle_contract.py             tests/test_evaluation_immutability_bypass_contract.py             tests/test_evaluation_liveness_contract.py

      - name: Run adjacent canonical Arena v2 regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" .evaluation-contract-compat-v2-venv/bin/pytest -q             tests/test_calibration_gate.py             tests/test_calibration_resume.py             tests/test_closed_loop_arena.py             tests/test_duel_gate.py             tests/test_elite_gate_preflight.py             tests/test_multisource_duel.py             tests/test_multisource_suite.py             tests/test_promotion.py             tests/test_scenario_source.py             tests/test_arena_v2_integration_workflow_contract.py             tests/test_calibration_cross_sha_resume_contract.py             tests/test_calibration_workflow_evidence_contract.py             tests/test_ci_workflow_exact_head_contract.py

      - name: Record compatibility result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_EVALUATION_CONTRACT_STACK_COMPAT_V2=green"
