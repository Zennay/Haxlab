name: FTMO main5335 PR471 queue cleanup
# Registered; this update triggers the cleanup.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-main5335-pr471-queue-cleanup.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-main5335-pr471-queue-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 8
    env:
      MAIN_SHA: 5335e0e17d3a1c35a40698cd2beebebdcdb26f8b
      STALE_SHA: 5594b2a1d310fd967b187ae637296727bfc3a8c7
      STALE_RUNS: "37161062903 37161062966"
      MAIN_VERIFY_RUN: "37161253628"
      MAIN_TEST_RUN: "37161253624"
      FTMO_SERVICE: actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
      FTMO_RUN_USER: ftmo-runner
    steps:
      - name: Prove exact identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          test "$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)" = "$MAIN_SHA"
          test "$(gh api repos/Zennay/Ftmo/pulls/471 --jq .merged)" = "true"
          test "$(gh api repos/Zennay/Ftmo/pulls/471 --jq .head.sha)" = "$STALE_SHA"
          for rid in $STALE_RUNS; do
            test "$(gh api repos/Zennay/Ftmo/actions/runs/$rid --jq .head_sha)" = "$STALE_SHA"
            test "$(gh api repos/Zennay/Ftmo/actions/runs/$rid --jq .event)" = "pull_request"
          done
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$MAIN_VERIFY_RUN --jq .head_sha)" = "$MAIN_SHA"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$MAIN_VERIFY_RUN --jq .event)" = "push"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$MAIN_VERIFY_RUN --jq .name)" = "Verify autonomous VPS runtime"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$MAIN_TEST_RUN --jq .head_sha)" = "$MAIN_SHA"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$MAIN_TEST_RUN --jq .event)" = "push"
          echo "FTMO_MAIN5335_CLEANUP_IDENTITIES=verified"

      - name: Cancel only queued superseded PR-head gates
        shell: bash
        run: |
          set -euo pipefail
          for rid in $STALE_RUNS; do
            status="$(gh api repos/Zennay/Ftmo/actions/runs/$rid --jq .status)"
            conclusion="$(gh api repos/Zennay/Ftmo/actions/runs/$rid --jq '.conclusion // ""')"
            echo "FTMO_STALE_GATE run=$rid status=$status conclusion=$conclusion"
            case "$status" in
              queued|pending)
                gh api --method POST "repos/Zennay/Ftmo/actions/runs/$rid/cancel" >/dev/null
                echo "FTMO_STALE_CANCEL_REQUESTED=$rid"
                ;;
              completed)
                ;;
              in_progress)
                echo "refusing to cancel an already-running stale gate: $rid" >&2
                exit 1
                ;;
              *)
                echo "unexpected stale gate status: $status" >&2
                exit 1
                ;;
            esac
          done
          for _ in $(seq 1 30); do
            active=0
            for rid in $STALE_RUNS; do
              status="$(gh api repos/Zennay/Ftmo/actions/runs/$rid --jq .status)"
              case "$status" in queued|pending) active=1 ;; esac
            done
            [[ "$active" -eq 0 ]] && break
            sleep 4
          done
          for rid in $STALE_RUNS; do
            status="$(gh api repos/Zennay/Ftmo/actions/runs/$rid --jq .status)"
            case "$status" in queued|pending)
              echo "stale queued gate did not retire: $rid" >&2
              exit 1
              ;;
            esac
          done

      - name: Recover dedicated FTMO listener only when idle
        id: listener
        shell: bash
        run: |
          set -euo pipefail
          worker=0
          pgrep -u "$FTMO_RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1 && worker=1 || true
          if [[ "$worker" -eq 1 ]]; then
            action=preserve-active-worker
          else
            sudo -n systemctl reset-failed "$FTMO_SERVICE" || true
            sudo -n systemctl restart "$FTMO_SERVICE"
            action=restart-idle-listener
          fi
          for _ in $(seq 1 30); do
            state="$(systemctl is-active "$FTMO_SERVICE" || true)"
            pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
            if [[ "$state" == "active" && "$pid" =~ ^[1-9][0-9]*$ ]]; then
              break
            fi
            sleep 2
          done
          test "$state" = "active"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "FTMO_LISTENER_ACTION=$action"

      - name: Prove canonical deploy schedules
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            status="$(gh api repos/Zennay/Ftmo/actions/runs/$MAIN_VERIFY_RUN --jq .status)"
            conclusion="$(gh api repos/Zennay/Ftmo/actions/runs/$MAIN_VERIFY_RUN --jq '.conclusion // ""')"
            echo "FTMO_MAIN_VERIFY status=$status conclusion=$conclusion"
            case "$status" in
              in_progress|completed) exit 0 ;;
            esac
            sleep 4
          done
          exit 1

      - name: Persist cleanup receipt
        if: always()
        env:
          LISTENER_ACTION: ${{ steps.listener.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/ftmo-main5335-pr471-queue-cleanup.json
          import json, os, subprocess
          ids=os.environ["STALE_RUNS"].split()+[os.environ["MAIN_VERIFY_RUN"],os.environ["MAIN_TEST_RUN"]]
          runs=[]
          for rid in ids:
              d=json.loads(subprocess.check_output(["gh","api",f"repos/Zennay/Ftmo/actions/runs/{rid}"], text=True))
              runs.append({
                  "run_id":int(rid),
                  "name":d.get("name"),
                  "event":d.get("event"),
                  "status":d.get("status"),
                  "conclusion":d.get("conclusion"),
                  "head_sha":d.get("head_sha"),
              })
          print(json.dumps({
              "scope":"ftmo-main5335-pr471-queue-cleanup",
              "main_sha":os.environ["MAIN_SHA"],
              "stale_sha":os.environ["STALE_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "listener_action":os.environ.get("LISTENER_ACTION"),
              "runs":runs,
          }, sort_keys=True, indent=2))
          PY
          mkdir -p runtime-evidence
          cp /tmp/ftmo-main5335-pr471-queue-cleanup.json runtime-evidence/ftmo-main5335-pr471-queue-cleanup.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/ftmo-main5335-pr471-queue-cleanup.json
          git commit -m "Record FTMO main5335 queue cleanup"
          git push origin HEAD:main
