name: Evaluation RNG-state validation

on:
  push:
    branches:
      - validation/evaluation-rng-state-contract-20261007
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: haxlab-evaluation-rng-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "HAXLAB_EVALUATION_RNG_STATE_HEAD=$(git rev-parse HEAD)"

      - name: Verify candidate is still the live branch head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 {print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "${{ github.sha }}"
          echo "HAXLAB_EVALUATION_RNG_STATE_LIVE_HEAD=$remote_head"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-rng-state-venv
          python3 -m venv .evaluation-rng-state-venv
          .evaluation-rng-state-venv/bin/pip install --upgrade pip
          .evaluation-rng-state-venv/bin/pip install -e '.[dev]'

      - name: Compile evaluation package and contract
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-rng-state-venv/bin/python -m compileall -q             src/haxlab/evaluation             tests/test_evaluation_rng_state_contract.py

      - name: Run RNG-state contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src"             .evaluation-rng-state-venv/bin/pytest -q               tests/test_evaluation_rng_state_contract.py

      - name: Run adjacent canonical evaluation regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src"             .evaluation-rng-state-venv/bin/pytest -q               tests/test_arena_v2_integration_workflow_contract.py               tests/test_calibration_cross_sha_resume_contract.py               tests/test_calibration_gate.py               tests/test_calibration_resume.py               tests/test_calibration_workflow_evidence_contract.py               tests/test_closed_loop_arena.py               tests/test_duel_gate.py               tests/test_elite_gate_preflight.py               tests/test_multisource_duel.py               tests/test_multisource_suite.py               tests/test_promotion.py               tests/test_scenario_source.py

      - name: Record green result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_EVALUATION_RNG_STATE_RESULT=green"

      - name: Publish exact-head proof receipt
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 405,
              body: [
                `Exact-head self-hosted proof: **${success ? "SUCCESS" : "FAILURE"}**`,
                "",
                `- run: \`${context.runId}\``,
                `- exact head: \`${context.sha}\``,
                `- branch: \`${context.ref.replace("refs/heads/", "")}\``,
                `- job status: \`${process.env.JOB_STATUS}\``,
                "- required on success: exact checkout/live-head, compile, focused RNG-state contract, adjacent canonical Arena-v2 regressions",
                "- green marker: `HAXLAB_EVALUATION_RNG_STATE_RESULT=green`",
              ].join("\n"),
            });
