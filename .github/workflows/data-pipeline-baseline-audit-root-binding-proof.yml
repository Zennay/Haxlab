name: HaxLab baseline audit root-binding proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch SHA to prove
        required: true
        type: string
  push:
    branches:
      - feature/data-pipeline-baseline-audit-root-binding-r1-20261007
    paths:
      - "src/haxlab/learning/baseline_audit.py"
      - "tests/test_baseline_audit.py"
      - "docs/bc-baseline-bundle-audit.md"
      - ".github/workflows/data-pipeline-baseline-audit-root-binding-proof.yml"

permissions:
  contents: read

concurrency:
  group: haxlab-baseline-audit-root-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head baseline bundle root binding
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run focused integrity proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .baseline-root-proof-venv
          python3 -m venv .baseline-root-proof-venv
          .baseline-root-proof-venv/bin/pip install -q --upgrade pip
          .baseline-root-proof-venv/bin/pip install -q -e '.[dev]'
          .baseline-root-proof-venv/bin/python -m compileall -q src tests
          .baseline-root-proof-venv/bin/pytest -q \
            tests/test_baseline_audit.py \
            tests/test_data_pipeline_audit_readonly_contract.py \
            tests/test_data_pipeline_audit_determinism_contract.py \
            tests/test_data_pipeline_audit_exception_boundary.py \
            tests/test_data_pipeline_audit_runtime_output_purity_contract.py
          .baseline-root-proof-venv/bin/pytest --collect-only -q >/dev/null
          echo "HAXLAB_BASELINE_AUDIT_ROOT_BINDING_PROOF=success"
