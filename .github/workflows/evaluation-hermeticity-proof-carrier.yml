name: Evaluation hermeticity exact-head carrier

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/evaluation-hermeticity-proof-carrier.yml
      - ops/evaluation-hermeticity-proof-carrier.md

permissions:
  contents: read

concurrency:
  group: haxlab-evaluation-hermeticity-proof-carrier
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    steps:
      - name: Checkout exact evaluation candidate
        uses: actions/checkout@v4
        with:
          ref: 9e82831b22e000c773284223bfa53a02f116a87f
          clean: true
          fetch-depth: 0

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9e82831b22e000c773284223bfa53a02f116a87f"
          echo "HAXLAB_EVALUATION_HERMETICITY_HEAD=$(git rev-parse HEAD)"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-hermeticity-proof-venv
          python3 -m venv .evaluation-hermeticity-proof-venv
          .evaluation-hermeticity-proof-venv/bin/pip install --upgrade pip
          .evaluation-hermeticity-proof-venv/bin/pip install -e '.[dev]'

      - name: Compile evaluation package and contract
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-hermeticity-proof-venv/bin/python -m compileall -q src/haxlab/evaluation tests/test_evaluation_hermeticity_contract.py

      - name: Run hermeticity contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" .evaluation-hermeticity-proof-venv/bin/pytest -q tests/test_evaluation_hermeticity_contract.py

      - name: Verify active resync-guard compatibility
        shell: bash
        run: |
          set -euo pipefail
          git show b9b12c5611872cd85c00ab0850f117c198d0a586:src/haxlab/evaluation/resync_guard.py > src/haxlab/evaluation/resync_guard.py
          PYTHONPATH="$GITHUB_WORKSPACE/src" .evaluation-hermeticity-proof-venv/bin/pytest -q tests/test_evaluation_hermeticity_contract.py
          rm -f src/haxlab/evaluation/resync_guard.py
          echo "HAXLAB_EVALUATION_HERMETICITY_RESYNC84_COMPAT=green"

      - name: Record proof result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_EVALUATION_HERMETICITY_RESULT=green"
