name: Evaluation contract stack compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/evaluation-contracts-compat-proof.yml
      - ops/evaluation-contracts-compat-proof.md

permissions:
  contents: read

concurrency:
  group: haxlab-evaluation-contracts-compat-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    steps:
      - name: Checkout canonical Arena v2
        uses: actions/checkout@v4
        with:
          ref: ee5ab508e9d8504de12b7cbb5fdeca43a58ae1a4
          clean: true
          fetch-depth: 0

      - name: Verify canonical base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ee5ab508e9d8504de12b7cbb5fdeca43a58ae1a4"
          echo "HAXLAB_EVALUATION_COMPAT_BASE=$(git rev-parse HEAD)"

      - name: Materialize exact validation contracts and active resync guard
        shell: bash
        run: |
          set -euo pipefail
          git show df5184b54c40a0df4f73a2adb1923e8a85e3f87e:tests/test_evaluation_no_assert_contract.py > tests/test_evaluation_no_assert_contract.py
          git show 69646fd0817b162be31add2bf8e87be3cb9b4fc7:tests/test_evaluation_determinism_contract.py > tests/test_evaluation_determinism_contract.py
          git show 9e82831b22e000c773284223bfa53a02f116a87f:tests/test_evaluation_hermeticity_contract.py > tests/test_evaluation_hermeticity_contract.py
          git show b9b12c5611872cd85c00ab0850f117c198d0a586:src/haxlab/evaluation/resync_guard.py > src/haxlab/evaluation/resync_guard.py

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-contract-compat-venv
          python3 -m venv .evaluation-contract-compat-venv
          .evaluation-contract-compat-venv/bin/pip install --upgrade pip
          .evaluation-contract-compat-venv/bin/pip install -e '.[dev]'

      - name: Compile synthetic integration
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-contract-compat-venv/bin/python -m compileall -q src/haxlab/evaluation \
            tests/test_evaluation_no_assert_contract.py \
            tests/test_evaluation_determinism_contract.py \
            tests/test_evaluation_hermeticity_contract.py

      - name: Run combined validation contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" .evaluation-contract-compat-venv/bin/pytest -q \
            tests/test_evaluation_no_assert_contract.py \
            tests/test_evaluation_determinism_contract.py \
            tests/test_evaluation_hermeticity_contract.py

      - name: Record compatibility result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_EVALUATION_CONTRACT_STACK_COMPAT=green"
