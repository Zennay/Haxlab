name: Temporary zCloud runner registration probe

on:
  push:
    branches: [ops/zcloud-runner-registration-probe-20260929]
    paths:
      - .github/workflows/zcloud-runner-registration-probe.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: temporary-zcloud-runner-registration-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 8
    steps:
      - name: Check out probe branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Acquire exact zCloud deploylane claim
        shell: bash
        run: |
          set -uo pipefail
          ROOT=/home/ubuntu/zennay-cloud
          TMP_BASE="$(mktemp -d /tmp/zcloud-runner-probe.XXXXXX)"
          CANDIDATE="$TMP_BASE/candidate"
          echo "ZCLOUD_PROBE_TMP_BASE=$TMP_BASE" >> "$GITHUB_ENV"
          echo "ZCLOUD_PROBE_CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
          claim_exit=99
          main_sha=""
          {
            git -C "$ROOT" fetch --prune origin main &&
            main_sha="$(git -C "$ROOT" rev-parse origin/main)" &&
            git -C "$ROOT" worktree add --detach "$CANDIDATE" "$main_sha" &&
            env -u GITHUB_TOKEN python3 "$CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" acquire
          } >/tmp/zcloud-claim-acquire.log 2>&1
          claim_exit=$?
          echo "ZCLOUD_MAIN_SHA=$main_sha" >> "$GITHUB_ENV"
          echo "CLAIM_ACQUIRE_EXIT=$claim_exit" >> "$GITHUB_ENV"
          if [[ "$claim_exit" == "0" ]]; then
            echo "CLAIM_ACQUIRED=yes" >> "$GITHUB_ENV"
          else
            echo "CLAIM_ACQUIRED=no" >> "$GITHUB_ENV"
          fi
          sed -E 's/(token|authorization|secret)[^ ]*/[redacted]/Ig' /tmp/zcloud-claim-acquire.log | tail -n 30
          exit 0

      - name: Diagnose permanent native zCloud runner route
        shell: bash
        run: |
          set -euo pipefail
          native_units="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '/actions\.runner\.Zennay-zCloud|actions\.runner\.Zennay-zcloud/ {print $1}' | paste -sd, - || true)"
          runner_roots="$(find /home/ubuntu -maxdepth 3 -type f -name .runner -printf '%h\n' 2>/dev/null | sort -u | paste -sd, - || true)"
          echo "NATIVE_UNITS=$native_units" >> "$GITHUB_ENV"
          echo "RUNNER_ROOTS=$runner_roots" >> "$GITHUB_ENV"

          gh_authenticated=no
          gh_reg_available=no
          if command -v gh >/dev/null 2>&1 && gh auth status >/dev/null 2>&1; then
            gh_authenticated=yes
            if gh api -X POST repos/Zennay/zCloud/actions/runners/registration-token --silent >/tmp/zcloud-native-registration-token.json 2>/dev/null; then
              python3 - <<'PY'
import json
p=json.load(open("/tmp/zcloud-native-registration-token.json"))
assert isinstance(p.get("token"), str) and p["token"]
PY
              gh_reg_available=yes
            fi
          fi
          rm -f /tmp/zcloud-native-registration-token.json
          echo "GH_AUTHENTICATED=$gh_authenticated" >> "$GITHUB_ENV"
          echo "GH_REG_AVAILABLE=$gh_reg_available" >> "$GITHUB_ENV"

          code="$(curl -sS -o /tmp/zcloud-registration-response.json -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${{ github.token }}"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/Zennay/zCloud/actions/runners/registration-token || true)"
          rm -f /tmp/zcloud-registration-response.json
          echo "WORKFLOW_TOKEN_HTTP=$code" >> "$GITHUB_ENV"

          curl -fsS             -H "Accept: application/vnd.github+json"             -H "User-Agent: zcloud-runner-probe"             "https://api.github.com/repos/Zennay/zCloud/actions/workflows/zcloud-vps-execution-probe.yml/runs?per_page=5"             -o /tmp/zcloud-native-runs.json

      - name: Verify exact zCloud deploylane claim
        shell: bash
        run: |
          set +e
          verify_exit=99
          if [[ "${CLAIM_ACQUIRED:-no}" == "yes" && -f "$ZCLOUD_PROBE_CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" ]]; then
            env -u GITHUB_TOKEN python3 "$ZCLOUD_PROBE_CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" verify >/tmp/zcloud-claim-verify.log 2>&1
            verify_exit=$?
          fi
          echo "CLAIM_VERIFY_EXIT=$verify_exit" >> "$GITHUB_ENV"
          if [[ "$verify_exit" == "0" ]]; then
            echo "CLAIM_VERIFIED=yes" >> "$GITHUB_ENV"
          else
            echo "CLAIM_VERIFIED=no" >> "$GITHUB_ENV"
          fi
          [[ ! -f /tmp/zcloud-claim-verify.log ]] || tail -n 20 /tmp/zcloud-claim-verify.log
          exit 0

      - name: Persist sanitized VPS diagnostic receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          python3 - <<'PY'
import json, os, subprocess
from datetime import datetime, timezone

units=[x for x in os.environ.get("NATIVE_UNITS","").split(",") if x]
unit_states={}
for unit in units:
    p=subprocess.run(["systemctl","is-active",unit],text=True,capture_output=True)
    unit_states[unit]=(p.stdout or p.stderr).strip() or "unknown"

try:
    runs=json.load(open("/tmp/zcloud-native-runs.json"))
except Exception:
    runs={}
recent=[]
for run in runs.get("workflow_runs",[])[:5]:
    recent.append({
        "id":run.get("id"),
        "status":run.get("status"),
        "conclusion":run.get("conclusion"),
        "head_sha":run.get("head_sha"),
        "event":run.get("event"),
        "created_at":run.get("created_at"),
    })

receipt={
    "event":"ZCLOUD_NATIVE_RUNNER_DIAGNOSTIC",
    "recorded_at":datetime.now(timezone.utc).isoformat(),
    "haxlab_workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
    "haxlab_commit":os.environ.get("GITHUB_SHA"),
    "host":subprocess.check_output(["hostname"],text=True).strip(),
    "zcloud_main_sha":os.environ.get("ZCLOUD_MAIN_SHA"),
    "claim_key":"cloud-permanent-vps-first-deploylane",
    "worker_id":"cloud::w1",
    "claim_acquire_exit":os.environ.get("CLAIM_ACQUIRE_EXIT"),
    "claim_acquired":os.environ.get("CLAIM_ACQUIRED")=="yes",
    "claim_verify_exit":os.environ.get("CLAIM_VERIFY_EXIT"),
    "claim_verified":os.environ.get("CLAIM_VERIFIED")=="yes",
    "native_runner_units":units,
    "native_runner_unit_states":unit_states,
    "runner_roots":[x for x in os.environ.get("RUNNER_ROOTS","").split(",") if x],
    "gh_authenticated":os.environ.get("GH_AUTHENTICATED")=="yes",
    "gh_registration_token_available":os.environ.get("GH_REG_AVAILABLE")=="yes",
    "workflow_token_registration_http":os.environ.get("WORKFLOW_TOKEN_HTTP"),
    "recent_native_probe_runs":recent,
}
open("ops/zcloud-runner-registration-probe-receipt.json","w").write(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
print(json.dumps(receipt,sort_keys=True))
PY
          git config user.name "zCloud VPS probe"
          git config user.email "actions@users.noreply.github.com"
          git add ops/zcloud-runner-registration-probe-receipt.json
          git commit -m "Record native zCloud runner diagnostic receipt"
          git push origin HEAD:ops/zcloud-runner-registration-probe-20260929

      - name: Release exact zCloud deploylane claim
        if: always()
        shell: bash
        run: |
          if [[ -n "${ZCLOUD_PROBE_CANDIDATE:-}" && -f "$ZCLOUD_PROBE_CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" ]]; then
            env -u GITHUB_TOKEN python3 "$ZCLOUD_PROBE_CANDIDATE/scripts/zcloud_vps_deploylane_coordination.py" release || true
          fi
          if [[ -n "${ZCLOUD_PROBE_CANDIDATE:-}" && -d "$ZCLOUD_PROBE_CANDIDATE" ]]; then
            git -C /home/ubuntu/zennay-cloud worktree remove --force "$ZCLOUD_PROBE_CANDIDATE" >/dev/null 2>&1 || true
          fi
          [[ -z "${ZCLOUD_PROBE_TMP_BASE:-}" ]] || rm -rf "$ZCLOUD_PROBE_TMP_BASE"

      - name: Fail probe if coordination was not exact
        if: always()
        shell: bash
        run: |
          test "${CLAIM_ACQUIRED:-no}" = "yes"
          test "${CLAIM_VERIFIED:-no}" = "yes"
