name: Temporary zCloud runner registration probe

on:
  push:
    branches: [ops/zcloud-runner-registration-probe-20260929]
    paths:
      - .github/workflows/zcloud-runner-registration-probe.yml

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5
    steps:
      - name: Check zCloud runner registration API access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/zcloud-registration-response.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Zennay/zCloud/actions/runners/registration-token)"
          case "$code" in
            201) echo "ZCLOUD_RUNNER_REGISTRATION_TOKEN_AVAILABLE" ;;
            *) echo "ZCLOUD_RUNNER_REGISTRATION_TOKEN_UNAVAILABLE http=$code"; cat /tmp/zcloud-registration-response.json; exit 1 ;;
          esac
