name: Closed-loop Arena native numeric validation

on:
  push:
    branches:
      - validation/closed-loop-native-numeric-evidence-20261006
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-closed-loop-native-numeric-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify exact validation checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "closed-loop native-numeric checkout mismatch: $actual_sha != $EXPECTED_SHA" >&2
            exit 1
          fi
          echo "CLOSED_LOOP_NATIVE_NUMERIC_EXACT_SHA=$actual_sha"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .closed-loop-native-numeric-venv
          python3 -m venv .closed-loop-native-numeric-venv
          .closed-loop-native-numeric-venv/bin/pip install --upgrade pip
          .closed-loop-native-numeric-venv/bin/pip install -e '.[dev]'

      - name: Compile gate, regressions and provenance contract
        shell: bash
        run: |
          set -euo pipefail
          .closed-loop-native-numeric-venv/bin/python -m compileall -q \
            src/haxlab/evaluation/closed_loop_arena.py \
            tests/test_closed_loop_arena.py \
            tests/test_closed_loop_native_numeric_workflow_provenance_contract.py

      - name: Run workflow provenance contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .closed-loop-native-numeric-venv/bin/pytest -q \
              tests/test_closed_loop_native_numeric_workflow_provenance_contract.py

      - name: Run Arena and adjacent evaluation regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .closed-loop-native-numeric-venv/bin/pytest -q \
              tests/test_closed_loop_arena.py \
              tests/test_duel_gate.py \
              tests/test_multisource_duel.py

      - name: Record exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "CLOSED_LOOP_NATIVE_NUMERIC_HEAD=$(git rev-parse HEAD)"
          echo "CLOSED_LOOP_NATIVE_NUMERIC_RESULT=green"
