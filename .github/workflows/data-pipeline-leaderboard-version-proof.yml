name: Data-pipeline leaderboard version exact-head proof

on:
  pull_request:
    branches:
      - main
    paths:
      - src/haxlab/skill/leaderboard.py
      - tests/test_skill_leaderboard.py
      - docs/leaderboard-analysis-version-contract.md
      - .github/workflows/data-pipeline-leaderboard-version-proof.yml
  push:
    branches:
      - feature/data-pipeline-leaderboard-version-contract-20261007
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pipeline-leaderboard-version-exact-head
  cancel-in-progress: true

jobs:
  proof:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[leaderboard-version-proof]')
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify immutable checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run leaderboard to manifest contract proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-leaderboard-version-proof
          .venv-leaderboard-version-proof/bin/python -m pip install -q -e ".[dev]"
          .venv-leaderboard-version-proof/bin/python -m py_compile src/haxlab/skill/leaderboard.py src/haxlab/learning/selector.py
          .venv-leaderboard-version-proof/bin/python -m pytest -q tests/test_skill_leaderboard.py tests/test_training_selector.py
          .venv-leaderboard-version-proof/bin/python -m pytest --collect-only -q >"$RUNNER_TEMP/haxlab-leaderboard-version-$GITHUB_RUN_ID.collect"
          test -s "$RUNNER_TEMP/haxlab-leaderboard-version-$GITHUB_RUN_ID.collect"
          echo "HAXLAB_LEADERBOARD_VERSION_PROOF=success"
