name: One-shot verify zCloud autonomy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zcloud-autonomy-deploy.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-zcloud-autonomy-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: control

      - name: Probe live zCloud autonomy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8765/api/autonomy > /tmp/zcloud-autonomy.json
          curl -fsS http://127.0.0.1:8765/api/runner-targets > /tmp/zcloud-runner-targets.json
          curl -fsS http://127.0.0.1:8765/api/status > /tmp/zcloud-status.json
          python3 -c 'import json; a=json.load(open("/tmp/zcloud-autonomy.json"))["projects"]; r=json.load(open("/tmp/zcloud-runner-targets.json"))["projects"]; s=json.load(open("/tmp/zcloud-status.json")); expected={"cloud":"zcloud_stopgate","haxlab":"haxlab_status","ftmo":"ftmo_status","ulab":"external_gate","supa":"ai_worker","raiseai":"ai_worker","zssh":"ai_worker"}; [(_ for _ in ()).throw(AssertionError((k,a.get(k)))) for k,v in expected.items() if a.get(k,{}).get("mode")!=v]; assert a["ulab"]["allow_ai"] is False; assert all(a[k].get("runtime") is not None for k in ("cloud","haxlab","ftmo","supa","raiseai","zssh")); assert s["chatgpt_firefox"]["active"] is True; assert all(t.get("auto_continue") is False for t in r.values() if t.get("base_project_id")=="ulab")'

      - name: Publish final live proof
        shell: bash
        env:
          ZCLOUD_SHA: 2a93899cfc96232543028b4ba7e18a45a33d0976
        run: |
          set -euo pipefail
          python3 -c 'import json,os; from datetime import datetime,timezone; a=json.load(open("/tmp/zcloud-autonomy.json"))["projects"]; r=json.load(open("/tmp/zcloud-runner-targets.json"))["projects"]; s=json.load(open("/tmp/zcloud-status.json")); out={"verified_at":datetime.now(timezone.utc).isoformat(),"zcloud_sha":os.environ["ZCLOUD_SHA"],"firefox":{"state":s["chatgpt_firefox"]["state"],"active":s["chatgpt_firefox"]["active"]},"autonomy":{k:{"mode":v.get("mode"),"allow_ai":v.get("allow_ai"),"reason":v.get("reason"),"runtime":v.get("runtime")} for k,v in a.items()},"workers":{k:{"base_project_id":v.get("base_project_id"),"worker_slot":v.get("worker_slot"),"active":v.get("active"),"desired_state":v.get("desired_state"),"auto_continue":v.get("auto_continue"),"delay":v.get("auto_continue_delay_seconds")} for k,v in r.items()}}; open("control/zcloud-autonomy-deploy-result.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\\n")'
          git -C control config user.name "zCloud deployment bridge"
          git -C control config user.email "actions@users.noreply.github.com"
          git -C control add zcloud-autonomy-deploy-result.json
          git -C control commit -m "Record verified zCloud autonomy state" || true
          git -C control push origin HEAD:main
