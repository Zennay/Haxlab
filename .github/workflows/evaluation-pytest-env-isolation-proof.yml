name: Evaluation pytest environment isolation proof

on:
  push:
    branches:
      - validation/evaluation-pytest-env-isolation-20261007
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character candidate SHA to validate
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: haxlab-evaluation-pytest-env-isolation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20

    steps:
      - name: Validate requested SHA
        id: requested
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.requested.outputs.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact checkout and live branch head
        shell: bash
        env:
          REQUESTED_SHA: ${{ steps.requested.outputs.sha }}
          VALIDATION_BRANCH: validation/evaluation-pytest-env-isolation-20261007
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$VALIDATION_BRANCH" | awk 'NR == 1 {print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$REQUESTED_SHA"
          echo "HAXLAB_EVALUATION_PYTEST_ENV_HEAD=$REQUESTED_SHA"

      - name: Create isolated proof environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-pytest-env-proof-venv
          python3 -m venv .evaluation-pytest-env-proof-venv
          .evaluation-pytest-env-proof-venv/bin/pip install --upgrade pip
          .evaluation-pytest-env-proof-venv/bin/pip install -e '.[dev]'

      - name: Compile focused contract
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-pytest-env-proof-venv/bin/python -m py_compile tests/test_evaluation_pytest_env_isolation_contract.py

      - name: Run focused environment-isolation contract
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-pytest-env-proof-venv/bin/pytest -q tests/test_evaluation_pytest_env_isolation_contract.py

      - name: Record green result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_EVALUATION_PYTEST_ENV_ISOLATION_RESULT=green"

      - name: Publish exact-head proof receipt
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          REQUESTED_SHA: ${{ steps.requested.outputs.sha }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 460,
              body: [
                `Exact-head self-hosted proof: **${success ? "SUCCESS" : "FAILURE"}**`,
                "",
                `- run: \`${context.runId}\``,
                `- exact head: \`${process.env.REQUESTED_SHA}\``,
                `- job status: \`${process.env.JOB_STATUS}\``,
                "- required on success: exact checkout/live-head, isolated proof venv, compile, focused workflow contract",
                "- green marker: `HAXLAB_EVALUATION_PYTEST_ENV_ISOLATION_RESULT=green`",
                "",
                "Validation evidence only; does not authorize Arena merge or champion promotion.",
              ].join("\n"),
            });
