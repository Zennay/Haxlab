name: HaxLab daemon timing contract proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch SHA to prove
        required: true
        type: string
  push:
    branches:
      - feature/data-pipeline-daemon-cli-timing-current-main-20261007
    paths:
      - "src/haxlab/runtime/daemon.py"
      - "tests/test_runtime_daemon_timing.py"
      - "docs/runtime-daemon-timing-contract.md"
      - ".github/workflows/data-pipeline-daemon-timing-proof.yml"

permissions:
  contents: read

concurrency:
  group: haxlab-daemon-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head daemon timing contract
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run focused proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .daemon-timing-venv
          python3 -m venv .daemon-timing-venv
          .daemon-timing-venv/bin/pip install -q --upgrade pip
          .daemon-timing-venv/bin/pip install -q -e '.[dev]'
          .daemon-timing-venv/bin/python -m compileall -q src tests
          .daemon-timing-venv/bin/pytest -q \
            tests/test_runtime_daemon_timing.py \
            tests/test_runtime_scanner.py \
            tests/test_data_pipeline_service_contract.py
          .daemon-timing-venv/bin/pytest --collect-only -q >/dev/null
          echo "HAXLAB_DAEMON_TIMING_PROOF=success"
