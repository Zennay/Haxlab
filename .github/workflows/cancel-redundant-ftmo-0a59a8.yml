name: Cancel redundant FTMO 0a59a8 finalizers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-redundant-ftmo-0a59a8.yml"

permissions:
  contents: read

jobs:
  cancel:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5
    steps:
      - name: Cancel only exact redundant finalizer runs
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          python3 - <<'PY'
          import json
          import subprocess

          targets = [
              ("Zennay/zCloud", 36998260491, "Finalize FTMO queue item 0a59a8", "34e1ea17be4992aa0405835df317fb22fd79867a"),
              ("Zennay/zCloud", 36998442327, "Finalize FTMO queue item 0a59a8", "66cd8304eec38590ee256d5fefeaed31a11b5e5e"),
              ("Zennay/zSSH", 36998633003, "Finalize FTMO queue item 0a59a8 via zSSH", "be552b50eee065233d88508aad32ccd15d4fc4b8"),
              ("Zennay/zSSH", 36998692930, "Finalize FTMO queue item 0a59a8 via HaxLab runner", "9984daaeba3cdf5c3b38ca81ed3cbac5b48a6a4d"),
          ]

          def gh_json(repo, run_id):
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/actions/runs/{run_id}"],
                  text=True,
              )
              return json.loads(raw)

          for repo, run_id, expected_name, expected_sha in targets:
              run = gh_json(repo, run_id)
              identity = {
                  "repo": repo,
                  "run_id": run_id,
                  "name": run.get("name"),
                  "head_sha": run.get("head_sha"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
              }
              print("REDUNDANT_FINALIZER_CHECK", json.dumps(identity, sort_keys=True))
              if run.get("name") != expected_name or run.get("head_sha") != expected_sha:
                  raise RuntimeError(f"identity mismatch for {repo} run {run_id}")
              if run.get("status") in {"queued", "in_progress", "waiting", "pending", "requested"}:
                  subprocess.check_call(
                      ["gh", "api", "--method", "POST", f"repos/{repo}/actions/runs/{run_id}/cancel"]
                  )
                  print(f"REDUNDANT_FINALIZER_CANCEL_REQUESTED={repo}#{run_id}")
              else:
                  print(f"REDUNDANT_FINALIZER_ALREADY_TERMINAL={repo}#{run_id}")
          PY
