name: Scenario source strict selector config validation

on:
  push:
    branches:
      - validation/scenario-source-strict-selector-config-20261007
  pull_request:
    branches:
      - feature/arena-v2-current-main-20261004
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-scenario-source-strict-config-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          clean: true
          fetch-depth: 0

      - name: Verify exact live head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          live="$(git ls-remote --heads origin "refs/heads/$EXPECTED_REF" | awk 'NR == 1 {print $1}')"
          test -n "$live"
          test "$live" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          echo "HAXLAB_SCENARIO_SOURCE_STRICT_CONFIG_HEAD=$live"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .scenario-source-strict-config-venv
          python3 -m venv .scenario-source-strict-config-venv
          .scenario-source-strict-config-venv/bin/pip install --upgrade pip
          .scenario-source-strict-config-venv/bin/pip install -e '.[dev]'

      - name: Compile changed evaluation surface
        shell: bash
        run: |
          set -euo pipefail
          .scenario-source-strict-config-venv/bin/python -m compileall -q             src/haxlab/evaluation/scenario_source.py             tests/test_scenario_source.py

      - name: Run focused scenario-source regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" .scenario-source-strict-config-venv/bin/pytest -q             tests/test_scenario_source.py

      - name: Run adjacent evaluation regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" .scenario-source-strict-config-venv/bin/pytest -q             tests/test_multisource_suite.py             tests/test_multisource_duel.py             tests/test_calibration_resume.py

      - name: Record proof result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_SCENARIO_SOURCE_STRICT_SELECTOR_RESULT=green"
