name: Data-pipeline ingestion output-purity proof

on:
  push:
    branches:
      - validation/data-pipeline-ingestion-output-purity-20261007
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-data-pipeline-ingestion-output-purity-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "HAXLAB_INGESTION_OUTPUT_PURITY_HEAD=$(git rev-parse HEAD)"

      - name: Verify candidate is still the live branch head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 {print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "${{ github.sha }}"
          echo "HAXLAB_INGESTION_OUTPUT_PURITY_LIVE_HEAD=$remote_head"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .data-pipeline-ingestion-output-purity-venv
          python3 -m venv .data-pipeline-ingestion-output-purity-venv
          .data-pipeline-ingestion-output-purity-venv/bin/pip install --upgrade pip
          .data-pipeline-ingestion-output-purity-venv/bin/pip install -e '.[dev]'

      - name: Compile repository Python
        shell: bash
        run: |
          set -euo pipefail
          .data-pipeline-ingestion-output-purity-venv/bin/python -m compileall -q src tests

      - name: Run focused ingestion output-purity contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .data-pipeline-ingestion-output-purity-venv/bin/pytest -q \
              tests/test_ingestion_runtime_output_purity_contract.py

      - name: Run adjacent ingestion regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .data-pipeline-ingestion-output-purity-venv/bin/pytest -q \
              tests/test_reports.py \
              tests/test_matcher.py \
              tests/test_pipeline.py \
              tests/test_source_bundle_receipt.py \
              tests/test_source_bundle_verify.py

      - name: Record green result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_INGESTION_OUTPUT_PURITY_RESULT=green"
