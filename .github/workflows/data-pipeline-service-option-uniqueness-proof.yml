name: HaxLab data-pipeline service option uniqueness proof

on:
  pull_request:
    branches: [main]
    paths:
      - tests/test_data_pipeline_service_option_uniqueness.py
      - docs/data-pipeline-service-option-uniqueness.md
      - .github/workflows/data-pipeline-service-option-uniqueness-proof.yml

permissions:
  contents: read

concurrency:
  group: haxlab-service-unique-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-only-uniqueness:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          persist-credentials: false
      - name: Prove exact PR head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Validate option uniqueness and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .service-unique-venv
          .service-unique-venv/bin/python -m pip install -q -e '.[dev]'
          .service-unique-venv/bin/python -m compileall -q tests/test_data_pipeline_service_option_uniqueness.py
          .service-unique-venv/bin/python -m pytest -q tests/test_data_pipeline_service_option_uniqueness.py
