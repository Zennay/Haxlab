name: FTMO PR464 exact-head provider ancestor proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr464-exact-head-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr464-exact-head-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 18
    env:
      TARGET_SHA: c60d70fbfad4b77fdbf61370912d1742c14fc209
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Fetch exact FTMO PR464 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr464-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"

      - name: Install isolated environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr464-proof"
          venv="$RUNNER_TEMP/ftmo-pr464-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Prove provider ancestor integrity
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr464-proof"
          venv="$RUNNER_TEMP/ftmo-pr464-venv"
          cd "$src"
          "$venv/bin/python" -m compileall -q src/prop_trading_ai/research/provider_validation.py
          "$venv/bin/python" -m pytest -q             tests/test_provider_validation_ancestor_integrity.py             tests/test_provider_validation_json_integrity.py             tests/test_provider_validation.py

      - name: Prove adjacent provider-foundation safety
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr464-proof"
          venv="$RUNNER_TEMP/ftmo-pr464-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q             tests/test_provider_foundation_publication.py             tests/test_autonomous_provider_retry.py             tests/test_zero_cost_workflow_boundary.py

      - name: Collect full exact-head suite
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr464-proof"
          venv="$RUNNER_TEMP/ftmo-pr464-venv"
          cd "$src"
          "$venv/bin/python" -m pytest --collect-only -q >"$RUNNER_TEMP/ftmo-pr464-collect.txt"
          tail -n 2 "$RUNNER_TEMP/ftmo-pr464-collect.txt"

      - name: Persist sanitized proof receipt
        if: always()
        shell: bash
        env:
          PROOF_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr464-proof-${GITHUB_RUN_ID}.json"
          python3 - <<'PY' > "$receipt"
          import json, os, socket
          print(json.dumps({
              "project":"ftmo",
              "queue_id":"ftmo-dbed0545ffd3cec5",
              "pr":464,
              "target_sha":os.environ["TARGET_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "runner_host":socket.gethostname(),
              "result":os.environ["PROOF_RESULT"],
              "paid_cloud_budget_usd":os.environ["FTMO_AUTONOMOUS_CLOUD_BUDGET_USD"],
              "proof":["exact-sha-checkout","isolated-install","provider-validation-compile","provider-ancestor-regressions","provider-validation-compatibility","provider-foundation-publication","autonomous-provider-retry","zero-cost-boundary","full-suite-collection"]
          },sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr464-haxlab-proof-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/Haxlab/contents/$path"             -f message="Record FTMO PR464 HaxLab exact-head proof ${GITHUB_RUN_ID}"             -f content="$encoded" >/dev/null
# trigger: worker1-pr464
