name: zSSH universal routing proof

on:
  push:
    branches:
      - ops/zssh-universal-routing-proof-20261003
    paths:
      - .github/workflows/zssh-universal-routing-proof-20261003.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    env:
      ZSSH_TARGET_SHA: 3629cb37484f44e81bd15444b25bac732799ccd1
    steps:
      - name: Verify VPS host
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"
          echo "ZSSH_ROUTING_HOST=$(hostname)"
      - name: Checkout exact zSSH head
        uses: actions/checkout@v4
        with:
          repository: Zennay/zSSH
          ref: ${{ env.ZSSH_TARGET_SHA }}
          path: zssh-proof
          fetch-depth: 1
      - name: Prove exact checkout
        shell: bash
        working-directory: zssh-proof
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ZSSH_TARGET_SHA"
          echo "ZSSH_ROUTING_EXACT_HEAD=$ZSSH_TARGET_SHA"
      - name: Install dependencies
        working-directory: zssh-proof
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run routing tests
        working-directory: zssh-proof
        run: node --test test/target-routing.test.mjs test/pairing.test.mjs
      - name: Run full zSSH suite
        working-directory: zssh-proof
        run: npm test
      - name: Prove no target URL enters routing registry
        shell: bash
        working-directory: zssh-proof
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { TargetSessionRegistry } from "./target-routing.mjs";
          const sessions = new TargetSessionRegistry();
          sessions.register({
            targetId: "zt_runtime1234",
            sessionId: "sess_runtimeproof123",
            transport: async () => ({ ok: true }),
          });
          const snapshot = JSON.stringify(sessions.snapshot());
          if (/https?:\/\/|ssh|secret|transport/i.test(snapshot)) {
            throw new Error("routing snapshot leaked transport/credential data");
          }
          console.log("ZSSH_UNIVERSAL_ROUTING_GREEN=1");
          NODE
