name: FTMO PR456 post-merge deploy unblock

on:
  push:
    branches:
      - worker/ftmo-pr456-observer-proof
    paths:
      - ".github/workflows/ftmo-pr456-observer-proof.yml"

permissions:
  contents: read

concurrency:
  group: ftmo-pr456-postmerge-unblock
  cancel-in-progress: true

jobs:
  unblock:
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      MERGE_SHA: 325cc2524596a6c936ee24c5f384a23a2965d721
      PR_HEAD: c7587dec3e826585870d22a59265d33ebdbdff6d
    steps:
      - name: Cancel only merged PR456 head runs
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1

          pr="$(gh api repos/Zennay/Ftmo/pulls/456)"
          merged="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print("yes" if d.get("merged_at") else "no")' <<<"$pr")"
          head="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("head") or {}).get("sha") or "")' <<<"$pr")"
          test "$merged" = yes
          test "$head" = "$PR_HEAD"

          python3 - <<'PY'
          import json
          import os
          import subprocess

          head = os.environ["PR_HEAD"]
          raw = subprocess.check_output(
              ["gh","api",f"repos/Zennay/Ftmo/actions/runs?head_sha={head}&per_page=100"],
              text=True,
          )
          runs = json.loads(raw).get("workflow_runs", [])
          for run in runs:
              if run.get("status") not in {"queued","in_progress","pending","waiting"}:
                  continue
              run_id = int(run["id"])
              subprocess.run(
                  ["gh","api","--method","POST",f"repos/Zennay/Ftmo/actions/runs/{run_id}/cancel"],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              print(f"cancelled_merged_pr456_run={run_id}:{run.get('name')}")
          PY

      - name: Dispatch fresh current-main runtime verification
        shell: bash
        run: |
          set -euo pipefail
          live_main="$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)"
          test "$live_main" = "$MERGE_SHA"
          before="$(gh api 'repos/Zennay/Ftmo/actions/workflows/deploy-autonomous-vps.yml/runs?event=workflow_dispatch&per_page=20')"
          before_ids="$(python3 -c 'import json,sys; print(" ".join(str(x["id"]) for x in json.load(sys.stdin).get("workflow_runs",[])))' <<<"$before")"
          gh workflow run deploy-autonomous-vps.yml --repo Zennay/Ftmo --ref main

          found=""
          for _ in $(seq 1 30); do
            sleep 2
            runs="$(gh api 'repos/Zennay/Ftmo/actions/workflows/deploy-autonomous-vps.yml/runs?event=workflow_dispatch&per_page=20')"
            found="$(BEFORE="$before_ids" EXPECTED="$MERGE_SHA" python3 -c '
          import json,os,sys
          before=set(os.environ.get("BEFORE","").split())
          expected=os.environ["EXPECTED"]
          for run in json.load(sys.stdin).get("workflow_runs",[]):
              if str(run.get("id")) not in before and run.get("head_sha")==expected:
                  print(run["id"])
                  break
          ' <<<"$runs")"
            test -n "$found" && break
          done
          test -n "$found"
          echo "FTMO_FRESH_DEPLOY_RUN_ID=$found"
