name: HaxLab data-pipeline finite service config proof

on:
  push:
    branches:
      - validation/data-pipeline-service-finite-values-20261012
    paths:
      - tests/test_data_pipeline_service_contract.py
      - docs/data-pipeline-service-finite-values.md
      - .github/workflows/data-pipeline-service-finite-proof.yml

permissions:
  contents: read

concurrency:
  group: haxlab-service-finite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-proof:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout immutable push head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
      - name: Verify exact head before installing or reading evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run source-only finite service contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .service-finite-venv
          .service-finite-venv/bin/python -m pip install -q -e '.[dev]'
          .service-finite-venv/bin/python -m compileall -q tests/test_data_pipeline_service_contract.py
          .service-finite-venv/bin/python -m pytest -q tests/test_data_pipeline_service_contract.py
