name: Recover FTMO runner for e536 runtime gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftmo-e536-runtime-gates-runner-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 6
    env:
      MAIN_SHA: e5363979dd40097ede98234554ed49b262514fa1
      SYNC_RUN: '37171444603'
      VERIFY_RUN: '37171446075'
      FTMO_SERVICE: actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
      FTMO_RUN_USER: ftmo-runner
    steps:
      - name: Recover idle FTMO listener with exact-main guards
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          test "$(gh api repos/Zennay/Ftmo/branches/main --jq .commit.sha)" = "$MAIN_SHA"

          test "$(gh api repos/Zennay/Ftmo/actions/runs/$SYNC_RUN --jq .head_sha)" = "$MAIN_SHA"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$VERIFY_RUN --jq .head_sha)" = "$MAIN_SHA"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$SYNC_RUN --jq .name)" = "Sync research state to VPS"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$VERIFY_RUN --jq .name)" = "Verify autonomous VPS runtime"

          pre_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
          pre_pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
          worker=0
          pgrep -u "$FTMO_RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1 && worker=1 || true
          listener=0
          if [[ "$pre_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$pre_pid/cmdline"; then
            cmd="$(tr '\0' ' ' < "/proc/$pre_pid/cmdline")"
            [[ "$cmd" == *"Runner.Listener"* || "$cmd" == *"runsvc.sh"* ]] && listener=1 || true
          fi
          echo "FTMO_RUNNER_PRE state=$pre_state pid=$pre_pid worker=$worker listener=$listener"

          if [[ "$worker" -eq 1 ]]; then
            action=preserve-active-worker
          else
            sudo -n systemctl reset-failed "$FTMO_SERVICE" || true
            sudo -n systemctl restart "$FTMO_SERVICE"
            action=restart-idle-listener
          fi

          post_state=""
          post_pid=""
          for _ in $(seq 1 30); do
            post_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
            post_pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
            if [[ "$post_state" == active && "$post_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$post_pid/cmdline"; then
              post_cmd="$(tr '\0' ' ' < "/proc/$post_pid/cmdline")"
              [[ "$post_cmd" == *"Runner.Listener"* || "$post_cmd" == *"runsvc.sh"* ]] && break
            fi
            sleep 2
          done
          test "$post_state" = active
          [[ "$post_pid" =~ ^[1-9][0-9]*$ ]]
          echo "FTMO_RUNNER_RECOVERY_ACTION=$action"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Prove protected e536 gate leaves queue
        shell: bash
        run: |
          set -euo pipefail
          started=""
          for _ in $(seq 1 48); do
            sync_status="$(gh api repos/Zennay/Ftmo/actions/runs/$SYNC_RUN --jq .status)"
            verify_status="$(gh api repos/Zennay/Ftmo/actions/runs/$VERIFY_RUN --jq .status)"
            echo "FTMO_E536_GATES sync=$sync_status verify=$verify_status"
            if [[ "$sync_status" == in_progress || "$sync_status" == completed ]]; then
              started="$SYNC_RUN"
              break
            fi
            if [[ "$verify_status" == in_progress || "$verify_status" == completed ]]; then
              started="$VERIFY_RUN"
              break
            fi
            sleep 5
          done
          test -n "$started"
          echo "FTMO_E536_SCHEDULING_GREEN=$started"

      - name: Persist recovery receipt
        if: always()
        env:
          RECOVERY_ACTION: ${{ steps.recover.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/ftmo-e536-runner-recovery.json
          import json, os, subprocess
          runs=[]
          for key in ("SYNC_RUN","VERIFY_RUN"):
              rid=os.environ[key]
              d=json.loads(subprocess.check_output(["gh","api",f"repos/Zennay/Ftmo/actions/runs/{rid}"],text=True))
              runs.append({
                  "run_id":int(rid),
                  "name":d.get("name"),
                  "status":d.get("status"),
                  "conclusion":d.get("conclusion"),
                  "head_sha":d.get("head_sha"),
              })
          print(json.dumps({
              "scope":"ftmo-e536-runtime-gates-runner-recovery",
              "main_sha":os.environ["MAIN_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "recovery_action":os.environ.get("RECOVERY_ACTION"),
              "protected_runs":runs,
          },sort_keys=True,indent=2))
          PY
          encoded="$(base64 -w0 /tmp/ftmo-e536-runner-recovery.json)"
          dest="runtime-evidence/ftmo-e536-runtime-gates-runner-recovery-$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/Zennay/Haxlab/contents/$dest"             -f message="Record FTMO e536 runtime-gate runner recovery $GITHUB_RUN_ID"             -f content="$encoded" >/dev/null
          echo "FTMO_E536_RECOVERY_RECEIPT=$dest"
