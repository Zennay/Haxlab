name: Elite Future Motion Challenger

on:
  push:
    branches:
      - feature/elite-4v4-player-v01
      - experiment/future-motion-v01

permissions:
  contents: read

concurrency:
  group: haxlab-elite-future-motion-challenger-${{ github.ref_name }}-${{ contains(github.event.head_commit.message, '[future]') }}
  cancel-in-progress: true

jobs:
  challenger:
    if: contains(github.event.head_commit.message, '[future]')
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Verify champion shards and model
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/var/lib/haxlab/derived/training/elite-player-champion-candidate
          test -f "$ROOT/model/runtime-model.json"
          test -f "$ROOT/model/metrics.json"
          test -f "$ROOT/shards/train/_index.json"
          test -f "$ROOT/shards/validation/_index.json"
          test -f "$ROOT/shards/holdout/_index.json"

      - name: Train future-motion challenger from existing shards
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/var/lib/haxlab/derived/training/elite-player-champion-candidate
          OUT=/var/lib/haxlab/derived/training/elite-player-future-challenger/model
          sudo -u haxlab rm -rf "$OUT"
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.learning.elite \
            --train-index "$ROOT/shards/train/_index.json" \
            --validation-index "$ROOT/shards/validation/_index.json" \
            --holdout-index "$ROOT/shards/holdout/_index.json" \
            --output-dir "$OUT" \
            --window 8 \
            --sequence-stride 1 \
            --hidden-dim 128 \
            --hidden-dim-2 96 \
            --epochs 3 \
            --batch-size 2048 \
            --learning-rate 0.0008 \
            --future-horizon-steps 5 \
            --future-loss-weight 0.35 \
            --seed 1337 \
            | tee /tmp/haxlab-future-challenger-training.log

      - name: Re-evaluate champion and challenger on identical frozen holdout
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/var/lib/haxlab/derived/training/elite-player-champion-candidate
          HOLDOUT="$ROOT/shards/holdout/_index.json"

          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.elite_model_eval \
            --model-dir "$ROOT/model" \
            --index "$HOLDOUT" \
            --future-horizon-steps 5 \
            --output /tmp/haxlab-future-champion-offline.json

          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.elite_model_eval \
            --model-dir /var/lib/haxlab/derived/training/elite-player-future-challenger/model \
            --index "$HOLDOUT" \
            --future-horizon-steps 5 \
            --output /tmp/haxlab-future-challenger-offline.json

      - name: Select healthy 4v4 replay
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.scenario_source \
            --state-db /var/lib/haxlab/state/haxlab.sqlite3 \
            --max-candidates 1500 \
            --output /tmp/haxlab-future-scenario-source.json

      - name: Export identical stadium and scenarios
        shell: bash
        run: |
          set -euo pipefail
          RAW_REPLAY="$(
            /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          print(json.load(open("/tmp/haxlab-future-scenario-source.json"))["raw_path"])
          PY
          )"
          ANALYSIS="$(
            /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          print(json.load(open("/tmp/haxlab-future-scenario-source.json"))["analysis_path"])
          PY
          )"

          NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_stadium_from_replay.js" \
            "$RAW_REPLAY" \
            /tmp/haxlab-future-stadium.hbs

          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_replay_scenarios.js" \
            "$RAW_REPLAY" \
            "$ANALYSIS" \
            /tmp/haxlab-future-scenarios.json \
            16 \
            8 \
            6

      - name: Benchmark current champion
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js" \
            --model /var/lib/haxlab/derived/training/elite-player-champion-candidate/model/runtime-model.json \
            --stadium /tmp/haxlab-future-stadium.hbs \
            --scenarios /tmp/haxlab-future-scenarios.json \
            --max-scenarios 8 \
            --seconds 30 \
            --sample-every 6 \
            --disable-recovery \
            --output /tmp/haxlab-future-champion.json

      - name: Benchmark future challenger without assist
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js" \
            --model /var/lib/haxlab/derived/training/elite-player-future-challenger/model/runtime-model.json \
            --stadium /tmp/haxlab-future-stadium.hbs \
            --scenarios /tmp/haxlab-future-scenarios.json \
            --max-scenarios 8 \
            --seconds 30 \
            --sample-every 6 \
            --disable-recovery \
            --output /tmp/haxlab-future-plain.json

      - name: Benchmark learned future assist sweep
        shell: bash
        run: |
          set -euo pipefail
          MODEL=/var/lib/haxlab/derived/training/elite-player-future-challenger/model/runtime-model.json
          for CONF in 0.45 0.60 0.75; do
            LABEL="$(printf '%s' "$CONF" | tr '.' '_')"
            sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
              "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js" \
              --model "$MODEL" \
              --stadium /tmp/haxlab-future-stadium.hbs \
              --scenarios /tmp/haxlab-future-scenarios.json \
              --max-scenarios 8 \
              --seconds 30 \
              --sample-every 6 \
              --disable-recovery \
              --future-assist \
              --future-assist-confidence "$CONF" \
              --future-assist-min-distance 80 \
              --output "/tmp/haxlab-future-assisted-${LABEL}.json"
          done

      - name: Select future-assist promotion
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/tools/select_future_assist.js" \
            /tmp/haxlab-future-champion-offline.json \
            /tmp/haxlab-future-challenger-offline.json \
            /tmp/haxlab-future-champion.json \
            /tmp/haxlab-future-plain.json \
            conf_0_45 /tmp/haxlab-future-assisted-0_45.json \
            conf_0_60 /tmp/haxlab-future-assisted-0_60.json \
            conf_0_75 /tmp/haxlab-future-assisted-0_75.json \
            /tmp/haxlab-future-promotion.json

      - name: Publish evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo cat /var/lib/haxlab/derived/training/elite-player-future-challenger/model/metrics.json > future-metrics.json
          cp /tmp/haxlab-future-champion-offline.json future-champion-offline.json
          cp /tmp/haxlab-future-challenger-offline.json future-challenger-offline.json
          cp /tmp/haxlab-future-champion.json future-champion.json
          cp /tmp/haxlab-future-plain.json future-plain.json
          cp /tmp/haxlab-future-assisted-0_45.json future-assisted-0_45.json
          cp /tmp/haxlab-future-assisted-0_60.json future-assisted-0_60.json
          cp /tmp/haxlab-future-assisted-0_75.json future-assisted-0_75.json
          cp /tmp/haxlab-future-promotion.json future-promotion.json

          echo '## HaxLab Future Motion Challenger' >> "$GITHUB_STEP_SUMMARY"
          cat future-promotion.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: elite-future-motion-challenger
          path: |
            future-metrics.json
            future-champion-offline.json
            future-challenger-offline.json
            future-champion.json
            future-plain.json
            future-assisted-0_45.json
            future-assisted-0_60.json
            future-assisted-0_75.json
            future-promotion.json
          retention-days: 30
