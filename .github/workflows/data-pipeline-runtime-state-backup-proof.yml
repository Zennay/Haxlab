name: Data-pipeline runtime state backup exact-head proof

on:
  push:
    branches:
      - feature/data-pipeline-runtime-state-backup-20261007
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pipeline-runtime-state-backup-exact-head
  cancel-in-progress: true

jobs:
  proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[runtime-state-backup-proof]')
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run focused runtime-state backup proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-state-backup-proof
          .venv-state-backup-proof/bin/python -m pip install -q -e ".[dev]"
          .venv-state-backup-proof/bin/python -m py_compile src/haxlab/runtime/state_backup.py
          .venv-state-backup-proof/bin/python -m pytest -q tests/test_runtime_state_backup.py
          .venv-state-backup-proof/bin/python -m pytest --collect-only -q >"$RUNNER_TEMP/haxlab-runtime-state-backup-$GITHUB_RUN_ID.collect"
          test -s "$RUNNER_TEMP/haxlab-runtime-state-backup-$GITHUB_RUN_ID.collect"
          echo "HAXLAB_RUNTIME_STATE_BACKUP_PROOF=success"
