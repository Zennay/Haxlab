name: Deploy portfolio runtime autonomy v2 once

on:
  push:
    branches:
      - ops/deploy-runtime-autonomy-v2-20260928
    paths:
      - ".github/workflows/deploy-runtime-autonomy-v2-once.yml"

permissions:
  contents: read

concurrency:
  group: portfolio-runtime-autonomy-live-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      ZCLOUD_SHA: cc0bbc1806521921706a328bf3e5a86f7f21dfc6
      ZSSH_SHA: 355b1729b2f30422825e17b25dc09fa1d390a751
      FTMO_MAIN_SHA: 90359a8150fcd974141160d2d2af7d505f1afa53
    steps:
      - name: Deploy zCloud runtime heal and canonical zSSH
        shell: bash
        run: |
          set -euo pipefail
          zc="$(mktemp -d /tmp/zcloud-runtime-v2.XXXXXX)"
          zs="$(mktemp -d /tmp/zssh-runtime-v2.XXXXXX)"
          trap 'rm -rf "$zc" "$zs"' EXIT

          git clone --filter=blob:none --no-checkout https://github.com/Zennay/zCloud.git "$zc"
          git -C "$zc" fetch --depth 1 origin "$ZCLOUD_SHA"
          git -C "$zc" checkout --detach "$ZCLOUD_SHA"
          test "$(git -C "$zc" rev-parse HEAD)" = "$ZCLOUD_SHA"
          bash -n "$zc/scripts/zcloud-self-heal.sh"
          python3 "$zc/tests/test_self_heal_assets.py"

          sudo install -o root -g root -m 0755             "$zc/scripts/zcloud-self-heal.sh"             /usr/local/sbin/zcloud-self-heal

          git clone --filter=blob:none --no-checkout https://github.com/Zennay/zSSH.git "$zs"
          git -C "$zs" fetch --depth 1 origin "$ZSSH_SHA"
          git -C "$zs" checkout --detach "$ZSSH_SHA"
          test "$(git -C "$zs" rev-parse HEAD)" = "$ZSSH_SHA"

          ZSSH_EXPECTED_SHA="$ZSSH_SHA" bash "$zs/deploy/install-live.sh" "$zs"

          test -f /opt/haxlab/deploy/haxlab-autonomy.service
          test -f /opt/haxlab/deploy/haxlab-autonomy.timer
          test -f /opt/haxlab/deploy/haxlab-autonomy-tick.sh
          sudo install -m 0644 /opt/haxlab/deploy/haxlab-autonomy.service /etc/systemd/system/haxlab-autonomy.service
          sudo install -m 0644 /opt/haxlab/deploy/haxlab-autonomy.timer /etc/systemd/system/haxlab-autonomy.timer
          sudo chmod 0755 /opt/haxlab/deploy/haxlab-autonomy-tick.sh
          sudo systemctl daemon-reload
          sudo systemctl enable --now haxlab-autonomy.timer

          ftmo_timer="$(mktemp)"
          printf '%s\n' \
            '[Unit]' \
            'Description=Run FTMO autonomous VPS tick every three minutes' \
            '' \
            '[Timer]' \
            'OnBootSec=1min' \
            'OnUnitActiveSec=3min' \
            'AccuracySec=30s' \
            'Unit=ftmo-autonomous.service' \
            '' \
            '[Install]' \
            'WantedBy=timers.target' > "$ftmo_timer"
          sudo install -m 0644 "$ftmo_timer" /etc/systemd/system/ftmo-autonomous.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now ftmo-autonomous.timer
          sudo systemctl restart ftmo-autonomous.timer
          grep -F "OnUnitActiveSec=3min" /etc/systemd/system/ftmo-autonomous.timer

          ftmo_src="/opt/ftmo-runner/_work/Ftmo/Ftmo"
          ftmo_root="/opt/ftmo-autonomous"
          test "$(git -C "$ftmo_src" rev-parse HEAD)" = "$FTMO_MAIN_SHA"
          git -C "$ftmo_src" diff --quiet --             configs/autonomous_runtime.json             src/prop_trading_ai/ops/autonomous_runtime.py             src/prop_trading_ai/cli/v1_autonomous_tick.py             deploy/systemd/ftmo-autonomous.service.in             deploy/systemd/ftmo-autonomous.timer
          ftmo_owner="$(stat -c %U "$ftmo_root")"
          ftmo_group="$(stat -c %G "$ftmo_root")"
          for rel in             configs/autonomous_runtime.json             src/prop_trading_ai/ops/autonomous_runtime.py             src/prop_trading_ai/cli/v1_autonomous_tick.py
          do
            sudo install -o "$ftmo_owner" -g "$ftmo_group" -m 0644               "$ftmo_src/$rel" "$ftmo_root/$rel"
          done
          rendered_service="$(mktemp)"
          sed             -e "s|__REPO_ROOT__|$ftmo_root|g"             -e "s|__RUN_USER__|$ftmo_owner|g"             "$ftmo_src/deploy/systemd/ftmo-autonomous.service.in" > "$rendered_service"
          sudo install -m 0644 "$rendered_service" /etc/systemd/system/ftmo-autonomous.service
          sudo systemctl daemon-reload
          sudo -u "$ftmo_owner" "$ftmo_root/.venv/bin/python"             -m prop_trading_ai.cli.v1_autonomous_tick             --root "$ftmo_root"             --config "$ftmo_root/configs/autonomous_runtime.json"
          sudo systemctl restart ftmo-autonomous.timer
          cmp "$ftmo_src/configs/autonomous_runtime.json" "$ftmo_root/configs/autonomous_runtime.json"
          cmp "$ftmo_src/src/prop_trading_ai/ops/autonomous_runtime.py" "$ftmo_root/src/prop_trading_ai/ops/autonomous_runtime.py"
          cmp "$ftmo_src/src/prop_trading_ai/cli/v1_autonomous_tick.py" "$ftmo_root/src/prop_trading_ai/cli/v1_autonomous_tick.py"

          sudo systemctl start zcloud-self-heal.service
          sudo systemctl is-enabled --quiet zcloud-self-heal.timer
          sudo systemctl is-active --quiet zcloud-self-heal.timer

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"

          systemctl is-active haxlab-ingest.service
          systemctl is-active haxlab-worker.service
          systemctl is-active haxlab-analyzer.service
          systemctl is-enabled haxlab-autonomy.timer
          systemctl is-active haxlab-autonomy.timer
          systemctl is-enabled ftmo-autonomous.timer
          systemctl is-active ftmo-autonomous.timer
          systemctl --user is-enabled zssh.service
          systemctl --user is-active zssh.service
          systemctl --user is-enabled raise-gateway.service
          systemctl --user is-active raise-gateway.service

          curl -fsS --max-time 5 http://127.0.0.1:8765/api/status >/dev/null
          echo "PORTFOLIO_RUNTIME_AUTONOMY_LIVE_GREEN"
