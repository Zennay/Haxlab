name: Recover FTMO listener for PR506

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-ftmo-listener-pr506.yml"

permissions:
  contents: read

concurrency:
  group: recover-ftmo-listener-pr506
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 8
    env:
      FTMO_SERVICE: actions.runner.Zennay-Ftmo.vps-bb300bba-ftmo.service
      FTMO_RUN_USER: ftmo-runner
      TARGET_RUN: "37168721949"
      TARGET_SHA: 7f4bc79b9f13ae0dbcccb0a3c3286bce72121faa
      EXPECTED_MAIN_SHA: b2fbd35cf970813d9428da4aa9668070778654fd
    steps:
      - name: Recover only idle unhealthy FTMO listener
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)" = "$EXPECTED_MAIN_SHA"
          test "$(gh api repos/Zennay/Ftmo/pulls/506 --jq .state)" = "open"
          test "$(gh api repos/Zennay/Ftmo/pulls/506 --jq .head.sha)" = "$TARGET_SHA"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$TARGET_RUN --jq .head_sha)" = "$TARGET_SHA"
          test "$(gh api repos/Zennay/Ftmo/actions/runs/$TARGET_RUN --jq .name)" = "Test suite"

          pre_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
          pre_pid="$(systemctl show "$FTMO_SERVICE" -p MainPID --value || true)"
          worker_before=0
          listener_before=0
          pgrep -u "$FTMO_RUN_USER" -f 'Runner\.Worker' >/dev/null 2>&1 && worker_before=1 || true
          if [[ "$pre_pid" =~ ^[1-9][0-9]*$ ]] && test -r "/proc/$pre_pid/cmdline"; then
            cmd="$(tr '\0' ' ' < "/proc/$pre_pid/cmdline")"
            [[ "$cmd" == *"Runner.Listener"* || "$cmd" == *"runsvc.sh"* ]] && listener_before=1 || true
          fi
          echo "PRE state=$pre_state pid=$pre_pid listener=$listener_before worker=$worker_before"

          if [[ "$worker_before" -eq 1 ]]; then
            action=preserve-active-worker
          elif [[ "$pre_state" != "active" ]]; then
            sudo -n systemctl reset-failed "$FTMO_SERVICE" || true
            sudo -n systemctl start "$FTMO_SERVICE"
            action=start-inactive-listener
          elif [[ "$listener_before" -eq 1 ]]; then
            action=preserve-healthy-listener
          else
            sudo -n systemctl restart "$FTMO_SERVICE"
            action=restart-unhealthy-listener
          fi

          post_state=""
          for _ in $(seq 1 30); do
            post_state="$(systemctl is-active "$FTMO_SERVICE" || true)"
            [[ "$post_state" == active ]] && break
            sleep 2
          done
          test "$post_state" = active
          echo "FTMO_RUNNER_RECOVERY_ACTION=$action"
          echo "POST state=$post_state pid=$(systemctl show "$FTMO_SERVICE" -p MainPID --value)"

      - name: Prove PR506 leaves queue
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            status="$(gh api "repos/Zennay/Ftmo/actions/runs/$TARGET_RUN" --jq .status)"
            conclusion="$(gh api "repos/Zennay/Ftmo/actions/runs/$TARGET_RUN" --jq '.conclusion // ""')"
            echo "PR506_RUN status=$status conclusion=$conclusion"
            if [[ "$status" == "in_progress" || "$status" == "completed" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "PR506 remained queued after listener recovery" >&2
          exit 1
