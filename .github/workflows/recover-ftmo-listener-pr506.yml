name: Recover FTMO listener for PR506

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-ftmo-listener-pr506.yml"

concurrency:
  group: recover-ftmo-listener-pr506
  cancel-in-progress: true

jobs:
  retired:
    if: false
    runs-on: [self-hosted, haxlab]
    steps:
      - run: echo "PR506 already left the FTMO queue; recovery retired"
