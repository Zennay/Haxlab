name: Elite Candidate B Evolution

on:
  push:
    branches:
      - feature/elite-sandbox-promotion-gate

permissions:
  contents: read

jobs:
  candidate-b:
    if: contains(github.event.head_commit.message, '[candidate-b]')
    concurrency:
      group: haxlab-elite-candidate-b
      cancel-in-progress: true
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Clear stale Candidate B evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab rm -f \
            /tmp/haxlab-candidate-b.log \
            /tmp/haxlab-candidate-b-stadium.hbs \
            /tmp/haxlab-candidate-b-scenario-source.json \
            /tmp/haxlab-candidate-b-replay-stadium.hbs \
            /tmp/haxlab-candidate-b-replay-scenarios.json \
            /tmp/haxlab-candidate-b-replay.json \
            /tmp/haxlab-live-champion-replay.json \
            /tmp/candidate-b-evolution.json
          rm -f \
            candidate-b-pipeline-summary.json \
            candidate-b-sandbox-benchmark.json \
            candidate-b-replay-seeded-duel.json \
            candidate-b-replay-benchmark.json \
            live-champion-replay-benchmark.json \
            candidate-b-scenario-source.json \
            candidate-b-replay-scenarios.json \
            candidate-b-replay-stadium.hbs \
            candidate-b-evolution.json \
            candidate-b-training.log \
            champion-registry.json

      - name: Build canonical elite leaderboard
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab mkdir -p /var/lib/haxlab/derived/leaderboards
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.skill.leaderboard \
            --root /var/lib/haxlab/derived/state-pass-v4 \
            --top 10000 \
            --min-matches 1 \
            --min-minutes 0 \
            --aliases "$GITHUB_WORKSPACE/configs/player_aliases.json" \
            --format json \
            --output /var/lib/haxlab/derived/leaderboards/elite-candidate-b.json \
            >/tmp/haxlab-candidate-b-leaderboard.json

      - name: Train candidate B with stable tactical slots
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab rm -rf /var/lib/haxlab/derived/training/elite-player-candidate-b
          sudo -u haxlab env \
            PYTHONPATH="$GITHUB_WORKSPACE/src" \
            NODE_PATH=/opt/haxlab/node_modules \
            /opt/haxlab/.venv/bin/python -m haxlab.learning.elite_pipeline \
            --analysis-root /var/lib/haxlab/derived/state-pass-v4 \
            --leaderboard /var/lib/haxlab/derived/leaderboards/elite-candidate-b.json \
            --raw-root /var/lib/haxlab/raw/replays \
            --work-root /var/lib/haxlab/derived/training/elite-player-candidate-b \
            --node-script "$GITHUB_WORKSPACE/tools/extract_elite_imitation.js" \
            --aliases "$GITHUB_WORKSPACE/configs/player_aliases.json" \
            --train-replay-limit 800 \
            --validation-replay-limit 200 \
            --window 8 \
            --sequence-stride 1 \
            --hidden-dim 128 \
            --hidden-dim-2 96 \
            --epochs 3 \
            --batch-size 2048 \
            --shard-workers 4 \
            | tee /tmp/haxlab-candidate-b.log

      - name: Extract exact BFF Big v4 stadium
        shell: bash
        run: |
          set -euo pipefail
          RAW_REPLAY="$(
            /opt/haxlab/.venv/bin/python - <<'PY'
          import sqlite3
          db = sqlite3.connect("/var/lib/haxlab/state/haxlab.sqlite3")
          row = db.execute("""
          SELECT r.archive_path
          FROM source_files s
          JOIN raw_replays r ON r.sha256 = s.sha256
          WHERE lower(s.source_path) LIKE '%kjambvsado%'
          ORDER BY s.last_seen_at DESC
          LIMIT 1
          """).fetchone()
          if row:
              print(row[0])
          PY
          )"
          test -n "$RAW_REPLAY"
          test -f "$RAW_REPLAY"
          NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_stadium_from_replay.js" \
            "$RAW_REPLAY" \
            /tmp/haxlab-candidate-b-stadium.hbs

      - name: Run scripted 4v4 benchmark
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_sandbox_benchmark.js" \
            --model /var/lib/haxlab/derived/training/elite-player-candidate-b/model/runtime-model.json \
            --stadium /tmp/haxlab-candidate-b-stadium.hbs \
            --matches 12 \
            --minutes 1.5 \
            --sample-every 6 \
            --output /var/lib/haxlab/derived/training/elite-player-candidate-b/sandbox-benchmark.json

      - name: Prepare replay-seeded evaluation scenarios
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.scenario_source \
            --state-db /var/lib/haxlab/state/haxlab.sqlite3 \
            --max-candidates 1500 \
            --output /tmp/haxlab-candidate-b-scenario-source.json

          RAW_REPLAY="$(python3 -c 'import json; print(json.load(open("/tmp/haxlab-candidate-b-scenario-source.json"))["raw_path"])')"
          ANALYSIS="$(python3 -c 'import json; print(json.load(open("/tmp/haxlab-candidate-b-scenario-source.json"))["analysis_path"])')"
          NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_stadium_from_replay.js" \
            "$RAW_REPLAY" /tmp/haxlab-candidate-b-replay-stadium.hbs
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_replay_scenarios.js" \
            "$RAW_REPLAY" "$ANALYSIS" \
            /tmp/haxlab-candidate-b-replay-scenarios.json 16 8 6

      - name: Seed evolution registry from live champion
        shell: bash
        run: |
          set -euo pipefail
          CHAMPIONS=/var/lib/haxlab/derived/training/elite-champions
          LIVE_POINTER=/var/lib/haxlab/derived/champions/elite-player/current.json
          sudo -u haxlab mkdir -p "$CHAMPIONS"

          if [ ! -f "$CHAMPIONS/registry.json" ]; then
            test -f "$LIVE_POINTER"
            sudo -u haxlab env \
              PYTHONPATH="$GITHUB_WORKSPACE/src" \
              LIVE_POINTER="$LIVE_POINTER" \
              CHAMPIONS="$CHAMPIONS" \
              /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          live = json.loads(Path(os.environ["LIVE_POINTER"]).read_text())
          model_dir = Path(live["model_path"]).parent
          for required in ("model.npz", "metrics.json", "runtime-model.json"):
              path = model_dir / required
              if not path.exists():
                  raise SystemExit(f"missing live champion artifact: {path}")

          current = {
              "candidate_id": f"live-{live['version_id']}",
              "promoted_at": live.get("updated_at"),
              "source_ref": live["version_id"],
              "artifact_dir": str(model_dir),
              "model_dir": str(model_dir),
          }
          registry = {
              "schema": "haxlab-elite-champion-registry-v1",
              "current": current,
              "history": [],
          }
          root = Path(os.environ["CHAMPIONS"])
          (root / "registry.json").write_text(
              json.dumps(registry, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "current.json").write_text(
              json.dumps(current, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(current, indent=2))
          PY
          fi

      - name: Build replay-seeded challenger evidence
        shell: bash
        run: |
          set -euo pipefail
          LIVE_RUNTIME="$(sudo -u haxlab /opt/haxlab/.venv/bin/python -c 'import json; print(json.load(open("/var/lib/haxlab/derived/champions/elite-player/current.json"))["runtime_model_path"])')"
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js" \
            --model /var/lib/haxlab/derived/training/elite-player-candidate-b/model/runtime-model.json \
            --stadium /tmp/haxlab-candidate-b-replay-stadium.hbs \
            --scenarios /tmp/haxlab-candidate-b-replay-scenarios.json \
            --max-scenarios 16 --seconds 30 --sample-every 6 \
            --disable-recovery --output /tmp/haxlab-candidate-b-replay.json
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js" \
            --model "$LIVE_RUNTIME" \
            --stadium /tmp/haxlab-candidate-b-replay-stadium.hbs \
            --scenarios /tmp/haxlab-candidate-b-replay-scenarios.json \
            --max-scenarios 16 --seconds 30 --sample-every 6 \
            --disable-recovery --output /tmp/haxlab-live-champion-replay.json
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.replay_duel \
            /tmp/haxlab-candidate-b-replay.json \
            /tmp/haxlab-live-champion-replay.json \
            --output /var/lib/haxlab/derived/training/elite-player-candidate-b/replay-seeded-duel.json

      - name: Evaluate candidate B against current champion
        shell: bash
        run: |
          set -euo pipefail
          CHAMPIONS=/var/lib/haxlab/derived/training/elite-champions
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-8)"
          set +e
          sudo -u haxlab env \
            PYTHONPATH="$GITHUB_WORKSPACE/src" \
            NODE_PATH=/opt/haxlab/node_modules \
            /opt/haxlab/.venv/bin/python -m haxlab.learning.evolution \
            --registry "$CHAMPIONS/registry.json" \
            --champions-root "$CHAMPIONS" \
            --candidate-id "candidate-b-$SHORT_SHA" \
            --candidate-model-dir /var/lib/haxlab/derived/training/elite-player-candidate-b/model \
            --metrics /var/lib/haxlab/derived/training/elite-player-candidate-b/model/metrics.json \
            --sandbox /var/lib/haxlab/derived/training/elite-player-candidate-b/sandbox-benchmark.json \
            --stadium /tmp/haxlab-candidate-b-stadium.hbs \
            --duel-script "$GITHUB_WORKSPACE/tools/elite_model_duel.js" \
            --duel-evidence /var/lib/haxlab/derived/training/elite-player-candidate-b/replay-seeded-duel.json \
            --duel-matches 12 \
            --duel-minutes 2 \
            --duel-seed 1337 \
            --sample-every-ticks 6 \
            --source-ref "$GITHUB_SHA" \
            --output /tmp/candidate-b-evolution.json
          EVOLUTION_CODE=$?
          set -e
          echo "evolution exit=$EVOLUTION_CODE"
          cat /tmp/candidate-b-evolution.json
          cp /tmp/candidate-b-evolution.json candidate-b-evolution.json

      - name: Collect candidate B evidence
        if: always()
        shell: bash
        run: |
          set -u

          copy_root_file() {
            local src="$1"
            local dst="$2"
            if sudo test -f "$src"; then
              sudo cat "$src" > "$dst"
            fi
          }

          copy_tmp_file() {
            local src="$1"
            local dst="$2"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
            fi
          }

          copy_root_file \
            /var/lib/haxlab/derived/training/elite-player-candidate-b/pipeline-summary.json \
            candidate-b-pipeline-summary.json
          copy_root_file \
            /var/lib/haxlab/derived/training/elite-player-candidate-b/sandbox-benchmark.json \
            candidate-b-sandbox-benchmark.json
          copy_root_file \
            /var/lib/haxlab/derived/training/elite-player-candidate-b/replay-seeded-duel.json \
            candidate-b-replay-seeded-duel.json
          copy_tmp_file /tmp/haxlab-candidate-b-replay.json candidate-b-replay-benchmark.json
          copy_tmp_file /tmp/haxlab-live-champion-replay.json live-champion-replay-benchmark.json
          copy_tmp_file /tmp/haxlab-candidate-b-scenario-source.json candidate-b-scenario-source.json
          copy_tmp_file /tmp/haxlab-candidate-b-replay-scenarios.json candidate-b-replay-scenarios.json
          copy_tmp_file /tmp/haxlab-candidate-b-replay-stadium.hbs candidate-b-replay-stadium.hbs
          copy_tmp_file /tmp/candidate-b-evolution.json candidate-b-evolution.json
          copy_tmp_file /tmp/haxlab-candidate-b.log candidate-b-training.log

          CHAMPIONS=/var/lib/haxlab/derived/training/elite-champions
          if sudo test -f "$CHAMPIONS/registry.json"; then
            sudo cat "$CHAMPIONS/registry.json" > champion-registry.json
          else
            echo '{"schema":"haxlab-elite-champion-registry-v1","current":null,"history":[]}' \
              > champion-registry.json
          fi

          {
            echo '## HaxLab Candidate B Evolution'
            for spec in \
              'Frozen holdout:candidate-b-pipeline-summary.json' \
              'Scripted sandbox:candidate-b-sandbox-benchmark.json' \
              'Replay-seeded duel:candidate-b-replay-seeded-duel.json' \
              'Evolution / champion decision:candidate-b-evolution.json'
            do
              title="${spec%%:*}"
              file="${spec#*:}"
              if [ -f "$file" ]; then
                echo
                echo "### $title"
                echo '```json'
                cat "$file"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-candidate-b-evolution
          path: |
            candidate-b-pipeline-summary.json
            candidate-b-sandbox-benchmark.json
            candidate-b-replay-seeded-duel.json
            candidate-b-replay-benchmark.json
            live-champion-replay-benchmark.json
            candidate-b-scenario-source.json
            candidate-b-replay-scenarios.json
            candidate-b-replay-stadium.hbs
            candidate-b-evolution.json
            candidate-b-training.log
            champion-registry.json
          if-no-files-found: warn
          retention-days: 30