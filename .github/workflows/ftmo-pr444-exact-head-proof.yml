name: FTMO PR444 exact-head proof via HaxLab

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr444-exact-head-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr444-exact-head-proof-haxlab
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      TARGET_SHA: a156246682bd836c071b461f66009e7d620c00b4
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Verify VPS identity and fetch exact FTMO head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr444-exact-head"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_head_sha=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr444-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr444-exact-head-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Compile changed runtime surface
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr444-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr444-exact-head-venv"
          "$venv/bin/python" -m compileall -q "$src/src/prop_trading_ai/data/market/providers/dukascopy_public.py"

      - name: Prove BI5 transfer framing and sealed boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr444-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr444-exact-head-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q             tests/test_dukascopy_public.py             tests/test_dukascopy_timeout_transport.py             tests/test_autonomous_provider_retry.py             tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR444_TARGETED_GREEN=1"

      - name: Prove complete suite collection
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr444-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr444-exact-head-venv"
          cd "$src"
          "$venv/bin/python" -m pytest --collect-only -q >/tmp/ftmo-pr444-haxlab-collect.txt
          test -s /tmp/ftmo-pr444-haxlab-collect.txt
          echo "FTMO_PR444_COLLECTION_GREEN=1"

      - name: Persist proof receipt
        if: always()
        env:
          PROOF_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr444-haxlab-${GITHUB_RUN_ID}.json"
          python3 - <<'PY' > "$receipt"
          import json, os, socket
          print(json.dumps({
              "project": "ftmo",
              "pr": 444,
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_host": socket.gethostname(),
              "result": os.environ["PROOF_RESULT"],
              "paid_cloud_budget_usd": os.environ.get("FTMO_AUTONOMOUS_CLOUD_BUDGET_USD"),
              "proof": [
                  "exact-sha-checkout",
                  "isolated-install",
                  "compile",
                  "dukascopy-public-provider-tests",
                  "timeout-retry-tests",
                  "autonomous-provider-retry-tests",
                  "zero-cost-boundary-tests",
                  "full-suite-collection"
              ]
          }, sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr444-haxlab-proof-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/Haxlab/contents/$path"             -f message="Record FTMO PR444 HaxLab proof run ${GITHUB_RUN_ID}"             -f content="$encoded" >/dev/null
          echo "FTMO_PR444_RECEIPT_PATH=$path"
