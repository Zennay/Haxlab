name: Frozen Future Head Smoke

on:
  push:
    branches:
      - experiment/frozen-future-head-v01

permissions:
  contents: read

concurrency:
  group: haxlab-frozen-future-head-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Compile frozen future and promotion tooling
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m py_compile \
            "$GITHUB_WORKSPACE/src/haxlab/learning/frozen_future.py" \
            "$GITHUB_WORKSPACE/src/haxlab/evaluation/champion_registry.py" \
            "$GITHUB_WORKSPACE/src/haxlab/evaluation/scenario_source.py"

      - name: Run frozen and registry tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m pytest -q \
            "$GITHUB_WORKSPACE/tests/test_frozen_future.py" \
            "$GITHUB_WORKSPACE/tests/test_champion_registry.py" \
            "$GITHUB_WORKSPACE/tests/test_scenario_source.py"

      - name: Run live runtime guard tests
        shell: bash
        run: |
          set -euo pipefail
          node --check "$GITHUB_WORKSPACE/tools/elite_tactics.js"
          node --check "$GITHUB_WORKSPACE/tools/elite_champion_config.js"
          node "$GITHUB_WORKSPACE/tests/test_frozen_future_role_gate.js"
          node "$GITHUB_WORKSPACE/tests/test_elite_champion_config.js"
