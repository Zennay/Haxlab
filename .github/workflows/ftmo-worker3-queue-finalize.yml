name: Finalize FTMO Worker3 queue item

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-worker3-queue-finalize.yml"

permissions:
  contents: read

concurrency:
  group: ftmo-worker3-queue-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      QUEUE_ID: ftmo-88c11658a14d8dbb
      MERGE_SHA: c504c3b92c265b36b45ebe718109a10aca06de26
      EXACT_PROOF_RUN: "37000330351"
    steps:
      - name: Verify merge and exact-head VPS proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          proof="$(gh api "repos/Zennay/Haxlab/actions/runs/$EXACT_PROOF_RUN")"
          python3 -c 'import json,sys; d=json.load(sys.stdin); (d.get("status"),d.get("conclusion"))==("completed","success") or (_ for _ in ()).throw(SystemExit("exact-head proof not green")); print("EXACT_HEAD_PROOF_GREEN=1")' <<<"$proof"
          main_sha="$(gh api repos/Zennay/Ftmo/commits/main --jq .sha)"
          ancestry="$(gh api "repos/Zennay/Ftmo/compare/$MERGE_SHA...$main_sha")"
          python3 -c 'import json,sys; d=json.load(sys.stdin); d.get("status") in {"ahead","identical"} or (_ for _ in ()).throw(SystemExit("merge is not in current main ancestry")); print("MERGE_IN_MAIN_ANCESTRY=1")' <<<"$ancestry"

      - name: Finish exact SQLite queue assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import importlib.util
          import json
          import os
          import sqlite3
          import sys
          from pathlib import Path

          queue_id = os.environ["QUEUE_ID"]
          merge_sha = os.environ["MERGE_SHA"]
          proof_run = os.environ["EXACT_PROOF_RUN"]
          live_root = Path("/home/ubuntu/zennay-cloud")
          server_path = live_root / "server.py"
          db_path = live_root / "history.db"
          if not server_path.is_file() or not db_path.is_file():
              raise SystemExit("live zCloud backend missing")

          sys.path.insert(0, str(live_root))
          spec = importlib.util.spec_from_file_location("zcloud_live_server", server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server")
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB = db_path

          evidence = (
              "Worker3 Gen29 cache progress snapshot integrity complete. PR #429 merged as "
              f"{merge_sha}; exact-head self-hosted VPS proof {proof_run} SUCCESS on vps-bb300bba "
              "(exact SHA checkout, isolated install, compile, autonomous provider retry/integrity tests, "
              "provider-foundation publication tests and zero-cost boundary tests). Generation 29 stayed "
              "at provider_foundation; development, walk-forward, final holdout, live/broker and paid-cloud "
              "permissions were not opened."
          )

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              row = c.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          if row is None:
              raise SystemExit("queue item missing")
          item = dict(row)
          print("QUEUE_BEFORE=" + json.dumps(item, sort_keys=True))
          if item["project_id"] != "ftmo":
              raise SystemExit("queue project mismatch")

          if item["status"] == "done":
              print("QUEUE_ALREADY_DONE=1")
          elif item["status"] in {"claimed", "running", "verifying", "in_progress"} and item["worker_slot"] is not None:
              result = server.portfolio_queue_finish(int(item["worker_slot"]), queue_id, "DONE", evidence)
              print("QUEUE_FINISH_RESULT=" + json.dumps(result, sort_keys=True, default=str))
              if not result.get("updated"):
                  raise SystemExit("portfolio_queue_finish refused active assignment")
          else:
              raise SystemExit(
                  f"refusing nonstandard queue mutation status={item['status']} slot={item['worker_slot']}"
              )

          with sqlite3.connect(db_path) as c:
              c.row_factory = sqlite3.Row
              final = c.execute(
                  "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at FROM portfolio_queue WHERE queue_id=?",
                  (queue_id,),
              ).fetchone()
          final = dict(final) if final else None
          print("QUEUE_AFTER=" + json.dumps(final, sort_keys=True))
          if (
              not final
              or final["status"] != "done"
              or int(final["eligible"] or 0) != 0
              or final["worker_slot"] is not None
          ):
              raise SystemExit("queue final state is not canonical")
          print("FTMO_WORKER3_QUEUE_DONE=1")
          PY
