name: zSSH production reviewer readiness audit

on:
  push:
    paths:
      - ".github/workflows/zssh-production-review-readiness.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 8
    steps:
      - name: Audit live zSSH reviewer readiness without secret output
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ZSSH_REVIEW_READINESS_V1"
          echo "runner=$RUNNER_NAME"
          echo "hostname=$(hostname)"
          echo "user=$(id -un)"
          echo "uid=$(id -u)"

          for unit in zssh.service zssh-agent.service; do
            active="$(systemctl --user is-active "$unit" 2>/dev/null || true)"
            enabled="$(systemctl --user is-enabled "$unit" 2>/dev/null || true)"
            printf 'service.%s.active=%s\n' "$unit" "${active:-missing}"
            printf 'service.%s.enabled=%s\n' "$unit" "${enabled:-missing}"
          done

          for file in "$HOME/.config/zssh/gateway.env" "$HOME/.config/zssh/agent.env"; do
            base="$(basename "$file")"
            if [[ -f "$file" ]]; then
              printf 'env.%s.exists=true\n' "$base"
              printf 'env.%s.mode=%s\n' "$base" "$(stat -c '%a' "$file")"
              for key in NODE_ENV ZSSH_PLUGIN_PROFILE ZSSH_PUBLIC_AUTH_MODE ZSSH_EXEC_MODE ZSSH_PUBLIC_BASE_URL ZSSH_PUBLIC_URL ZSSH_OAUTH_ISSUER ZSSH_OAUTH_JWKS_URI ZSSH_TARGET_ID ZSSH_GATEWAY_URL ZSSH_AGENT_PRIVATE_KEY_FILE ZSSH_PUBLIC_ALLOWED_ROOTS ZSSH_ALLOWED_ROOTS ZSSH_AGENT_PUBLIC_KEYS_FILE OPENAI_APPS_CHALLENGE_TOKEN; do
                line="$(grep -m1 "^$key=" "$file" 2>/dev/null || true)"
                if [[ -n "$line" && -n "${line#*=}" ]]; then
                  printf 'env.%s.%s.present=true\n' "$base" "$key"
                  case "$key" in
                    ZSSH_PUBLIC_BASE_URL|ZSSH_PUBLIC_URL|ZSSH_OAUTH_ISSUER|ZSSH_OAUTH_JWKS_URI|ZSSH_GATEWAY_URL)
                      value="${line#*=}"
                      if [[ "$value" == https://* && "$value" != *"@"* && "$value" != *"?"* && "$value" != *"#"* ]]; then
                        printf 'env.%s.%s.public_value=%s\n' "$base" "$key" "$value"
                      fi
                      ;;
                  esac
                else
                  printf 'env.%s.%s.present=false\n' "$base" "$key"
                fi
              done
            else
              printf 'env.%s.exists=false\n' "$base"
            fi
          done

          for dir in "$HOME/.local/share/zssh" "$HOME/.local/share/zssh-agent" "$HOME/.local/src/zssh" "/srv/zssh-review" "$HOME/zssh-review"; do
            label="$(printf '%s' "$dir" | sed 's|/|_|g')"
            if [[ -e "$dir" ]]; then
              printf 'path.%s.exists=true\n' "$label"
              printf 'path.%s.mode=%s\n' "$label" "$(stat -c '%a' "$dir" 2>/dev/null || echo unknown)"
              printf 'path.%s.owner=%s\n' "$label" "$(stat -c '%U' "$dir" 2>/dev/null || echo unknown)"
            else
              printf 'path.%s.exists=false\n' "$label"
            fi
          done

          if command -v caddy >/dev/null 2>&1; then
            echo "caddy.binary=true"
          else
            echo "caddy.binary=false"
          fi
          printf 'caddy.system.active=%s\n' "$(systemctl is-active caddy 2>/dev/null || true)"
          printf 'https.listener=%s\n' "$(ss -ltn 2>/dev/null | awk '$4 ~ /:443$/ {found=1} END {print found ? "true" : "false"}')"

          if [[ -f /etc/caddy/Caddyfile && -r /etc/caddy/Caddyfile ]]; then
            echo "caddy.config.readable=true"
            awk '
              /^[[:space:]]*#/ || /^[[:space:]]*$/ {next}
              /^[^[:space:]]+[[:space:]]*\{/ {
                host=$1
                if (host ~ /^https:\/\// || host ~ /^[A-Za-z0-9.-]+(:[0-9]+)?$/) print "caddy.site=" host
              }
            ' /etc/caddy/Caddyfile | head -20
          else
            echo "caddy.config.readable=false"
          fi

          if [[ -f "$HOME/.config/zssh/gateway.env" ]]; then
            public_base="$(grep -m1 '^ZSSH_PUBLIC_BASE_URL=' "$HOME/.config/zssh/gateway.env" 2>/dev/null | cut -d= -f2- || true)"
            if [[ "$public_base" == https://* && "$public_base" != *"@"* && "$public_base" != *"?"* && "$public_base" != *"#"* ]]; then
              health="${public_base%/}/health"
              code="$(curl --silent --show-error --output /tmp/zssh-review-health.$$ --write-out '%{http_code}' --max-time 8 "$health" || true)"
              printf 'public.health.http_code=%s\n' "$code"
              rm -f /tmp/zssh-review-health.$$
            else
              echo "public.health.http_code=not-configured"
            fi
          fi

          echo "ZSSH_REVIEW_READINESS_END"
