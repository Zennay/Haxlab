name: Live VPS compute probe

on:
  push:
    branches: [main]
    paths: [".github/workflows/live-compute-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5
    steps:
      - name: Keep HaxLab training paused for Firefox
        shell: bash
        run: |
          set -uo pipefail
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"project_id":"haxlab","action":"pause"}' \
            http://127.0.0.1:8765/api/runner-control || true
          sudo systemctl stop haxlab-autonomy.timer 2>/dev/null || true
          sudo systemctl stop haxlab-autonomy.service 2>/dev/null || true
          sudo pkill -TERM -f '[h]axlab-train-bc' 2>/dev/null || true
          sleep 3

          echo "=== VERIFY ==="
          echo -n "trainer: "; pgrep -af '[h]axlab-train-bc' || echo "stopped"
          echo -n "autonomy-service: "; systemctl is-active haxlab-autonomy.service 2>/dev/null || true
          echo -n "autonomy-timer: "; systemctl is-active haxlab-autonomy.timer 2>/dev/null || true
          uptime
          free -h
          ps -eo pid,user,%cpu,%mem,etime,comm,args --sort=-%cpu | head -15

# Firefox headroom verification 2026-09-30\n# FTMO priority pause 2026-09-30T13:15Z

# Persistent project pause for FTMO priority 2026-09-30T13:17Z
