name: HaxLab VPS

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - "deploy/**"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/vps-control.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "VPS action"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - deploy
          - restart-analyzer
          - player-stats
          - analyzer-logs
          - failed-analysis

permissions:
  contents: read

concurrency:
  group: haxlab-vps
  cancel-in-progress: false

jobs:
  vps:
    name: HaxLab VPS control
    runs-on: [self-hosted, linux, x64, haxlab]
    timeout-minutes: 30

    steps:
      - name: Select action
        id: select
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "action=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run HaxLab action
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.select.outputs.action }}" in
            status)
              sudo /usr/local/sbin/haxlab-actions-control status
              ;;
            deploy)
              sudo /usr/local/sbin/haxlab-actions-control deploy
              ;;
            restart-analyzer)
              sudo /usr/local/sbin/haxlab-actions-control restart-analyzer
              ;;
            player-stats)
              sudo /usr/local/sbin/haxlab-actions-control player-stats
              ;;
            analyzer-logs)
              sudo /usr/local/sbin/haxlab-actions-control analyzer-logs
              ;;
            failed-analysis)
              sudo /usr/local/sbin/haxlab-actions-control failed-analysis
              ;;
            *)
              echo "Unsupported action" >&2
              exit 2
              ;;
          esac
