name: HaxLab VPS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "VPS action"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - deploy
          - restart-analyzer
          - retry-failed-analysis
          - feature-smoke
          - player-stats
          - skill-leaderboard
          - training-manifest
          - start-training-shards
          - stop-training-shards
          - training-shards-status
          - analyzer-logs
          - failed-analysis

permissions:
  contents: read

concurrency:
  group: haxlab-vps-manual
  cancel-in-progress: false

jobs:
  vps:
    name: HaxLab VPS control
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 30

    steps:
      - name: Run HaxLab action
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            status)
              sudo /usr/local/sbin/haxlab-actions-control status
              ;;
            deploy)
              sudo /usr/local/sbin/haxlab-actions-control deploy
              ;;
            restart-analyzer)
              sudo /usr/local/sbin/haxlab-actions-control restart-analyzer
              ;;
            retry-failed-analysis)
              sudo /usr/local/sbin/haxlab-actions-control retry-failed-analysis
              ;;
            feature-smoke)
              sudo /usr/local/sbin/haxlab-actions-control feature-smoke
              ;;
            player-stats)
              sudo /usr/local/sbin/haxlab-actions-control player-stats
              ;;
            skill-leaderboard)
              sudo /usr/local/sbin/haxlab-actions-control skill-leaderboard
              ;;
            training-manifest)
              sudo /usr/local/sbin/haxlab-actions-control training-manifest
              ;;
            start-training-shards)
              sudo /usr/local/sbin/haxlab-actions-control start-training-shards
              ;;
            stop-training-shards)
              sudo /usr/local/sbin/haxlab-actions-control stop-training-shards
              ;;
            training-shards-status)
              sudo /usr/local/sbin/haxlab-actions-control training-shards-status
              ;;
            analyzer-logs)
              sudo /usr/local/sbin/haxlab-actions-control analyzer-logs
              ;;
            failed-analysis)
              sudo /usr/local/sbin/haxlab-actions-control failed-analysis
              ;;
            *)
              echo "Unsupported action" >&2
              exit 2
              ;;
          esac
