name: FTMO PR449 deploy-handoff exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr449-deploy-handoff-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr449-deploy-handoff-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 12
    env:
      TARGET_SHA: e3d90b2e657d01e5996dc1135f3e0420c77b47ff
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Checkout exact PR449 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr449-deploy-proof"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"

      - name: Run deploy lockstep regressions
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr449-deploy-proof"
          venv="$RUNNER_TEMP/ftmo-pr449-deploy-proof-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
          cd "$src"
          "$venv/bin/python" -m pytest -q \
            tests/test_autonomous_deploy_lockstep.py \
            tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR449_DEPLOY_LOCKSTEP_GREEN=1"

      - name: Persist proof receipt
        if: always()
        env:
          PROOF_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr449-proof-${GITHUB_RUN_ID}.json"
          python3 - <<'PY' > "$receipt"
          import json,os,socket
          print(json.dumps({
              "project":"ftmo",
              "pr":449,
              "target_sha":os.environ["TARGET_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "runner_host":socket.gethostname(),
              "result":os.environ["PROOF_RESULT"],
              "paid_cloud_budget_usd":os.environ.get("FTMO_AUTONOMOUS_CLOUD_BUDGET_USD"),
              "proof":["exact-sha-checkout","deploy-lockstep-regressions","zero-cost-workflow-boundaries"],
          },sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr449-deploy-handoff-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/Haxlab/contents/$path" \
            -f message="Record FTMO PR449 deploy proof ${GITHUB_RUN_ID}" \
            -f content="$encoded" >/dev/null
