name: zSSH public secret red-team proof

on:
  push:
    branches:
      - ops/zssh-secret-redteam-proof-20261003
    paths:
      - .github/workflows/zssh-secret-redteam-proof-20261003.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    env:
      ZSSH_TARGET_SHA: eb4c18ebb9ee850b9ecec1bb8a526ab5fc223721
    steps:
      - name: Verify VPS host
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"
          echo "ZSSH_REDTEAM_HOST=$(hostname)"
      - name: Checkout exact zSSH head
        uses: actions/checkout@v4
        with:
          repository: Zennay/zSSH
          ref: ${{ env.ZSSH_TARGET_SHA }}
          path: zssh-proof
          fetch-depth: 1
      - name: Prove exact checkout
        shell: bash
        working-directory: zssh-proof
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ZSSH_TARGET_SHA"
          echo "ZSSH_REDTEAM_EXACT_HEAD=$ZSSH_TARGET_SHA"
      - name: Install dependencies
        working-directory: zssh-proof
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run security red-team tests
        working-directory: zssh-proof
        run: node --test test/security.test.mjs
      - name: Run full zSSH suite
        working-directory: zssh-proof
        run: npm test
      - name: Prove raw-secret detector at runtime
        shell: bash
        working-directory: zssh-proof
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { containsCredentialLikeSecret, redactSecrets } from "./server.mjs";
          const fixtures = [
            ["sk-", "proj-", "abcdefghijklmnopqrstuvwxyz0123456789"].join(""),
            ["ghp_", "abcdefghijklmnopqrstuvwxyz0123456789"].join(""),
            ["AKIA", "1234567890ABCDEF"].join(""),
            ["xox", "b-", "1234567890-abcdefghijklmnop"].join(""),
            ["eyJhbGciOiJIUzI1NiJ9", ".", "eyJzdWIiOiJkZW1vIn0", ".", "signaturevalue"].join(""),
            ["https://operator:", "supersecret", "@example.invalid/path"].join(""),
          ];
          for (const value of fixtures) {
            if (!containsCredentialLikeSecret(value)) throw new Error("fixture escaped detector");
            if (redactSecrets(value) === value) throw new Error("fixture escaped redaction");
          }
          for (const value of ["sk-short", "release-tokenizer-design", "https://example.invalid/path"]) {
            if (containsCredentialLikeSecret(value)) throw new Error("false positive: " + value);
          }
          console.log("ZSSH_PUBLIC_SECRET_REDTEAM_GREEN=1");
          NODE
