name: RaiseAI PR22 exact-head Watch proof

on:
  push:
    branches:
      - ops/raiseai-pr22-proof-20261004
    paths:
      - ".github/workflows/raiseai-pr22-proof-20261004.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raiseai-pr22-proof-20261004
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 35
    env:
      TARGET_SHA: bc3d9d6e310db64c37c8ce3c2fdaae2daeda67c9
    steps:
      - name: Verify VPS execution host
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android 35 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          java -version
          python3 --version

      - name: Checkout RaiseAI PR22 exact head
        uses: actions/checkout@v4
        with:
          repository: Zennay/RaiseAI
          ref: ${{ env.TARGET_SHA }}
          path: raise-pr22

      - name: Prove physical validation release
        working-directory: raise-pr22
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

          bash -n install-watch-apk.command
          bash -n upgrade-watch.command
          bash -n provision-watch-gateway.command
          bash -n pull-diagnostics.command
          bash -n pull-watch-data.command
          bash -n physical-validation.command
          bash physical-validation.command --help >/dev/null

          expected="$(tr -d '\r\n' < VERSION.txt)"
          actual="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "$expected" = "1.5.1"
          test "$expected" = "$actual"

          python3 -m py_compile \
            tools/validate-watch-e2e-evidence.py \
            tools/analyze-watch-sensor-traces.py \
            tools/analyze-watch-sensor-trials.py
          python3 -m unittest discover -s tests -p 'test_watch_e2e_evidence_validator.py'
          python3 -m unittest discover -s tests -p 'test_watch_sensor_trace_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_watch_sensor_trial_analyzer.py'

          RAISE_BUILD_REVISION="$TARGET_SHA" ./gradlew --no-daemon testDebugUnitTest assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

          generated="$(find app/build/generated -type f -name 'BuildConfig.*' -print | head -n 1)"
          test -n "$generated"
          grep -F 'SOURCE_REVISION' "$generated"
          grep -F "$TARGET_SHA" "$generated"

          echo "RAISEAI_PR22_EXACT_HEAD_GREEN=$TARGET_SHA"
