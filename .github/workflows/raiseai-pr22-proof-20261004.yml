name: RaiseAI PR22 exact-head proof

on:
  push:
    branches:
      - ops/raiseai-pr22-proof-20261004-0103
    paths:
      - ".github/workflows/raiseai-pr22-proof-20261004.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raiseai-pr22-proof-20261004
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 35
    env:
      RAISE_SHA: f4abeea8c8ef1a3c5a9e0543488e6407b1e26343
    steps:
      - name: Verify VPS execution host
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "HOST=$(hostname)"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android 35 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          java -version
          python3 --version

      - name: Checkout RaiseAI exact PR22 head
        uses: actions/checkout@v4
        with:
          repository: Zennay/RaiseAI
          ref: ${{ env.RAISE_SHA }}
          path: raise-pr22

      - name: Prove physical-validation contracts and Watch APK
        working-directory: raise-pr22
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RAISE_SHA"
          bash -n pull-diagnostics.command
          bash -n pull-watch-data.command
          bash -n physical-validation.command
          bash physical-validation.command --help >/dev/null
          bash -n provision-watch-gateway.command
          bash -n install-watch-apk.command
          bash -n upgrade-watch.command
          test "$(tr -d '\r\n' < VERSION.txt)" = "1.5.1"
          python3 -m py_compile \
            tools/validate-watch-e2e-evidence.py \
            tools/analyze-watch-sensor-traces.py \
            tools/analyze-watch-sensor-trials.py
          python3 -m unittest discover -s tests -p 'test_watch_e2e_evidence_validator.py'
          python3 -m unittest discover -s tests -p 'test_watch_sensor_trace_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_watch_sensor_trial_analyzer.py'
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx1280m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=1 \
            testDebugUnitTest assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Record exact-head proof
        working-directory: raise-pr22
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RaiseAI PR22 exact-head proof"
            echo "host=$(hostname)"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "source_revision=$(git rev-parse HEAD)"
            echo "version=$(tr -d '\r\n' < VERSION.txt)"
            echo "apk_sha256=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')"
          } | tee ../raiseai-pr22-proof.txt

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaiseAI-pr22-proof-${{ github.run_id }}
          path: |
            raiseai-pr22-proof.txt
            raise-pr22/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
