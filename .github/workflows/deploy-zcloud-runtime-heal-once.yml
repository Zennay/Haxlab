name: Deploy zCloud runtime self-heal once

on:
  push:
    branches:
      - ops/deploy-zcloud-runtime-heal-20260928
    paths:
      - ".github/workflows/deploy-zcloud-runtime-heal-once.yml"

permissions:
  contents: read

concurrency:
  group: zcloud-runtime-heal-live-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    env:
      ZCLOUD_SHA: 26a3c5fcd24d28087eebf242372bcf35a6a08718
    steps:
      - name: Install guarded runtime self-heal
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d /tmp/zcloud-runtime-heal.XXXXXX)"
          trap 'rm -rf "$tmp"' EXIT

          git clone --filter=blob:none --no-checkout https://github.com/Zennay/zCloud.git "$tmp"
          git -C "$tmp" fetch --depth 1 origin "$ZCLOUD_SHA"
          git -C "$tmp" checkout --detach "$ZCLOUD_SHA"
          test "$(git -C "$tmp" rev-parse HEAD)" = "$ZCLOUD_SHA"

          bash -n "$tmp/scripts/zcloud-self-heal.sh"
          python3 -m unittest "$tmp/tests/test_self_heal_assets.py"

          sudo install -o root -g root -m 0755             "$tmp/scripts/zcloud-self-heal.sh"             /usr/local/sbin/zcloud-self-heal

          # Execute one reconciliation immediately; the existing persistent
          # minute timer owns all future checks.
          sudo systemctl start zcloud-self-heal.service
          sudo systemctl is-enabled --quiet zcloud-self-heal.timer
          sudo systemctl is-active --quiet zcloud-self-heal.timer

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"

          echo "=== project runtime state ==="
          systemctl is-active haxlab-ingest.service
          systemctl is-active haxlab-worker.service
          systemctl is-active haxlab-analyzer.service
          systemctl is-active haxlab-autonomy.timer
          systemctl is-active ftmo-autonomous.timer
          systemctl --user is-enabled zssh.service
          systemctl --user is-active zssh.service
          systemctl --user is-enabled raise-gateway.service
          systemctl --user is-active raise-gateway.service

          curl -fsS --max-time 5 http://127.0.0.1:8765/api/status >/dev/null
          echo "ZCLOUD_RUNTIME_HEAL_LIVE_GREEN"
