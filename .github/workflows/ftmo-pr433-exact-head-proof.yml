name: FTMO PR448 deploy and queue finalizer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr433-exact-head-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-pr448-deploy-finalizer-haxlab
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      QUEUE_ID: ftmo-7ee077e0b88278da
      EXACT_HEAD: 3034aa82c6dfae98803a4c15a105f56c8f94a9be
      MERGE_SHA: 920df21438332e57e2bd4027bdd0e8f68f922e8d
      DEPLOY_FIX_SHA: b03e28641dd2937327150bf3f654ae6e347f52cf
      FULL_TEST_RUN: '37020168266'
      PUBLICATION_RUN: '37020167847'
      CACHE_RUN: '37020167797'
      HAXLAB_PROOF_RUN: '37021001278'
      FTMO_ROOT: /opt/ftmo-autonomous

    steps:
      - name: Verify exact proofs on VPS
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          python3 - <<'PY'
          import json, os, subprocess

          expected = {
              int(os.environ["FULL_TEST_RUN"]): "Test suite",
              int(os.environ["PUBLICATION_RUN"]): "Provider foundation publication integrity proof",
              int(os.environ["CACHE_RUN"]): "Dukascopy resume-cache integrity proof",
          }
          for run_id, name in expected.items():
              run=json.loads(subprocess.check_output(
                  ["gh","api",f"repos/Zennay/Ftmo/actions/runs/{run_id}"], text=True
              ))
              if (run.get("status"),run.get("conclusion")) != ("completed","success"):
                  raise SystemExit(f"FTMO proof {run_id} not green")
              if run.get("name") != name or run.get("head_sha") != os.environ["EXACT_HEAD"]:
                  raise SystemExit(f"FTMO proof {run_id} identity mismatch")
          hax=json.loads(subprocess.check_output(
              ["gh","api",f"repos/Zennay/Haxlab/actions/runs/{os.environ['HAXLAB_PROOF_RUN']}"],
              text=True,
          ))
          if (hax.get("status"),hax.get("conclusion")) != ("completed","success"):
              raise SystemExit("HaxLab exact-head proof not green")
          print("FTMO_PR448_ALL_EXACT_PROOFS_GREEN=1")
          PY

      - name: Dispatch and prove canonical FTMO deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time

          merge=os.environ["MERGE_SHA"]
          deploy_fix=os.environ["DEPLOY_FIX_SHA"]

          def api(path):
              return json.loads(subprocess.check_output(["gh","api",path],text=True))

          def contains_required(head):
              if not head:
                  return False
              merge_comp=api(f"repos/Zennay/Ftmo/compare/{merge}...{head}")
              fix_comp=api(f"repos/Zennay/Ftmo/compare/{deploy_fix}...{head}")
              return (
                  merge_comp.get("status") in {"ahead","identical"}
                  and fix_comp.get("status") in {"ahead","identical"}
              )

          def matching():
              data=api("repos/Zennay/Ftmo/actions/workflows/deploy-autonomous-vps.yml/runs?per_page=30")
              return [
                  r for r in data.get("workflow_runs",[])
                  if r.get("name")=="Verify autonomous VPS runtime"
                  and contains_required(r.get("head_sha"))
              ]

          dispatched=False
          runs=matching()
          running=[r for r in runs if r.get("status")!="completed"]
          successful=[r for r in runs if r.get("status")=="completed" and r.get("conclusion")=="success"]
          if not running and not successful:
              subprocess.check_call([
                  "gh","workflow","run","deploy-autonomous-vps.yml",
                  "--repo","Zennay/Ftmo","--ref","main"
              ])
              dispatched=True
              print("FTMO_PR448_DEPLOY_DISPATCHED=1")

          chosen=None
          last_failure=None
          for _ in range(240):
              runs=matching()
              runs.sort(key=lambda r:r.get("created_at") or "", reverse=True)
              successes=[
                  r for r in runs
                  if r.get("status")=="completed" and r.get("conclusion")=="success"
              ]
              if successes:
                  chosen=successes[0]
                  break
              active=[r for r in runs if r.get("status")!="completed"]
              failures=[r for r in runs if r.get("status")=="completed"]
              if failures:
                  last_failure=failures[0]
              if not active and last_failure is not None and dispatched:
                  raise SystemExit(
                      f"dispatched canonical deployment failed: "
                      f"{last_failure.get('id')} {last_failure.get('conclusion')}"
                  )
              if not active and not dispatched:
                  subprocess.check_call([
                      "gh","workflow","run","deploy-autonomous-vps.yml",
                      "--repo","Zennay/Ftmo","--ref","main"
                  ])
                  dispatched=True
                  print("FTMO_PR448_DEPLOY_REDISPATCHED=1")
              time.sleep(5)

          if not chosen:
              raise SystemExit("no successful canonical deployment found")
          if not contains_required(chosen.get("head_sha")):
              raise SystemExit("deployment head does not contain PR448 merge and PR449 fix")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as h:
              h.write(f"DEPLOY_RUN={chosen['id']}\n")
              h.write(f"DEPLOY_HEAD={chosen['head_sha']}\n")
          print("FTMO_PR448_DEPLOY_GREEN="+json.dumps({
              "run_id":chosen["id"],"head_sha":chosen["head_sha"]
          },sort_keys=True))
          PY

      - name: Verify live runtime and finish SQLite queue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os, sqlite3, subprocess, sys
          from pathlib import Path

          def gh(path):
              return json.loads(subprocess.check_output(["gh","api",path],text=True))

          root=Path(os.environ["FTMO_ROOT"])
          status_path=root/".scratch/autonomy/status.json"
          if not status_path.is_file() or status_path.is_symlink():
              raise SystemExit("unsafe/missing FTMO runtime status")
          status=json.loads(status_path.read_text(encoding="utf-8"))
          research=status.get("research") or {}
          controller=status.get("research_controller") or {}
          loop=controller.get("generation_loop") or {}
          outcome=controller.get("outcome_execution") or {}
          compute=controller.get("compute") or {}
          revision=str(status.get("runtime_revision") or "")
          ancestry=gh(f"repos/Zennay/Ftmo/compare/{os.environ['MERGE_SHA']}...{revision}")
          if ancestry.get("status") not in {"ahead","identical"}:
              raise SystemExit("live runtime does not contain PR448 merge")
          if str(status.get("deployment_workflow_run_id") or "") != str(os.environ["DEPLOY_RUN"]):
              raise SystemExit("live deployment workflow id mismatch")
          required={
              "research_cycle_ok":status.get("research_cycle_ok") is True,
              "generation_29":research.get("generation_number")==29,
              "development_sealed":research.get("development_access_allowed") is False,
              "walk_forward_sealed":research.get("walk_forward_access_allowed") is False,
              "final_holdout_sealed":research.get("final_holdout_access_allowed") is False,
              "no_outcomes":loop.get("outcomes_executed") is False,
              "wf_not_accessed":loop.get("walk_forward_accessed") is False,
              "holdout_not_accessed":loop.get("final_holdout_accessed") is False,
              "live_false":status.get("live_trading_allowed") is False,
              "broker_false":status.get("broker_order_submission_allowed") is False,
              "controller_wf_false":outcome.get("walk_forward_accessed") is False,
              "controller_holdout_false":outcome.get("final_holdout_accessed") is False,
              "controller_broker_false":outcome.get("broker_order_submission_allowed") is False,
              "compute_ok":compute.get("ok") is True,
              "zero_cloud":str(status.get("autonomous_cloud_budget_usd"))=="0.00",
          }
          bad=[k for k,v in required.items() if not v]
          if bad:
              raise SystemExit("sealed runtime verification failed: "+",".join(bad))
          state=subprocess.check_output(
              ["systemctl","is-active","ftmo-autonomous-marathon.service"],text=True
          ).strip()
          pid=subprocess.check_output(
              ["systemctl","show","ftmo-autonomous-marathon.service","-p","MainPID","--value"],
              text=True,
          ).strip()
          if state!="active" or not pid.isdigit() or int(pid)<=0:
              raise SystemExit("FTMO marathon service not healthy")

          zroot=Path("/home/ubuntu/zennay-cloud")
          db=zroot/"history.db"
          server_path=zroot/"server.py"
          sys.path.insert(0,str(zroot))
          spec=importlib.util.spec_from_file_location("zcloud_live_server",server_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load live zCloud server")
          server=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          server.DB=db

          qid=os.environ["QUEUE_ID"]
          def read_queue():
              with sqlite3.connect(db) as c:
                  c.row_factory=sqlite3.Row
                  row=c.execute(
                      "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                      "FROM portfolio_queue WHERE queue_id=?",(qid,)
                  ).fetchone()
              return dict(row) if row else None

          item=read_queue()
          print("QUEUE_BEFORE="+json.dumps(item,sort_keys=True))
          if not item or item.get("project_id")!="ftmo":
              raise SystemExit("queue item missing/project mismatch")

          evidence=(
              "Worker1 Gen29 staged provider-publication integrity complete. PR #448 merged as "
              +os.environ["MERGE_SHA"]+" from exact head "+os.environ["EXACT_HEAD"]+". "
              "Native exact-head runs "+os.environ["FULL_TEST_RUN"]+", "
              +os.environ["PUBLICATION_RUN"]+", "+os.environ["CACHE_RUN"]+" SUCCESS; "
              "HaxLab exact-head VPS proof "+os.environ["HAXLAB_PROOF_RUN"]+" SUCCESS; "
              "canonical deploy/runtime verify "+os.environ["DEPLOY_RUN"]+" SUCCESS; "
              "Generation 29 OOS/live/broker boundaries sealed, cloud budget 0.00, marathon active."
          )

          if not (item["status"]=="done" and int(item["eligible"] or 0)==0 and item["worker_slot"] is None):
              if item["status"] not in {"claimed","running","verifying","in_progress"} or item["worker_slot"] is None:
                  raise SystemExit(
                      f"refusing queue mutation status={item['status']} "
                      f"eligible={item['eligible']} worker_slot={item['worker_slot']}"
                  )
              result=server.portfolio_queue_finish(
                  int(item["worker_slot"]),qid,"DONE",evidence
              )
              print("QUEUE_FINISH_RESULT="+json.dumps(result,sort_keys=True,default=str))

          final=read_queue()
          print("QUEUE_AFTER="+json.dumps(final,sort_keys=True))
          if not final or final["status"]!="done" or int(final["eligible"] or 0)!=0 or final["worker_slot"] is not None:
              raise SystemExit("queue final state not done/eligible=0/worker_slot=None")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as h:
              h.write(f"LIVE_REVISION={revision}\n")
              h.write(f"LIVE_STAGE={research.get('next_stage')}\n")
          print("FTMO_PR448_RUNTIME_AND_QUEUE_GREEN=1")
          PY

      - name: Persist durable finalizer receipt
        if: always()
        env:
          FINALIZER_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr448-finalizer-${GITHUB_RUN_ID}.json"
          python3 - <<'PY' > "$receipt"
          import json, os, sqlite3
          from pathlib import Path
          queue=None
          db=Path("/home/ubuntu/zennay-cloud/history.db")
          if db.is_file():
              with sqlite3.connect(db) as c:
                  c.row_factory=sqlite3.Row
                  row=c.execute(
                      "SELECT queue_id,project_id,status,eligible,worker_slot,evidence,updated_at "
                      "FROM portfolio_queue WHERE queue_id=?",(os.environ["QUEUE_ID"],)
                  ).fetchone()
                  queue=dict(row) if row else None
          print(json.dumps({
              "project":"ftmo",
              "queue_id":os.environ["QUEUE_ID"],
              "result":os.environ["FINALIZER_RESULT"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "exact_head":os.environ["EXACT_HEAD"],
              "merge_sha":os.environ["MERGE_SHA"],
              "deploy_fix_sha":os.environ["DEPLOY_FIX_SHA"],
              "proof_runs":{
                  "full_test":os.environ["FULL_TEST_RUN"],
                  "provider_publication":os.environ["PUBLICATION_RUN"],
                  "cache_integrity":os.environ["CACHE_RUN"],
                  "haxlab_exact_head":os.environ["HAXLAB_PROOF_RUN"],
              },
              "deploy_run":os.environ.get("DEPLOY_RUN"),
              "deploy_head":os.environ.get("DEPLOY_HEAD"),
              "live_revision":os.environ.get("LIVE_REVISION"),
              "live_stage":os.environ.get("LIVE_STAGE"),
              "queue_readback":queue,
          },sort_keys=True,default=str))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-${QUEUE_ID}-finalizer-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/Haxlab/contents/$path" \
            -f message="Record FTMO PR448 queue finalizer ${GITHUB_RUN_ID}" \
            -f content="$encoded" >/dev/null
          echo "FTMO_PR448_FINALIZER_RECEIPT=$path"
