name: FTMO PR433 exact-head proof via HaxLab

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr433-exact-head-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr433-exact-head-proof-haxlab
  cancel-in-progress: true

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      TARGET_SHA: ca639c3623a7354fd9254c4f8b565a126f0eab7d
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Verify VPS identity and fetch exact FTMO head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr433-exact-head"
          rm -rf "$src"
          gh repo clone Zennay/Ftmo "$src" -- --filter=blob:none --no-checkout >/dev/null
          git -C "$src" checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_head_sha=$TARGET_SHA"

      - name: Install isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr433-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr433-exact-head-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"

      - name: Compile changed runtime surface
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr433-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr433-exact-head-venv"
          "$venv/bin/python" -m compileall -q             "$src/src/prop_trading_ai/ops/autonomous_rollover.py"             "$src/src/prop_trading_ai/data/market/dukascopy_resume_cache.py"             "$src/src/prop_trading_ai/data/market/dukascopy_tick_resume_cache.py"

      - name: Prove semantic cache progress and sealed boundaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr433-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr433-exact-head-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q             tests/test_autonomous_provider_retry.py             tests/test_provider_foundation_publication.py             tests/test_dukascopy_resume_cache.py             tests/test_dukascopy_tick_resume_cache.py             tests/test_zero_cost_workflow_boundary.py
          echo "FTMO_PR433_TARGETED_GREEN=1"

      - name: Prove complete exact-head test suite
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr433-exact-head"
          venv="$RUNNER_TEMP/ftmo-pr433-exact-head-venv"
          cd "$src"
          "$venv/bin/python" -m pytest -q
          echo "FTMO_PR433_FULL_SUITE_GREEN=1"

      - name: Persist proof receipt
        if: always()
        env:
          PROOF_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="/tmp/ftmo-pr433-haxlab-${GITHUB_RUN_ID}.json"
          python3 - <<'PY' > "$receipt"
          import json, os, socket
          print(json.dumps({
              "project": "ftmo",
              "pr": 433,
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_host": socket.gethostname(),
              "result": os.environ["PROOF_RESULT"],
              "paid_cloud_budget_usd": os.environ.get("FTMO_AUTONOMOUS_CLOUD_BUDGET_USD"),
              "proof": [
                  "exact-sha-checkout",
                  "isolated-install",
                  "compile",
                  "resume-cache-provider-targeted-tests",
                  "provider-foundation-publication-tests",
                  "zero-cost-boundary-tests",
                  "full-exact-head-pytest-suite"
              ]
          }, sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr433-haxlab-proof-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/Zennay/Haxlab/contents/$path"             -f message="Record FTMO PR433 HaxLab proof run ${GITHUB_RUN_ID}"             -f content="$encoded" >/dev/null
          echo "FTMO_PR433_RECEIPT_PATH=$path"
