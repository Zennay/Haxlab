name: HaxLab V3 Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v3-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Wait for v3 and print skill leaderboard
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20

    steps:
      - name: Wait for v3 replay analysis
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..180}; do
            JSON="$(sudo /usr/local/sbin/haxlab-actions-control status | sed -n '/^{/,$p')"
            echo "$JSON"
            PENDING="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["analysis_pending"])' <<<"$JSON")"
            FAILED="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["analysis_failed"])' <<<"$JSON")"
            if [[ "$FAILED" != "0" ]]; then
              echo "v3 has failures: $FAILED" >&2
              exit 1
            fi
            if [[ "$PENDING" == "0" ]]; then
              echo "V3 analysis complete."
              exit 0
            fi
            sleep 5
          done
          echo "V3 analysis did not finish within 15 minutes." >&2
          exit 1

      - name: Skill leaderboard
        shell: bash
        run: |
          set -euo pipefail
          echo "=== V3 STATUS ==="
          sudo /usr/local/sbin/haxlab-actions-control status
          echo
          echo "=== HAXLAB SKILL V0.1 ==="
          sudo /usr/local/sbin/haxlab-actions-control skill-leaderboard
