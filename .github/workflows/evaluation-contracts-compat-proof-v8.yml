name: Evaluation additive contract compatibility v8

on:
  push:
    branches:
      - ops/evaluation-contracts-compat-v8-current-state-20261007
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-evaluation-contracts-compat-v8-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prove:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-v8]') }}
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      CARRIER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARRIER_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Checkout exact canonical Arena v2
        uses: actions/checkout@v5
        with:
          ref: ee5ab508e9d8504de12b7cbb5fdeca43a58ae1a4
          clean: true
          fetch-depth: 0

      - name: Verify canonical base and live carrier head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ee5ab508e9d8504de12b7cbb5fdeca43a58ae1a4"
          test -z "$(git status --porcelain)"
          carrier_head="$(git ls-remote --heads origin "refs/heads/$CARRIER_REF" | awk 'NR == 1 {print $1}')"
          test -n "$carrier_head"
          test "$carrier_head" = "$CARRIER_SHA"
          echo "HAXLAB_EVALUATION_COMPAT_V8_BASE=$(git rev-parse HEAD)"
          echo "HAXLAB_EVALUATION_COMPAT_V8_CARRIER=$carrier_head"

      - name: Verify additive validation heads are still live
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected owner_branch; do
            actual="$(git ls-remote --heads origin "refs/heads/${owner_branch}" | awk 'NR == 1 {print $1}')"
            test -n "${actual}"
            if [ "${actual}" != "${expected}" ]; then
              echo "stale validation head: ${owner_branch} expected=${expected} actual=${actual}" >&2
              exit 1
            fi
            echo "HAXLAB_EVALUATION_LIVE_HEAD ${owner_branch}=${actual}"
          done <<'EOF'
          df5184b54c40a0df4f73a2adb1923e8a85e3f87e validation/evaluation-no-assert-contract-20261007
          69646fd0817b162be31add2bf8e87be3cb9b4fc7 validation/evaluation-determinism-contract-20261007
