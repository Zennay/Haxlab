      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-contract-compat-v8-venv
          python3 -m venv .evaluation-contract-compat-v8-venv
          .evaluation-contract-compat-v8-venv/bin/pip install --upgrade pip
          .evaluation-contract-compat-v8-venv/bin/pip install -e '.[dev]'

      - name: Compile canonical evaluation and synthetic contracts
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-contract-compat-v8-venv/bin/python -m compileall -q             src/haxlab/evaluation             tests/test_evaluation_no_assert_contract.py             tests/test_evaluation_determinism_contract.py             tests/test_evaluation_hermeticity_contract.py             tests/test_evaluation_safe_deserialization_contract.py             tests/test_evaluation_control_plane_import_contract.py             tests/test_evaluation_import_purity_contract.py             tests/test_evaluation_exception_boundary_contract.py             tests/test_evaluation_global_state_contract.py             tests/test_evaluation_dynamic_loading_contract.py             tests/test_evaluation_process_state_contract.py             tests/test_evaluation_process_termination_contract.py             tests/test_evaluation_background_execution_contract.py             tests/test_evaluation_import_cycle_contract.py             tests/test_evaluation_immutability_bypass_contract.py             tests/test_evaluation_liveness_contract.py             tests/test_evaluation_filesystem_mutation_contract.py             tests/test_evaluation_runtime_output_purity_contract.py             tests/test_evaluation_mutable_defaults_contract.py             tests/test_evaluation_native_ffi_contract.py             tests/test_evaluation_memoization_state_contract.py             tests/test_evaluation_class_state_contract.py             tests/test_evaluation_function_attribute_state_contract.py             tests/test_evaluation_context_local_state_contract.py             tests/test_evaluation_module_object_state_contract.py             tests/test_evaluation_logging_warnings_state_contract.py             tests/test_evaluation_process_registry_contract.py             tests/test_evaluation_atexit_registry_contract.py

      - name: Run all additive evaluation validation contracts together
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" .evaluation-contract-compat-v8-venv/bin/pytest -q             tests/test_evaluation_no_assert_contract.py             tests/test_evaluation_determinism_contract.py             tests/test_evaluation_hermeticity_contract.py             tests/test_evaluation_safe_deserialization_contract.py             tests/test_evaluation_control_plane_import_contract.py             tests/test_evaluation_import_purity_contract.py             tests/test_evaluation_exception_boundary_contract.py             tests/test_evaluation_global_state_contract.py             tests/test_evaluation_dynamic_loading_contract.py             tests/test_evaluation_process_state_contract.py             tests/test_evaluation_process_termination_contract.py             tests/test_evaluation_background_execution_contract.py             tests/test_evaluation_import_cycle_contract.py             tests/test_evaluation_immutability_bypass_contract.py             tests/test_evaluation_liveness_contract.py             tests/test_evaluation_filesystem_mutation_contract.py             tests/test_evaluation_runtime_output_purity_contract.py             tests/test_evaluation_mutable_defaults_contract.py             tests/test_evaluation_native_ffi_contract.py             tests/test_evaluation_memoization_state_contract.py             tests/test_evaluation_class_state_contract.py             tests/test_evaluation_function_attribute_state_contract.py             tests/test_evaluation_context_local_state_contract.py             tests/test_evaluation_module_object_state_contract.py             tests/test_evaluation_logging_warnings_state_contract.py             tests/test_evaluation_process_registry_contract.py             tests/test_evaluation_atexit_registry_contract.py

