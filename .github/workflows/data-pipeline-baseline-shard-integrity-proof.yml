name: Data-pipeline BC baseline shard integrity proof

on:
  pull_request:
    branches:
      - main
    paths:
      - src/haxlab/learning/baseline.py
      - tests/test_bc_baseline.py
      - docs/bc-baseline-shard-integrity.md
      - .github/workflows/data-pipeline-baseline-shard-integrity-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pipeline-baseline-shard-integrity-exact-head
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify immutable candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run focused BC baseline shard-integrity proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-baseline-shard-proof
          .venv-baseline-shard-proof/bin/python -m pip install -q -e ".[dev]"
          .venv-baseline-shard-proof/bin/python -m py_compile src/haxlab/learning/baseline.py
          .venv-baseline-shard-proof/bin/python -m pytest -q tests/test_bc_baseline.py
          .venv-baseline-shard-proof/bin/python -m pytest --collect-only -q >"$RUNNER_TEMP/haxlab-baseline-shard-$GITHUB_RUN_ID.collect"
          test -s "$RUNNER_TEMP/haxlab-baseline-shard-$GITHUB_RUN_ID.collect"
          echo "HAXLAB_BASELINE_SHARD_INTEGRITY_PROOF=success"
