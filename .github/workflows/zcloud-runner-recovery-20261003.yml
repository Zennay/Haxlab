name: Recover zCloud production runner
# retrigger 2026-10-04T20:47Z: latest zCloud production deploys queued/pending

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zcloud-runner-recovery-20261003.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-zcloud-runner-recovery-20261003
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 6
    env:
      ZCLOUD_RUNNER_SERVICE: actions.runner.Zennay-zCloud.zcloud-vps-1.service
      PRIMARY_DEPLOY_RUN: "37163173461"
      CURRENT_DEPLOY_RUN: "37163260994"
    steps:
      - name: Recover only idle zCloud Actions listener
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          service="$ZCLOUD_RUNNER_SERVICE"
          pre_state="$(systemctl is-active "$service" || true)"
          pre_pid="$(systemctl show "$service" -p MainPID --value || true)"
          cgroup="$(systemctl show "$service" -p ControlGroup --value || true)"
          worker_before=0
          if [[ -n "$cgroup" && -r "/sys/fs/cgroup${cgroup}/cgroup.procs" ]]; then
            while read -r pid; do
              [[ -r "/proc/$pid/cmdline" ]] || continue
              cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
              if [[ "$cmd" == *"Runner.Worker"* ]]; then
                worker_before=1
                break
              fi
            done < "/sys/fs/cgroup${cgroup}/cgroup.procs"
          fi
          echo "ZCLOUD_RUNNER_PRE state=$pre_state pid=$pre_pid worker=$worker_before cgroup=$cgroup"

          if [[ "$worker_before" -eq 1 ]]; then
            action=preserve-active-worker
          else
            sudo -n systemctl reset-failed "$service" || true
            sudo -n systemctl restart "$service"
            action=restart-idle-listener
          fi

          for _ in $(seq 1 30); do
            post_state="$(systemctl is-active "$service" || true)"
            post_pid="$(systemctl show "$service" -p MainPID --value || true)"
            if [[ "$post_state" == "active" && "$post_pid" =~ ^[1-9][0-9]*$ && -r "/proc/$post_pid/cmdline" ]]; then
              post_cmd="$(tr '\0' ' ' < "/proc/$post_pid/cmdline")"
              if [[ "$post_cmd" == *"Runner.Listener"* || "$post_cmd" == *"runsvc.sh"* ]]; then
                echo "ZCLOUD_RUNNER_RECOVERY action=$action state=$post_state pid=$post_pid"
                exit 0
              fi
            fi
            sleep 2
          done
          systemctl --no-pager --full status "$service" || true
          exit 1

      - name: Verify production deploy scheduling
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            for run_id in "$PRIMARY_DEPLOY_RUN" "$CURRENT_DEPLOY_RUN"; do
              payload="$(curl -fsSL --max-time 10 \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/Zennay/zCloud/actions/runs/$run_id")"
              status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$payload")"
              conclusion="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$payload")"
              echo "ZCLOUD_PRODUCTION_RUN run_id=$run_id status=$status conclusion=$conclusion"
              if [[ "$status" == "in_progress" || "$status" == "completed" ]]; then
                exit 0
              fi
            done
            sleep 4
          done
          echo "No zCloud production deploy left the queue after recovery" >&2
          exit 1
