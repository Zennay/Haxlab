name: Validate Arena v2 integration head

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arena-v2-integration-validate.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character commit SHA to validate
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 30
    steps:
      - name: Validate immutable requested SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Mutable Arena validation ref::workflow_dispatch requires an exact 40-character lowercase commit SHA"
            exit 1
          fi

      - name: Checkout requested Arena v2 ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 1
          clean: true

      - name: Verify exact requested SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error title=Arena validation provenance mismatch::checked out $ACTUAL_SHA, expected $EXPECTED_SHA"
            exit 1
          fi
          echo "ARENA_VALIDATION_EXPECTED_SHA=$EXPECTED_SHA"

      - name: Create isolated Arena test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .arena-ci-venv
          python3 -m venv .arena-ci-venv
          .arena-ci-venv/bin/pip install --upgrade pip
          .arena-ci-venv/bin/pip install -e '.[dev]'

      - name: Validate Python and Arena v2 contracts
        shell: bash
        run: |
          set -euo pipefail
          .arena-ci-venv/bin/python -m compileall -q src tests
          NODE_PATH=/opt/haxlab/node_modules node --check tools/elite_closed_loop_arena_v2.js
          NODE_PATH=/opt/haxlab/node_modules node tests/test_closed_loop_arena_v2.js
          PYTHONPATH="$GITHUB_WORKSPACE/src" .arena-ci-venv/bin/python - <<'PY'
          import runpy
          ns = runpy.run_path("tests/test_closed_loop_arena.py")
          names = [
              "test_initial_policy_is_fail_closed_until_calibrated",
              "test_identity_reference_passes_relative_checks",
              "test_context_adaptation_regression_rejects_behavior_gate",
              "test_safety_controller_invalidates_raw_policy_arena",
              "test_calibrated_policy_adds_absolute_strength_gate",
          ]
          for name in names:
              ns[name]()
              print("ARENA_TEST_PASS", name)
          PY

      - name: Run focused pytest regression set
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" .arena-ci-venv/bin/pytest -q \
            tests/test_closed_loop_arena.py \
            tests/test_duel_gate.py \
            tests/test_multisource_duel.py \
            tests/test_promotion.py

      - name: Record integration evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "ARENA_VALIDATION_HEAD=$(git rev-parse HEAD)"
          echo "ARENA_VALIDATION_BRANCH=$(git branch --show-current)"
          echo "ARENA_VALIDATION_RESULT=green"
