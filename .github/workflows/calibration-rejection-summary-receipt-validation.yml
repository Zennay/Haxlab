name: Calibration rejection summary receipt validation

on:
  push:
    branches:
      - validation/calibration-rejection-summary-receipt-20261007
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: haxlab-calibration-rejection-summary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Verify exact live head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 {print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "${{ github.sha }}"
          echo "HAXLAB_CALIBRATION_REJECTION_SUMMARY_HEAD=$remote_head"

      - name: Create isolated proof environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .calibration-rejection-summary-venv
          python3 -m venv .calibration-rejection-summary-venv
          .calibration-rejection-summary-venv/bin/pip install --upgrade pip
          .calibration-rejection-summary-venv/bin/pip install -e '.[dev]'

      - name: Compile focused contracts
        shell: bash
        run: |
          set -euo pipefail
          .calibration-rejection-summary-venv/bin/python -m py_compile             tests/test_calibration_rejection_summary_contract.py             tests/test_calibration_summary_pythonpath_contract.py             tests/test_calibration_workflow_evidence_contract.py             src/haxlab/evaluation/calibration_gate.py

      - name: Run focused and adjacent calibration regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src"             .calibration-rejection-summary-venv/bin/pytest -q               tests/test_calibration_rejection_summary_contract.py               tests/test_calibration_summary_pythonpath_contract.py               tests/test_calibration_workflow_evidence_contract.py               tests/test_calibration_cross_sha_resume_contract.py               tests/test_calibration_gate.py               tests/test_calibration_resume.py

      - name: Record green result
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_CALIBRATION_REJECTION_SUMMARY_RESULT=green"

      - name: Publish exact-head proof receipt
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 408,
              body: [
                `Exact-head self-hosted proof: **${success ? "SUCCESS" : "FAILURE"}**`,
                "",
                `- run: \`${context.runId}\``,
                `- exact/live head: \`${context.sha}\``,
                `- branch: \`${context.ref.replace("refs/heads/", "")}\``,
                `- job status: \`${process.env.JOB_STATUS}\``,
                "- focused summary-order + existing evidence/PYTHONPATH/cross-SHA/gate/resume regressions required on success",
                "- green marker: `HAXLAB_CALIBRATION_REJECTION_SUMMARY_RESULT=green`",
              ].join("\n"),
            });
