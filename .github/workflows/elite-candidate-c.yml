name: Elite Candidate C Rollout Robustness

on:
  push:
    branches:
      - experiment/candidate-c-rollout-robustness

permissions:
  contents: read

jobs:
  candidate-c:
    if: contains(github.event.head_commit.message, '[candidate-c]')
    concurrency:
      group: haxlab-elite-candidate-c
      cancel-in-progress: true
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen Candidate C inputs
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src"             /opt/haxlab/.venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = {
              Path("/var/lib/haxlab/derived/training/elite-player-candidate-b/shards/train/_index.json"):
                  "920ca18fdbc3682130307c01f91d61ad745d6642824f19962c6a2c614ffe1923",
              Path("/var/lib/haxlab/derived/training/elite-player-candidate-b/shards/validation/_index.json"):
                  "baaa00830ec3906640e893344262282d931de15b7a1c5c63485df1da44d6ba27",
              Path("/var/lib/haxlab/derived/training/elite-player-candidate-b/shards/holdout/_index.json"):
                  "a80b9789547ba3befd993bfd4c62c84b2c2c999a6d9283d9b2ef3c08451083fe",
              Path("/var/lib/haxlab/derived/evaluation/candidate-c-holdout-v1/frozen-manifest.json"):
                  "1d73bc436cda03a1d9f5db0f2c36479c415d5074468b45c5f188097b6157b3e1",
          }
          for path, wanted in expected.items():
              if not path.exists():
                  raise SystemExit(f"missing frozen input: {path}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != wanted:
                  raise SystemExit(
                      f"frozen input hash mismatch: {path}: {actual} != {wanted}"
                  )

          root = Path("/var/lib/haxlab/derived/evaluation/candidate-c-holdout-v1")
          manifest = json.loads((root / "frozen-manifest.json").read_text())
          for name, wanted in manifest["files_sha256"].items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != wanted:
                  raise SystemExit(
                      f"evaluation file hash mismatch: {name}: {actual} != {wanted}"
                  )
          print(json.dumps({
              "training_index_hashes_verified": 3,
              "evaluation_manifest_verified": True,
              "source_replay_sha256": manifest["source_replay_sha256"],
              "scenario_count": manifest["scenario_count"],
          }, indent=2))
          PY

      - name: Clear stale Candidate C evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab rm -rf             /var/lib/haxlab/derived/training/elite-player-candidate-c             /var/lib/haxlab/derived/training/elite-champions-candidate-c
          sudo -u haxlab rm -f             /tmp/haxlab-candidate-c-replay.json             /tmp/haxlab-candidate-c-live-replay.json             /tmp/candidate-c-evolution.json             /tmp/haxlab-candidate-c.log
          rm -f candidate-c-*.json candidate-c-*.log frozen-manifest.json

      - name: Train Candidate C with AM ST rollout robustness
        shell: bash
        run: |
          set -euo pipefail
          OUT=/var/lib/haxlab/derived/training/elite-player-candidate-c/model
          sudo -u haxlab mkdir -p "$OUT"
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src"             /opt/haxlab/.venv/bin/python -m haxlab.learning.elite             --train-index /var/lib/haxlab/derived/training/elite-player-candidate-b/shards/train/_index.json             --validation-index /var/lib/haxlab/derived/training/elite-player-candidate-b/shards/validation/_index.json             --holdout-index /var/lib/haxlab/derived/training/elite-player-candidate-b/shards/holdout/_index.json             --output-dir "$OUT"             --window 8             --sequence-stride 1             --hidden-dim 128             --hidden-dim-2 96             --epochs 3             --batch-size 2048             --learning-rate 0.0008             --l2 0.00001             --future-horizon-steps 5             --future-loss-weight 0.35             --state-jitter-std 0.10             --seed 1337             | tee /tmp/haxlab-candidate-c.log

      - name: Run Candidate C scripted sandbox
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/var/lib/haxlab/derived/evaluation/candidate-c-holdout-v1
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node             "$GITHUB_WORKSPACE/tools/elite_sandbox_benchmark.js"             --model /var/lib/haxlab/derived/training/elite-player-candidate-c/model/runtime-model.json             --stadium "$ROOT/stadium.hbs"             --matches 12             --minutes 1.5             --sample-every 6             --output /var/lib/haxlab/derived/training/elite-player-candidate-c/sandbox-benchmark.json

      - name: Build frozen replay-seeded challenger evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/var/lib/haxlab/derived/evaluation/candidate-c-holdout-v1
          LIVE_RUNTIME="$(
            sudo -u haxlab /opt/haxlab/.venv/bin/python -c               'import json; print(json.load(open("/var/lib/haxlab/derived/champions/elite-player/current.json"))["runtime_model_path"])'
          )"

          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node             "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js"             --model /var/lib/haxlab/derived/training/elite-player-candidate-c/model/runtime-model.json             --stadium "$ROOT/stadium.hbs"             --scenarios "$ROOT/scenarios.json"             --max-scenarios 16             --seconds 30             --sample-every 6             --disable-recovery             --output /tmp/haxlab-candidate-c-replay.json

          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node             "$GITHUB_WORKSPACE/tools/elite_replay_scenario_benchmark.js"             --model "$LIVE_RUNTIME"             --stadium "$ROOT/stadium.hbs"             --scenarios "$ROOT/scenarios.json"             --max-scenarios 16             --seconds 30             --sample-every 6             --disable-recovery             --output /tmp/haxlab-candidate-c-live-replay.json

          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src"             /opt/haxlab/.venv/bin/python -m haxlab.evaluation.replay_duel             /tmp/haxlab-candidate-c-replay.json             /tmp/haxlab-candidate-c-live-replay.json             --output /var/lib/haxlab/derived/training/elite-player-candidate-c/replay-seeded-duel.json

      - name: Seed isolated Candidate C registry from live champion
        shell: bash
        run: |
          set -euo pipefail
          CHAMPIONS=/var/lib/haxlab/derived/training/elite-champions-candidate-c
          LIVE_POINTER=/var/lib/haxlab/derived/champions/elite-player/current.json
          sudo -u haxlab mkdir -p "$CHAMPIONS"
          sudo -u haxlab env             LIVE_POINTER="$LIVE_POINTER"             CHAMPIONS="$CHAMPIONS"             /opt/haxlab/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          live = json.loads(Path(os.environ["LIVE_POINTER"]).read_text())
          model_dir = Path(live["model_path"]).parent
          for required in ("model.npz", "metrics.json", "runtime-model.json"):
              path = model_dir / required
              if not path.exists():
                  raise SystemExit(f"missing live champion artifact: {path}")

          current = {
              "candidate_id": f"live-{live['version_id']}",
              "promoted_at": live.get("updated_at"),
              "source_ref": live["version_id"],
              "artifact_dir": str(model_dir),
              "model_dir": str(model_dir),
          }
          registry = {
              "schema": "haxlab-elite-champion-registry-v1",
              "current": current,
              "history": [],
          }
          root = Path(os.environ["CHAMPIONS"])
          (root / "registry.json").write_text(
              json.dumps(registry, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "current.json").write_text(
              json.dumps(current, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Evaluate Candidate C against current champion
        shell: bash
        run: |
          set -euo pipefail
          CHAMPIONS=/var/lib/haxlab/derived/training/elite-champions-candidate-c
          ROOT=/var/lib/haxlab/derived/evaluation/candidate-c-holdout-v1
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-8)"
          set +e
          sudo -u haxlab env             PYTHONPATH="$GITHUB_WORKSPACE/src"             NODE_PATH=/opt/haxlab/node_modules             /opt/haxlab/.venv/bin/python -m haxlab.learning.evolution             --registry "$CHAMPIONS/registry.json"             --champions-root "$CHAMPIONS"             --candidate-id "candidate-c-$SHORT_SHA"             --candidate-model-dir /var/lib/haxlab/derived/training/elite-player-candidate-c/model             --metrics /var/lib/haxlab/derived/training/elite-player-candidate-c/model/metrics.json             --sandbox /var/lib/haxlab/derived/training/elite-player-candidate-c/sandbox-benchmark.json             --stadium "$ROOT/stadium.hbs"             --duel-script "$GITHUB_WORKSPACE/tools/elite_model_duel.js"             --duel-evidence /var/lib/haxlab/derived/training/elite-player-candidate-c/replay-seeded-duel.json             --duel-matches 12             --duel-minutes 2             --duel-seed 1337             --sample-every-ticks 6             --source-ref "$GITHUB_SHA"             --output /tmp/candidate-c-evolution.json
          EVOLUTION_CODE=$?
          set -e
          echo "evolution exit=$EVOLUTION_CODE"
          cat /tmp/candidate-c-evolution.json

      - name: Collect Candidate C evidence
        if: always()
        shell: bash
        run: |
          set -u
          ROOT=/var/lib/haxlab/derived/evaluation/candidate-c-holdout-v1
          MODEL=/var/lib/haxlab/derived/training/elite-player-candidate-c/model
          TRAINING=/var/lib/haxlab/derived/training/elite-player-candidate-c

          copy_haxlab() {
            local src="$1"
            local dst="$2"
            if sudo -u haxlab test -f "$src"; then
              sudo -u haxlab cat "$src" > "$dst"
            fi
          }

          copy_haxlab "$MODEL/metrics.json" candidate-c-metrics.json
          copy_haxlab "$TRAINING/sandbox-benchmark.json" candidate-c-sandbox-benchmark.json
          copy_haxlab "$TRAINING/replay-seeded-duel.json" candidate-c-replay-seeded-duel.json
          copy_haxlab "$ROOT/frozen-manifest.json" frozen-manifest.json
          copy_haxlab "$ROOT/source.json" candidate-c-source.json
          copy_haxlab "$ROOT/scenarios.json" candidate-c-scenarios.json

          [ -f /tmp/haxlab-candidate-c-replay.json ] &&             cp /tmp/haxlab-candidate-c-replay.json candidate-c-replay-benchmark.json
          [ -f /tmp/haxlab-candidate-c-live-replay.json ] &&             cp /tmp/haxlab-candidate-c-live-replay.json live-champion-replay-benchmark.json
          [ -f /tmp/candidate-c-evolution.json ] &&             cp /tmp/candidate-c-evolution.json candidate-c-evolution.json
          [ -f /tmp/haxlab-candidate-c.log ] &&             cp /tmp/haxlab-candidate-c.log candidate-c-training.log

      - name: Upload Candidate C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-candidate-c-rollout-robustness
          path: |
            candidate-c-metrics.json
            candidate-c-sandbox-benchmark.json
            candidate-c-replay-seeded-duel.json
            candidate-c-replay-benchmark.json
            live-champion-replay-benchmark.json
            candidate-c-evolution.json
            candidate-c-training.log
            candidate-c-source.json
            candidate-c-scenarios.json
            frozen-manifest.json
          if-no-files-found: warn
          retention-days: 30
