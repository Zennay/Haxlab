name: Evaluation Cross-Workflow Contract c0ec Proof

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character candidate SHA
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    steps:
      - name: Validate immutable candidate SHA
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Mutable proof ref::exact 40-character lowercase commit SHA required"
            exit 1
          fi

      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          clean: true

      - name: Verify exact validation head
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error title=Cross-workflow validation provenance mismatch::checked out $ACTUAL_SHA, expected $EXPECTED_SHA"
            exit 1
          fi
          echo "HAXLAB_EVALUATION_CROSS_WORKFLOW_HEAD=$ACTUAL_SHA"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .evaluation-cross-workflow-venv
          python3 -m venv .evaluation-cross-workflow-venv
          .evaluation-cross-workflow-venv/bin/pip install --upgrade pip
          .evaluation-cross-workflow-venv/bin/pip install -e '.[dev]'

      - name: Run cross-workflow contract regressions
        shell: bash
        run: |
          set -euo pipefail
          .evaluation-cross-workflow-venv/bin/python -m pytest -q tests/test_evaluation_cross_workflow_contract.py

      - name: Record focused proof
        shell: bash
        run: |
          set -euo pipefail
          echo "HAXLAB_EVALUATION_CROSS_WORKFLOW_CONTRACT=success"
