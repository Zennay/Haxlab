name: Multisource suite config integrity validation

on:
  push:
    branches:
      - validation/multisource-suite-config-integrity-20261006
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haxlab-multisource-suite-config-integrity-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .multisource-suite-config-validation-venv
          python3 -m venv .multisource-suite-config-validation-venv
          .multisource-suite-config-validation-venv/bin/pip install --upgrade pip
          .multisource-suite-config-validation-venv/bin/pip install -e '.[dev]'

      - name: Compile multisource suite code
        shell: bash
        run: |
          set -euo pipefail
          .multisource-suite-config-validation-venv/bin/python -m compileall -q \
            src/haxlab/evaluation/multisource_suite.py \
            tests/test_multisource_suite.py

      - name: Run multisource suite regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .multisource-suite-config-validation-venv/bin/pytest -q \
              tests/test_multisource_suite.py

      - name: Record exact-head validation evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "MULTISOURCE_SUITE_CONFIG_VALIDATION_HEAD=$(git rev-parse HEAD)"
          echo "MULTISOURCE_SUITE_CONFIG_VALIDATION_RESULT=green"
