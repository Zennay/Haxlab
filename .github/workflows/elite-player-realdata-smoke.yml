name: Elite Player Real-Data Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "src/haxlab/learning/elite*.py"
      - "src/haxlab/analysis/roles.py"
      - "tools/extract_elite_imitation.js"
      - "tools/extract_stadium_from_replay.js"
      - "tools/elite_features.js"
      - "tools/elite_tactics.js"
      - "tools/elite_policy_runtime.js"
      - "tools/elite_bot_plugin.js"
      - "tools/elite_sandbox_benchmark.js"
      - "configs/player_aliases.json"
      - ".github/workflows/elite-player-realdata-smoke.yml"

permissions:
  contents: read

concurrency:
  group: haxlab-elite-realdata-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.head_ref == 'feature/elite-4v4-player-v01'
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Build branch leaderboard from real analyses
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab mkdir -p /var/lib/haxlab/derived/leaderboards
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.skill.leaderboard \
            --root /var/lib/haxlab/derived/state-pass-v4 \
            --top 10000 \
            --min-matches 1 \
            --min-minutes 0 \
            --aliases "$GITHUB_WORKSPACE/configs/player_aliases.json" \
            --format json \
            --output /var/lib/haxlab/derived/leaderboards/elite-pr-smoke.json \
            >/tmp/haxlab-elite-pr-leaderboard.json

      - name: Run small real-data pipeline
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab rm -rf /var/lib/haxlab/derived/training/elite-player-pr-smoke
          sudo -u haxlab env \
            PYTHONPATH="$GITHUB_WORKSPACE/src" \
            NODE_PATH=/opt/haxlab/node_modules \
            /opt/haxlab/.venv/bin/python -m haxlab.learning.elite_pipeline \
            --analysis-root /var/lib/haxlab/derived/state-pass-v4 \
            --leaderboard /var/lib/haxlab/derived/leaderboards/elite-pr-smoke.json \
            --raw-root /var/lib/haxlab/raw/replays \
            --work-root /var/lib/haxlab/derived/training/elite-player-pr-smoke \
            --node-script "$GITHUB_WORKSPACE/tools/extract_elite_imitation.js" \
            --aliases "$GITHUB_WORKSPACE/configs/player_aliases.json" \
            --replay-limit 20 \
            --epochs 1 \
            --window 4 \
            --sequence-stride 2 \
            --hidden-dim 32 \
            --hidden-dim-2 24 \
            --batch-size 512 \
            --shard-workers 2 \
            | tee /tmp/haxlab-elite-pr-smoke.log

      - name: Load trained model and act as all four roles
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python - <<'PY'
          from pathlib import Path
          from haxlab.learning.elite_runtime import ElitePolicy

          model_dir = Path(
              "/var/lib/haxlab/derived/training/elite-player-pr-smoke/model"
          )
          policy = ElitePolicy(model_dir)
          features = {name: 0.0 for name in policy.input_columns}

          for role in ("gk", "dm", "am", "st"):
              action = policy.act(
                  agent_id=f"smoke-{role}",
                  role=role,
                  features=features,
              )
              assert action["dir_x"] in (-1, 0, 1)
              assert action["dir_y"] in (-1, 0, 1)
              assert isinstance(action["kick"], bool)
              assert 0.0 <= action["kick_probability"] <= 1.0
              print(role, action)
          PY

      - name: Extract replay stadium and run local 4v4 sandbox benchmark
        shell: bash
        run: |
          set -euo pipefail

          RAW_REPLAY="$(
            /opt/haxlab/.venv/bin/python - <<'PY'
          import sqlite3
          db = sqlite3.connect("/var/lib/haxlab/state/haxlab.sqlite3")
          row = db.execute("""
          SELECT r.archive_path
          FROM source_files s
          JOIN raw_replays r ON r.sha256 = s.sha256
          WHERE lower(s.source_path) LIKE '%kjambvsado%'
          ORDER BY s.last_seen_at DESC
          LIMIT 1
          """).fetchone()
          if row:
              print(row[0])
          PY
          )"

          test -n "$RAW_REPLAY"
          test -f "$RAW_REPLAY"

          NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_stadium_from_replay.js" \
            "$RAW_REPLAY" \
            /tmp/haxlab-benchmark-stadium.hbs

          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_sandbox_benchmark.js" \
            --model /var/lib/haxlab/derived/training/elite-player-pr-smoke/model/runtime-model.json \
            --stadium /tmp/haxlab-benchmark-stadium.hbs \
            --matches 6 \
            --minutes 0.5 \
            --sample-every 6 \
            --output /var/lib/haxlab/derived/training/elite-player-pr-smoke/sandbox-benchmark.json

          sudo cat /var/lib/haxlab/derived/training/elite-player-pr-smoke/sandbox-benchmark.json

      - name: Surface smoke metrics
        shell: bash
        run: |
          set -euo pipefail
          sudo cat /var/lib/haxlab/derived/training/elite-player-pr-smoke/pipeline-summary.json \
            > elite-realdata-smoke-summary.json
          {
            echo '## Elite Player real-data smoke'
            echo
            echo '\`\`\`json'
            cat elite-realdata-smoke-summary.json
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: elite-realdata-smoke-summary
          path: elite-realdata-smoke-summary.json
          retention-days: 7
