name: HaxLab transient service snapshot exact-head proof

on:
  push:
    branches:
      - fix/data-pipeline-transient-service-capture-20261012
    paths:
      - deploy/update-service-recovery.sh
      - tests/test_update_service_recovery.py
      - docs/vps-update-failure-recovery.md
      - .github/workflows/data-pipeline-transient-service-capture-proof.yml

permissions:
  contents: read

concurrency:
  group: haxlab-transient-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
      - name: Assert exact HEAD before testing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Test bounded service-state capture without touching live services
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/update-service-recovery.sh
          python3 -m venv .service-capture-venv
          .service-capture-venv/bin/python -m pip install -q -e '.[dev]'
          .service-capture-venv/bin/python -m compileall -q tests/test_update_service_recovery.py
          .service-capture-venv/bin/python -m pytest -q tests/test_update_service_recovery.py
