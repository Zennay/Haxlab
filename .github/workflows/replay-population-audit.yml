name: HaxLab 4v4 Population Audit

on:
  push:
    branches:
      - feature/elite-4v4-player-v01

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[audit4v4]')
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Audit all state-pass-v4 replays
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.evaluation.replay_population_audit \
            --root /var/lib/haxlab/derived/state-pass-v4 \
            --output /tmp/haxlab-4v4-population-audit.json

          cp /tmp/haxlab-4v4-population-audit.json replay-population-audit.json
          cat replay-population-audit.json
          echo '## HaxLab 4v4 Population Audit' >> "$GITHUB_STEP_SUMMARY"
          cat replay-population-audit.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: haxlab-4v4-population-audit
          path: replay-population-audit.json
          retention-days: 30
