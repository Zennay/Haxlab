name: Temporary zCloud prechange diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-promote-temp.yml"

permissions:
  contents: read

concurrency:
  group: temporary-zcloud-promotion
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    steps:
      - name: zCloud health
        shell: bash
        run: |
          set -euo pipefail
          /home/ubuntu/.local/bin/zcloud-healthcheck || true
      - name: Exact pre-change guard evidence
        shell: bash
        run: |
          set -uo pipefail
          /home/ubuntu/.local/bin/zcloud-prechange-guard --json
          code=$?
          echo "PRECHANGE_EXIT=$code"
          exit 0
