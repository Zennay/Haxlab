name: Temporary zCloud guarded promotion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-promote-temp.yml"

permissions:
  contents: read

concurrency:
  group: temporary-zcloud-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 15
    steps:
      - name: Check out exact green zCloud revision
        uses: actions/checkout@v4
        with:
          repository: Zennay/zCloud
          ref: bd8902449fb0ef787eff99bab2b26820dac64379
          path: zcloud-candidate
          persist-credentials: false

      - name: Preserve live resource priorities in pre-change gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/zcloud-prechange-preserve-resource-policy <<'SH'
          #!/usr/bin/env bash
          exec /home/ubuntu/.local/bin/zcloud-prechange-guard "$@" --allow-change resource-policy.json
          SH
          chmod +x /tmp/zcloud-prechange-preserve-resource-policy
          /tmp/zcloud-prechange-preserve-resource-policy --json

      - name: Promote backend and autonomy policy guarded
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/zcloud-candidate/scripts/zcloud_transactional_promote.py" \
            --candidate "$GITHUB_WORKSPACE/zcloud-candidate" \
            --path server.py \
            --path autonomy-policy.json \
            --prechange /tmp/zcloud-prechange-preserve-resource-policy \
            --actor "haxlab-runner-zcloud-transport" \
            --json

      - name: Promote Firefox runner guarded
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/zcloud-candidate/scripts/zcloud_transactional_promote.py" \
            --candidate "$GITHUB_WORKSPACE/zcloud-candidate" \
            --path firefox-extension/background.js \
            --prechange /tmp/zcloud-prechange-preserve-resource-policy \
            --actor "haxlab-runner-zcloud-transport" \
            --json

      - name: Final zCloud autonomy evidence
        shell: bash
        run: |
          set -euo pipefail
          /home/ubuntu/.local/bin/zcloud-healthcheck
          curl -fsS http://127.0.0.1:8765/api/runner-targets >/tmp/zcloud-runner-targets.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/zcloud-runner-targets.json'))
          projects=p.get('projects') or {}
          supa=projects.get('supa::w1') or {}
          hax=projects.get('haxlab::w1') or {}
          ftmo=projects.get('ftmo::w1') or {}
          assert supa.get('vps_dispatch_only') is True, supa
          assert int(supa.get('ai_dispatch_interval_seconds') or 0) == 600, supa
          assert hax.get('vps_dispatch_only') is True, hax
          assert ftmo.get('vps_dispatch_only') is True, ftmo
          print('ZCLOUD_VPS_AI_DISPATCH_LIVE_GREEN')
          PY
