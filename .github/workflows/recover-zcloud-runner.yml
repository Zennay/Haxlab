name: Recover zCloud Actions Runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-zcloud-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5
    steps:
      - name: Recover zCloud runner on shared VPS
        shell: bash
        run: |
          set -euo pipefail
          echo "=== system runner units ==="
          systemctl list-unit-files --type=service --no-pager | grep -Ei 'actions\.runner|zcloud' || true
          echo "=== user runner units ==="
          systemctl --user list-unit-files --type=service --no-pager | grep -Ei 'actions\.runner|zcloud' || true

          mapfile -t system_units < <(
            systemctl list-unit-files --type=service --no-legend 2>/dev/null |
            awk '{print $1}' |
            grep -Ei '^actions\.runner\..*zcloud.*\.service$' || true
          )
          mapfile -t user_units < <(
            systemctl --user list-unit-files --type=service --no-legend 2>/dev/null |
            awk '{print $1}' |
            grep -Ei '^actions\.runner\..*zcloud.*\.service$' || true
          )

          if (( ${#system_units[@]} == 0 && ${#user_units[@]} == 0 )); then
            echo "No zCloud Actions runner service found" >&2
            exit 2
          fi

          recovered=0
          for unit in "${system_units[@]}"; do
            echo "Attempting system recovery for $unit"
            if sudo -n systemctl restart "$unit"; then
              sudo -n systemctl is-active "$unit"
              recovered=1
            else
              echo "sudo restart failed for $unit"
            fi
          done
          for unit in "${user_units[@]}"; do
            echo "Attempting user recovery for $unit"
            if systemctl --user restart "$unit"; then
              systemctl --user is-active "$unit"
              recovered=1
            else
              echo "user restart failed for $unit"
            fi
          done

          if (( recovered == 0 )); then
            echo "Found zCloud runner but could not restart it" >&2
            exit 3
          fi

          sleep 3
          echo "=== recovered status ==="
          for unit in "${system_units[@]}"; do sudo -n systemctl --no-pager --full status "$unit" || true; done
          for unit in "${user_units[@]}"; do systemctl --user --no-pager --full status "$unit" || true; done
