# emergency zCloud restore trigger 2026-10-06T06:16Z
name: Recover zCloud Actions Runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-zcloud-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5
    steps:
      - name: Recover zCloud web service
        shell: bash
        run: |
          set -euo pipefail
          # A cancelled/stuck guarded deploy may leave self-heal suppressed.
          # This cross-runner recovery is intentionally outside that deploy and
          # restores the control plane before touching the zCloud Actions listener.
          sudo -n rm -f /home/ubuntu/zennay-cloud/.disable-self-heal
          service="zennay-cloud.service"
          root="/home/ubuntu/zennay-cloud"
          db="$root/history.db"
          service_user="$(systemctl show "$service" -p User --value 2>/dev/null || true)"
          [[ -n "$service_user" ]] || service_user="root"
          service_group="$(systemctl show "$service" -p Group --value 2>/dev/null || true)"
          [[ -n "$service_group" ]] || service_group="$(id -gn "$service_user")"

          sudo -n systemctl stop "$service" || true
          sudo -n chown "$service_user:$service_group" "$root" "$db"
          sudo -n chmod u+rwx "$root"
          sudo -n chmod u+rw "$db"
          for candidate in "$db-wal" "$db-shm"; do
            [[ -e "$candidate" ]] || continue
            attrs="$(lsattr -d "$candidate" 2>/dev/null | awk '{print $1}' || true)"
            [[ "$attrs" != *i* ]] || sudo -n chattr -i "$candidate"
            sudo -n chown "$service_user:$service_group" "$candidate"
            sudo -n chmod u+rw "$candidate"
          done
          sudo -n -u "$service_user" python3 - <<'PY'
          import sqlite3
          db="/home/ubuntu/zennay-cloud/history.db"
          conn=sqlite3.connect(db, timeout=10)
          try:
              conn.execute("BEGIN IMMEDIATE")
              conn.rollback()
          finally:
              conn.close()
          print("ZCLOUD_SQLITE_WRITE_PROBE_GREEN")
          PY

          sudo -n systemctl reset-failed "$service" || true
          sudo -n systemctl restart "$service"
          systemctl is-active "$service"
          for i in {1..20}; do
            if curl -fsS --max-time 3 http://127.0.0.1:8765/api/status >/tmp/zcloud-status.json; then
              python3 -c 'import json; s=json.load(open("/tmp/zcloud-status.json")); print(json.dumps({"time":s.get("time"),"errors":s.get("errors"),"dynamic_workers":s.get("dynamic_workers"),"firefox":s.get("chatgpt_firefox")}, indent=2))'
              exit 0
            fi
            sleep 1
          done
          journalctl -u zennay-cloud.service -n 80 --no-pager || true
          exit 2

      - name: Recover zCloud runner on shared VPS
        shell: bash
        run: |
          set -euo pipefail
          echo "=== system runner units ==="
          systemctl list-unit-files --type=service --no-pager | grep -Ei 'actions\.runner|zcloud' || true
          echo "=== user runner units ==="
          systemctl --user list-unit-files --type=service --no-pager | grep -Ei 'actions\.runner|zcloud' || true

          mapfile -t system_units < <(
            systemctl list-unit-files --type=service --no-legend 2>/dev/null |
            awk '{print $1}' |
            grep -Ei '^actions\.runner\..*zcloud.*\.service$' || true
          )
          mapfile -t user_units < <(
            systemctl --user list-unit-files --type=service --no-legend 2>/dev/null |
            awk '{print $1}' |
            grep -Ei '^actions\.runner\..*zcloud.*\.service$' || true
          )

          if (( ${#system_units[@]} == 0 && ${#user_units[@]} == 0 )); then
            echo "No zCloud Actions runner service found" >&2
            exit 2
          fi

          recovered=0
          for unit in "${system_units[@]}"; do
            echo "Attempting system recovery for $unit"
            if sudo -n systemctl restart "$unit"; then
              sudo -n systemctl is-active "$unit"
              recovered=1
            else
              echo "sudo restart failed for $unit"
            fi
          done
          for unit in "${user_units[@]}"; do
            echo "Attempting user recovery for $unit"
            if systemctl --user restart "$unit"; then
              systemctl --user is-active "$unit"
              recovered=1
            else
              echo "user restart failed for $unit"
            fi
          done

          if (( recovered == 0 )); then
            echo "Found zCloud runner but could not restart it" >&2
            exit 3
          fi

          sleep 3
          echo "=== recovered status ==="
          for unit in "${system_units[@]}"; do sudo -n systemctl --no-pager --full status "$unit" || true; done
          for unit in "${user_units[@]}"; do systemctl --user --no-pager --full status "$unit" || true; done


      - name: Restore seven zCloud workers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base="http://127.0.0.1:8765"

          def call(method,path,payload=None):
              data=None
              headers={"User-Agent":"haxlab-zcloud-recovery/2"}
              if payload is not None:
                  data=json.dumps(payload).encode("utf-8")
                  headers["Content-Type"]="application/json"
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          current=(call("GET","/api/dynamic-workers").get("dynamic_workers") or {})
          desired={
              key: current.get(key)
              for key in (
                  "chatgpt_count","claude_count",
                  "chatgpt_cooldown_seconds","claude_cooldown_seconds",
                  "check_interval_ms","tick_interval_ms","heartbeat_interval_ms",
                  "generation_start_timeout_ms","scheduler_interval_seconds",
              )
              if current.get(key) is not None
          }
          desired["chatgpt_count"]=7
          reconciled=call("POST","/api/dynamic-workers",desired)
          pushed=call("POST","/api/dynamic-workers/force-push",{})
          print("WORKER_CAPACITY_RECONCILED="+json.dumps(reconciled,sort_keys=True))
          print("WORKERS_FORCE_PUSHED="+json.dumps(pushed,sort_keys=True))
          if not reconciled.get("ok") or not pushed.get("ok"):
              raise SystemExit("worker restore failed")
          PY
