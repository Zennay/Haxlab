name: Cancel exact superseded HaxLab evaluation runs

on:
  push:
    branches:
      - ops/haxlab-cancel-superseded-calibration-20261006
    paths:
      - ".github/workflows/haxlab-cancel-superseded-calibration-20261006.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Cancel exact superseded evaluation runs only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          targets = {
              37486999853: (
                  "Closed-Loop Arena v2 Frozen Policy Validation",
                  "7a8689a875474ad3d4114967ae35e015472ea8b5",
              ),
              37512280392: (
                  "Freeze Multisource Evaluation Suite v2 Current-Main",
                  "1271b4f2365773350999bd7b854f5966955f1db7",
              ),
              37512347288: (
                  "Freeze Multisource Evaluation Suite v2 Current-Main",
                  "f6968433826044889a53c9127439a8fdbbe4a2b5",
              ),
              37512350210: (
                  "HaxLab CI",
                  "f6968433826044889a53c9127439a8fdbbe4a2b5",
              ),
              37512837718: (
                  "Freeze Multisource Evaluation Suite v2 Current-Main",
                  "a070d031a35d4191a14b4f780ae454114219c50f",
              ),
              37512850878: (
                  "Freeze Multisource Evaluation Suite v2 Current-Main",
                  "5541c37c9d2bc6cc31d4c6e3747a75ff1c32431f",
              ),
          }
          protected_head = "1c186d5d8927ab55722615631e0e61e5bda56971"
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "haxlab-targeted-evaluation-cancel/2",
          }

          def request(path, method="GET"):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  method=method,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  if method == "POST" and exc.code in (409, 422):
                      return {"terminal_race": True, "status": exc.code, "body": body}
                  raise SystemExit(
                      f"GitHub API {method} {path} failed: {exc.code} {body}"
                  )

          states = {}
          requested = []
          for run_id, (expected_name, expected_sha) in targets.items():
              run = request(f"/repos/{repo}/actions/runs/{run_id}")
              actual_name = str(run.get("name") or "")
              actual_sha = str(run.get("head_sha") or "")
              status = str(run.get("status") or "")
              conclusion = run.get("conclusion")
              states[run_id] = {
                  "name": actual_name,
                  "head_sha": actual_sha,
                  "status": status,
                  "conclusion": conclusion,
              }
              if actual_sha == protected_head:
                  raise SystemExit(f"refusing to cancel protected current head run {run_id}")
              if actual_name != expected_name or actual_sha != expected_sha:
                  raise SystemExit(
                      f"target mismatch run={run_id} name={actual_name!r} sha={actual_sha}"
                  )
              if status == "completed":
                  continue
              result = request(f"/repos/{repo}/actions/runs/{run_id}/cancel", method="POST")
              if not result.get("terminal_race"):
                  requested.append(run_id)

          print("TARGETS_BEFORE=" + json.dumps(states, sort_keys=True))
          print("CANCEL_REQUESTED=" + json.dumps(requested))

          for _ in range(12):
              remaining = []
              for run_id in requested:
                  run = request(f"/repos/{repo}/actions/runs/{run_id}")
                  if str(run.get("status") or "") != "completed":
                      remaining.append(run_id)
              if not remaining:
                  print("SUPERSEDED_EVALUATION_RUNS_TERMINAL")
                  raise SystemExit(0)
              print("WAITING_FOR_CANCEL=" + json.dumps(remaining))
              time.sleep(5)

          raise SystemExit("targeted superseded runs did not become terminal within 60 seconds")
          PY
