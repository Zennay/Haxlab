name: Elite Resume Smoke

on:
  push:
    branches:
      - experiment/elite-resumable-training-v01

permissions:
  contents: read

concurrency:
  group: haxlab-elite-resume-smoke
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .resume-ci-venv
          python3 -m venv .resume-ci-venv
          .resume-ci-venv/bin/pip install --upgrade pip
          .resume-ci-venv/bin/pip install -e '.[dev]'

      - name: Compile trainer
        shell: bash
        run: |
          set -euo pipefail
          .resume-ci-venv/bin/python -m py_compile src/haxlab/learning/elite.py

      - name: Run checkpoint tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            .resume-ci-venv/bin/python -m pytest -q \
            tests/test_elite_resume.py \
            tests/test_elite_policy.py
