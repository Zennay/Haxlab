name: Elite Stacked CI

on:
  push:
    branches:
      - feature/elite-sandbox-promotion-gate

permissions:
  contents: read

concurrency:
  group: haxlab-elite-stacked-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-venv
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install -e '.[dev]'

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail
          .ci-venv/bin/python -m compileall -q src/haxlab

      - name: Validate elite Node stack
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/extract_elite_imitation.js
          node --check tools/extract_stadium_from_replay.js
          node --check tools/elite_features.js
          node --check tools/elite_tactics.js
          node --check tools/elite_policy_runtime.js
          node --check tools/elite_bot_plugin.js
          node --check tools/elite_sandbox_benchmark.js
          node --check tools/elite_model_duel.js
          node tests/test_elite_mirror.js
          node tests/test_elite_feature_order.js

      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail
          .ci-venv/bin/pytest -q