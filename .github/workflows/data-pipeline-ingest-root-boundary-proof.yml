name: Data-pipeline ingest root boundary exact-head proof

on:
  pull_request:
    branches:
      - main
    paths:
      - src/haxlab/cli.py
      - tests/test_cli_ingest_boundary.py
      - docs/ingest-cli-export-root-boundary.md
      - .github/workflows/data-pipeline-ingest-root-boundary-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pipeline-ingest-root-boundary-exact-head
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify immutable candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run focused ingest-root boundary proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-ingest-root-proof
          .venv-ingest-root-proof/bin/python -m pip install -q -e ".[dev]"
          .venv-ingest-root-proof/bin/python -m py_compile src/haxlab/cli.py
          .venv-ingest-root-proof/bin/python -m pytest -q tests/test_cli_ingest_boundary.py
          .venv-ingest-root-proof/bin/python -m pytest --collect-only -q >"$RUNNER_TEMP/haxlab-ingest-root-$GITHUB_RUN_ID.collect"
          test -s "$RUNNER_TEMP/haxlab-ingest-root-$GITHUB_RUN_ID.collect"
          echo "HAXLAB_INGEST_ROOT_BOUNDARY_PROOF=success"
