name: Data pipeline runtime event retention proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-proof:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Focused retention proof
        run: python -m pytest -q tests/test_runtime_event_retention.py
