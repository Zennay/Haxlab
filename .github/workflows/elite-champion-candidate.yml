name: Elite Champion Candidate

on:
  push:
    branches:
      - feature/elite-4v4-player-v01

permissions:
  contents: read

concurrency:
  group: haxlab-elite-champion-candidate
  cancel-in-progress: true

jobs:
  candidate:
    if: contains(github.event.head_commit.message, '[candidate]')
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Build alias-aware 4v4 leaderboard
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab mkdir -p /var/lib/haxlab/derived/leaderboards
          sudo -u haxlab env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /opt/haxlab/.venv/bin/python -m haxlab.skill.leaderboard \
            --root /var/lib/haxlab/derived/state-pass-v4 \
            --top 10000 \
            --min-matches 1 \
            --min-minutes 0 \
            --aliases "$GITHUB_WORKSPACE/configs/player_aliases.json" \
            --format json \
            --output /var/lib/haxlab/derived/leaderboards/elite-champion-candidate.json \
            >/tmp/haxlab-champion-leaderboard.json

      - name: Train champion candidate
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab rm -rf /var/lib/haxlab/derived/training/elite-player-champion-candidate
          sudo -u haxlab env \
            PYTHONPATH="$GITHUB_WORKSPACE/src" \
            NODE_PATH=/opt/haxlab/node_modules \
            /opt/haxlab/.venv/bin/python -m haxlab.learning.elite_pipeline \
            --analysis-root /var/lib/haxlab/derived/state-pass-v4 \
            --leaderboard /var/lib/haxlab/derived/leaderboards/elite-champion-candidate.json \
            --raw-root /var/lib/haxlab/raw/replays \
            --work-root /var/lib/haxlab/derived/training/elite-player-champion-candidate \
            --node-script "$GITHUB_WORKSPACE/tools/extract_elite_imitation.js" \
            --aliases "$GITHUB_WORKSPACE/configs/player_aliases.json" \
            --train-replay-limit 800 \
            --validation-replay-limit 200 \
            --window 8 \
            --sequence-stride 1 \
            --hidden-dim 128 \
            --hidden-dim-2 96 \
            --epochs 3 \
            --batch-size 2048 \
            --shard-workers 4 \
            | tee /tmp/haxlab-champion-candidate.log

      - name: Extract exact BFF Big v4 stadium
        shell: bash
        run: |
          set -euo pipefail
          RAW_REPLAY="$(
            /opt/haxlab/.venv/bin/python - <<'PY'
          import sqlite3
          db = sqlite3.connect("/var/lib/haxlab/state/haxlab.sqlite3")
          row = db.execute("""
          SELECT r.archive_path
          FROM source_files s
          JOIN raw_replays r ON r.sha256 = s.sha256
          WHERE lower(s.source_path) LIKE '%kjambvsado%'
          ORDER BY s.last_seen_at DESC
          LIMIT 1
          """).fetchone()
          if row:
              print(row[0])
          PY
          )"
          test -n "$RAW_REPLAY"
          test -f "$RAW_REPLAY"

          NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/extract_stadium_from_replay.js" \
            "$RAW_REPLAY" \
            /tmp/haxlab-champion-stadium.hbs

      - name: Run longer 4v4 sandbox benchmark
        shell: bash
        run: |
          set -euo pipefail
          sudo -u haxlab env NODE_PATH=/opt/haxlab/node_modules node \
            "$GITHUB_WORKSPACE/tools/elite_sandbox_benchmark.js" \
            --model /var/lib/haxlab/derived/training/elite-player-champion-candidate/model/runtime-model.json \
            --stadium /tmp/haxlab-champion-stadium.hbs \
            --matches 12 \
            --minutes 1.5 \
            --sample-every 6 \
            --output /var/lib/haxlab/derived/training/elite-player-champion-candidate/sandbox-benchmark.json

      - name: Collect candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo cat /var/lib/haxlab/derived/training/elite-player-champion-candidate/pipeline-summary.json \
            > champion-pipeline-summary.json
          sudo cat /var/lib/haxlab/derived/training/elite-player-champion-candidate/sandbox-benchmark.json \
            > champion-sandbox-benchmark.json

          {
            echo '## HaxLab Elite Champion Candidate'
            echo
            echo '### Pipeline / frozen holdout'
            echo
            echo '```json'
            cat champion-pipeline-summary.json
            echo '```'
            echo
            echo '### Local 4v4 sandbox'
            echo
            echo '```json'
            cat champion-sandbox-benchmark.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: elite-champion-candidate
          path: |
            champion-pipeline-summary.json
            champion-sandbox-benchmark.json
          retention-days: 30
