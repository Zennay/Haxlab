name: zCloud soak live probe
on:
  push:
    branches: ['canary/zcloud-soak-probe-20260929']
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stop failed canary and leave dynamic workers paused
        run: |
          python3 - <<'PY'
          import sqlite3
          from datetime import datetime, timezone
          db='/home/ubuntu/zennay-cloud/history.db'
          ts=datetime.now(timezone.utc).isoformat()
          with sqlite3.connect(db,timeout=5) as c:
              c.execute("UPDATE runner_workers SET desired_state='paused'")
              c.execute("UPDATE runner_targets SET active=0")
              c.execute("""UPDATE portfolio_queue SET status='blocked',eligible=0,
                           blocker='soak canary stopped after false-generation detection',
                           evidence='assistant_chars remained 0; no issue action',
                           worker_slot=NULL,claimed_at=NULL,claim_expires=NULL,updated_at=?
                           WHERE queue_id='canary-worker-soak-20260929'""",(ts,))
              c.execute("""UPDATE portfolio_queue SET status='queued',worker_slot=NULL,claimed_at=NULL,claim_expires=NULL,updated_at=?
                           WHERE queue_id<>'canary-worker-soak-20260929'
                             AND status IN ('claimed','running','verifying')""",(ts,))
              c.execute("""UPDATE runner_commands SET status='failed',updated_at=?,
                           result='soak cleanup; workers remain paused'
                           WHERE status='pending'""",(ts,))
              c.commit()
          print('ZCLOUD_SOAK_CLEANUP_GREEN')
          PY
