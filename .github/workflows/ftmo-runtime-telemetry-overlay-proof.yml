name: FTMO runtime telemetry overlay exact-head proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftmo-runtime-telemetry-overlay-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-runtime-telemetry-overlay-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      TARGET_SHA: e17d084955e5b8cf49a1f057441760db3cf7afda
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: '0.00'
      FTMO_ALLOW_PAID_AWS: ''
    steps:
      - name: Prove exact FTMO telemetry branch on VPS
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          gh auth status >/dev/null 2>&1
          work="$RUNNER_TEMP/ftmo-runtime-telemetry-$GITHUB_RUN_ID"
          rm -rf "$work"
          gh repo clone Zennay/Ftmo "$work" -- --filter=blob:none --no-checkout
          cd "$work"
          git fetch --no-tags origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 -m venv .venv-proof
          .venv-proof/bin/python -m pip install -q -r requirements-ci.txt
          .venv-proof/bin/python -m pip install -q -e .
          .venv-proof/bin/python -m py_compile src/prop_trading_ai/cli/v1_project_telemetry.py
          .venv-proof/bin/python -m pytest -q             tests/test_project_telemetry_cli.py             tests/test_zero_cost_workflow_boundary.py
          .venv-proof/bin/python -m pytest --collect-only -q >/tmp/ftmo-telemetry-collection-$GITHUB_RUN_ID.txt
          test -s /tmp/ftmo-telemetry-collection-$GITHUB_RUN_ID.txt
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = '0.00'
          test -z "${FTMO_ALLOW_PAID_AWS:-}"
          echo "FTMO_RUNTIME_TELEMETRY_OVERLAY_PROOF=success"

      - name: Persist proof receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/ftmo-runtime-telemetry-proof.json
          import json, os
          print(json.dumps({
              "project":"ftmo",
              "scope":"runtime-telemetry-overlay-proof",
              "target_sha":os.environ["TARGET_SHA"],
              "result":"success",
              "runner_host":"vps-bb300bba",
              "runner_name":os.environ.get("RUNNER_NAME"),
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "paid_cloud_budget_usd":"0.00",
              "proof":[
                  "exact-sha-checkout",
                  "telemetry-cli-compile",
                  "runtime-status-overlay-regressions",
                  "zero-cost-workflow-boundaries",
                  "full-suite-collection"
              ]
          },sort_keys=True))
          PY
          encoded="$(base64 -w0 /tmp/ftmo-runtime-telemetry-proof.json)"
          dest="runtime-evidence/ftmo-runtime-telemetry-overlay-proof-$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/Zennay/Haxlab/contents/$dest"             -f message="Record FTMO runtime telemetry overlay proof $GITHUB_RUN_ID"             -f content="$encoded" >/dev/null
          echo "FTMO_TELEMETRY_PROOF_RECEIPT=$dest"
