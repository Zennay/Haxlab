name: FTMO PR486 deploy-publication exact-head proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ftmo-pr486-deploy-publication-proof.yml"

permissions:
  contents: write

concurrency:
  group: ftmo-pr486-deploy-publication-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 20
    env:
      TARGET_SHA: 496a7e21ff22a783c80d9738fab6737d0db53445
      TARGET_PR: "486"
      EXPECTED_MAIN_SHA: 272df5c6468ce7e6949c80def7ca029ae0adc5dc
      FTMO_AUTONOMOUS_CLOUD_BUDGET_USD: "0.00"
      FTMO_ALLOW_PAID_AWS: ""
    steps:
      - name: Checkout exact FTMO PR486 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          src="$RUNNER_TEMP/ftmo-pr486-hax-$GITHUB_RUN_ID"
          rm -rf "$src"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/Zennay/Ftmo.git
          git -C "$src" -c protocol.version=2 fetch -q --depth=1 origin "$TARGET_SHA"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$TARGET_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          pr=json.loads(subprocess.check_output(
              ["gh","api",f"repos/Zennay/Ftmo/pulls/{os.environ['TARGET_PR']}"],
              text=True,
          ))
          assert pr["state"] == "open"
          assert pr["head"]["sha"] == os.environ["TARGET_SHA"]
          assert pr["base"]["sha"] == os.environ["EXPECTED_MAIN_SHA"]
          main=subprocess.check_output(
              ["gh","api","repos/Zennay/Ftmo/commits/main","--jq",".sha"],
              text=True,
          ).strip()
          assert main == os.environ["EXPECTED_MAIN_SHA"]
          print("FTMO_PR486_IDENTITY=verified")
          PY

      - name: Prove deployment publication integrity
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/ftmo-pr486-hax-$GITHUB_RUN_ID"
          venv="$RUNNER_TEMP/ftmo-pr486-hax-venv-$GITHUB_RUN_ID"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r "$src/requirements-ci.txt"
          "$venv/bin/python" -m pip install -q -e "$src"
          cd "$src"
          "$venv/bin/python" -m py_compile src/prop_trading_ai/ops/deploy_publish.py
          "$venv/bin/python" -m pytest -q             tests/test_deploy_publish_integrity.py             tests/test_autonomous_deploy_lockstep.py
          "$venv/bin/python" -m pytest -q             tests/test_zero_cost_workflow_boundary.py::test_every_repository_workflow_has_no_github_hosted_runner             tests/test_zero_cost_workflow_boundary.py::test_diagnostic_zero_cost_workflows_are_self_hosted_and_secret_free
          test "$FTMO_AUTONOMOUS_CLOUD_BUDGET_USD" = "0.00"
          test -z "${FTMO_ALLOW_PAID_AWS:-}"
          echo "FTMO_PR486_DEPLOY_PUBLICATION_PROOF=success"

      - name: Persist durable proof receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ftmo-pr486-proof-$GITHUB_RUN_ID.json"
          python3 - <<'PY' > "$receipt"
          import json, os
          print(json.dumps({
              "schema_version":1,
              "project":"ftmo",
              "pull_request":486,
              "target_sha":os.environ["TARGET_SHA"],
              "expected_main_sha":os.environ["EXPECTED_MAIN_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "runner":os.environ.get("RUNNER_NAME",""),
              "host":"vps-bb300bba",
              "result":"success",
              "proof":[
                  "exact-sha-checkout",
                  "exact-pr-and-main-identity",
                  "deploy-publisher-compile",
                  "descriptor-bound-destination-traversal",
                  "exclusive-no-follow-deploy-temp",
                  "symlink-and-permission-regressions",
                  "safe-deployment-marker-publication",
                  "deploy-lockstep-regressions",
                  "zero-cost-boundary"
              ],
              "paid_cloud_budget_usd":"0.00",
              "research_outcomes_accessed":False,
              "walk_forward_accessed":False,
              "final_holdout_accessed":False,
              "live_or_broker_access_opened":False
          },sort_keys=True))
          PY
          encoded="$(base64 -w0 "$receipt")"
          path="runtime-evidence/ftmo-pr486-deploy-publication-proof-$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/Zennay/HaxLab/contents/$path"             -f message="Record FTMO PR486 exact-head proof $GITHUB_RUN_ID"             -f content="$encoded" >/dev/null
          echo "FTMO_PR486_RECEIPT_PATH=$path"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftmo-pr486-hax-$GITHUB_RUN_ID" "$RUNNER_TEMP/ftmo-pr486-hax-venv-$GITHUB_RUN_ID"
