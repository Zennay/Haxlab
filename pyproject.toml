[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "haxlab"
version = "0.1.0"
description = "HaxBall replay intelligence and learning platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zennay" }]
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
haxlab = "haxlab.cli:main"
haxlab-daemon = "haxlab.runtime.daemon:main"
haxlab-worker = "haxlab.runtime.worker:main"
haxlab-status = "haxlab.runtime.status:main"
haxlab-analyzer = "haxlab.runtime.analyzer:main"
haxlab-players = "haxlab.runtime.player_stats:main"
haxlab-skill = "haxlab.skill.leaderboard:main"
haxlab-coach = "haxlab.coaching.replay_coach:main"
haxlab-training-manifest = "haxlab.learning.selector:main"
haxlab-build-shards = "haxlab.learning.shards:main"
haxlab-train-bc = "haxlab.learning.baseline:main"
haxlab-elite-manifest = "haxlab.learning.elite_selector:main"
haxlab-elite-shards = "haxlab.learning.elite_shards:main"
haxlab-train-elite = "haxlab.learning.elite:main"
haxlab-elite-agent = "haxlab.learning.elite_runtime:main"
haxlab-elite-pipeline = "haxlab.learning.elite_pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
